// ---------------- bank reconciliation ----------------
function renderReconciliation(body){
  body.innerHTML = '<div class="card">'+esc(t('loading'))+'</div>';
  loadReconciliation();

  function loadReconciliation(){
    api('getReconciliation', {}).then(function(res){
      if (!res.ok){ body.innerHTML = '<div class="msg err">'+esc(errMsg_(res))+'</div>'; return; }
      body.innerHTML = '';

      var importCard = el('<div class="card">' +
        '<h2>'+esc(t('recon_title'))+'</h2>' +
        '<div class="muted" style="font-size:12.5px;margin-bottom:10px;">'+esc(t('recon_hint'))+'</div>' +
        '<input type="file" id="reconFile" accept=".csv,text/csv">' +
        '<div id="reconMsg"></div>' +
      '</div>');
      body.appendChild(importCard);
      qs('#reconFile', importCard).addEventListener('change', function(e){
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(){
          var parsed;
          try { parsed = parseCsv_(String(reader.result||'')); } catch(err){ parsed = null; }
          if (!parsed || parsed.length < 2){ qs('#reconMsg',importCard).innerHTML = '<div class="msg err">'+esc(t('entry_importParseError'))+'</div>'; return; }
          var header = parsed[0].map(function(h){ return String(h||'').trim(); });
          var idx = {};
          header.forEach(function(h,i){ idx[h]=i; });
          var dataRows = parsed.slice(1).filter(function(r){ return r.some(function(c){ return String(c||'').trim()!==''; }); });
          function cell(r,key){ var i=idx[key]; return (i!=null && r[i]!=null) ? String(r[i]) : ''; }
          var rows = dataRows.map(function(r){
            return { date: cell(r,'date').trim(), amount: cell(r,'amount').trim(), reference: cell(r,'reference').trim() };
          });
          api('importBankStatement', { rows: rows }).then(function(res2){
            if (!res2.ok){ qs('#reconMsg',importCard).innerHTML = '<div class="msg err">'+esc(errMsg_(res2))+'</div>'; return; }
            qs('#reconMsg',importCard).innerHTML = '<div class="msg ok">'+esc(t('recon_result').replace('{imported}',res2.imported).replace('{matched}',res2.autoMatched))+'</div>';
            loadReconciliation();
          });
        };
        reader.readAsText(file);
      });

      body.appendChild(kpiRow([
        [res.totalDeposits, t('recon_totalDeposits')],
        [res.reconciledCount, t('recon_reconciled')],
        [res.unmatchedDeposits.length, t('recon_unmatchedDeposits')],
        [res.unmatchedLines.length, t('recon_unmatchedLines')]
      ]));

      var depCard = el('<div class="card"><h2>'+esc(t('recon_unmatchedDeposits'))+'</h2><div id="reconDepList"></div></div>');
      body.appendChild(depCard);
      var depList = qs('#reconDepList', depCard);
      if (!res.unmatchedDeposits.length){
        depList.innerHTML = '<div class="muted">'+esc(t('recon_noUnmatchedDeposits'))+'</div>';
      } else {
        res.unmatchedDeposits.forEach(function(d){
          var row = el('<div class="list-item">' +
            '<div class="top"><div class="amount">'+money(d.amount)+'</div><div class="muted">'+esc((d.createdAt||'').slice(0,10))+' · '+esc(d.bankReference||'—')+'</div></div>' +
            '<div class="field"><label>'+esc(t('recon_matchManually'))+'</label><select class="reconLineSel"><option value="">'+esc(t('recon_pickLine'))+'</option>' +
              res.unmatchedLines.map(function(l){ return '<option value="'+l.id+'">'+esc(l.date)+' — '+money(l.amount)+' — '+esc(l.reference||'—')+'</option>'; }).join('') +
            '</select></div>' +
            '<button class="btn secondary">'+esc(t('recon_link'))+'</button>' +
          '</div>');
          var sel = qs('select', row);
          qs('button', row).addEventListener('click', function(){
            if (!sel.value) return;
            api('manualMatchReconciliation', { lineId: sel.value, handoffId: d.id }).then(function(res3){
              if (res3.ok) loadReconciliation(); else toastRaw_(errMsg_(res3), 'err');
            });
          });
          depList.appendChild(row);
        });
      }

      var lineCard = el('<div class="card"><h2>'+esc(t('recon_unmatchedLines'))+'</h2><div id="reconLineList"></div></div>');
      body.appendChild(lineCard);
      var lineList = qs('#reconLineList', lineCard);
      if (!res.unmatchedLines.length){
        lineList.innerHTML = '<div class="muted">'+esc(t('recon_noUnmatchedLines'))+'</div>';
      } else {
        lineList.appendChild(sortableTable(res.unmatchedLines, [
          { key:'date', label: t('recon_col_date') },
          { key:'amount', label: t('recon_col_amount'), render: function(r){ return money(r.amount); } },
          { key:'reference', label: t('recon_col_reference') }
        ]));
      }
    });
  }
}

var adminTab = 'users';

// Every hole in the collection chain, as { key, subject, tab }. key is an
// i18n template, subject the thing it names, tab where the admin fixes it.
function chainGaps_(){
  var meta = state.meta || {};
  var users = meta.users || [], gaps = [];
  function off(id){ var u = byId(users, id); return !!(u && u.active === false); }
  function add(key, subject, tab, who){ gaps.push({ key: key, subject: subject, tab: tab, who: who || '' }); }
  (meta.clusters||[]).forEach(function(c){
    if (!c.clusterManagerUserId) add('gap_areaManager', c.name, 'clusters');
    else if (off(c.clusterManagerUserId)) add('gap_disabled', c.name, 'clusters', userName(c.clusterManagerUserId));
    if (!c.collectorUserId) add('gap_areaCollector', c.name, 'clusters');
    else if (off(c.collectorUserId)) add('gap_disabled', c.name, 'clusters', userName(c.collectorUserId));
  });
  (meta.locations||[]).forEach(function(l){
    var nm = (l.city ? l.city + ' — ' : '') + l.name;
    if (!l.clusterId || !byId(meta.clusters, l.clusterId)) add('gap_branchArea', nm, 'locations');
    if (!(meta.stores||[]).some(function(st){ return st.locationId === l.id; })) add('gap_branchStore', nm, 'stores');
  });
  (meta.stores||[]).forEach(function(st){
    if (!st.storeManagerUserId) add('gap_storeManager', st.name, 'stores');
    else if (off(st.storeManagerUserId)) add('gap_disabled', st.name, 'stores', userName(st.storeManagerUserId));
  });
  (meta.cars||[]).forEach(function(c){
    if (!c.driverUserId) add('gap_carDriver', c.label, 'cars');
    else if (off(c.driverUserId)) add('gap_disabled', c.label, 'cars', userName(c.driverUserId));
  });
  (meta.pos||[]).forEach(function(p){
    if (!p.assignedUserId) add('gap_posHolder', p.label, 'pos');
    else if (off(p.assignedUserId)) add('gap_disabled', p.label, 'pos', userName(p.assignedUserId));
  });
  // one person, one area
  var areaCount = {};
  (meta.clusters||[]).forEach(function(c){
    [c.clusterManagerUserId, c.collectorUserId].forEach(function(uid){
      if (!uid) return;
      (areaCount[uid] = areaCount[uid] || []).push(c.name);
    });
  });
  Object.keys(areaCount).forEach(function(uid){
    if (areaCount[uid].length > 1) add('gap_multiArea', areaCount[uid].join('، '), 'clusters', userName(uid));
  });
  // people hired into a link of the chain but never placed on one
  users.forEach(function(u){
    if (u.active === false) return;
    var placed = true;
    if (u.role === 'cluster_manager') placed = (meta.clusters||[]).some(function(c){ return c.clusterManagerUserId === u.id; });
    else if (u.role === 'collector') placed = (meta.clusters||[]).some(function(c){ return c.collectorUserId === u.id; });
    else if (u.role === 'store_manager') placed = (meta.stores||[]).some(function(st){ return st.storeManagerUserId === u.id; });
    else if (u.role === 'driver') placed = (meta.cars||[]).some(function(c){ return c.driverUserId === u.id; }) ||
      (meta.pos||[]).some(function(p){ return p.assignedUserId === u.id; });
    if (!placed) add('gap_idle', t('role_' + u.role), { cluster_manager: 'clusters', collector: 'clusters', store_manager: 'stores', driver: 'cars' }[u.role], u.name);
  });
  return gaps;
}

function refreshMetaThen(cb, fromWrite){
  // An admin write already answered with the fresh reference data, so use it
  // instead of paying for a second round trip to Apps Script.
  if (fromWrite && fromWrite.meta && fromWrite.meta.ok) {
    state.meta = fromWrite.meta;
    saveSession_();
    cb && cb();
    return;
  }
  api('listMeta', {}).then(function(res){ if(res.ok){ state.meta = res; saveSession_(); } cb && cb(); });
}

// A request to /exec answers in about two seconds once the script is warm,
// but the first one after it has been idle pays a cold start — measured at
// over a minute on the live deployment. A cheap GET while someone is looking
// at the app keeps it warm, so their next real action is the fast kind.
var WARMUP_MS = 4 * 60 * 1000;
function warmUp_(){
  if (!state.apiUrl || document.visibilityState === 'hidden') return;
  try { fetch(state.apiUrl, { method: 'GET', mode: 'no-cors', cache: 'no-store' }); } catch (e) {}
}
function startWarmUp_(){
  warmUp_();
  setInterval(warmUp_, WARMUP_MS);
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible') warmUp_(); });
}

function metaListFor_(kind){

  var map = { location:'locations', store:'stores', car:'cars', pos:'pos', cluster:'clusters', zone:'zones', product:'products',
    income_item:'incomeItems', expense_item:'expenseItems' };
  return m[map[kind]]||[];
}

// One input for one entity field, optionally pre-filled — the add form and
// the profile build their fields from the same spec through this.
function entityFieldInput_(f, value, meta, kind){
  var input;
  if (f.pick){
    var options = (meta[f.pick]||[]).filter(function(x){ return !f.pickFilter || f.pickFilter(x); });
    // one person, one area: someone already on another area is not offered
    if (kind === 'cluster' && (f.k === 'clusterManagerUserId' || f.k === 'collectorUserId')){
      var taken = [];
      (meta.clusters||[]).forEach(function(c){
        if (c.clusterManagerUserId && String(c.clusterManagerUserId) !== String(value)) taken.push(c.clusterManagerUserId);
        if (c.collectorUserId && String(c.collectorUserId) !== String(value)) taken.push(c.collectorUserId);
      });
      options = options.filter(function(x){ return String(x.id) === String(value) || taken.indexOf(x.id) < 0; });
    }
    input = el('<select data-k="'+f.k+'"><option value="">—</option>' +
      options.map(function(x){ return '<option value="'+x.id+'"'+(String(value)===String(x.id)?' selected':'')+'>'+esc(f.pickLabel(x))+'</option>'; }).join('') +
    '</select>');
  } else if (f.options){
    input = el('<select data-k="'+f.k+'">' +
      f.options.map(function(o){ return '<option value="'+o[0]+'"'+(String(value)===String(o[0])?' selected':'')+'>'+esc(t(o[1]))+'</option>'; }).join('') +
    '</select>');
  } else if (f.type === 'check'){
    input = el('<input type="checkbox" data-k="'+f.k+'" style="width:18px;height:18px;"'+(value?' checked':'')+'>');
  } else if (f.type === 'number'){
    input = el('<input type="text" inputmode="decimal" data-k="'+f.k+'" placeholder="0" value="'+esc(value != null && value !== '' ? value : '')+'">');
    wireCommaInput_(input, true);
  } else {
    input = el('<input data-k="'+f.k+'" value="'+esc(value != null ? value : '')+'">');
  }
  return input;
}
function entityFieldValue_(f, input){
  if (!input) return null;
  return f.type === 'check' ? input.checked : f.type === 'number' ? numFromInput_(input) : input.value;
}
// A field the collection chain depends on: the server refuses the row
// without it, so the form marks it.
var REQUIRED_ASSIGNMENTS_ = {
  cluster: ['name', 'clusterManagerUserId', 'collectorUserId'],
  location: ['city', 'name'],
  store: ['locationId', 'name', 'storeManagerUserId'],
  car: ['locationId', 'label', 'driverUserId'],
  pos: ['ownerType', 'ownerId', 'label', 'assignedUserId'],
  zone: ['city', 'name'],
  product: ['name'], income_item: ['name'], expense_item: ['name']
};
function isRequiredField_(kind, key){
  return (REQUIRED_ASSIGNMENTS_[kind] || []).indexOf(key) >= 0;
}

// A POS machine's owner list follows its owner type, in every form.
function wirePosOwner_(grid, currentOwnerId){
  var meta = state.meta || {};
  var typeSel = qs('[data-k="ownerType"]', grid);
  if (!typeSel) return;
  function refresh(){
    var list = typeSel.value === 'store' ? (meta.stores||[]) : (meta.cars||[]);
    var cur = qs('[data-k="ownerId"]', grid);
    var keep = cur && cur.value ? cur.value : currentOwnerId;
    var sel = el('<select data-k="ownerId">' + list.map(function(x){
      return '<option value="'+x.id+'"'+(String(keep)===String(x.id)?' selected':'')+'>'+esc((x.name||x.label)+' — '+locationName(x.locationId))+'</option>';
    }).join('') + '</select>');
    cur.parentNode.replaceChild(sel, cur);
  }
  typeSel.addEventListener('change', function(){ var c = qs('[data-k="ownerId"]', grid); if (c) c.value = ''; refresh(); });
  refresh();
}
function entityForm_(kind, item){
  var spec = ENTITY_FIELDS[kind], meta = state.meta || {};
  var grid = el('<div class="grid"></div>');
  spec.fields.forEach(function(f){
    var wrap = el('<div class="field'+(f.type==='check'?' field-check':'')+'"><label>'+esc(t(f.l))+(isRequiredField_(kind, f.k) ? '<span class="req">*</span>' : '')+'</label></div>');
    var v = item ? item[f.k] : (f.k === 'active' ? true : '');
    wrap.appendChild(entityFieldInput_(f, v, meta, kind));
    grid.appendChild(wrap);
  });
  if (kind === 'pos') wirePosOwner_(grid, item && item.ownerId);
  return {
    node: grid,
    values: function(){
      var d = {};
      spec.fields.forEach(function(f){ d[f.k] = entityFieldValue_(f, qs('[data-k="'+f.k+'"]', grid)); });
      return d;
    }
  };
}
// What a list cell or a profile line shows for one field: names, not ids.
function fieldDisplay_(kind, item, c){
  var spec = ENTITY_FIELDS[kind], meta = state.meta || {};
  if (kind === 'pos' && c === 'owner') return posOwnerName_(item) + ' — ' + locationName(posOwnerLocationId_(item));
  if (kind === 'pos' && c === 'locationId') return locationName(posOwnerLocationId_(item));
  if (c === 'branches') return String((meta.locations||[]).filter(function(l){ return l.clusterId === item.id; }).length);
  if (c === 'active') return item.active === false ? t('org_disabled') : t('admin_active');
  var v = item[c];
  if (c === 'locationId') return v ? locationName(v) : '—';
  var f = spec.fields.filter(function(x){ return x.k===c; })[0];
  if (f && f.pick){
    var ref = byId(meta[f.pick], v);
    return ref ? f.pickLabel(ref) : (v ? '—' : '—');
  }
  if (f && f.options){
    var opt = f.options.filter(function(o){ return o[0]===v; })[0];
    return opt ? t(opt[1]) : (v || '—');
  }
  if (f && f.type === 'check') return v ? '✓' : '—';
  if (f && f.type === 'number') return v != null && v !== '' ? money(v) : '—';
  return v != null && v !== '' ? String(v) : '—';
}
function fieldLabel_(kind, c){
  if (kind === 'pos' && c === 'owner') return t('admin_owner');
  if (c === 'branches') return t('chain_branches');
  if (c === 'active') return t('us_status');
  if (kind === 'pos' && c === 'locationId') return t('admin_location');
  var f = ENTITY_FIELDS[kind].fields.filter(function(x){ return x.k===c; })[0];
  return f ? t(f.l) : c;
}

function renderAdminEntity(content, kind){
  if (adminProfile && adminProfile.kind === kind) { renderAdminProfile(content, kind, adminProfile.id); return; }
  var spec = ENTITY_FIELDS[kind];
  var list = metaListFor_(kind);
  var title = t('admin_' + KIND_TAB_[kind]);

  var head = el('<div class="ent-head">' +
    '<div class="ent-ht"><span class="ent-ic">'+icon_(KIND_ICON_[kind])+'</span>' +
      '<div><b>'+esc(title)+'</b><span>'+esc(t('pf_count').replace('{n}', list.length))+'</span></div></div>' +
    '<div class="ent-tools">' +
      '<label class="ent-search">'+icon_('search')+'<input type="search" placeholder="'+esc(t('lf_searchHint'))+'"></label>' +
      '<button type="button" class="btn ent-addBtn">'+esc(t(spec.addKey))+'</button>' +
    '</div></div>');

// ---------------- record profile ----------------
// Everything a record is linked to, grouped, each entry openable.
function relationsOf_(kind, r){
  var meta = state.meta || {};
  var groups = [];
  function grp(label, items){ if (items.length) groups.push({ label: label, items: items }); }
  function one(k, id){ var x = recordOf_(k, id); return x ? [{ kind: k, id: x.id, title: recordTitle_(k, x), sub: k === 'user' ? roleLabel(x.role) : '' }] : []; }
  function many(k, list){ return list.map(function(x){ return { kind: k, id: x.id, title: recordTitle_(k, x), sub: k === 'user' ? roleLabel(x.role) : '' }; }); }
  var stores = meta.stores || [], cars = meta.cars || [], pos = meta.pos || [], locs = meta.locations || [], clusters = meta.clusters || [];
  function posOf(ownerType, ids){ return pos.filter(function(p){ return p.ownerType === ownerType && ids.indexOf(p.ownerId) >= 0; }); }
  if (kind === 'location'){
    var ls = stores.filter(function(x){ return x.locationId === r.id; }), lc = cars.filter(function(x){ return x.locationId === r.id; });
    grp(t('pf_kindCluster'), one('cluster', r.clusterId));
    grp(t('pf_kindZone'), one('zone', r.zoneId));
    grp(t('admin_stores'), many('store', ls));
    grp(t('admin_cars'), many('car', lc));
    grp(t('admin_pos'), many('pos', posOf('store', ls.map(function(x){ return x.id; })).concat(posOf('car', lc.map(function(x){ return x.id; })))));
    var people = [];
    ls.forEach(function(x){ if (x.storeManagerUserId) people = people.concat(one('user', x.storeManagerUserId)); });
    lc.forEach(function(x){ if (x.driverUserId) people = people.concat(one('user', x.driverUserId)); });
    grp(t('pf_people'), people);
  } else if (kind === 'cluster'){
    grp(t('admin_clusterManager'), one('user', r.clusterManagerUserId));
    grp(t('admin_collector'), one('user', r.collectorUserId));
    grp(t('admin_locations'), many('location', locs.filter(function(l){ return l.clusterId === r.id; })));
  } else if (kind === 'zone'){
    grp(t('admin_locations'), many('location', locs.filter(function(l){ return l.zoneId === r.id; })));
  } else if (kind === 'store' || kind === 'car'){
    var loc = byId(locs, r.locationId);
    grp(t('pf_kindLocation'), one('location', r.locationId));
    if (loc) grp(t('pf_kindCluster'), one('cluster', loc.clusterId));
    grp(t(kind === 'store' ? 'admin_manager' : 'admin_driver'), one('user', kind === 'store' ? r.storeManagerUserId : r.driverUserId));
    grp(t('admin_pos'), many('pos', posOf(kind, [r.id])));
  } else if (kind === 'pos'){
    grp(t(r.ownerType === 'store' ? 'pf_kindStore' : 'pf_kindCar'), one(r.ownerType === 'store' ? 'store' : 'car', r.ownerId));
    grp(t('pf_kindLocation'), one('location', posOwnerLocationId_(r)));
    grp(t('admin_assignedDriver'), one('user', r.assignedUserId));
  } else if (kind === 'user'){
    grp(t('pf_managesArea'), many('cluster', clusters.filter(function(c){ return c.clusterManagerUserId === r.id; })));
    grp(t('pf_collectsArea'), many('cluster', clusters.filter(function(c){ return c.collectorUserId === r.id; })));
    grp(t('admin_stores'), many('store', stores.filter(function(x){ return x.storeManagerUserId === r.id; })));
    grp(t('admin_cars'), many('car', cars.filter(function(x){ return x.driverUserId === r.id; })));
    grp(t('admin_pos'), many('pos', pos.filter(function(x){ return x.assignedUserId === r.id; })));
  }
  return groups;
}
// The sales-report filter that selects a record's own activity.
function activityFilter_(kind, r){
  if (kind === 'location') return { locationId: r.id };
  if (kind === 'cluster') return { clusterId: r.id };
  if (kind === 'zone') return { zoneId: r.id };
  if (kind === 'store' || kind === 'car' || kind === 'pos') return { sourceType: kind, sourceId: r.id };
  if (kind === 'product') return { productId: r.id };
  if (kind === 'user') return r.role === 'driver' ? { driverUserId: r.id } : { enteredBy: r.id };
  if (kind === 'income_item' || kind === 'expense_item') return {};
  return null;
}
var AUDIT_LABELS_ = { admin_invite_user:'pf_auInvite', admin_resend_invite:'pf_auResend', admin_reset_password:'pf_auReset',
  admin_update_user:'pf_auUpdateUser', invite_accepted:'pf_auAccepted', change_password:'pf_auChangePw', login:'pf_auLogin' };
function auditLabel_(action){
  if (AUDIT_LABELS_[action]) return t(AUDIT_LABELS_[action]);
  if (/^admin_save_/.test(action)) return t('pf_auSaved');
  if (/^admin_delete_/.test(action)) return t('pf_auDeleted');
  return action;
}

      qs('#cArchMsg', fresh).innerHTML = '<div class="msg ok">'+esc(t('admin_freshDone'))+'</div>' +
        (lines.length ? '<div class="muted" style="font-size:12px;line-height:1.9;margin-top:6px;">'+lines.join('<br>')+'</div>'
                      : '<div class="muted" style="font-size:12px;margin-top:6px;">'+esc(t('admin_freshNothing'))+'</div>');
      clearScreenCache_();
    });
  });
  qs('#cSave', form).addEventListener('click', function(){
    api('adminSetConfig', { data: {
      vatRate: Number(qs('#cVat',form).value),
      staleThresholdHours: Number(qs('#cStale',form).value),
      heldThresholdHours: Number(qs('#cHeld',form).value),
      secondApprovalThreshold: Number(qs('#cSecondApproval',form).value),
      areaManagerBulkUploadEnabled: qs('#cAreaBulk',form).checked
    } }).then(function(res){
      qs('#cMsg',form).innerHTML = res.ok ? '<div class="msg ok">'+esc(t('ok_saved'))+'</div>' : '<div class="msg err">'+esc(errMsg_(res))+'</div>';
    });
  });

  var slaCard = el('<div class="card"><h2>'+esc(t('admin_runStaleCheck'))+'</h2>' +
    '<div class="row" style="gap:10px;flex-wrap:wrap;">' +
      '<button class="btn secondary" id="cRunStale">'+esc(t('admin_runStaleCheck'))+'</button>' +
      '<button class="btn secondary" id="cInstallTrigger">'+esc(t('admin_installStaleTrigger'))+'</button>' +
    '</div><div id="slaMsg"></div></div>');
  content.appendChild(slaCard);
  qs('#cRunStale', slaCard).addEventListener('click', function(){
    api('runStaleCheck', {}).then(function(res){
      qs('#slaMsg',slaCard).innerHTML = res.ok ? '<div class="msg ok">'+esc(t('admin_staleCheckResult').replace('{stale}',res.staleEscalated).replace('{held}',res.heldEscalated))+'</div>' : '<div class="msg err">'+esc(errMsg_(res))+'</div>';
    });
  });
  qs('#cInstallTrigger', slaCard).addEventListener('click', function(){
    api('adminInstallStaleTrigger', {}).then(function(res){
      if (!res.ok){ qs('#slaMsg',slaCard).innerHTML = '<div class="msg err">'+esc(errMsg_(res))+'</div>'; return; }
      qs('#slaMsg',slaCard).innerHTML = '<div class="msg ok">'+esc(t(res.alreadyInstalled ? 'admin_triggerAlready' : 'admin_triggerInstalled'))+'</div>';
    });
  });
}

function renderAdminAudit(content){
  content.innerHTML = '<div class="card">'+esc(t('loading'))+'</div>';
  api('listAudit', { limit: 200 }).then(function(res){
    if(!res.ok){ content.innerHTML = '<div class="msg err">'+esc(errMsg_(res))+'</div>'; return; }
    content.innerHTML = '';
    var auditFilter = listFilters_({
      fields: ['text','date','person'],
      people: (state.meta.users||[]).map(function(u){ return [u.id, u.name]; }),
      labels: { person: 'admin_name' },
      onChange: draw
    });
    content.appendChild(auditFilter.node);
    var card = el('<div class="card"><div class="tbl-scroll" id="auditBody"></div></div>');
    content.appendChild(card);
    function draw(){
      var shown = res.audit.filter(function(a){
        return auditFilter.match({
          date: (a.at||'').slice(0,10), people: [a.userId],
          text: [a.action, userName(a.userId), a.detail, (a.at||'').slice(0,19)].join(' ')
        });
      });
      var body2 = qs('#auditBody', card);
      if (!shown.length){ body2.innerHTML = '<div class="lf-empty">'+esc(t('lf_noMatch'))+'</div>'; return; }
      body2.innerHTML = '<table><thead><tr><th>'+esc(t('handoff_created'))+'</th><th>action</th><th>'+esc(t('admin_name'))+'</th><th></th></tr></thead><tbody>' +
        shown.map(function(a){
          return '<tr><td>'+esc((a.at||'').slice(0,19).replace('T',' '))+'</td><td>'+esc(a.action)+'</td><td>'+esc(userName(a.userId))+'</td><td>'+esc(a.detail||'')+'</td></tr>';
        }).join('') + '</tbody></table>' +
        '<div class="muted" style="margin-top:8px;font-size:11.5px;">'+esc(t('lf_showing').replace('{n}', shown.length).replace('{total}', res.audit.length))+'</div>';
    }
    draw();
  });
}

// ---------------- render dispatcher ----------------
function render(){
  document.documentElement.lang = state.lang;
  document.documentElement.dir = dirFor(state.lang);
  // renderShell() turns #app into the sidebar grid (`class="shell"`), and
  // nothing used to take that class off again — so after signing out, the
  // sign-in page was drawn inside the grid's content column: a narrow strip
  // with the empty sidebar column beside it. Clear it on every dispatch;
  // renderShell puts it straight back for the screens that want it.
  var appEl = qs('#app');
  if (appEl && appEl.className) appEl.className = '';
  if (!state.apiUrl) { renderUrlSetup(); return; }
  if (state.inviteToken) { renderAcceptInvite(); return; }
  if (!state.token) { renderLogin(); return; }
  if (!state.user) {
    if (restoreSession_()) { refreshSessionInBackground_(); render(); return; }
    loadWhoAmI();
    return;
  }
  if (state.user.mustChangePw) { renderChangePw(); return; }
  if (!state.meta) { loadMetaAndRender(); return; }
  renderShell();
}

function loadWhoAmI(){
  // bootstrap = whoami + listMeta in one round trip; falls back to whoami
  // alone if the backend predates it.
  api('bootstrap', {}).then(function(res){
    if (res.error === 'unknown_action') {
      api('whoami', {}).then(function(res2){
        if (!res2.ok){ state.token=''; localStorage.removeItem('bgc_token'); render(); return; }
        state.user = res2.user;
        setLang(res2.user.language || state.lang);
        render();
      });
      return;
    }
    if (!res.ok){ state.token=''; localStorage.removeItem('bgc_token'); render(); return; }
    state.user = res.user;
    if (res.meta && res.meta.ok) state.meta = res.meta;
    saveSession_();
    setLang(res.user.language || state.lang);
    render();
  });
}

state.inviteToken = inviteTokenFromUrl_();
startWarmUp_();
render();
})();
</script>
