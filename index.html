<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Best Gas — Cash Collection</title>
<!-- Favicon, apple-touch-icon, and the Android manifest are all built at
     runtime from LOGO_SRC (see attachIcons() near the bottom of the script)
     instead of duplicated here — this single-file app has exactly one
     confirmed-good logo asset and every icon surface reuses it. -->
<meta name="theme-color" content="#4D6D51">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Best Gas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#4D6D51; --green-dark:#3b5540; --green-pale:#e7ede8; --cream:#F2EEE4;
    --bg:#f6f5f1; --card:#ffffff; --text:#20241f; --muted:#767b71; --muted-2:#98988f;
    --border:#e7e3d7; --border-soft:#f0ede4; --danger:#c14a30; --danger-bg:#fbe7e1;
    --warn:#b3820f; --warn-bg:#fdf1d8; --ok:#2f7a45; --ok-bg:#e2f3e6;
    --radius:14px; --radius-sm:9px; --radius-lg:20px;
    --shadow-sm:0 1px 2px rgba(32,36,31,.05), 0 1px 1px rgba(32,36,31,.04);
    --shadow-md:0 4px 14px rgba(32,36,31,.07), 0 1px 3px rgba(32,36,31,.05);
    --shadow-lg:0 12px 32px rgba(32,36,31,.12), 0 2px 6px rgba(32,36,31,.06);
    --font-en:'Inter',-apple-system,'Segoe UI',Tahoma,Arial,sans-serif;
    --font-ar:'Cairo','Inter',-apple-system,'Segoe UI','Geeza Pro',Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-en);min-height:100vh;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;}
  html[dir="rtl"] body{font-family:var(--font-ar);letter-spacing:0;}
  ::selection{background:var(--green);color:#fff;}
  /* Flat #4D6D51, exactly the logo artwork's own background — the PNG has
     no transparency around the emblem, so anything but an exact match shows
     as a visible rectangle behind it. */
  .brand-page{background:var(--green);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;gap:22px;}
  .brand-logo{width:150px;max-width:55vw;display:block;}
  header{background:var(--green);color:#fff;padding:13px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;box-shadow:var(--shadow-md);position:relative;z-index:2;}
  header .brand{font-weight:800;font-size:21px;display:flex;align-items:center;gap:12px;letter-spacing:-.02em;}
  header .brand img{height:48px;width:auto;object-fit:contain;border-radius:6px;}
  header .who{font-size:13px;opacity:.85;font-weight:500;}
  header select, header button{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:9px;padding:7px 12px;font-size:13px;cursor:pointer;font-weight:600;transition:background .15s ease, transform .1s ease;font-family:inherit;}
  header select{background:#fff;color:var(--green-dark);border-color:transparent;}
  header button:hover{background:rgba(255,255,255,.24);}
  header button:active{transform:scale(.97);}
  .notif-bell{position:relative;padding:8px !important;display:flex;align-items:center;justify-content:center;line-height:1;}
  .notif-bell svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;}
  #loadOverlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(32,36,31,.22);z-index:9999;opacity:0;pointer-events:none;transition:opacity .2s ease;}
  #loadOverlay.active{opacity:1;}
  #loadOverlay .ring{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-lg);}
  #loadOverlay .ring-inner{width:52px;height:52px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;}
  #loadOverlay .pct{font-size:13.5px;font-weight:800;color:var(--green-dark);}
  .notif-badge{position:absolute;top:-4px;inset-inline-end:-4px;background:var(--danger);color:#fff;border-radius:999px;min-width:17px;height:17px;padding:0 4px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--green);}
  .home-action{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.22);font-size:13px;font-weight:600;opacity:.95;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .home-action.has-action{cursor:pointer;}
  .home-action.has-action:hover{opacity:1;}
  .home-action-cta{font-size:12px;font-weight:800;white-space:nowrap;text-decoration:underline;text-underline-offset:2px;}
  nav{display:flex;gap:6px;flex-wrap:wrap;background:var(--green-dark);padding:10px 18px;position:relative;z-index:1;}
  nav button{background:transparent;border:1px solid rgba(255,255,255,.28);color:rgba(255,255,255,.92);padding:7px 15px 7px 12px;border-radius:999px;font-size:13px;cursor:pointer;font-weight:600;transition:background .15s ease, border-color .15s ease, transform .1s ease;font-family:inherit;display:inline-flex;align-items:center;gap:6px;}
  html[dir="rtl"] nav button{padding:7px 12px 7px 15px;}
  nav button:hover{background:rgba(255,255,255,.1);}
  nav button.active{background:#fff;color:var(--green-dark);border-color:#fff;box-shadow:var(--shadow-sm);}
  nav button.active .nav-icon{stroke:var(--green-dark);}
  nav button:active{transform:scale(.96);}
  .nav-icon{width:15px;height:15px;stroke:rgba(255,255,255,.92);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
  main{max-width:1080px;margin:0 auto;padding:22px 18px 60px;}
  .card{background:var(--card);border:1px solid var(--border-soft);border-radius:var(--radius);padding:20px;margin-bottom:18px;overflow-x:auto;box-shadow:var(--shadow-sm);transition:box-shadow .2s ease;}
  .card h2{margin:0 0 14px;font-size:15px;font-weight:700;color:var(--text);letter-spacing:-.01em;display:flex;align-items:center;gap:8px;}
  .card h2::before{content:'';width:4px;height:15px;border-radius:3px;background:var(--green);display:inline-block;flex-shrink:0;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  html[dir="rtl"] label{text-transform:none;letter-spacing:0;}
  input,select,textarea{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;background:var(--bg);color:var(--text);font-family:inherit;transition:border-color .15s ease, background .15s ease, box-shadow .15s ease;}
  input:hover,select:hover,textarea:hover{border-color:var(--muted-2);}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);background:#fff;box-shadow:0 0 0 3px var(--green-pale);}
  .field{margin-bottom:12px;}
  button.btn{background:var(--green);color:#fff;border:none;padding:10px 18px;border-radius:var(--radius-sm);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:var(--shadow-sm);transition:background .15s ease, transform .1s ease, box-shadow .15s ease;}
  button.btn:hover{background:var(--green-dark);box-shadow:var(--shadow-md);}
  button.btn:active{transform:scale(.97);}
  button.btn.secondary{background:#fff;color:var(--green);border:1.5px solid var(--border);box-shadow:none;}
  button.btn.secondary:hover{border-color:var(--green);background:var(--green-pale);}
  button.btn.danger{background:var(--danger);}
  button.btn.danger:hover{background:#a13c26;}
  button.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{padding:10px 12px;border-bottom:1px solid var(--border-soft);text-align:start;}
  th{color:var(--muted);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;background:var(--bg);position:sticky;top:0;}
  html[dir="rtl"] th{text-transform:none;letter-spacing:0;}
  tbody tr{transition:background .1s ease;}
  tbody tr:hover{background:var(--green-pale);}
  .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 11px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.01em;}
  .badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
  .badge.pending{background:var(--warn-bg);color:var(--warn);}
  .badge.confirmed{background:var(--ok-bg);color:var(--ok);}
  .badge.disputed{background:var(--danger-bg);color:var(--danger);}
  .badge.rejected{background:#efeee8;color:var(--muted);}
  .badge.completed{background:var(--ok-bg);color:var(--ok);}
  .stat{display:flex;flex-direction:column;gap:4px;position:relative;padding-inline-start:14px;}
  .stat::before{content:'';position:absolute;inset-inline-start:0;top:2px;bottom:2px;width:3px;border-radius:3px;background:var(--green);opacity:.55;}
  .stat .n{font-size:26px;font-weight:800;color:var(--text);letter-spacing:-.02em;line-height:1.1;}
  .stat .l{font-size:12px;color:var(--muted);font-weight:600;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .msg{padding:11px 14px;border-radius:var(--radius-sm);margin-bottom:14px;font-size:13px;font-weight:600;}
  .msg.err{background:var(--danger-bg);color:var(--danger);}
  .msg.ok{background:var(--ok-bg);color:var(--ok);}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
  .tabs button{padding:8px 15px;border-radius:999px;border:1.5px solid var(--border);background:#fff;cursor:pointer;font-size:13px;font-weight:600;color:var(--text);font-family:inherit;transition:all .15s ease;}
  .tabs button:hover{border-color:var(--green);}
  .tabs button.active{background:var(--green);color:#fff;border-color:var(--green);box-shadow:var(--shadow-sm);}
  .center{display:flex;align-items:center;justify-content:center;min-height:70vh;}
  table th[data-key]{cursor:pointer;user-select:none;white-space:nowrap;}
  table th[data-key]:hover{color:var(--green);}
  .barlist{display:flex;flex-direction:column;gap:10px;}
  .barlist .row-label{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:3px;}
  .barlist .track{height:10px;border-radius:6px;background:var(--bg-2,#eee9dd);overflow:hidden;}
  .barlist .fill{height:100%;border-radius:6px;background:var(--green);}
  .barlist .fill.pos{background:#8fae7a;}
  .trend-svg{width:100%;height:auto;display:block;}
  .login-card{width:100%;max-width:380px;box-shadow:var(--shadow-lg);border:none;border-radius:var(--radius-lg);padding:30px 26px 26px;}
  .brand-title{color:#fff;font-weight:800;font-size:21px;letter-spacing:-.02em;text-align:center;margin:0;}
  .brand-tagline{color:rgba(255,255,255,.8);font-size:12.5px;font-weight:600;text-align:center;margin-top:2px;letter-spacing:.01em;}
  .login-lang{display:flex;justify-content:center;gap:6px;margin-bottom:20px;}
  .login-lang button{border:1.5px solid var(--border);background:#fff;color:var(--muted);font-size:12px;font-weight:700;padding:5px 13px;border-radius:999px;cursor:pointer;font-family:inherit;transition:all .15s ease;}
  .login-lang button:hover{border-color:var(--green);color:var(--green-dark);}
  .login-lang button.active{background:var(--green);color:#fff;border-color:var(--green);}
  .login-card h2{font-size:16px;margin:0 0 6px;text-align:center;}
  .login-hint{font-size:12.5px;color:var(--muted);text-align:center;margin:0 0 18px;line-height:1.5;}
  .login-card .field label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
  .login-card .field input{padding:12px 14px;border-radius:var(--radius-sm);font-size:15px;}
  .login-card button.btn{width:100%;padding:12.5px;font-size:14.5px;border-radius:var(--radius-sm);margin-top:8px;letter-spacing:-.005em;}
  .login-forgot{display:block;width:100%;text-align:center;margin-top:16px;font-size:12.5px;color:var(--green-dark);font-weight:700;cursor:pointer;background:none;border:none;font-family:inherit;padding:4px;}
  .login-forgot:hover{text-decoration:underline;color:var(--green);}
  .login-footer{color:rgba(255,255,255,.65);font-size:11px;text-align:center;margin-top:-6px;}
  small.hint{color:var(--muted);font-size:12px;}
  .list-item{padding:14px;border:1px solid var(--border-soft);border-radius:var(--radius-sm);margin-bottom:10px;background:#fff;transition:box-shadow .15s ease, border-color .15s ease;}
  .list-item:hover{box-shadow:var(--shadow-sm);border-color:var(--border);}
  .list-item .top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
  .amount{font-weight:800;color:var(--text);font-size:15px;letter-spacing:-.01em;}
  .muted{color:var(--muted);font-size:12px;}
  .actions{display:flex;gap:8px;margin-top:10px;}
  .breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);}
  .breakdown .bi{font-size:11.5px;color:var(--muted);}
  .breakdown .bi b{display:block;font-size:13.5px;color:var(--text);font-weight:700;margin-top:1px;}
  .details-toggle{background:none;border:none;color:var(--green);font-size:12px;font-weight:700;cursor:pointer;padding:0;margin-top:8px;font-family:inherit;}
  .details-toggle:hover{text-decoration:underline;}
  /* sortable / searchable table component */
  .tbl-search{position:relative;margin-bottom:12px;max-width:320px;}
  .tbl-search input{padding-inline-start:36px;border-radius:999px;background:var(--bg);}
  .tbl-search::before{content:'';position:absolute;top:50%;inset-inline-start:13px;transform:translateY(-50%);width:14px;height:14px;border:2px solid var(--muted-2);border-radius:50%;pointer-events:none;}
  .tbl-search::after{content:'';position:absolute;top:60%;inset-inline-start:23px;width:6px;height:2px;background:var(--muted-2);transform:rotate(45deg);pointer-events:none;}
  html[dir="rtl"] .tbl-search::after{inset-inline-start:auto;inset-inline-end:23px;transform:rotate(-45deg);}
  .tbl-scroll{overflow-x:auto;}
  th.sortable{cursor:pointer;user-select:none;white-space:nowrap;}
  th.sortable:hover{color:var(--green-dark);}
  th.sortable .arrow{color:var(--green);margin-inline-start:3px;}

  /* Small phones — tighten spacing to reclaim width rather than relying on
     auto-fit grids alone, and keep the header from feeling cramped once the
     bell + language switch + logout are all fighting for the same row. */
  @media (max-width: 420px){
    main{padding:14px 10px 50px;}
    .card{padding:14px;}
    header{padding:10px 12px;gap:8px;}
    header .brand{font-size:16px;gap:8px;}
    header .brand img{height:38px;}
    header .who{display:none;}
    .grid{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;}
    .login-card{padding:22px 18px 20px;}
    .brand-logo{width:118px;}
    table{font-size:12.5px;}
  }
</style>
</head>

(function attachIcons(){
  try {
    var favicon = document.createElement('link');
    favicon.rel = 'icon'; favicon.type = 'image/png'; favicon.href = LOGO_SRC;
    document.head.appendChild(favicon);

    };
    var blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    var manifestLink = document.createElement('link');
    manifestLink.rel = 'manifest';
    manifestLink.href = URL.createObjectURL(blob);
    document.head.appendChild(manifestLink);

})();

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function money(n){ n=Number(n||0); return n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function el(html){
  html = html.trim();
  // A bare <tr>/<td>/<th> fragment gets silently stripped by the HTML
  // parser when set via a plain <div>'s innerHTML (no enclosing <table> in
  // that same string) — verified: div.innerHTML='<tr><td>a</td></tr>'
  // leaves a single text node "a", not the row. Give it a <table> context.
  var m = /^<(tr|td|th|tbody|thead)[ >]/i.exec(html);
  if (m) {
    var table = document.createElement('table');
    table.innerHTML = html;
    return table.querySelector(m[1].toLowerCase());
  }
  var d=document.createElement('div'); d.innerHTML=html; return d.firstChild;
}
function qs(sel,root){ return (root||document).querySelector(sel); }
function qsa(sel,root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }

// ---------------- centered % loading overlay ----------------
// Lives outside #app (appended to <body> directly) so it survives every
// screen's `root.innerHTML=''` re-render. A request count rather than a
// boolean so overlapping calls (e.g. the dashboard's parallel
// listDashboard+getSalesReport) don't let an earlier finish hide it while a
// later one is still in flight. There's no real progress to report (Apps
// Script gives no partial-completion signal), so the percentage eases
// toward 90% while waiting and jumps to 100% the moment a response lands —
// same honest-but-approximate approach as every "loading %" UI that isn't
// backed by a real byte counter.
var loadingCount = 0;
var loadProgress = 0;
var loadTimer = null;
function loadOverlayEls(){
  var overlay = document.getElementById('loadOverlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'loadOverlay';
    overlay.innerHTML = '<div class="ring" id="loadRing"><div class="ring-inner"><span class="pct" id="loadPct">0%</span></div></div>';
    document.body.appendChild(overlay);
  }
  return { overlay: overlay, ring: qs('#loadRing', overlay), pct: qs('#loadPct', overlay) };
}
function setLoadProgress(p){
  loadProgress = p;
  var els = loadOverlayEls();
  var deg = Math.round(p * 3.6);
  els.ring.style.background = 'conic-gradient(var(--green) ' + deg + 'deg, var(--border-soft) 0deg)';
  els.pct.textContent = Math.round(p) + '%';
}
function startLoading(){
  loadingCount++;
  if (loadingCount !== 1) return;
  var els = loadOverlayEls();
  els.overlay.classList.add('active');
  setLoadProgress(0);
  clearInterval(loadTimer);
  loadTimer = setInterval(function(){
    setLoadProgress(Math.min(loadProgress + (90 - loadProgress) * 0.12, 90));
  }, 120);
}
function stopLoading(){
  loadingCount = Math.max(0, loadingCount - 1);
  if (loadingCount !== 0) return;
  clearInterval(loadTimer);
  setLoadProgress(100);
  setTimeout(function(){
    if (loadingCount !== 0) return; // a new request started before the fade-out
    loadOverlayEls().overlay.classList.remove('active');
    setLoadProgress(0);
  }, 250);
}

function api(action, payload){
  payload = payload || {};
  payload.action = action;
  payload.token = state.token;
  startLoading();
  return fetch(state.apiUrl, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  }).then(function(r){ return r.json(); }).then(function(res){
    stopLoading();
    if (res.token) { state.token = res.token; localStorage.setItem('bgc_token', res.token); }
    return res;
  }).catch(function(err){
    stopLoading();
    return { ok:false, error:'network' };
  });
}

// ---------------- meta loading ----------------
function loadMetaAndRender(){
  api('listMeta', {}).then(function(res){
    if (res.ok) state.meta = res;
    if (state.user.mustChangePw) { render(); return; }
    render();
    // renderHome and renderHandoffs already populate the count from data
    // they fetch anyway — firing a second, separate listDashboard call
    // right after login just to do it again here wastes a full extra round
    // trip to Apps Script on every single login for most users, who land
    // on Home. Only screens that don't otherwise touch dashboard data need
    // this fallback fetch.
    if (state.screen !== 'home' && state.screen !== 'handoffs') refreshNotifCount();
  });
}

// ---------------- notifications bell ----------------
// A quick-access count of "things needing this person's attention right
// now" — their own pending handoffs plus (for company-wide roles) open
// disputes — so it's visible from every screen, not just Home/Handoffs.
// Patches the badge in place instead of a full render() so it can be
// refreshed opportunistically (after login, after any handoff list load)
// without disrupting whatever the user is doing elsewhere on screen.
function setNotifCount(n){
  state.notifCount = n;
  var badge = qs('#notifBadge');
  if (badge) { badge.textContent = n; badge.hidden = n === 0; }

function refreshNotifCount(){
  if (!state.user) return;
  api('listDashboard', {}).then(function(res){
    if (!res.ok) return;
    var n = (res.pendingForMe||[]).length + (res.openDisputes||[]).length;
    setNotifCount(n);
  });
}

      (res.companyOutstanding!=null ? statCard(money(res.companyOutstanding), t('home_companyOutstanding')) : '') +
      (report ? statCard(money(report.totals.netCashOwed), t('report_net')) : '') +
      (report ? statCard(money(report.totals.posSales), t('report_pos')) : '');
    body.appendChild(statsWrap);

    if (res.pendingForMe.length){
      var pendingCard = el('<div class="card"><h2>'+esc(t('home_pendingForMe'))+'</h2><div id="pendingList"></div></div>');
      body.appendChild(pendingCard);
      var pl = qs('#pendingList', pendingCard);
      res.pendingForMe.forEach(function(h){ pl.appendChild(handoffItem(h, true)); });
    }
    if (res.openDisputes && res.openDisputes.length){
      var disputeCard = el('<div class="card"><h2>'+esc(t('home_openDisputes'))+'</h2><div id="disputeList"></div></div>');
      body.appendChild(disputeCard);
      var dl = qs('#disputeList', disputeCard);
      res.openDisputes.forEach(function(h){ dl.appendChild(handoffItem(h, false, true)); });
    }

    // Company-wide dashboard: real business shape, not just a to-do list —
    // a trend, who's currently holding cash, and top products at a glance.
    if (report){
      if (report.byDate && report.byDate.length){
        var trendCard = el('<div class="card"><h2>'+esc(t('report_trend'))+'</h2></div>');
        trendCard.appendChild(trendChart(report.byDate));
        body.appendChild(trendCard);
      }
      if (res.companyHeldByHolder && Object.keys(res.companyHeldByHolder).length){
        var holderRows = Object.keys(res.companyHeldByHolder).map(function(uid){
          return { uid: uid, amount: res.companyHeldByHolder[uid] };
        }).sort(function(a,b){ return b.amount - a.amount; });
        var holderCard = el('<div class="card"><h2>'+esc(t('home_companyOutstanding'))+'</h2></div>');
        holderCard.appendChild(barList(holderRows, function(r){ return userName(r.uid); }, function(r){ return r.amount; }, function(){ return 0; }));
        body.appendChild(holderCard);
      }
      if (report.byProduct && report.byProduct.length){
        var topProductsCard = el('<div class="card"><h2>'+esc(t('report_byProduct'))+'</h2></div>');
        topProductsCard.appendChild(barList(report.byProduct.slice(0,5),
          function(r){ return r.name || t('report_unspecified'); },
          function(r){ return r.cashAmount; }, function(r){ return r.posAmount; }));
        body.appendChild(topProductsCard);
      }
    }
  });
}

function statCard(n, label){
  return '<div class="card stat"><div class="n">'+esc(n)+'</div><div class="l">'+esc(label)+'</div></div>';
}

// ---------------- entries ----------------
function renderEntries(body){
  var role = state.user.role;
  var sourceOptions = '';
  var meta = state.meta || {};

  var form = el('<div class="card">' +
    '<h2>'+esc(t('entry_new'))+'</h2>' +
    '<div id="entryMsg"></div>' +
    '<div class="grid">' +
      '<div class="field"><label>'+esc(t('entry_date'))+'</label><input id="eDate" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div>' +
      '<div class="field"><label>'+esc(t('entry_sourceType'))+'</label><select id="eType"></select></div>' +
      '<div class="field"><label id="eSourceLabel"></label><select id="eSource"></select></div>' +
    '</div>' +
    '<div class="grid">' +
      '<div class="field" id="eCashWrap"><label>'+esc(t('entry_cash'))+'</label><input id="eCash" type="number" step="0.01" value="0"></div>' +
      '<div class="field" id="eDeliveryWrap"><label>'+esc(t('entry_delivery'))+'</label><input id="eDelivery" type="number" step="0.01" value="0">' +
        '<small class="hint" id="eDeliveryHint"></small></div>' +
      '<div class="field" id="ePosWrap"><label>'+esc(t('entry_pos'))+'</label><input id="ePos" type="number" step="0.01" value="0"></div>' +
      '<div class="field" id="eProductWrap"><label>'+esc(t('entry_product'))+'</label><select id="eProduct"></select></div>' +
    '</div>' +
    '<div class="field"><label>'+esc(t('entry_note'))+'</label><input id="eNote"></div>' +
    '<button class="btn" id="eSubmit">'+esc(t('entry_submit'))+'</button>' +
  '</div>');
  body.innerHTML = '';
  body.appendChild(form);

  var typeSel = qs('#eType', form);
  var opts = [];
  if (role==='store_manager' || role==='admin') opts.push(['store', t('entry_source_store')]);
  if (role==='store_manager' || role==='admin' || role==='driver') opts.push(['car', t('entry_source_car')]);
  opts.push(['pos', t('entry_source_pos')]);
  typeSel.innerHTML = opts.map(function(o){ return '<option value="'+o[0]+'">'+esc(o[1])+'</option>'; }).join('');

  // A location only ever has stores and cars as direct children (per the
  // entity hierarchy) — a POS machine is a grandchild, owned by one of
  // those. Showing it as a bare label alongside store/car names with no
  // context made it look like a disconnected third category floating next
  // to Store/Car rather than a device attached to one of them, so every
  // option here now says which store/car (and location) it actually
  // belongs to.
  function posOwnerName_(p){
    if (p.ownerType === 'store') { var s = byId(meta.stores, p.ownerId); return s ? s.name : '—'; }
    var c = byId(meta.cars, p.ownerId); return c ? c.label : '—';
  }
  function posOwnerLocationId_(p){
    if (p.ownerType === 'store') { var s = byId(meta.stores, p.ownerId); return s && s.locationId; }
    var c = byId(meta.cars, p.ownerId); return c && c.locationId;
  }
  function sourceOptionLabel_(type, x){
    if (type === 'store') return (x.name || x.id) + ' — ' + locationName(x.locationId);
    if (type === 'car') return (x.label || x.id) + ' — ' + locationName(x.locationId);
    if (type === 'pos') return (x.label || x.id) + ' — ' + posOwnerName_(x) + ' — ' + locationName(posOwnerLocationId_(x));
    return x.label || x.name || x.id;
  }

  function populateSourceOptions(){
    var type = typeSel.value;
    var srcSel = qs('#eSource', form);
    qs('#eSourceLabel', form).textContent = t('entry_source_' + type);
    var list = [];
    if (type==='store'){
      list = (meta.stores||[]).filter(function(s){ return role==='admin' || s.storeManagerUserId===state.user.id; });
    } else if (type==='car'){
      list = (meta.cars||[]).filter(function(c){ return role==='admin' || role==='store_manager' || c.driverUserId===state.user.id; });
    } else if (type==='pos'){
      list = (meta.pos||[]).filter(function(p){ return role==='admin' || role==='store_manager' || p.assignedUserId===state.user.id; });
    }
    srcSel.innerHTML = list.map(function(x){
      return '<option value="'+x.id+'">'+esc(sourceOptionLabel_(type, x))+'</option>';
    }).join('') || '<option value="">'+esc(t('noData'))+'</option>';

    // Switching source type carries no meaning across types (a car's cash
    // figure has nothing to do with a store's), so leftover numbers from
    // whatever was last on screen would silently get submitted against the
    // new source if left in place.
    qs('#eCash', form).value = '0';
    qs('#eDelivery', form).value = '0';
    qs('#ePos', form).value = '0';

    qs('#eCashWrap', form).style.display = (type==='pos') ? 'none' : '';
    qs('#eDeliveryWrap', form).style.display = (type==='car') ? '' : 'none';
    qs('#ePosWrap', form).style.display = (type==='pos') ? '' : 'none';
    // this field only ever applies to a car entry — say so right where
    // people look for it when it's (correctly) not on screen.
    qs('#eDeliveryHint', form).textContent = (type==='car') ? '' : t('entry_delivery') + ' — ' + t('entry_source_car');
    qs('#eDeliveryHint', form).style.display = (type==='car') ? 'none' : 'block';
  }
  typeSel.addEventListener('change', populateSourceOptions);
  populateSourceOptions();

  var productSel = qs('#eProduct', form);
  var products = (meta.products||[]).filter(function(p){ return p.active !== false; });
  productSel.innerHTML = '<option value="">'+esc(t('entry_product_none'))+'</option>' +
    products.map(function(p){ return '<option value="'+p.id+'">'+esc(p.name)+'</option>'; }).join('');

  qs('#eSubmit', form).addEventListener('click', function(){
    var payload = {
      date: qs('#eDate', form).value,
      sourceType: typeSel.value,
      sourceId: qs('#eSource', form).value,
      productId: productSel.value || null,
      cashSales: Number(qs('#eCash', form).value||0),
      deliveryFeeBankAmount: Number(qs('#eDelivery', form).value||0),
      posSales: Number(qs('#ePos', form).value||0),
      note: qs('#eNote', form).value
    };
    if (!payload.sourceId){ qs('#entryMsg',form).innerHTML='<div class="msg err">'+esc(t('err_generic'))+'</div>'; return; }
    api('createDailyEntry', payload).then(function(res){
      if(!res.ok){ qs('#entryMsg',form).innerHTML='<div class="msg err">'+esc(t('err_generic'))+'</div>'; return; }
      qs('#entryMsg',form).innerHTML='<div class="msg ok">'+esc(t('ok_saved'))+'</div>';
      loadEntryList();
    });
  });

  var listCard = el('<div class="card"><h2>'+esc(t('entry_list'))+'</h2><div id="entryListBody"></div></div>');
  body.appendChild(listCard);
  loadEntryList();

  function loadEntryList(){
    api('listEntries', {}).then(function(res){
      var wrap = qs('#entryListBody');
      if(!res.ok || !res.entries.length){ wrap.innerHTML = '<div class="muted">'+esc(t('noData'))+'</div>'; return; }
      var rows = res.entries.slice(0,30).map(function(e){
        var amt = e.sourceType==='pos' ? e.posSales : e.cashSales;
        return '<tr><td>'+esc(e.date)+'</td><td>'+esc(t('entry_source_'+e.sourceType))+'</td><td>'+money(amt)+'</td><td>'+(e.consumedBy?'✓':'')+'</td></tr>';
      }).join('');
      wrap.innerHTML = '<table><thead><tr><th>'+esc(t('entry_date'))+'</th><th>'+esc(t('entry_sourceType'))+'</th><th>'+esc(t('handoff_amount'))+'</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>';
    });
  }
}

// ---------------- handoffs ----------------
function statusBadge(s){
  return '<span class="badge '+esc(s)+'">'+esc(t('handoff_'+s))+'</span>';
}

function breakdownGrid(b){
  if (!b) return '';
  var items = [
    ['report_storeCash', b.storeCash],
    ['report_carCash', b.carCash],
    ['report_delivery', b.deliveryFee],
    ['report_vat', b.vatOnDelivery],
    ['report_net', b.netCashOwed]
  ];
  var grid = '<div class="breakdown">' + items.map(function(it){
    return '<div class="bi">'+esc(t(it[0]))+'<b>'+money(it[1])+'</b></div>';
  }).join('') + '</div>';
  if (Number(b.posSales||0) > 0) {
    grid += '<div class="muted" style="margin-top:8px;font-size:11.5px;">'+esc(t('report_pos'))+': '+money(b.posSales)+' — '+esc(t('handoff_posNote'))+'</div>';
  }
  return grid;
}

function handoffDetailRows(h){
  if (h.perLocation && h.perLocation.length) {
    return '<div class="muted" style="font-weight:700;margin-top:10px;margin-bottom:4px;">'+esc(t('handoff_perLocation'))+'</div>' +
      h.perLocation.map(function(p){

          '<span>'+esc(locationName(p.locationId))+'</span><span><strong>'+money(p.amount)+'</strong></span></div>';
      }).join('');
  }
  if (h.perCluster && h.perCluster.length) {
    return '<div class="muted" style="font-weight:700;margin-top:10px;margin-bottom:4px;">'+esc(t('handoff_perCluster'))+'</div>' +
      h.perCluster.map(function(p){
        return '<div class="row" style="justify-content:space-between;font-size:12.5px;padding:4px 0;border-top:1px dashed var(--border-soft);">' +

function varianceLine(h){
  if (h.originalAmount == null) return '';
  return '<div class="msg err" style="margin-top:8px;">'+esc(t('handoff_originalAmount'))+': '+money(h.originalAmount)+
    ' · '+esc(t('handoff_receivedAmount'))+': '+money(h.amount)+
    ' · '+esc(t('handoff_shortfall'))+': '+money(h.shortfall)+'</div>';
}

function handoffItem(h, showConfirm, showResolve){
  // The receiving step is exactly where "what am I actually confirming?"
  // matters most — default the breakdown open there instead of behind an
  // extra click, and collapsed elsewhere to keep history lists scannable.
  var isReceivingStep = showConfirm && h.status === 'pending';
  var div = el('<div class="list-item">' +
    '<div class="top">' +
      '<div><strong>'+esc(t('kind_'+h.kind))+'</strong> ' + statusBadge(h.status) + '</div>' +
      '<div class="amount">'+money(h.amount)+'</div>' +
    '</div>' +
    '<div class="muted">'+esc(t('handoff_from'))+': '+esc(userName(h.fromUserId))+' · '+esc(t('handoff_to'))+': '+esc(h.toUserId?userName(h.toUserId):'Bank')+' · '+esc((h.createdAt||'').slice(0,16).replace('T',' '))+'</div>' +
    (h.disputeNote ? '<div class="muted">📝 '+esc(h.disputeNote)+'</div>' : '') +
    varianceLine(h) +
    (h.breakdown ? (
      '<button type="button" class="details-toggle" id="hBrkToggle">'+esc(t(isReceivingStep ? 'handoff_hideBreakdown' : 'handoff_showBreakdown'))+'</button>' +
      '<div id="hBrkBody"'+(isReceivingStep?'':' hidden')+'>' + breakdownGrid(h.breakdown) + handoffDetailRows(h) + '</div>'
    ) : '') +
    '<div class="actions" id="hActions"></div>' +
  '</div>');

  if (h.breakdown) {
    var toggle = qs('#hBrkToggle', div), brkBody = qs('#hBrkBody', div);
    toggle.addEventListener('click', function(){
      brkBody.hidden = !brkBody.hidden;
      toggle.textContent = t(brkBody.hidden ? 'handoff_showBreakdown' : 'handoff_hideBreakdown');
    });
  }

  var actions = qs('#hActions', div);
  if (showConfirm && h.status==='pending'){
    var recv = el('<div class="field"><label>'+esc(t('handoff_receivedAmount'))+'</label>' +
      '<input id="hRecvAmt" type="number" step="0.01" value="'+esc(h.amount)+'"></div>');
    actions.parentNode.insertBefore(recv, actions);
    var cb = el('<button class="btn">'+esc(t('handoff_confirm'))+'</button>');
    cb.addEventListener('click', function(){
      var recvInput = qs('#hRecvAmt', div);
      var receivedAmount = recvInput.value === '' ? h.amount : Number(recvInput.value);
      api('confirmHandoff',{id:h.id, receivedAmount:receivedAmount}).then(function(res){
        if (res.ok && res.handoff && res.handoff.shortfall != null) { toast('handoff_shortfallAccepted', 'ok'); return; }
        render();
      });
    });
    var db = el('<button class="btn danger">'+esc(t('handoff_dispute'))+'</button>');
    db.addEventListener('click', function(){
      var note = prompt(t('handoff_disputeNote'))||'';
      api('disputeHandoff',{id:h.id, note:note}).then(function(){ render(); });
    });
    actions.appendChild(cb); actions.appendChild(db);
  }
  if (showResolve && h.status==='disputed'){
    var rc = el('<button class="btn">'+esc(t('handoff_resolveConfirm'))+'</button>');
    rc.addEventListener('click', function(){ api('resolveDispute',{id:h.id, resolution:'confirm'}).then(function(){ render(); }); });
    var rr = el('<button class="btn danger">'+esc(t('handoff_resolveReject'))+'</button>');
    rr.addEventListener('click', function(){ api('resolveDispute',{id:h.id, resolution:'reject'}).then(function(){ render(); }); });
    actions.appendChild(rc); actions.appendChild(rr);
  }
  return div;
}

function renderHandoffs(body){
  body.innerHTML = '<div class="card">'+esc(t('loading'))+'</div>';
  var role = state.user.role;

  api('listHandoffs', {}).then(function(res){
    if(!res.ok){ body.innerHTML='<div class="msg err">'+esc(t('err_generic'))+'</div>'; return; }
    body.innerHTML = '';

    // action card: create outgoing handoff / record deposit
    if (role==='store_manager' || role==='admin'){
      var locId = null;
      var myStore = (state.meta.stores||[]).find(function(s){ return s.storeManagerUserId===state.user.id; });
      if (myStore) locId = myStore.locationId;
      var lc = el('<div class="card"><h2>'+esc(t('handoff_createLocation'))+'</h2>' +
        (role==='admin' ? '<div class="field"><select id="hLoc">'+(state.meta.locations||[]).map(function(l){return '<option value="'+l.id+'">'+esc(l.city+' — '+l.name)+'</option>';}).join('')+'</select></div>' : '') +
        '<button class="btn" id="hCreateLoc">'+esc(t('handoff_createLocation'))+'</button><div id="hLocMsg"></div></div>');
      body.appendChild(lc);
      qs('#hCreateLoc', lc).addEventListener('click', function(){
        var lid = role==='admin' ? qs('#hLoc',lc).value : locId;
        api('createHandoff', {kind:'location_to_cluster', locationId: lid}).then(function(res2){
          qs('#hLocMsg',lc).innerHTML = res2.ok ? '<div class="msg ok">'+esc(t('ok_saved'))+'</div>' : '<div class="msg err">'+esc(t('err_generic'))+'</div>';
          if(res2.ok) render();
        });
      });
    }

    if (role==='cluster_manager' || role==='admin'){
      var myCluster = (state.meta.clusters||[]).find(function(c){ return c.clusterManagerUserId===state.user.id; });
      var cc = el('<div class="card"><h2>'+esc(t('handoff_createCluster'))+'</h2>' +
        (role==='admin' ? '<div class="field"><select id="hClu">'+(state.meta.clusters||[]).map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>';}).join('')+'</select></div>' : '') +
        '<button class="btn" id="hCreateClu">'+esc(t('handoff_createCluster'))+'</button><div id="hCluMsg"></div></div>');
      body.appendChild(cc);
      qs('#hCreateClu', cc).addEventListener('click', function(){
        var cid = role==='admin' ? qs('#hClu',cc).value : (myCluster && myCluster.id);
        api('createHandoff', {kind:'cluster_to_collector', clusterId: cid}).then(function(res2){
          qs('#hCluMsg',cc).innerHTML = res2.ok ? '<div class="msg ok">'+esc(t('ok_saved'))+'</div>' : '<div class="msg err">'+esc(t('err_generic'))+'</div>';
          if(res2.ok) render();
        });
      });
    }

    if (role==='collector' || role==='admin'){
      var dc = el('<div class="card"><h2>'+esc(t('handoff_deposit'))+'</h2>' +
        '<div class="field"><label>'+esc(t('handoff_bankRef'))+'</label><input id="hBankRef"></div>' +
        '<div class="field"><label>'+esc(t('handoff_slip'))+'</label>' +
          '<div class="row">' +
            '<button type="button" class="btn secondary" id="hSlipCameraBtn">'+esc(t('handoff_takePhoto'))+'</button>' +
            '<button type="button" class="btn secondary" id="hSlipFileBtn">'+esc(t('handoff_chooseFile'))+'</button>' +
          '</div>' +
          '<input id="hSlipCamera" type="file" accept="image/*" capture="environment" hidden>' +
          '<input id="hSlipFile" type="file" accept="image/*" hidden>' +
          '<img id="hSlipPreview" hidden style="max-width:160px;max-height:160px;border-radius:8px;margin-top:8px;display:block;">' +
        '</div>' +
        '<button class="btn" id="hDeposit">'+esc(t('handoff_deposit'))+'</button><div id="hDepMsg"></div></div>');
      body.appendChild(dc);

      var pickedFile = null;
      var preview = qs('#hSlipPreview', dc);
      function onPicked(input){
        return function(){
          var f = input.files && input.files[0];
          if (!f) return;
          pickedFile = f;
          var reader = new FileReader();
          reader.onload = function(){ preview.src = reader.result; preview.hidden = false; };
          reader.readAsDataURL(f);
        };
      }
      qs('#hSlipCameraBtn', dc).addEventListener('click', function(){ qs('#hSlipCamera', dc).click(); });
      qs('#hSlipFileBtn', dc).addEventListener('click', function(){ qs('#hSlipFile', dc).click(); });
      qs('#hSlipCamera', dc).addEventListener('change', onPicked(qs('#hSlipCamera', dc)));
      qs('#hSlipFile', dc).addEventListener('change', onPicked(qs('#hSlipFile', dc)));

      qs('#hDeposit', dc).addEventListener('click', function(){
        var bankRef = qs('#hBankRef', dc).value;
        function submit(fileData){
          var payload = { bankReference: bankRef };
          if (fileData) { payload.fileBase64 = fileData.base64; payload.fileName = fileData.name; payload.fileMime = fileData.mime; }
          api('recordDeposit', payload).then(function(res2){
            qs('#hDepMsg',dc).innerHTML = res2.ok ? '<div class="msg ok">'+esc(t('ok_saved'))+'</div>' : '<div class="msg err">'+esc(t('err_generic'))+'</div>';
            if(res2.ok) render();
          });
        }
        if (pickedFile){
          var reader = new FileReader();
          reader.onload = function(){
            var base64 = reader.result.split(',')[1];
            submit({ base64: base64, name: pickedFile.name, mime: pickedFile.type });
          };
          reader.readAsDataURL(pickedFile);
        } else {
          submit(null);
        }
      });
    }

    // lists
    var pending = res.handoffs.filter(function(h){ return h.status==='pending' && h.toUserId===state.user.id; });
    var disputed = res.handoffs.filter(function(h){ return h.status==='disputed'; });
    var history = res.handoffs.filter(function(h){ return pending.indexOf(h)<0; });
    setNotifCount(pending.length + ((role==='admin'||role==='finance') ? disputed.length : 0));

    if (pending.length){
      var pc = el('<div class="card"><h2>'+esc(t('handoff_pending'))+'</h2><div id="pList"></div></div>');
      body.appendChild(pc);
      var pl = qs('#pList', pc);
      pending.forEach(function(h){ pl.appendChild(handoffItem(h, true)); });
    }

    if (disputed.length && (role==='admin' || role==='finance')){
      var dcw = el('<div class="card"><h2>'+esc(t('handoff_disputed'))+'</h2><div id="dList"></div></div>');
      body.appendChild(dcw);
      var dl = qs('#dList', dcw);
      disputed.forEach(function(h){ dl.appendChild(handoffItem(h, false, true)); });
    }

    var hc = el('<div class="card"><h2>'+esc(t('nav_handoffs'))+'</h2><div id="hList"></div></div>');
    body.appendChild(hc);
    var hl = qs('#hList', hc);
    if (!history.length){ hl.innerHTML = '<div class="muted">'+esc(t('noData'))+'</div>'; }
    history.slice(0,40).forEach(function(h){ hl.appendChild(handoffItem(h, false, false)); });
  });
}

// ---------------- small viz helpers (no chart library — self-contained app) ----------------

// A <table> that re-sorts itself in place when a header is clicked. Column
// defs: {key, label, render?(row)->html, numeric?}. Keeps its own sort
// state via closures, so callers just call sortableTable(...).el once.
function sortableTable(rows, columns, opts){
  opts = opts || {};
  var sortKey = opts.sortKey || columns[0].key;
  var sortDir = opts.sortDir || 'desc';
  var wrap = el('<div></div>');
  function render(){
    var sorted = rows.slice().sort(function(a,b){
      var av = a[sortKey], bv = b[sortKey];
      var an = typeof av === 'number', bn = typeof bv === 'number';
      if (an || bn) {
        av = Number(av||0); bv = Number(bv||0);
        return sortDir==='asc' ? av-bv : bv-av;
      }
      av = String(av==null?'':av); bv = String(bv==null?'':bv);
      return sortDir==='asc' ? av.localeCompare(bv) : bv.localeCompare(av);
    });
    var thead = '<tr>'+columns.map(function(c){
      var arrow = c.key===sortKey ? (sortDir==='asc'?' ▲':' ▼') : '';
      return '<th data-key="'+c.key+'">'+esc(c.label)+arrow+'</th>';
    }).join('')+'</tr>';
    var tbody = sorted.map(function(r){
      return '<tr>'+columns.map(function(c){ return '<td>'+(c.render?c.render(r):esc(r[c.key])) +'</td>'; }).join('')+'</tr>';
    }).join('');
    wrap.innerHTML = (rows.length ? '<table><thead>'+thead+'</thead><tbody>'+tbody+'</tbody></table>' : '<div class="muted">'+esc(t('noData'))+'</div>');
    qsa('th[data-key]', wrap).forEach(function(th){
      th.addEventListener('click', function(){
        var k = th.getAttribute('data-key');
        if (sortKey===k) sortDir = sortDir==='asc'?'desc':'asc'; else { sortKey=k; sortDir='desc'; }
        render();
      });
    });
  }
  render();
  return wrap;
}

// Horizontal bar list (e.g. top products) — two stacked bars per row (cash / pos).
function barList(rows, labelFn, cashFn, posFn){
  var max = Math.max.apply(null, rows.map(function(r){ return cashFn(r)+posFn(r); }).concat([1]));
  var wrap = el('<div class="barlist"></div>');
  rows.forEach(function(r){
    var cash = cashFn(r), pos = posFn(r), total = cash+pos;
    var item = el('<div>' +
      '<div class="row-label"><span>'+esc(labelFn(r))+'</span><span>'+money(total)+'</span></div>' +
      '<div class="track"><div class="fill" style="width:'+(max? (cash/max*100):0)+'%;display:inline-block;"></div>' +
      '<div class="fill pos" style="width:'+(max? (pos/max*100):0)+'%;display:inline-block;"></div></div>' +
    '</div>');
    wrap.appendChild(item);
  });
  return wrap;
}

// Minimal inline SVG bar chart for a date trend — no charting library, self
// contained like the rest of this app.
function trendChart(rows){
  var w = 700, h = 160, pad = 24;
  if (!rows.length) return el('<div class="muted">'+esc(t('noData'))+'</div>');
  var max = Math.max.apply(null, rows.map(function(r){ return r.total; }).concat([1]));
  var barW = (w - pad*2) / rows.length;
  var bars = rows.map(function(r, i){
    var bh = max>0 ? (r.total/max) * (h - pad*2) : 0;
    var x = pad + i*barW;
    var y = h - pad - bh;
    return '<rect x="'+(x+barW*0.15)+'" y="'+y+'" width="'+(barW*0.7)+'" height="'+bh+'" rx="3" fill="var(--green)"><title>'+esc(r.date)+': '+money(r.total)+'</title></rect>';
  }).join('');
  var baseline = '<line x1="'+pad+'" y1="'+(h-pad)+'" x2="'+(w-pad)+'" y2="'+(h-pad)+'" stroke="var(--border)" stroke-width="1"/>';
  var firstLabel = rows[0] ? '<text x="'+pad+'" y="'+(h-4)+'" font-size="10" fill="var(--muted)">'+esc(rows[0].date)+'</text>' : '';
  var lastLabel = rows.length>1 ? '<text x="'+(w-pad)+'" y="'+(h-4)+'" font-size="10" fill="var(--muted)" text-anchor="end">'+esc(rows[rows.length-1].date)+'</text>' : '';
  return el('<svg class="trend-svg" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+baseline+bars+firstLabel+lastLabel+'</svg>');
}

// ---------------- sales report ----------------
function renderReport(body){
  body.innerHTML = '<div class="card">' +
    '<h2>'+esc(t('report_title'))+'</h2>' +
    '<div class="grid">' +
      '<div class="field"><label>'+esc(t('report_from'))+'</label><input id="rFrom" type="date"></div>' +
      '<div class="field"><label>'+esc(t('report_to'))+'</label><input id="rTo" type="date"></div>' +
    '</div>' +
    '<button class="btn" id="rRun">'+esc(t('report_run'))+'</button>' +
  '</div><div id="rResult"></div>';

  qs('#rRun').addEventListener('click', runReport);
  runReport();

  function runReport(){
    var payload = { dateFrom: qs('#rFrom').value || undefined, dateTo: qs('#rTo').value || undefined };
    api('getSalesReport', payload).then(function(res){
      var out = qs('#rResult');
      if(!res.ok){ out.innerHTML = '<div class="msg err">'+esc(t('err_generic'))+'</div>'; return; }
      var t1 = res.totals, t2 = res.outstanding;

      out.innerHTML = '';

      var statsCard = el('<div class="grid">' +
        statCard(money(t1.netCashOwed), t('report_net')) +
        statCard(money(t2.netCashOwed), t('report_outstanding')) +
        statCard(money(t1.storeCash), t('report_storeCash')) +
        statCard(money(t1.carCash), t('report_carCash')) +
        statCard(money(t1.posSales), t('report_pos')) +
        statCard(money(t1.deliveryFee), t('report_delivery')) +
        statCard(money(t1.vatOnDelivery), t('report_vat')) +
      '</div>');
      out.appendChild(statsCard);

      // Daily trend — the shape of the dashboard, not just a number.
      if (res.byDate && res.byDate.length){
        var trendCard = el('<div class="card"><h2>'+esc(t('report_trend'))+'</h2></div>');
        trendCard.appendChild(trendChart(res.byDate));
        out.appendChild(trendCard);
      }

      // By product — cash vs POS, sortable, with a proportional bar per row
      // so the biggest sellers are visible at a glance, not just numbers.
      var productCard = el('<div class="card"><h2>'+esc(t('report_byProduct'))+'</h2></div>');
      if (res.byProduct && res.byProduct.length){
        productCard.appendChild(barList(res.byProduct.slice(0,8),
          function(r){ return r.name || t('report_unspecified'); },
          function(r){ return r.cashAmount; },
          function(r){ return r.posAmount; }));
        var productTableWrap = el('<div style="margin-top:14px;"></div>');
        productTableWrap.appendChild(sortableTable(res.byProduct, [
          { key:'name', label: t('report_product'), render: function(r){ return esc(r.name || t('report_unspecified')); } },
          { key:'cashAmount', label: t('report_cashChannel'), render: function(r){ return money(r.cashAmount); } },
          { key:'posAmount', label: t('report_posChannel'), render: function(r){ return money(r.posAmount); } },
          { key:'total', label: t('report_total'), render: function(r){ return '<strong>'+money(r.total)+'</strong>'; } }
        ], { sortKey:'total', sortDir:'desc' }));
        productCard.appendChild(productTableWrap);
        productCard.appendChild(el('<small class="hint">'+esc(t('report_sortHint'))+'</small>'));
      } else {
        productCard.appendChild(el('<div class="muted">'+esc(t('noData'))+'</div>'));
      }
      out.appendChild(productCard);

      // By location — same sortable treatment. Flatten netCashOwed onto
      // the row first so the table can sort on the real number, not the
      // formatted string.
      res.byLocation.forEach(function(r){ r.net = r.totals.netCashOwed; });
      var locationCard = el('<div class="card"><h2>'+esc(t('report_byLocation'))+'</h2></div>');
      locationCard.appendChild(sortableTable(res.byLocation, [
        { key:'city', label: t('report_city') },
        { key:'name', label: t('admin_location') },
        { key:'net', label: t('report_net'), render: function(r){ return '<strong>'+money(r.net)+'</strong>'; } }
      ], { sortKey:'city', sortDir:'asc' }));
      out.appendChild(locationCard);

      // finance/accountant/operations manager get the audit trail here —
      // admin has its own dedicated tab under "nav_admin" already.
      if (['finance','accountant','operations_manager'].indexOf(state.user.role) >= 0){
        var auditCard = el('<div class="card"><h2>'+esc(t('admin_audit'))+'</h2><div id="rAudit">'+esc(t('loading'))+'</div></div>');
        out.appendChild(auditCard);
        api('listAudit', { limit: 100 }).then(function(res2){
          var wrap = qs('#rAudit', auditCard);
          if (!res2.ok || !res2.audit.length){ wrap.innerHTML = '<div class="muted">'+esc(t('noData'))+'</div>'; return; }
          wrap.innerHTML = '<table><thead><tr><th>'+esc(t('handoff_created'))+'</th><th>action</th><th>'+esc(t('admin_name'))+'</th></tr></thead><tbody>' +
            res2.audit.map(function(a){ return '<tr><td>'+esc((a.at||'').slice(0,19).replace('T',' '))+'</td><td>'+esc(a.action)+'</td><td>'+esc(userName(a.userId))+'</td></tr>'; }).join('') +
            '</tbody></table>';
        });
      }
    });
  }
}

function render(){
  document.documentElement.lang = state.lang;
  document.documentElement.dir = dirFor(state.lang);
  if (!state.apiUrl) { renderUrlSetup(); return; }
  if (!state.token) { renderLogin(); return; }
  if (!state.user) { loadWhoAmI(); return; }
  if (state.user.mustChangePw) { renderChangePw(); return; }
  if (!state.meta) { loadMetaAndRender(); return; }
  renderShell();
}

function loadWhoAmI(){
  api('whoami', {}).then(function(res){
    if (!res.ok){ state.token=''; localStorage.removeItem('bgc_token'); render(); return; }
    state.user = res.user;
    setLang(res.user.language || state.lang);
    render();
  });
}

render();
})();
</script>
