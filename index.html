// A <table> that re-sorts itself in place when a header is clicked. Column
// defs: {key, label, render?(row)->html, numeric?}. Keeps its own sort
// state via closures, so callers just call sortableTable(...).el once.
function sortableTable(rows, columns, opts){
  opts = opts || {};
  var sortKey = opts.sortKey || columns[0].key;
  var sortDir = opts.sortDir || 'desc';
  var wrap = el('<div></div>');
  function render(){
    var sorted = rows.slice().sort(function(a,b){
      var av = a[sortKey], bv = b[sortKey];
      var an = typeof av === 'number', bn = typeof bv === 'number';
      if (an || bn) {
        av = Number(av||0); bv = Number(bv||0);
        return sortDir==='asc' ? av-bv : bv-av;
      }
      av = String(av==null?'':av); bv = String(bv==null?'':bv);
      return sortDir==='asc' ? av.localeCompare(bv) : bv.localeCompare(av);
    });
    var thead = '<tr>'+columns.map(function(c){
      var arrow = c.key===sortKey ? (sortDir==='asc'?' ▲':' ▼') : '';
      return '<th data-key="'+c.key+'">'+esc(c.label)+arrow+'</th>';
    }).join('')+'</tr>';
    var tbody = sorted.map(function(r){
      return '<tr>'+columns.map(function(c){ return '<td>'+(c.render?c.render(r):esc(r[c.key])) +'</td>'; }).join('')+'</tr>';
    }).join('');
    wrap.innerHTML = (rows.length ? '<table><thead>'+thead+'</thead><tbody>'+tbody+'</tbody></table>' : '<div class="muted">'+esc(t('noData'))+'</div>');
    qsa('th[data-key]', wrap).forEach(function(th){
      th.addEventListener('click', function(){
        var k = th.getAttribute('data-key');
        if (sortKey===k) sortDir = sortDir==='asc'?'desc':'asc'; else { sortKey=k; sortDir='desc'; }
        render();
      });
    });
  }
  render();
  return wrap;
}

// Horizontal bar list (e.g. top products) — two stacked bars per row (cash / pos).
function barList(rows, labelFn, cashFn, posFn, creditFn){
  creditFn = creditFn || function(){ return 0; };
  var max = Math.max.apply(null, rows.map(function(r){ return cashFn(r)+posFn(r)+creditFn(r); }).concat([1]));
  var wrap = el('<div class="barlist"></div>');
  rows.forEach(function(r){
    var cash = cashFn(r), pos = posFn(r), credit = creditFn(r), total = cash+pos+credit;
    var item = el('<div>' +
      '<div class="row-label"><span>'+esc(labelFn(r))+'</span><span>'+money(total)+'</span></div>' +
      '<div class="track"><div class="fill" style="width:'+(max? (cash/max*100):0)+'%;display:inline-block;"></div>' +
      '<div class="fill pos" style="width:'+(max? (pos/max*100):0)+'%;display:inline-block;"></div>' +
      '<div class="fill credit" style="width:'+(max? (credit/max*100):0)+'%;display:inline-block;"></div></div>' +
    '</div>');
    wrap.appendChild(item);
  });
  return wrap;
}

// Minimal inline SVG bar chart for a date trend — no charting library, self
// contained like the rest of this app.
function trendChart(rows){
  var w = 700, h = 160, pad = 24;
  if (!rows.length) return el('<div class="muted">'+esc(t('noData'))+'</div>');
  var max = Math.max.apply(null, rows.map(function(r){ return r.total; }).concat([1]));
  var barW = (w - pad*2) / rows.length;
  var bars = rows.map(function(r, i){
    var bh = max>0 ? (r.total/max) * (h - pad*2) : 0;
    var x = pad + i*barW;
    var y = h - pad - bh;
    return '<rect x="'+(x+barW*0.15)+'" y="'+y+'" width="'+(barW*0.7)+'" height="'+bh+'" rx="3" fill="var(--green)"><title>'+esc(r.date)+': '+money(r.total)+'</title></rect>';
  }).join('');
  var baseline = '<line x1="'+pad+'" y1="'+(h-pad)+'" x2="'+(w-pad)+'" y2="'+(h-pad)+'" stroke="var(--border)" stroke-width="1"/>';
  var firstLabel = rows[0] ? '<text x="'+pad+'" y="'+(h-4)+'" font-size="10" fill="var(--muted)">'+esc(rows[0].date)+'</text>' : '';
  var lastLabel = rows.length>1 ? '<text x="'+(w-pad)+'" y="'+(h-4)+'" font-size="10" fill="var(--muted)" text-anchor="end">'+esc(rows[rows.length-1].date)+'</text>' : '';
  return el('<svg class="trend-svg" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+baseline+bars+firstLabel+lastLabel+'</svg>');
}

// Inline SVG donut with a legend — segments: [{label, value, color}].
function donutChart(segments){
  segments = segments.filter(function(s){ return s.value > 0; });
  var total = segments.reduce(function(s,x){ return s+x.value; }, 0);
  if (!total) return el('<div class="muted">'+esc(t('dash_noData'))+'</div>');
  var r = 54, cx = 70, cy = 70, circumference = 2*Math.PI*r;
  var offset = 0;
  var arcs = segments.map(function(seg){
    var frac = seg.value/total;
    var len = frac*circumference;
    var circle = '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+seg.color+'" stroke-width="20" ' +
      'stroke-dasharray="'+len+' '+(circumference-len)+'" stroke-dashoffset="'+(-offset)+'"><title>'+esc(seg.label)+': '+money(seg.value)+'</title></circle>';
    offset += len;
    return circle;
  }).join('');
  var svg = '<svg viewBox="0 0 140 140" width="140" height="140" style="transform:rotate(-90deg)">'+arcs+'</svg>';
  var legend = '<div class="donut-legend">'+segments.map(function(seg){
    var pct = Math.round(seg.value/total*100);
    return '<div class="donut-legend-row"><span class="dot" style="background:'+seg.color+'"></span>' +
      '<span class="dl-label">'+esc(seg.label)+'</span><span class="dl-val">'+money(seg.value)+' ('+pct+'%)</span></div>';
  }).join('')+'</div>';
  return el('<div class="donut-wrap">'+svg+legend+'</div>');
}

// Multi-series inline SVG line chart — series: [{label, color, values:[...]}]
// all aligned to the same `dates` array. Same no-library, self-contained
// approach as trendChart/donutChart above.
function lineChart(dates, series){
  var w = 700, h = 200, pad = 28;
  if (!dates.length || !series.length) return el('<div class="muted">'+esc(t('noData'))+'</div>');
  var max = Math.max.apply(null, series.reduce(function(acc,s){ return acc.concat(s.values); }, []).concat([1]));
  var stepX = dates.length > 1 ? (w - pad*2) / (dates.length - 1) : 0;
  function xAt(i){ return pad + i*stepX; }
  function yAt(v){ return h - pad - (max>0 ? (v/max)*(h-pad*2) : 0); }
  var lines = series.map(function(s){
    var points = s.values.map(function(v,i){ return xAt(i)+','+yAt(v); }).join(' ');
    var dots = s.values.map(function(v,i){
      return '<circle cx="'+xAt(i)+'" cy="'+yAt(v)+'" r="2.5" fill="'+s.color+'"><title>'+esc(s.label)+' — '+esc(dates[i])+': '+money(v)+'</title></circle>';
    }).join('');
    return '<polyline points="'+points+'" fill="none" stroke="'+s.color+'" stroke-width="2"/>'+dots;
  }).join('');
  var baseline = '<line x1="'+pad+'" y1="'+(h-pad)+'" x2="'+(w-pad)+'" y2="'+(h-pad)+'" stroke="var(--border)" stroke-width="1"/>';
  var firstLabel = '<text x="'+pad+'" y="'+(h-6)+'" font-size="10" fill="var(--muted)">'+esc(dates[0])+'</text>';
  var lastLabel = dates.length>1 ? '<text x="'+(w-pad)+'" y="'+(h-6)+'" font-size="10" fill="var(--muted)" text-anchor="end">'+esc(dates[dates.length-1])+'</text>' : '';
  var svg = '<svg class="trend-svg" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+baseline+lines+firstLabel+lastLabel+'</svg>';
  var legend = '<div class="donut-legend">'+series.map(function(s){
    var last = s.values[s.values.length-1];
    return '<div class="donut-legend-row"><span class="dot" style="background:'+s.color+'"></span>' +
      '<span class="dl-label">'+esc(s.label)+'</span><span class="dl-val">'+money(last)+'</span></div>';
  }).join('')+'</div>';
  return el('<div>'+svg+legend+'</div>');
}

// A row of small KPI tiles — [[value, label], ...], value pre-formatted.
function kpiRow(items){
  return el('<div class="kpi-grid">'+items.map(function(it){
    return '<div class="kpi"><div class="n">'+esc(it[0])+'</div><div class="l">'+esc(it[1])+'</div></div>';
  }).join('')+'</div>');
}

// One line of a period-over-period comparison — current figure large and
// prominent, previous figure as context underneath, and a colored up/down
// percentage badge (0% previous with something now reads as +100%, not a
// divide-by-zero NaN).
function comparisonRow_(label, current, previous){
  var delta = current - previous;
  var pct = previous > 0 ? (delta / previous * 100) : (current > 0 ? 100 : 0);
  var up = delta >= 0;
  var color = up ? 'var(--ok)' : 'var(--danger)';
  var arrow = up ? '▲' : '▼';
  return '<div class="row" style="justify-content:space-between;align-items:center;padding:10px 0;border-top:1px dashed var(--border-soft);">' +
    '<div><div class="muted" style="font-size:12px;">'+esc(label)+'</div>' +
      '<div style="font-size:18px;font-weight:800;">'+money(current)+'</div>' +
      '<div class="muted" style="font-size:11.5px;">'+esc(t('dash_comparisonPrevious'))+': '+money(previous)+'</div></div>' +
    '<div style="color:'+color+';font-weight:800;font-size:15px;white-space:nowrap;">'+arrow+' '+Math.abs(Math.round(pct))+'%</div>' +
  '</div>';
}

    var cityVal = qs('#rCity').value;
    var zoneSel = qs('#rZone');
    var list = zones.filter(function(z){ return !cityVal || z.city === cityVal; });
    zoneSel.innerHTML = '<option value="">'+esc(t('report_allZones'))+'</option>' +
      list.map(function(z){ return '<option value="'+z.id+'">'+esc(z.city+' — '+z.name)+'</option>'; }).join('');
    populateLocationFilter();
  }
  qs('#rType').addEventListener('change', populateSourceFilter);
  qs('#rLoc').addEventListener('change', populateSourceFilter);
  qs('#rZone').addEventListener('change', populateLocationFilter);
  qs('#rCity').addEventListener('change', populateZoneFilter);

  qs('#rRun').addEventListener('click', runReport);
  runReport();

  function activeFilterCount_(payload){
    var keys = ['dateFrom','dateTo','city','zoneId','locationId','sourceType','sourceId','enteredBy','productId','amountMin','amountMax'];
    return keys.reduce(function(n,k){ return n + (payload[k] ? 1 : 0); }, 0);
  }

  function runReport(){
    var payload = {
      dateFrom: qs('#rFrom').value || undefined,
      dateTo: qs('#rTo').value || undefined,
      city: qs('#rCity').value || undefined,
      zoneId: qs('#rZone').value || undefined,
      locationId: qs('#rLoc').value || undefined,
      sourceType: qs('#rType').value || undefined,
      sourceId: qs('#rSource').value || undefined,
      enteredBy: qs('#rEnteredBy').value || undefined,
      productId: qs('#rProduct').value || undefined,
      amountMin: qs('#rAmountMin').value || undefined,
      amountMax: qs('#rAmountMax').value || undefined
    };
    // Auto-collapse — once you've applied the filters, the pane just takes
    // up space over the results; "Edit filters" brings it back with every
    // value still in place.
    var n = activeFilterCount_(payload);
    qs('#rFilterSummary').textContent = n ? (n + ' ' + t('report_activeFilters')) : t('report_noActiveFilters');
    filterBody.hidden = true;
    filterToggle.textContent = t('report_editFilters');
    api('getSalesReport', payload).then(function(res){
      var out = qs('#rResult');
      if(!res.ok){ out.innerHTML = '<div class="msg err">'+esc(errMsg_(res))+'</div>'; return; }
      var t1 = res.totals, t2 = res.outstanding;

      out.innerHTML = '';

      var statsCard = el('<div class="grid">' +
        statCard(money(t1.netCashOwed), t('report_net')) +
        statCard(money(t2.netCashOwed), t('report_outstanding')) +
        statCard(money(t1.storeCash), t('report_storeCash')) +
        statCard(money(t1.carCash), t('report_carCash')) +
        statCard(money(t1.posSales), t('report_pos')) +
        statCard(money(t1.creditSales), t('report_credit')) +
        statCard(money(t1.deliveryFee), t('report_delivery')) +
        statCard(money(t1.vatOnDelivery), t('report_vat')) +
      '</div>');
      out.appendChild(statsCard);

      // Daily trend — the shape of the dashboard, not just a number.
      if (res.byDate && res.byDate.length){
        var trendCard = el('<div class="card"><h2>'+esc(t('report_trend'))+'</h2></div>');
        trendCard.appendChild(trendChart(res.byDate));
        out.appendChild(trendCard);
      }

      // By product — cash vs POS, sortable, with a proportional bar per row
      // so the biggest sellers are visible at a glance, not just numbers.
      var productCard = el('<div class="card"><h2>'+esc(t('report_byProduct'))+'</h2></div>');
      if (res.byProduct && res.byProduct.length){
        productCard.appendChild(barList(res.byProduct.slice(0,8),
          function(r){ return r.name || t('report_unspecified'); },
          function(r){ return r.cashAmount; },
          function(r){ return r.posAmount; },
          function(r){ return r.creditAmount; }));
        var productTableWrap = el('<div style="margin-top:14px;"></div>');
        productTableWrap.appendChild(sortableTable(res.byProduct, [
          { key:'name', label: t('report_product'), render: function(r){ return esc(r.name || t('report_unspecified')); } },
          { key:'cashAmount', label: t('report_cashChannel'), render: function(r){ return money(r.cashAmount); } },
          { key:'posAmount', label: t('report_posChannel'), render: function(r){ return money(r.posAmount); } },
          { key:'creditAmount', label: t('report_creditChannel'), render: function(r){ return money(r.creditAmount); } },
          { key:'total', label: t('report_total'), render: function(r){ return '<strong>'+money(r.total)+'</strong>'; } }
        ], { sortKey:'total', sortDir:'desc' }));
        productCard.appendChild(productTableWrap);
        productCard.appendChild(el('<small class="hint">'+esc(t('report_sortHint'))+'</small>'));
      } else {
        productCard.appendChild(el('<div class="muted">'+esc(t('noData'))+'</div>'));
      }
      out.appendChild(productCard);

      // By location — same sortable treatment. Flatten netCashOwed onto
      // the row first so the table can sort on the real number, not the
      // formatted string.
      res.byLocation.forEach(function(r){ r.net = r.totals.netCashOwed; });
      var locationCard = el('<div class="card"><h2>'+esc(t('report_byLocation'))+'</h2></div>');
      locationCard.appendChild(sortableTable(res.byLocation, [
        { key:'city', label: t('report_city') },
        { key:'name', label: t('admin_location') },
        { key:'net', label: t('report_net'), render: function(r){ return '<strong>'+money(r.net)+'</strong>'; } }
      ], { sortKey:'city', sortDir:'asc' }));
      out.appendChild(locationCard);

      // Who a repeated shortfall traces back to — company-wide visibility
      // only (isCompanyWide_ on the client mirrors requireCompanyWide_ on
      // the server), same as every other accountability-adjacent view.
      if (isCompanyWide){
        var shortfallCard = el('<div class="card"><h2>'+esc(t('report_shortfallTitle'))+'</h2>' +
          '<div class="muted" style="font-size:12px;margin-bottom:10px;">'+esc(t('report_shortfallHint'))+'</div>' +
          '<div id="rShortfall">'+esc(t('loading'))+'</div></div>');
        out.appendChild(shortfallCard);
        api('getShortfallByEntrant', {}).then(function(res3){
          var wrap = qs('#rShortfall', shortfallCard);
          if (!res3.ok){ wrap.innerHTML = '<div class="msg err">'+esc(errMsg_(res3))+'</div>'; return; }
          if (!res3.byEntrant.length){ wrap.innerHTML = '<div class="muted">'+esc(t('report_shortfallNone'))+'</div>'; return; }
          wrap.innerHTML = '';
          wrap.appendChild(sortableTable(res3.byEntrant, [
            { key:'userId', label: t('report_shortfallPerson'), render: function(r){ return esc(userName(r.userId)); } },
            { key:'totalShortfall', label: t('report_shortfallAmount'), render: function(r){ return '<strong>'+money(r.totalShortfall)+'</strong>'; } },
            { key:'handoffCount', label: t('report_shortfallCount') }
          ], { sortKey:'totalShortfall', sortDir:'desc' }));
        });
      }

      // finance/accountant/operations manager get the audit trail here —
      // admin has its own dedicated tab under "nav_admin" already.
      if (['finance','accountant','operations_manager'].indexOf(state.user.role) >= 0){
        var auditCard = el('<div class="card"><h2>'+esc(t('admin_audit'))+'</h2><div id="rAudit">'+esc(t('loading'))+'</div></div>');
        out.appendChild(auditCard);
        api('listAudit', { limit: 100 }).then(function(res2){
          var wrap = qs('#rAudit', auditCard);
          if (!res2.ok || !res2.audit.length){ wrap.innerHTML = '<div class="muted">'+esc(t('noData'))+'</div>'; return; }
          wrap.innerHTML = '<table><thead><tr><th>'+esc(t('handoff_created'))+'</th><th>action</th><th>'+esc(t('admin_name'))+'</th></tr></thead><tbody>' +
            res2.audit.map(function(a){ return '<tr><td>'+esc((a.at||'').slice(0,19).replace('T',' '))+'</td><td>'+esc(a.action)+'</td><td>'+esc(userName(a.userId))+'</td></tr>'; }).join('') +
            '</tbody></table>';
        });
      }
    });
  }
}

// ---------------- bank reconciliation ----------------
function renderReconciliation(body){
  body.innerHTML = '<div class="card">'+esc(t('loading'))+'</div>';
  loadReconciliation();

  function loadReconciliation(){
    api('getReconciliation', {}).then(function(res){
      if (!res.ok){ body.innerHTML = '<div class="msg err">'+esc(errMsg_(res))+'</div>'; return; }
      body.innerHTML = '';

      var importCard = el('<div class="card">' +
        '<h2>'+esc(t('recon_title'))+'</h2>' +
        '<div class="muted" style="font-size:12.5px;margin-bottom:10px;">'+esc(t('recon_hint'))+'</div>' +
        '<input type="file" id="reconFile" accept=".csv,text/csv">' +
        '<div id="reconMsg"></div>' +
      '</div>');
      body.appendChild(importCard);
      qs('#reconFile', importCard).addEventListener('change', function(e){
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(){
          var parsed;
          try { parsed = parseCsv_(String(reader.result||'')); } catch(err){ parsed = null; }
          if (!parsed || parsed.length < 2){ qs('#reconMsg',importCard).innerHTML = '<div class="msg err">'+esc(t('entry_importParseError'))+'</div>'; return; }
          var header = parsed[0].map(function(h){ return String(h||'').trim(); });
          var idx = {};
          header.forEach(function(h,i){ idx[h]=i; });
          var dataRows = parsed.slice(1).filter(function(r){ return r.some(function(c){ return String(c||'').trim()!==''; }); });
          function cell(r,key){ var i=idx[key]; return (i!=null && r[i]!=null) ? String(r[i]) : ''; }
          var rows = dataRows.map(function(r){
            return { date: cell(r,'date').trim(), amount: cell(r,'amount').trim(), reference: cell(r,'reference').trim() };
          });
          api('importBankStatement', { rows: rows }).then(function(res2){
            if (!res2.ok){ qs('#reconMsg',importCard).innerHTML = '<div class="msg err">'+esc(errMsg_(res2))+'</div>'; return; }
            qs('#reconMsg',importCard).innerHTML = '<div class="msg ok">'+esc(t('recon_result').replace('{imported}',res2.imported).replace('{matched}',res2.autoMatched))+'</div>';
            loadReconciliation();
          });
        };
        reader.readAsText(file);
      });

      body.appendChild(kpiRow([
        [res.totalDeposits, t('recon_totalDeposits')],
        [res.reconciledCount, t('recon_reconciled')],
        [res.unmatchedDeposits.length, t('recon_unmatchedDeposits')],
        [res.unmatchedLines.length, t('recon_unmatchedLines')]
      ]));

      var depCard = el('<div class="card"><h2>'+esc(t('recon_unmatchedDeposits'))+'</h2><div id="reconDepList"></div></div>');
      body.appendChild(depCard);
      var depList = qs('#reconDepList', depCard);
      if (!res.unmatchedDeposits.length){
        depList.innerHTML = '<div class="muted">'+esc(t('recon_noUnmatchedDeposits'))+'</div>';
      } else {
        res.unmatchedDeposits.forEach(function(d){
          var row = el('<div class="list-item">' +
            '<div class="top"><div class="amount">'+money(d.amount)+'</div><div class="muted">'+esc((d.createdAt||'').slice(0,10))+' · '+esc(d.bankReference||'—')+'</div></div>' +
            '<div class="field"><label>'+esc(t('recon_matchManually'))+'</label><select class="reconLineSel"><option value="">'+esc(t('recon_pickLine'))+'</option>' +
              res.unmatchedLines.map(function(l){ return '<option value="'+l.id+'">'+esc(l.date)+' — '+money(l.amount)+' — '+esc(l.reference||'—')+'</option>'; }).join('') +
            '</select></div>' +
            '<button class="btn secondary">'+esc(t('recon_link'))+'</button>' +
          '</div>');
          var sel = qs('select', row);
          qs('button', row).addEventListener('click', function(){
            if (!sel.value) return;
            api('manualMatchReconciliation', { lineId: sel.value, handoffId: d.id }).then(function(res3){
              if (res3.ok) loadReconciliation(); else toastRaw_(errMsg_(res3), 'err');
            });
          });
          depList.appendChild(row);
        });
      }

      var lineCard = el('<div class="card"><h2>'+esc(t('recon_unmatchedLines'))+'</h2><div id="reconLineList"></div></div>');
      body.appendChild(lineCard);
      var lineList = qs('#reconLineList', lineCard);
      if (!res.unmatchedLines.length){
        lineList.innerHTML = '<div class="muted">'+esc(t('recon_noUnmatchedLines'))+'</div>';
      } else {
        lineList.appendChild(sortableTable(res.unmatchedLines, [
          { key:'date', label: t('recon_col_date') },
          { key:'amount', label: t('recon_col_amount'), render: function(r){ return money(r.amount); } },
          { key:'reference', label: t('recon_col_reference') }
        ]));
      }
    });
  }
}

function renderRisk(body){
  body.innerHTML = '';
  var isCompanyWide = ['admin','finance','accountant','operations_manager','deputy_operations_manager'].indexOf(state.user.role)>=0;

  var form = el('<div class="card"><h2>'+esc(t('risk_reportNew'))+'</h2>' +
    '<div id="riskMsg"></div>' +
    '<div class="grid">' +
      '<div class="field"><label>'+esc(t('risk_type'))+'</label><select id="rkType">' +
        '<option value="risk">'+esc(t('risk_type_risk'))+'</option>' +
        '<option value="complaint">'+esc(t('risk_type_complaint'))+'</option>' +
      '</select></div>' +
      '<div class="field"><label>'+esc(t('risk_severity'))+'</label><select id="rkSeverity">' +
        '<option value="low">'+esc(t('risk_severity_low'))+'</option>' +
        '<option value="medium" selected>'+esc(t('risk_severity_medium'))+'</option>' +
        '<option value="high">'+esc(t('risk_severity_high'))+'</option>' +
      '</select></div>' +
    '</div>' +
    '<div class="field"><label>'+esc(t('risk_titleLabel'))+'</label><input id="rkTitle"></div>' +
    '<div class="field"><label>'+esc(t('risk_description'))+'</label><textarea id="rkDesc" rows="3"></textarea></div>' +
    '<button class="btn" id="rkSubmit">'+esc(t('risk_submit'))+'</button>' +
  '</div>');
  body.appendChild(form);
  qs('#rkSubmit', form).addEventListener('click', function(){
    var title = qs('#rkTitle', form).value.trim();
    if (!title){ qs('#riskMsg',form).innerHTML = '<div class="msg err">'+esc(t('err_titleRequired'))+'</div>'; return; }
    api('createRiskItem', {
      type: qs('#rkType', form).value,
      severity: qs('#rkSeverity', form).value,
      title: title,
      description: qs('#rkDesc', form).value
    }).then(function(res){
      if (!res.ok){ qs('#riskMsg',form).innerHTML = '<div class="msg err">'+esc(errMsg_(res))+'</div>'; return; }
      qs('#riskMsg',form).innerHTML = '<div class="msg ok">'+esc(t('risk_submitted'))+'</div>';
      qs('#rkTitle', form).value = ''; qs('#rkDesc', form).value = '';
      if (isCompanyWide) loadRiskList();
    });
  });

  if (!isCompanyWide) return;

  var listCard = el('<div class="card"><h2>'+esc(t('risk_list'))+'</h2><div id="riskListBody">'+esc(t('loading'))+'</div></div>');
  body.appendChild(listCard);
  loadRiskList();

  function loadRiskList(){
    api('listRiskItems', {}).then(function(res){
      var wrap = qs('#riskListBody', listCard);
      if (!res.ok){ wrap.innerHTML = '<div class="msg err">'+esc(errMsg_(res))+'</div>'; return; }
      if (!res.items.length){ wrap.innerHTML = '<div class="muted">'+esc(t('risk_noItems'))+'</div>'; return; }
      wrap.innerHTML = '';
      var statusClass = { open:'pending', in_progress:'rejected', resolved:'confirmed' };
      res.items.forEach(function(it){
        var row = el('<div class="list-item">' +
          '<div class="top"><div><strong>'+esc(it.title)+'</strong> <span class="badge '+statusClass[it.status]+'">'+esc(t('risk_status_'+it.status))+'</span></div>' +
            '<div class="muted">'+esc(t(it.type==='risk'?'risk_type_risk':'risk_type_complaint'))+' · '+esc(t('risk_severity_'+it.severity))+'</div></div>' +
          '<div class="muted">'+esc(it.description||'')+'</div>' +
          '<div class="muted">'+esc(t('risk_reportedBy'))+': '+esc(userName(it.reportedBy))+' · '+esc((it.createdAt||'').slice(0,16).replace('T',' '))+'</div>' +
          (it.resolutionNote ? '<div class="muted">📝 '+esc(it.resolutionNote)+'</div>' : '') +
          '<div class="actions" id="rkActions-'+it.id+'"></div>' +
        '</div>');
        if (['admin','finance'].indexOf(state.user.role)>=0 && it.status !== 'resolved'){
          var actions = qs('#rkActions-'+it.id, row);
          if (it.status === 'open'){
            var progressBtn = el('<button class="btn secondary">'+esc(t('risk_status_in_progress'))+'</button>');
            progressBtn.addEventListener('click', function(){ api('updateRiskItemStatus',{id:it.id, status:'in_progress'}).then(loadRiskList); });
            actions.appendChild(progressBtn);
          }
          var resolveBtn = el('<button class="btn">'+esc(t('risk_status_resolved'))+'</button>');
          resolveBtn.addEventListener('click', function(){
            var note = prompt(t('risk_resolutionNote')) || '';
            api('updateRiskItemStatus',{id:it.id, status:'resolved', resolutionNote:note}).then(loadRiskList);
          });
          actions.appendChild(resolveBtn);
        }
        wrap.appendChild(row);
      });
    });
  }
}

// ---------------- admin ----------------
var adminTab = 'users';

function renderAdmin(body){
  // Grouped like a real ERP admin area: reference/catalog data the whole
  // hierarchy is built from ("Master Data") is visually separate from
  // system-level screens (accounts, settings, the trail of who-did-what).
  var groups = [
    { key:'system', label:'admin_groupSystem', tabs:[['users','admin_users'],['permissions','admin_permissions']] },
    { key:'master', label:'admin_groupMaster', tabs:[['locations','admin_locations'],['stores','admin_stores'],
        ['cars','admin_cars'],['pos','admin_pos'],['clusters','admin_clusters'],['zones','admin_zones'],['products','admin_products']] },
    { key:'other', label:'admin_groupOther', tabs:[['config','admin_config'],['audit','admin_audit']] }
  ];
  body.innerHTML = '';
  groups.forEach(function(g){
    var groupWrap = el('<div style="margin-bottom:8px;"><div class="muted" style="font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;">'+esc(t(g.label))+'</div></div>');
    var tabBar = el('<div class="tabs"></div>');
    g.tabs.forEach(function(tb){
      var b = el('<button'+(adminTab===tb[0]?' class="active"':'')+'>'+esc(t(tb[1]))+'</button>');
      b.addEventListener('click', function(){ adminTab=tb[0]; render(); });

    });
    groupWrap.appendChild(tabBar);
    body.appendChild(groupWrap);
  });
  var content = el('<div id="adminContent"></div>');
  body.appendChild(content);

  var renderers = {
    users: renderAdminUsers, permissions: renderAdminPermissions,
    locations: function(c){ renderAdminEntity(c,'location'); },
    stores: function(c){ renderAdminEntity(c,'store'); }, cars: function(c){ renderAdminEntity(c,'car'); },
    pos: function(c){ renderAdminEntity(c,'pos'); }, clusters: function(c){ renderAdminEntity(c,'cluster'); },
    zones: function(c){ renderAdminEntity(c,'zone'); },
    products: function(c){ renderAdminEntity(c,'product'); },
    config: renderAdminConfig, audit: renderAdminAudit
  };
  (renderers[adminTab]||renderAdminUsers)(content);
}

  var tbody = qs('#uBody', listCard);
  var langOpts = [['ar','العربية'],['en','English'],['ur','اردو']];
  (meta.users||[]).forEach(function(u){
    var tr = el('<tr><td>'+esc(u.name)+'</td><td>'+esc(u.email||'')+'</td><td>'+esc(roleLabel(u.role))+'</td><td>'+(u.active?'✓':'—')+'</td><td class="col-actions"></td></tr>');
    var td = tr.lastChild;
    td.style.display = 'flex'; td.style.gap = '6px'; td.style.justifyContent = 'flex-end';
    var resetBtn = el('<button class="btn secondary">'+esc(t('admin_resetPw'))+'</button>');
    resetBtn.addEventListener('click', function(){ api('adminResetPassword',{id:u.id}).then(function(){ toast('ok_saved','ok'); }); });
    var toggleBtn = el('<button class="btn secondary">'+esc(u.active?t('admin_delete'):t('admin_active'))+'</button>');
    toggleBtn.addEventListener('click', function(){
      api('adminUpdateUser',{id:u.id, data:{active: !u.active}}).then(function(){ refreshMetaThen(function(){ renderAdmin(qs('#screenBody')); }); });
    });
    var editBtn = el('<button class="btn secondary">'+esc(t('admin_edit'))+'</button>');
    td.appendChild(resetBtn); td.appendChild(toggleBtn); td.appendChild(editBtn);
    tbody.appendChild(tr);

    var editRow = el('<tr hidden><td colspan="5"></td></tr>');
    var editCell = editRow.firstChild;
    editCell.appendChild(el(
      '<div class="card" style="margin:0;background:var(--bg-soft,#f7f5ef);">' +
        '<h2 style="font-size:14px;">'+esc(t('admin_editProfile'))+'</h2>' +
        '<div class="grid">' +
          '<div class="field"><label>'+esc(t('admin_name'))+'</label><input class="ueName" value="'+esc(u.name)+'"></div>' +
          '<div class="field"><label>'+esc(t('email'))+'</label><input class="ueEmail" type="email" value="'+esc(u.email||'')+'"></div>' +
          '<div class="field"><label>'+esc(t('admin_role'))+'</label><select class="ueRole">'+roles.map(function(r){return '<option value="'+r+'"'+(r===u.role?' selected':'')+'>'+esc(roleLabel(r))+'</option>';}).join('')+'</select></div>' +
          '<div class="field"><label>'+esc(t('language'))+'</label><select class="ueLang">'+langOpts.map(function(l){return '<option value="'+l[0]+'"'+(l[0]===(u.language||'ar')?' selected':'')+'>'+l[1]+'</option>';}).join('')+'</select></div>' +
          '<div class="field"><label>'+esc(t('admin_active'))+'</label><select class="ueActive"><option value="1"'+(u.active?' selected':'')+'>'+esc(t('admin_active'))+'</option><option value="0"'+(!u.active?' selected':'')+'>—</option></select></div>' +
        '</div>' +
        '<div class="row" style="gap:10px;">' +
          '<button type="button" class="btn ueSave">'+esc(t('save'))+'</button>' +
          '<button type="button" class="btn secondary ueCancel">'+esc(t('cancel'))+'</button>' +
        '</div><div class="ueMsg"></div>' +
      '</div>'
    ));
    tbody.appendChild(editRow);

    editBtn.addEventListener('click', function(){ editRow.hidden = !editRow.hidden; });
    qs('.ueCancel', editCell).addEventListener('click', function(){ editRow.hidden = true; });
    qs('.ueSave', editCell).addEventListener('click', function(){
      api('adminUpdateUser', { id: u.id, data: {
        name: qs('.ueName', editCell).value,
        email: qs('.ueEmail', editCell).value,
        role: qs('.ueRole', editCell).value,
        language: qs('.ueLang', editCell).value,
        active: qs('.ueActive', editCell).value === '1'
      } }).then(function(res){
        if (!res.ok){ qs('.ueMsg', editCell).innerHTML = '<div class="msg err">'+esc(errMsg_(res))+'</div>'; return; }
        refreshMetaThen(function(){ renderAdmin(qs('#screenBody')); });
      });
    });
  });
}

var ENTITY_FIELDS = {
  location: { addKey:'admin_addLocation', fields:[
    {k:'city', l:'admin_city'}, {k:'name', l:'admin_locName'},
    {k:'clusterId', l:'admin_cluster', pick:'clusters', pickLabel:function(x){return x.name;}},
    {k:'zoneId', l:'admin_zone', pick:'zones', pickLabel:function(x){return x.city+' — '+x.name;}}
  ], cols:['city','name'] },
  store: { addKey:'admin_addStore', fields:[
    {k:'locationId', l:'admin_location', pick:'locations', pickLabel:function(x){return x.city+' — '+x.name;}},
    {k:'name', l:'admin_storeName'},
    {k:'storeManagerUserId', l:'admin_manager', pick:'users', pickLabel:function(x){return x.name;}, pickFilter:function(x){return x.role==='store_manager';}}
  ], cols:['name','locationId'] },
  car: { addKey:'admin_addCar', fields:[
    {k:'locationId', l:'admin_location', pick:'locations', pickLabel:function(x){return x.city+' — '+x.name;}},
    {k:'label', l:'admin_carLabel'},
    {k:'driverUserId', l:'admin_driver', pick:'users', pickLabel:function(x){return x.name;}, pickFilter:function(x){return x.role==='driver';}}
  ], cols:['label','locationId'] },
  pos: { addKey:'admin_addPos', fields:[
    {k:'ownerType', l:'admin_ownerType', options:[['store','admin_stores'],['car','admin_cars']]},
    {k:'ownerId', l:'admin_owner'},
    {k:'label', l:'admin_posLabel'},
    {k:'assignedUserId', l:'admin_assignedDriver', pick:'users', pickLabel:function(x){return x.name;}, pickFilter:function(x){return x.role==='driver';}}
  ],
  // 'owner' is a virtual column (not a real stored field) — a bare
  // ownerType only ever said "Car" or "Store", the generic category, never
  // which specific one or where — so a POS machine looked disconnected
  // from the location its own car/store already shows in their own admin
  // lists. Shows the actual store/car name plus its location instead, same
  // information store/car rows already carry via locationId.
  cols:['label','owner'] },
  cluster: { addKey:'admin_addCluster', fields:[
    {k:'name', l:'admin_clusterName'},
    {k:'clusterManagerUserId', l:'admin_clusterManager', pick:'users', pickLabel:function(x){return x.name;}, pickFilter:function(x){return x.role==='cluster_manager';}},
    {k:'collectorUserId', l:'admin_collector', pick:'users', pickLabel:function(x){return x.name;}, pickFilter:function(x){return x.role==='collector';}}
  ], cols:['name'] },
  // Pure geography — City/Zone, independent of Cluster (which is the
  // employee-based management assignment above). A location can optionally
  // point at a zone for the Country > City > Zone > Location filtering view.
  zone: { addKey:'admin_addZone', fields:[
    {k:'city', l:'admin_city'}, {k:'name', l:'admin_zoneName'}
  ], cols:['city','name'] },
  product: { addKey:'admin_addProduct', fields:[
    {k:'name', l:'admin_productName'},
    {k:'type', l:'admin_productType', options:[['goods','admin_typeGoods'],['services','admin_typeServices']]}
  ], cols:['name'] }
};

function metaListFor_(kind){
  var m = state.meta||{};
  var map = { location:'locations', store:'stores', car:'cars', pos:'pos', cluster:'clusters', zone:'zones', product:'products' };
  return m[map[kind]]||[];
}

function renderAdminEntity(content, kind){
  var spec = ENTITY_FIELDS[kind];
  var meta = state.meta || {};
  var form = el('<div class="card"><h2>'+esc(t(spec.addKey))+'</h2><div class="grid" id="eFields"></div><button class="btn" id="eAdd">'+esc(t(spec.addKey))+'</button><div id="eMsg"></div></div>');
  content.appendChild(form);
  var fieldsWrap = qs('#eFields', form);

  spec.fields.forEach(function(f){
    var wrap = el('<div class="field"><label>'+esc(t(f.l))+'</label></div>');
    var input;
    if (f.pick){
      var options = (meta[f.pick]||[]).filter(function(x){ return !f.pickFilter || f.pickFilter(x); });
      input = el('<select data-k="'+f.k+'"><option value="">—</option>'+options.map(function(x){return '<option value="'+x.id+'">'+esc(f.pickLabel(x))+'</option>';}).join('')+'</select>');
    } else if (f.options){
      input = el('<select data-k="'+f.k+'">'+f.options.map(function(o){return '<option value="'+o[0]+'">'+esc(t(o[1]))+'</option>';}).join('')+'</select>');
    } else {
      input = el('<input data-k="'+f.k+'">');
    }
    wrap.appendChild(input);
    fieldsWrap.appendChild(wrap);
  });

  // pos owner picker depends on ownerType
  if (kind==='pos'){
    var ownerTypeSel = qs('[data-k="ownerType"]', fieldsWrap);
    var ownerIdWrap = qs('[data-k="ownerId"]', fieldsWrap).parentNode;
    function refreshOwnerOptions(){
      var type = ownerTypeSel.value;
      var list = type==='store' ? (meta.stores||[]) : (meta.cars||[]);
      var sel = el('<select data-k="ownerId">'+list.map(function(x){return '<option value="'+x.id+'">'+esc(x.name||x.label)+'</option>';}).join('')+'</select>');
      ownerIdWrap.replaceChild(sel, qs('[data-k="ownerId"]', ownerIdWrap));
    }
    ownerTypeSel.addEventListener('change', refreshOwnerOptions);
    refreshOwnerOptions();
  }

  qs('#eAdd', form).addEventListener('click', function(){
    var data = {};
    spec.fields.forEach(function(f){
      var input = qs('[data-k="'+f.k+'"]', fieldsWrap);
      data[f.k] = input.value;
    });
    api('adminSaveEntity', { kind: kind, data: data }).then(function(res){
      qs('#eMsg', form).innerHTML = res.ok ? '<div class="msg ok">'+esc(t('ok_saved'))+'</div>' : '<div class="msg err">'+esc(errMsg_(res))+'</div>';
      if (res.ok) refreshMetaThen(function(){ renderAdmin(qs('#screenBody')); });
    });
  });

  var list = metaListFor_(kind);
  // column header = the matching field's own label translation, not the
  // raw storage key (that showed literal "locationId"/"name" on screen).
  function colLabel_(c){
    if (kind === 'pos' && c === 'owner') return t('admin_owner');
    var f = spec.fields.filter(function(x){ return x.k===c; })[0];
    return f ? t(f.l) : c;
  }
  var listCard = el('<div class="card"><h2>'+esc(t('admin_'+({location:'locations',store:'stores',car:'cars',pos:'pos',cluster:'clusters',zone:'zones',product:'products'})[kind]))+'</h2><table><thead><tr>' +
    spec.cols.map(function(c){ return '<th>'+esc(colLabel_(c))+'</th>'; }).join('') + '<th class="col-actions"></th></tr></thead><tbody id="entBody"></tbody></table></div>');
  content.appendChild(listCard);
  // A column backed by an options-based field (e.g. pos's ownerType:
  // 'store'/'car') must show the translated option label, not the raw
  // stored value — same reasoning as locationId already being resolved to
  // a readable name instead of a bare id.
  function colValue_(item, c){
    if (kind === 'pos' && c === 'owner') return posOwnerName_(item) + ' — ' + locationName(posOwnerLocationId_(item));
    var v = item[c];
    if (c === 'locationId') return locationName(v);
    var f = spec.fields.filter(function(x){ return x.k===c; })[0];
    if (f && f.options) {
      var opt = f.options.filter(function(o){ return o[0]===v; })[0];
      return opt ? t(opt[1]) : v;
    }
    return v;
  }
  var tbody = qs('#entBody', listCard);
  list.forEach(function(item){
    var tds = spec.cols.map(function(c){
      return '<td>'+esc(colValue_(item, c))+'</td>';
    }).join('');
    var tr = el('<tr>'+tds+'<td class="col-actions"></td></tr>');
    var delBtn = el('<button class="btn-icon" title="'+esc(t('admin_delete'))+'"><svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg></button>');
    delBtn.addEventListener('click', function(){
      if (!confirm(t('confirm_delete'))) return;
      api('adminDeleteEntity', { kind: kind, id: item.id }).then(function(res){
        if (!res.ok){ toastRaw_(errMsg_(res), 'err'); return; }
        refreshMetaThen(function(){ renderAdmin(qs('#screenBody')); });
      });
    });
    tr.lastChild.appendChild(delBtn);
    tbody.appendChild(tr);
  });
}

function renderAdminConfig(content){
  var cfg = (state.meta && state.meta.config) || {};
  var form = el('<div class="card"><h2>'+esc(t('admin_config'))+'</h2>' +
    '<div class="field"><label>'+esc(t('admin_vatRate'))+'</label><input id="cVat" type="number" step="0.01" value="'+(cfg.vatRate!=null?cfg.vatRate:0.15)+'"></div>' +
    '<div class="field"><label>'+esc(t('admin_staleThreshold'))+'</label><input id="cStale" type="number" step="1" value="'+(cfg.staleThresholdHours!=null?cfg.staleThresholdHours:24)+'"></div>' +
    '<div class="field"><label>'+esc(t('admin_heldThreshold'))+'</label><input id="cHeld" type="number" step="1" value="'+(cfg.heldThresholdHours!=null?cfg.heldThresholdHours:48)+'"></div>' +
    '<div class="field"><label>'+esc(t('admin_secondApprovalThreshold'))+'</label><input id="cSecondApproval" type="number" step="1" value="'+(cfg.secondApprovalThreshold!=null?cfg.secondApprovalThreshold:0)+'"></div>' +
    '<div class="field"><label style="display:flex;align-items:center;gap:8px;cursor:pointer;">' +
      '<input id="cAreaBulk" type="checkbox"'+(cfg.areaManagerBulkUploadEnabled?' checked':'')+'> '+esc(t('admin_areaBulkUploadEnabled'))+
    '</label><small class="hint">'+esc(t('admin_areaBulkUploadHint'))+'</small></div>' +
    '<button class="btn" id="cSave">'+esc(t('save'))+'</button><div id="cMsg"></div></div>');
  content.appendChild(form);
  qs('#cSave', form).addEventListener('click', function(){
    api('adminSetConfig', { data: {
      vatRate: Number(qs('#cVat',form).value),
      staleThresholdHours: Number(qs('#cStale',form).value),
      heldThresholdHours: Number(qs('#cHeld',form).value),
      secondApprovalThreshold: Number(qs('#cSecondApproval',form).value),
      areaManagerBulkUploadEnabled: qs('#cAreaBulk',form).checked
    } }).then(function(res){
      qs('#cMsg',form).innerHTML = res.ok ? '<div class="msg ok">'+esc(t('ok_saved'))+'</div>' : '<div class="msg err">'+esc(errMsg_(res))+'</div>';
    });
  });

  var slaCard = el('<div class="card"><h2>'+esc(t('admin_runStaleCheck'))+'</h2>' +
    '<div class="row" style="gap:10px;flex-wrap:wrap;">' +
      '<button class="btn secondary" id="cRunStale">'+esc(t('admin_runStaleCheck'))+'</button>' +
      '<button class="btn secondary" id="cInstallTrigger">'+esc(t('admin_installStaleTrigger'))+'</button>' +
    '</div><div id="slaMsg"></div></div>');
  content.appendChild(slaCard);
  qs('#cRunStale', slaCard).addEventListener('click', function(){
    api('runStaleCheck', {}).then(function(res){
      qs('#slaMsg',slaCard).innerHTML = res.ok ? '<div class="msg ok">'+esc(t('admin_staleCheckResult').replace('{stale}',res.staleEscalated).replace('{held}',res.heldEscalated))+'</div>' : '<div class="msg err">'+esc(errMsg_(res))+'</div>';
    });
  });
  qs('#cInstallTrigger', slaCard).addEventListener('click', function(){
    api('adminInstallStaleTrigger', {}).then(function(res){
      if (!res.ok){ qs('#slaMsg',slaCard).innerHTML = '<div class="msg err">'+esc(errMsg_(res))+'</div>'; return; }
      qs('#slaMsg',slaCard).innerHTML = '<div class="msg ok">'+esc(t(res.alreadyInstalled ? 'admin_triggerAlready' : 'admin_triggerInstalled'))+'</div>';
    });
  });
}

function renderAdminAudit(content){
  content.innerHTML = '<div class="card">'+esc(t('loading'))+'</div>';
  api('listAudit', { limit: 200 }).then(function(res){
    if(!res.ok){ content.innerHTML = '<div class="msg err">'+esc(errMsg_(res))+'</div>'; return; }
    var rows = res.audit.map(function(a){
      return '<tr><td>'+esc((a.at||'').slice(0,19).replace('T',' '))+'</td><td>'+esc(a.action)+'</td><td>'+esc(userName(a.userId))+'</td><td>'+esc(a.detail||'')+'</td></tr>';
    }).join('');
    content.innerHTML = '<div class="card"><table><thead><tr><th>'+esc(t('handoff_created'))+'</th><th>action</th><th>'+esc(t('admin_name'))+'</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  });
}

// ---------------- render dispatcher ----------------
function render(){
  document.documentElement.lang = state.lang;
  document.documentElement.dir = dirFor(state.lang);
  if (!state.apiUrl) { renderUrlSetup(); return; }
  if (!state.token) { renderLogin(); return; }
  if (!state.user) { loadWhoAmI(); return; }
  if (state.user.mustChangePw) { renderChangePw(); return; }
  if (!state.meta) { loadMetaAndRender(); return; }
  renderShell();
}

function loadWhoAmI(){
  api('whoami', {}).then(function(res){
    if (!res.ok){ state.token=''; localStorage.removeItem('bgc_token'); render(); return; }
    state.user = res.user;
    setLang(res.user.language || state.lang);
    render();
  });
}

render();
})();
</script>
