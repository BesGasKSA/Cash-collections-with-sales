<style>
  :root{
    --green:#4D6D51; --green-dark:#3b5540; --green-pale:#e7ede8; --cream:#F2EEE4;
    --bg:#f6f5f1; --card:#ffffff; --text:#20241f; --muted:#767b71; --muted-2:#98988f;
    --border:#e7e3d7; --border-soft:#f0ede4; --danger:#c14a30; --danger-bg:#fbe7e1;
    --warn:#b3820f; --warn-bg:#fdf1d8; --ok:#2f7a45; --ok-bg:#e2f3e6;
    --radius:14px; --radius-sm:9px; --radius-lg:20px;
    --shadow-sm:0 1px 2px rgba(32,36,31,.05), 0 1px 1px rgba(32,36,31,.04);
    --shadow-md:0 4px 14px rgba(32,36,31,.07), 0 1px 3px rgba(32,36,31,.05);
    --shadow-lg:0 12px 32px rgba(32,36,31,.12), 0 2px 6px rgba(32,36,31,.06);
    --font-en:'Inter',-apple-system,'Segoe UI',Tahoma,Arial,sans-serif;
    --font-ar:'Cairo','Inter',-apple-system,'Segoe UI','Geeza Pro',Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-en);min-height:100vh;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;}
  html[dir="rtl"] body{font-family:var(--font-ar);letter-spacing:0;}
  ::selection{background:var(--green);color:#fff;}
  /* Flat #4D6D51, exactly the logo artwork's own background — the PNG has
     no transparency around the emblem, so anything but an exact match shows
     as a visible rectangle behind it. */
  .brand-page{background:var(--green);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;gap:22px;}
  .brand-logo{width:280px;max-width:65vw;display:block;}
  header{background:var(--green);color:#fff;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;box-shadow:var(--shadow-md);position:relative;z-index:2;}
  header .brand{font-weight:800;font-size:36px;display:flex;align-items:center;gap:14px;letter-spacing:-.02em;min-width:0;flex-shrink:1;line-height:1.15;}
  /* LOGO_B64 is one full lockup (circular emblem + "BEST GAS CARRIER CO."
     wordmark + Arabic tagline stacked below it, 555x457) on a solid
     background that happens to match the header exactly (both var(--green))
     — so showing the whole image here at a small header height rendered the
     circular mark itself at barely half that height, with the wordmark/
     tagline beneath it too tiny to read and blending invisibly into the
     same-color header: the "logo" effectively read as a small, soft blob.
     .logo-mark crops to just the circular emblem (its bounding box in the
     source image is x:[148,392] y:[43,287], a 244x244 square — measured by

<script>
(function(){
'use strict';

// Best Gas Carrier Co. logo — embedded so the client stays a single file.
// Its background is a flat #4D6D51 baked into the PNG; only place it on a

// ---------------- state ----------------
// Baked-in default so this file works out of the box wherever it's opened —
// no per-browser/per-profile localStorage setup step. localStorage can still
// override it (used when pointing a copy at a different deployment, e.g.
// local testing against mock-backend-server.js).
var DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbxgS7bhn4Nn0szYnKVRb6rjGEKumqCJkQ8jY2uNjDrf2wP2YQYgTvltLrwsbKviD7I/exec';
var state = {
  lang: localStorage.getItem('bgc_lang') || 'ar',
  apiUrl: localStorage.getItem('bgc_apiUrl') || DEFAULT_API_URL,
  token: localStorage.getItem('bgc_token') || '',
  user: null,
  screen: 'home',
  meta: null,
  msg: null,
  notifCount: 0
};

function setLang(l){ state.lang = l; localStorage.setItem('bgc_lang', l); document.documentElement.lang=l; document.documentElement.dir=dirFor(l); }
setLang(state.lang);

// ---------------- helpers ----------------
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function money(n){ n=Number(n||0); return n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
// A plain type="number" input can never show thousand separators while
// being typed (browsers reject the comma outright), so every amount/count
// field the user types into is a plain type="text" input instead, reusing
// this same comma-on-blur + comma-stripped-on-read pattern already proven
// on the handoff receivedAmount field.
function numFromInput_(el){ return Number(String(el.value||'').replace(/,/g,'').trim() || 0); }
function wireCommaInput_(input, decimals){
  input.addEventListener('blur', function(){
    var raw = String(input.value||'').replace(/,/g,'').trim();
    if (raw === '' || isNaN(Number(raw))) return;
    input.value = decimals ? money(Number(raw)) : Math.round(Number(raw)).toLocaleString();
  });
}
function el(html){
  html = html.trim();
  // A bare <tr>/<td>/<th> fragment gets silently stripped by the HTML
  // parser when set via a plain <div>'s innerHTML (no enclosing <table> in
  // that same string) — verified: div.innerHTML='<tr><td>a</td></tr>'
  // leaves a single text node "a", not the row. Give it a <table> context.
  var m = /^<(tr|td|th|tbody|thead)[ >]/i.exec(html);
  if (m) {
    var table = document.createElement('table');
    table.innerHTML = html;
    return table.querySelector(m[1].toLowerCase());
  }
  var d=document.createElement('div'); d.innerHTML=html; return d.firstChild;
}
function qs(sel,root){ return (root||document).querySelector(sel); }
function qsa(sel,root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }

// ---------------- centered % loading overlay ----------------
// Lives outside #app (appended to <body> directly) so it survives every
// screen's `root.innerHTML=''` re-render. A request count rather than a
// boolean so overlapping calls (e.g. the dashboard's parallel
// listDashboard+getSalesReport) don't let an earlier finish hide it while a
// later one is still in flight. There's no real progress to report (Apps
// Script gives no partial-completion signal), so the percentage eases
// toward 90% while waiting and jumps to 100% the moment a response lands —
// same honest-but-approximate approach as every "loading %" UI that isn't
// backed by a real byte counter.
var loadingCount = 0;
var loadProgress = 0;
var loadTimer = null;
function loadOverlayEls(){
  var overlay = document.getElementById('loadOverlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'loadOverlay';
    overlay.innerHTML = '<div class="ring" id="loadRing"><div class="ring-inner"><span class="pct" id="loadPct">0%</span></div></div>';
    document.body.appendChild(overlay);
  }
  return { overlay: overlay, ring: qs('#loadRing', overlay), pct: qs('#loadPct', overlay) };
}
function setLoadProgress(p){
  loadProgress = p;
  var els = loadOverlayEls();
  var deg = Math.round(p * 3.6);
  els.ring.style.background = 'conic-gradient(var(--green) ' + deg + 'deg, var(--border-soft) 0deg)';
  els.pct.textContent = Math.round(p) + '%';
}
function startLoading(){
  loadingCount++;
  if (loadingCount !== 1) return;
  var els = loadOverlayEls();
  els.overlay.classList.add('active');
  setLoadProgress(0);
  clearInterval(loadTimer);
  loadTimer = setInterval(function(){
    setLoadProgress(Math.min(loadProgress + (90 - loadProgress) * 0.12, 90));
  }, 120);
}
function stopLoading(){
  loadingCount = Math.max(0, loadingCount - 1);
  if (loadingCount !== 0) return;
  clearInterval(loadTimer);
  setLoadProgress(100);
  setTimeout(function(){
    if (loadingCount !== 0) return; // a new request started before the fade-out
    loadOverlayEls().overlay.classList.remove('active');
    setLoadProgress(0);
  }, 250);
}

function api(action, payload){
  payload = payload || {};
  payload.action = action;
  payload.token = state.token;
  startLoading();
  return fetch(state.apiUrl, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  }).then(function(r){ return r.json(); }).then(function(res){
    stopLoading();
    if (res.token) { state.token = res.token; localStorage.setItem('bgc_token', res.token); }
    return res;
  }).catch(function(err){
    stopLoading();
    return { ok:false, error:'network' };
  });
}

function toast(msgKey, type){
  state.msg = { text: t(msgKey), type: type||'err' };
  render();
  setTimeout(function(){ state.msg=null; var m=qs('#msgBox'); if(m) m.remove(); }, 4000);
}
// Same as toast(), but takes an already-resolved string instead of an
// i18n key — for errMsg_() output, which is itself already translated
// (and may include a raw, untranslated server error code as a fallback).
function toastRaw_(text, type){
  state.msg = { text: text, type: type||'err' };
  render();
  setTimeout(function(){ state.msg=null; var m=qs('#msgBox'); if(m) m.remove(); }, 4000);
}

// A bare "something went wrong" swallowed exactly which action failed and
// why — every server-side action returns a specific error CODE (forbidden,
// not_found, conflict_of_interest, ...), and this surfaces the real one.
// Known codes get a clear, specific translated message; an unrecognized
// code still shows the generic message but with the raw code appended in
// parentheses, so the real reason is never fully hidden even for a code
// this table hasn't been taught yet.
var ERROR_KEYS_ = {
  already_acknowledged:'err_alreadyAcknowledged', auth_required:'err_authRequired', bad_request:'err_badRequest',
  conflict_of_interest:'err_conflictOfInterest', deposit_not_eligible:'err_depositNotEligible', email_exists:'err_emailExists',
  forbidden:'err_forbidden', has_children:'admin_hasChildren', invalid_input:'err_invalidInput', invalid_kind:'err_invalidKind',
  invalid_resolution:'err_invalidResolution', invalid_status:'err_invalidStatus', invalid_type:'err_invalidType',
  line_already_matched:'err_lineAlreadyMatched', missing_action:'err_missingAction', missing_email:'err_missingEmail',
  no_cluster_manager:'err_noClusterManager', no_collector:'err_noCollector', no_entries:'err_noEntries',
  no_held_cash:'err_noHeldCash', no_store_manager:'err_noStoreManager', delivery_without_sale:'err_deliveryWithoutSale', not_disputed:'err_notDisputed', not_flagged:'err_notFlagged', not_found:'err_notFound',
  not_pending:'err_notPending', nothing_owed:'err_nothingOwed', too_many_rows:'err_tooManyRows',
  feature_disabled:'err_featureDisabled', invalid_rows:'err_invalidRows',
  unknown_action:'err_unknownAction', weak_password:'err_weakPassword', wrong_current_password:'err_wrongCurrentPassword',
  network:'err_network'
};
function errMsg_(res){
  var code = res && res.error;
  if (!code) return t('err_generic');
  var key = ERROR_KEYS_[code];
  if (key) return t(key);
  return t('err_generic') + ' (' + code + ')';
}

function roleLabel(r){ return t('role_'+r); }
function timeGreeting(){
  var h = new Date().getHours();
  var key = h < 5 ? 'greeting_night' : h < 12 ? 'greeting_morning' : h < 18 ? 'greeting_afternoon' : 'greeting_evening';
  return t(key);
}
function langLocale_(){ return state.lang==='ar' ? 'ar-SA' : state.lang==='ur' ? 'ur-PK' : 'en-US'; }
// Raw-timestamp convention (slice+replace 'T') matches every other
// timestamp display in this app (handoff_created, audit log, risk items) —
// unambiguous and locale-independent, unlike a "today's date" banner line
// which is meant to read naturally, so that one goes through Intl instead.
// Seconds-precision (slice to 19 chars, not 16) since this is a one-line
// security-style "last login" notice, not a list of records where trailing
// seconds would just be noise.
function lastLoginLabel_(){
  var v = localStorage.getItem('bgc_lastLogin');
  return v ? String(v).slice(0,19).replace('T',' ') : null;
}
// Returns {gregorian, hijri} as two separate strings — shown as two separate
// lines in the welcome card, not joined, since Hijri and Gregorian are two
// distinct calendars a reader may want to read independently.
function todayDatesLines_(){
  var now = new Date();
  var loc = langLocale_();
  var greg;
  try { greg = new Intl.DateTimeFormat(loc, { weekday:'long', day:'numeric', month:'long', year:'numeric' }).format(now); }
  catch(e) { greg = now.toDateString(); }
  var hijri = '';
  try {
    var parts = new Intl.DateTimeFormat(loc + '-u-ca-islamic-umalqura', { day:'numeric', month:'long', year:'numeric' }).formatToParts(now);
    var d = {}; parts.forEach(function(p){ d[p.type] = p.value; });
    if (d.day && d.month && d.year) hijri = d.day + ' ' + d.month + ' ' + d.year + ' ' + t('home_hijriSuffix');
  } catch(e) { /* Hijri calendar not supported in this environment — Gregorian alone is still useful */ }
  return { gregorian: greg, hijri: hijri };
}
// A driver has no locationId of their own — it only lives on the car they
// drive — so this resolves both shapes rather than assuming state.user
// always carries it directly.
function myLocationId_(){
  if (state.user.locationId) return state.user.locationId;
  if (state.user.role === 'driver' && state.meta && state.meta.cars) {
    var mine = state.meta.cars.filter(function(c){ return c.driverUserId === state.user.id; });
    if (mine.length) return mine[0].locationId;
  }
  return null;
}
function myCityLabel_(){
  var locId = myLocationId_();
  if (!locId) return null;
  var loc = byId(state.meta && state.meta.locations, locId);
  return loc ? loc.city : null;
}

// ---------------- meta loading ----------------
function loadMetaAndRender(){
  api('listMeta', {}).then(function(res){
    if (res.ok) state.meta = res;
    if (state.user.mustChangePw) { render(); return; }
    render();
    // renderHome and renderHandoffs already populate the count from data
    // they fetch anyway — firing a second, separate listDashboard call
    // right after login just to do it again here wastes a full extra round
    // trip to Apps Script on every single login for most users, who land
    // on Home. Only screens that don't otherwise touch dashboard data need
    // this fallback fetch.
    if (state.screen !== 'home' && state.screen !== 'handoffs') refreshNotifCount();
  });
}

// ---------------- notifications bell ----------------
// A quick-access count of "things needing this person's attention right
// now" — their own pending handoffs plus (for company-wide roles) open
// disputes — so it's visible from every screen, not just Home/Handoffs.
// Patches the badge in place instead of a full render() so it can be
// refreshed opportunistically (after login, after any handoff list load)
// without disrupting whatever the user is doing elsewhere on screen.
function setNotifCount(n){
  state.notifCount = n;
  var badge = qs('#notifBadge');
  if (badge) { badge.textContent = n; badge.hidden = n === 0; }
}

function refreshNotifCount(){
  if (!state.user) return;
  api('listDashboard', {}).then(function(res){
    if (!res.ok) return;
    var n = (res.pendingForMe||[]).length + (res.openDisputes||[]).length;
    setNotifCount(n);
  });
}

function byId(list, id){ for(var i=0;i<(list||[]).length;i++) if(list[i].id===id) return list[i]; return null; }
function userName(id){ var u = byId(state.meta && state.meta.users, id); return u ? u.name : '—'; }
function locationName(id){ var l = byId(state.meta && state.meta.locations, id); return l ? (l.city+' — '+l.name) : '—'; }
function clusterName(id){ var c = byId(state.meta && state.meta.clusters, id); return c ? c.name : '—'; }

// A location only ever has stores and cars as direct children (per the
// entity hierarchy) — a POS machine is a grandchild, owned by one of those.
// Showing it as a bare label alongside store/car names with no context made
// it look like a disconnected third category floating next to Store/Car
// rather than a device attached to one of them, so every option built from
// these says which store/car (and location) it actually belongs to. Shared
// by the daily-entry form and the sales report filters — anywhere someone
// picks a specific store/car/POS.
function posOwnerName_(p){
  var meta = state.meta || {};
  if (p.ownerType === 'store') { var s = byId(meta.stores, p.ownerId); return s ? s.name : '—'; }
  var c = byId(meta.cars, p.ownerId); return c ? c.label : '—';
}
function posOwnerLocationId_(p){
  var meta = state.meta || {};
  if (p.ownerType === 'store') { var s = byId(meta.stores, p.ownerId); return s && s.locationId; }
  var c = byId(meta.cars, p.ownerId); return c && c.locationId;
}
function sourceOptionLabel_(type, x){
  if (type === 'store') return (x.name || x.id) + ' — ' + locationName(x.locationId);
  if (type === 'car') return (x.label || x.id) + ' — ' + locationName(x.locationId);
  if (type === 'pos') return (x.label || x.id) + ' — ' + posOwnerName_(x) + ' — ' + locationName(posOwnerLocationId_(x));
  return x.label || x.name || x.id;
}

// ---------------- home ----------------
function renderHome(body){
  body.innerHTML = '<div class="card">'+esc(t('loading'))+'</div>';
  var isCompanyWide = ['admin','finance','accountant','operations_manager','deputy_operations_manager'].indexOf(state.user.role) >= 0;

  var dashP = api('listDashboard', {});
  var reportP = isCompanyWide ? api('getSalesReport', {}) : Promise.resolve(null);

  Promise.all([dashP, reportP]).then(function(results){
    var res = results[0], report = results[1];
    if(!res.ok){ body.innerHTML = '<div class="msg err">'+esc(errMsg_(res))+'</div>'; return; }
    setNotifCount((res.pendingForMe||[]).length + (res.openDisputes||[]).length);
    body.innerHTML = '';

    var actionParts = [];
    if (res.pendingForMe.length) actionParts.push(t('home_actionPending').replace('{n}', res.pendingForMe.length));
    if (res.openDisputes && res.openDisputes.length) actionParts.push(t('home_actionDisputes').replace('{n}', res.openDisputes.length));
    var hasAction = actionParts.length > 0;

    var splash = !!state.justLoggedIn;
    state.justLoggedIn = false;
    var lastLogin = lastLoginLabel_();
    var city = myCityLabel_();
    var dates = todayDatesLines_();
    var metaLines = [];
    metaLines.push(esc(dates.gregorian));
    if (dates.hijri) metaLines.push(esc(dates.hijri));
    metaLines.push((lastLogin ? esc(t('home_lastLogin'))+': '+esc(lastLogin) : esc(t('home_firstLogin'))));
    if (city) metaLines.push(esc(t('home_city'))+': '+esc(city));

    var greeting = el('<div class="card welcome-card'+(splash?' splash':'')+'" style="color:#fff;text-align:center;">' +
      '<div style="font-size:13.5px;font-weight:700;opacity:.85;">'+esc(timeGreeting())+'</div>' +
      '<div style="font-size:19px;font-weight:800;margin-top:1px;">'+esc(state.user.name)+'</div>' +
      '<div style="opacity:.85;font-size:13px;margin-top:2px;">'+esc(roleLabel(state.user.role))+'</div>' +
      '<div class="welcome-meta">' + metaLines.map(function(l){ return '<div>'+l+'</div>'; }).join('') + '</div>' +
      '<div class="home-action'+(hasAction?' has-action':'')+'"'+(hasAction?' id="homeActionLine"':'')+'>' +
        (hasAction
          ? esc(actionParts.join(' · ')) + '<span class="home-action-cta">'+esc(t('home_actionCta'))+'</span>'
          : esc(t('home_actionNone'))) +
      '</div>' +
    '</div>');
    body.appendChild(greeting);
    if (hasAction) qs('#homeActionLine', greeting).addEventListener('click', function(){ state.screen = 'handoffs'; render(); });
    if (splash) setTimeout(function(){ greeting.classList.remove('splash'); }, 4000);

    var statsWrap = el('<div class="grid"></div>');
    statsWrap.innerHTML =
      statCard(res.pendingForMe.length, t('home_pendingForMe')) +
      statCard(money(res.heldAmount), t('home_heldByMe')) +
      statCard(res.disputedInvolvingMe.length, t('home_disputes')) +
      (res.companyOutstanding!=null ? statCard(money(res.companyOutstanding), t('home_companyOutstanding')) : '') +
      (report ? statCard(money(report.totals.netCashOwed), t('report_net')) : '') +
      (report ? statCard(money(report.totals.posSales), t('report_pos')) : '') +
      (report ? statCard(money(report.totals.creditSales), t('report_credit')) : '');
    body.appendChild(statsWrap);

    if (res.pendingForMe.length){
      var pendingCard = el('<div class="card"><h2>'+esc(t('home_pendingForMe'))+'</h2><div id="pendingList"></div></div>');
      body.appendChild(pendingCard);
      var pl = qs('#pendingList', pendingCard);
      res.pendingForMe.forEach(function(h){ pl.appendChild(handoffItem(h, true)); });
    }
    if (res.openDisputes && res.openDisputes.length){
      var disputeCard = el('<div class="card"><h2>'+esc(t('home_openDisputes'))+'</h2><div id="disputeList"></div></div>');
      body.appendChild(disputeCard);
      var dl = qs('#disputeList', disputeCard);
      res.openDisputes.forEach(function(h){ dl.appendChild(handoffItem(h, false, true)); });
    }

    // Company-wide dashboard: real business shape, not just a to-do list —
    // a trend, who's currently holding cash, and top products at a glance.
    if (report){
      if (report.byDate && report.byDate.length){
        var trendCard = el('<div class="card"><h2>'+esc(t('report_trend'))+'</h2></div>');
        trendCard.appendChild(trendChart(report.byDate));
        body.appendChild(trendCard);
      }
      if (res.companyHeldByHolder && Object.keys(res.companyHeldByHolder).length){
        var holderRows = Object.keys(res.companyHeldByHolder).map(function(uid){
          return { uid: uid, amount: res.companyHeldByHolder[uid] };
        }).sort(function(a,b){ return b.amount - a.amount; });
        var holderCard = el('<div class="card"><h2>'+esc(t('home_companyOutstanding'))+'</h2></div>');
        holderCard.appendChild(barList(holderRows, function(r){ return userName(r.uid); }, function(r){ return r.amount; }, function(){ return 0; }));
        body.appendChild(holderCard);
      }
      if (report.byProduct && report.byProduct.length){
        var topProductsCard = el('<div class="card"><h2>'+esc(t('report_byProduct'))+'</h2></div>');
        topProductsCard.appendChild(barList(report.byProduct.slice(0,5),
          function(r){ return r.name || t('report_unspecified'); },
          function(r){ return r.cashAmount; }, function(r){ return r.posAmount; }, function(r){ return r.creditAmount; }));
        body.appendChild(topProductsCard);
      }
    }
  });
}

// ---------------- dashboard (company-wide: sales + collections) ----------------
function renderDashboard(body){
  body.innerHTML = '<div class="card">'+esc(t('loading'))+'</div>';
  Promise.all([api('getSalesReport', {}), api('listHandoffs', {}), api('listDashboard', {})]).then(function(results){
    var report = results[0], ho = results[1], dash = results[2];
    if (!report.ok || !ho.ok || !dash.ok){ body.innerHTML = '<div class="msg err">'+esc(errMsg_(!report.ok?report:!ho.ok?ho:dash))+'</div>'; return; }
    body.innerHTML = '';

    // ---------- Sales ----------
    body.appendChild(el('<div class="dash-section-title">'+esc(t('dash_salesTitle'))+'</div>'));

    var entries = report.entries || [];
    var grossSales = entries.reduce(function(s,e){ return s + Number(e.cashSales||0) + Number(e.posSales||0) + Number(e.creditSales||0); }, 0);
    var locsReporting = {};
    entries.forEach(function(e){ if (e.locationId) locsReporting[e.locationId] = 1; });
    var locCount = Object.keys(locsReporting).length;
    var avgPerLoc = locCount ? grossSales/locCount : 0;
    var topLoc = report.byLocation.slice().sort(function(a,b){ return b.totals.netCashOwed - a.totals.netCashOwed; })[0];
    var topProd = report.byProduct[0];

    body.appendChild(kpiRow([
      [money(grossSales), t('dash_grossSales')],
      [money(report.totals.netCashOwed), t('report_net')],
      [money(report.outstanding.netCashOwed), t('report_outstanding')],
      [money(report.totals.posSales), t('report_pos')],
      [money(report.totals.creditSales), t('report_credit')],
      [money(report.totals.deliveryFee), t('report_delivery')],
      [money(report.totals.vatOnDelivery), t('report_vat')],
      [locCount, t('dash_locationsReporting')],
      [money(avgPerLoc), t('dash_avgPerLocation')]
    ]));

    // Fixed last-7-days-vs-previous-7-days comparison — no date picker to
    // configure, so there's always something useful on screen immediately.
    // Loaded separately so a slow/failed comparison never blocks the rest

    var comparisonCard = el('<div class="card"><h2>'+esc(t('dash_comparisonTitle'))+'</h2><div id="dashComparison">'+esc(t('loading'))+'</div></div>');

// ---------------- CSV import (daily entries) ----------------
// Minimal RFC4180-ish CSV parser — quoted fields, escaped quotes, CRLF/LF.
// No library: this is the only place in the app that needs one.
function parseCsv_(text){
  var rows = [], row = [], field = '', inQuotes = false;
  for (var i=0;i<text.length;i++){
    var c = text[i];
    if (inQuotes){
      if (c === '"'){
        if (text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; }
      } else field += c;
    } else if (c === '"'){
      inQuotes = true;
    } else if (c === ','){
      row.push(field); field = '';
    } else if (c === '\n' || c === '\r'){
      if (c === '\r' && text[i+1] === '\n') i++;
      row.push(field); field = '';
      if (row.length > 1 || row[0] !== '') rows.push(row);
      row = [];
    } else field += c;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function resolveSourceByName_(type, name){
  var meta = state.meta || {};
  var n = String(name||'').trim().toLowerCase();
  if (!n) return null;
  var list = type==='store' ? (meta.stores||[]) : type==='car' ? (meta.cars||[]) : type==='pos' ? (meta.pos||[]) : [];
  for (var i=0;i<list.length;i++){
    var label = (type==='store' ? list[i].name : list[i].label) || '';
    if (String(label).trim().toLowerCase() === n) return list[i].id;
  }
  return null;
}

function resolveProductByName_(name){
  var meta = state.meta || {};
  var n = String(name||'').trim().toLowerCase();
  if (!n) return null;
  var list = meta.products || [];
  for (var i=0;i<list.length;i++){ if (String(list[i].name||'').trim().toLowerCase() === n) return list[i].id; }
  return null;
}

// Cluster-scoped source resolution for the area-manager bulk upload —
// unlike resolveSourceByName_ (single-admin/whole-company scope, name alone
// is enough), two stores/cars in different locations of the same cluster
// could share a name, so resolution here always goes through the location
// first: (locationName, sourceType, sourceName) -> id, never name alone.
function resolveLocationByNameInCluster_(name, clusterId){
  var meta = state.meta || {};
  var n = String(name||'').trim().toLowerCase();
  if (!n) return null;
  var list = (meta.locations||[]).filter(function(l){ return l.clusterId === clusterId; });
  for (var i=0;i<list.length;i++){ if (String(list[i].name||'').trim().toLowerCase() === n) return list[i].id; }
  return null;
}
function resolveSourceByNameInCluster_(type, name, locationId){
  var meta = state.meta || {};
  var n = String(name||'').trim().toLowerCase();
  if (!n || !locationId) return null;
  if (type === 'store'){
    var s = (meta.stores||[]).filter(function(x){ return x.locationId===locationId; });
    for (var i=0;i<s.length;i++){ if (String(s[i].name||'').trim().toLowerCase()===n) return s[i].id; }
  } else if (type === 'car'){
    var c = (meta.cars||[]).filter(function(x){ return x.locationId===locationId; });
    for (var j=0;j<c.length;j++){ if (String(c[j].label||'').trim().toLowerCase()===n) return c[j].id; }
  } else if (type === 'pos'){
    var p = (meta.pos||[]).filter(function(x){ return posOwnerLocationId_(x)===locationId; });
    for (var k=0;k<p.length;k++){ if (String(p[k].label||'').trim().toLowerCase()===n) return p[k].id; }
  }
  return null;
}

function downloadCsvTemplate_(){
  var meta = state.meta || {};
  var sampleStore = (meta.stores && meta.stores[0] && meta.stores[0].name) || 'Store name';
  var header = 'date,sourceType,sourceName,product,cashSales,deliveryFee,posSales,creditSales,cylindersOut,cylindersIn,note';
  var sample = new Date().toISOString().slice(0,10)+',store,'+sampleStore+',,1000,,0,0,,,';

  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

// Product-level template: one row = one product/service line (qty x unit
// price, routed to a single payment method), the same shape renderEntries'
// product mode already writes one daily_entries row per line — not one row
// per source per day like the old flat cashSales/deliveryFee/posSales/
// creditSales columns used to be. Plus a leading locationName column, needed
// here (and not on the single-location admin import) because this template
// spans every location in a whole cluster at once.
function downloadAreaBulkCsvTemplate_(clusterId){
  var meta = state.meta || {};
  var myLoc = (meta.locations||[]).filter(function(l){ return l.clusterId===clusterId; })[0];
  var sampleLocation = myLoc ? myLoc.name : 'Location name';
  var sampleStore = (meta.stores||[]).filter(function(s){ return !myLoc || s.locationId===myLoc.id; })[0];
  var sampleCar = (meta.cars||[]).filter(function(c){ return !myLoc || c.locationId===myLoc.id; })[0];
  var goodsProduct = (meta.products||[]).filter(function(p){ return p.type!=='services' && p.active!==false; })[0];
  // Delivery fees are a service, never cash — the sample line demonstrates
  // that the delivery paymentMethod pairs with a services-type product on
  // a car/pos row, exactly like lineProductOptionsHtml_ enforces in the
  // regular Entries screen.
  var serviceProduct = (meta.products||[]).filter(function(p){ return p.type==='services' && p.active!==false; })[0];
  var header = 'date,locationName,sourceType,sourceName,product,qty,unitPrice,paymentMethod,cylindersOut,cylindersIn,note';
  var d = new Date().toISOString().slice(0,10);
  var sample1 = d+','+sampleLocation+',store,'+(sampleStore?sampleStore.name:'Store name')+','+(goodsProduct?goodsProduct.name:'Product name')+',10,50,cash,10,0,';
  var sample2 = d+','+sampleLocation+',car,'+(sampleCar?sampleCar.label:'Car name')+','+(serviceProduct?serviceProduct.name:'Delivery Fee')+',1,115,delivery,,,';
  var csv = header+'\n'+sample1+'\n'+sample2+'\n';
  var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'area_bulk_template.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

    // this field only ever applies to a car/pos entry — say so right where
    // people look for it when it's (correctly) not on screen.
    qs('#eDeliveryHint', form).textContent = showDelivery ? '' : t('entry_delivery') + ' — ' + t('entry_source_car') + ' / ' + t('entry_source_pos');
    qs('#eDeliveryHint', form).style.display = showDelivery ? 'none' : 'block';
    updateLocationDisplay();
    resetLines_();
  }
  // Store/car/pos are all ultimately tied to one location (a POS machine's
  // through whichever store or car owns it) — showing it read-only the
  // moment a source is picked confirms where an entry will actually count,
  // without making the person go look it up separately.
  function resolveLocationIdForSource_(type, sourceId){
    if (type === 'store') { var s = byId(meta.stores, sourceId); return s ? s.locationId : null; }
    if (type === 'car') { var c = byId(meta.cars, sourceId); return c ? c.locationId : null; }
    if (type === 'pos') { var p = byId(meta.pos, sourceId); return p ? posOwnerLocationId_(p) : null; }
    return null;
  }
  function updateLocationDisplay(){
    var locId = resolveLocationIdForSource_(typeSel.value, qs('#eSource', form).value);
    qs('#eLocation', form).value = locId ? locationName(locId) : '—';
  }
  // Cylinder in/out only means anything once a specific product (which
  // cylinder type) is picked — a company selling anything beyond LPG
  // cylinders alone just never fills these in, no harm either way. Only
  // relevant in direct mode — product mode has its own per-line cylinder
  // fields instead.
  function toggleCylFields(){
    var show = qs('#eMode', form).value === 'direct' && !!productSel.value;
    qs('#eCylWrap', form).style.display = show ? '' : 'none';
    if (!show) { qs('#eCylOut', form).value = '0'; qs('#eCylIn', form).value = '0'; }
  }

  // ---------- product-level lines (qty x unit price, per payment method) ----------
  var linesBody = qs('#eLinesBody', form);
  var lineSeq = 0;

  function paymentOptionsHtml_(){
    var opts2 = [['cash', t('entry_payment_cash')], ['pos', t('entry_payment_pos')], ['credit', t('entry_payment_credit')]];
    if (lastShowDelivery) opts2.push(['delivery', t('entry_payment_delivery')]);
    return opts2.map(function(o){ return '<option value="'+o[0]+'">'+esc(o[1])+'</option>'; }).join('');
  }
  // The xlsx note is explicit: delivery fees are a *service*, paid to the
  // bank, never cash — so a line tagged "delivery" only ever offers
  // services-type products, not goods. Keeps a data-entry person from
  // accidentally booking a cylinder sale as a delivery fee or vice versa.
  function lineProductOptionsHtml_(payment){
    var list = payment === 'delivery' ? products.filter(function(p){ return p.type === 'services'; }) : products;
    return '<option value="">'+esc(t('entry_product_none'))+'</option>' +
      list.map(function(p){ return '<option value="'+p.id+'">'+esc(p.name)+'</option>'; }).join('');
  }
  function refreshLineProductOptions_(lineEl){
    var paySel = qs('.lnPayment', lineEl), prodSel = qs('.lnProduct', lineEl);
    var current = prodSel.value;
    prodSel.innerHTML = lineProductOptionsHtml_(paySel.value);
    if (list_hasOption_(prodSel, current)) prodSel.value = current; else recomputeLineCyl_(lineEl);
  }
  function list_hasOption_(sel, val){
    for (var i=0;i<sel.options.length;i++) if (sel.options[i].value===val) return true;
    return false;
  }
  function recomputeLineCyl_(lineEl){
    var show = !!qs('.lnProduct', lineEl).value;
    var wrap = qs('.lnCylWrap', lineEl);
    wrap.style.display = show ? '' : 'none';
    if (!show) { qs('.lnCylOut', lineEl).value = '0'; qs('.lnCylIn', lineEl).value = '0'; }
  }
  function recomputeLineSubtotal_(lineEl){
    var qty = numFromInput_(qs('.lnQty', lineEl));
    var price = numFromInput_(qs('.lnPrice', lineEl));
    qs('.lnSubtotal', lineEl).textContent = money(qty * price);
  }
  function recomputeTotals_(){
    var sums = { cash: 0, pos: 0, delivery: 0, credit: 0 };
    qsa('.eLine', linesBody).forEach(function(lineEl){
      var qty = numFromInput_(qs('.lnQty', lineEl));
      var price = numFromInput_(qs('.lnPrice', lineEl));
      var payment = qs('.lnPayment', lineEl).value;
      if (sums.hasOwnProperty(payment)) sums[payment] += qty * price;
    });
    qs('#eCash', form).value = money(sums.cash);
    qs('#ePos', form).value = money(sums.pos);
    qs('#eDelivery', form).value = money(sums.delivery);
    qs('#eCredit', form).value = money(sums.credit);
  }
  function addLine_(){
    lineSeq++;
    var lineEl = el(
      '<div class="card eLine" style="margin-bottom:10px;background:var(--bg-soft,#f7f5ef);" data-seq="'+lineSeq+'">' +
        '<div class="grid">' +
          '<div class="field"><label>'+esc(t('entry_lineProduct'))+'</label><select class="lnProduct">'+lineProductOptionsHtml_('cash')+'</select></div>' +
          '<div class="field"><label>'+esc(t('entry_qty'))+'</label><input class="lnQty" type="text" inputmode="decimal" value="0"></div>' +
          '<div class="field"><label>'+esc(t('entry_unitPrice'))+'</label><input class="lnPrice" type="text" inputmode="decimal" value="0"></div>' +
          '<div class="field"><label>'+esc(t('entry_paymentMethod'))+'</label><select class="lnPayment">'+paymentOptionsHtml_()+'</select></div>' +
        '</div>' +
        '<div class="grid lnCylWrap" style="display:none;">' +
          '<div class="field"><label>'+esc(t('entry_cylindersOut'))+'</label><input class="lnCylOut" type="text" inputmode="numeric" value="0"></div>' +
          '<div class="field"><label>'+esc(t('entry_cylindersIn'))+'</label><input class="lnCylIn" type="text" inputmode="numeric" value="0"></div>' +
        '</div>' +
        '<div class="row" style="justify-content:space-between;align-items:center;margin-top:6px;">' +
          '<div><span class="muted">'+esc(t('entry_lineSubtotal'))+':</span> <strong class="lnSubtotal">0.00</strong></div>' +
          '<button type="button" class="btn-icon lnRemove" title="'+esc(t('entry_removeLine'))+'"><svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg></button>' +
        '</div>' +
      '</div>'
    );
    linesBody.appendChild(lineEl);
    wireCommaInput_(qs('.lnQty', lineEl), true);
    wireCommaInput_(qs('.lnPrice', lineEl), true);
    wireCommaInput_(qs('.lnCylOut', lineEl), false);
    wireCommaInput_(qs('.lnCylIn', lineEl), false);
    qs('.lnProduct', lineEl).addEventListener('change', function(){ recomputeLineCyl_(lineEl); });
    qs('.lnPayment', lineEl).addEventListener('change', function(){ refreshLineProductOptions_(lineEl); recomputeTotals_(); });
    ['input','blur'].forEach(function(evt){
      qs('.lnQty', lineEl).addEventListener(evt, function(){ recomputeLineSubtotal_(lineEl); recomputeTotals_(); });
      qs('.lnPrice', lineEl).addEventListener(evt, function(){ recomputeLineSubtotal_(lineEl); recomputeTotals_(); });
    });
    qs('.lnRemove', lineEl).addEventListener('click', function(){
      lineEl.remove();
      recomputeTotals_();
    });
  }
  function resetLines_(){
    linesBody.innerHTML = '';
    if (qs('#eMode', form).value === 'product') addLine_();
    recomputeTotals_();
  }
  qs('#eAddLine', form).addEventListener('click', addLine_);

  function applyMode_(){
    var mode = qs('#eMode', form).value;
    var isProduct = mode === 'product';
    qs('#eProductWrap', form).style.display = isProduct ? 'none' : '';
    qs('#eLinesWrap', form).style.display = isProduct ? '' : 'none';
    qs('#eComputedHint', form).style.display = isProduct ? '' : 'none';
    ['#eCash','#eDelivery','#ePos','#eCredit'].forEach(function(sel){
      var input = qs(sel, form);
      input.disabled = isProduct;
      input.readOnly = isProduct;
    });
    toggleCylFields();
    if (isProduct) {
      if (!qsa('.eLine', linesBody).length) addLine_();
      recomputeTotals_();
    } else {
      // Switching back to direct mode starts the amount fields fresh
      // rather than carrying over whatever the (now-hidden) product lines
      // last summed to — the two entry paths shouldn't silently blend.
      qs('#eCash', form).value = '0';
      qs('#eDelivery', form).value = '0';
      qs('#ePos', form).value = '0';
      qs('#eCredit', form).value = '0';
    }
  }
  qs('#eMode', form).addEventListener('change', applyMode_);

  typeSel.addEventListener('change', populateSourceOptions);
  qs('#eSource', form).addEventListener('change', updateLocationDisplay);
  populateSourceOptions();
  productSel.addEventListener('change', toggleCylFields);
  applyMode_();

  qs('#eSubmit', form).addEventListener('click', function(){
    var mode = qs('#eMode', form).value;
    var date = qs('#eDate', form).value;
    var sourceType = typeSel.value;
    var sourceId = qs('#eSource', form).value;
    var note = qs('#eNote', form).value;
    if (!sourceId){ qs('#entryMsg',form).innerHTML='<div class="msg err">'+esc(t('err_noSourceSelected'))+'</div>'; return; }

    if (mode === 'direct') {
      var payload = {
        date: date, sourceType: sourceType, sourceId: sourceId,
        cylindersOut: numFromInput_(qs('#eCylOut', form)),
        cylindersIn: numFromInput_(qs('#eCylIn', form)),
        productId: productSel.value || null,
        cashSales: numFromInput_(qs('#eCash', form)),
        deliveryFeeBankAmount: numFromInput_(qs('#eDelivery', form)),
        posSales: numFromInput_(qs('#ePos', form)),
        creditSales: numFromInput_(qs('#eCredit', form)),
        note: note
      };
      api('createDailyEntry', payload).then(function(res){
        if(!res.ok){ qs('#entryMsg',form).innerHTML='<div class="msg err">'+esc(errMsg_(res))+'</div>'; return; }
        qs('#entryMsg',form).innerHTML='<div class="msg ok">'+esc(t('ok_saved'))+'</div>';
        loadEntryList();
      });
      return;
    }

    // product mode: one daily_entries row per product line, all sharing the
    // same date/source/note — the existing bulk-import action already does
    // exactly this per-row validation, so it's reused instead of adding a
    // second entry-creation code path on the server.
    var lineEls = qsa('.eLine', linesBody);
    if (!lineEls.length){ qs('#entryMsg',form).innerHTML='<div class="msg err">'+esc(t('err_noProductLines'))+'</div>'; return; }
    var rows = [];
    for (var i=0;i<lineEls.length;i++){
      var lineEl = lineEls[i];
      var productId = qs('.lnProduct', lineEl).value;
      var qty = numFromInput_(qs('.lnQty', lineEl));
      var price = numFromInput_(qs('.lnPrice', lineEl));
      var payment = qs('.lnPayment', lineEl).value;
      if (!productId || !(qty > 0) || !(price > 0) || !payment){
        qs('#entryMsg',form).innerHTML='<div class="msg err">'+esc(t('err_lineIncomplete'))+'</div>';
        return;
      }
      var subtotal = qty * price;
      rows.push({
        date: date, sourceType: sourceType, sourceId: sourceId, productId: productId,
        qty: qty, unitPrice: price,
        cashSales: payment==='cash' ? subtotal : 0,
        posSales: payment==='pos' ? subtotal : 0,
        deliveryFeeBankAmount: payment==='delivery' ? subtotal : 0,
        creditSales: payment==='credit' ? subtotal : 0,
        cylindersOut: numFromInput_(qs('.lnCylOut', lineEl)),
        cylindersIn: numFromInput_(qs('.lnCylIn', lineEl)),
        note: note
      });
    }
    api('importDailyEntries', { rows: rows }).then(function(res){
      if(!res.ok){ qs('#entryMsg',form).innerHTML='<div class="msg err">'+esc(errMsg_(res))+'</div>'; return; }
      var failed = (res.results||[]).filter(function(r){ return !r.ok; });
      qs('#entryMsg',form).innerHTML = failed.length
        ? '<div class="msg err">'+esc(t('entry_importResult').replace('{created}',res.created).replace('{total}',res.total))+'</div>'
        : '<div class="msg ok">'+esc(t('ok_saved'))+'</div>';
      if (res.created > 0){ resetLines_(); loadEntryList(); }
    });
  });

  if (role === 'admin') {
    var importCard = el('<div class="card">' +
      '<h2>'+esc(t('entry_importTitle'))+'</h2>' +
      '<div class="muted" style="font-size:12.5px;margin-bottom:10px;">'+esc(t('entry_importHint'))+'</div>' +
      '<div class="row" style="gap:10px;flex-wrap:wrap;margin-bottom:10px;align-items:center;">' +
        '<button type="button" class="btn" id="impTemplateBtn" style="background:var(--muted-2);">'+esc(t('entry_importTemplate'))+'</button>' +
        '<input type="file" id="impFile" accept=".csv,text/csv">' +
      '</div>' +
      '<div id="impMsg"></div>' +
      '<div id="impPreviewWrap"></div>' +
    '</div>');
    body.appendChild(importCard);
    qs('#impTemplateBtn', importCard).addEventListener('click', downloadCsvTemplate_);

    var pendingImportRows = [];
    qs('#impFile', importCard).addEventListener('change', function(e){
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(){
        var parsed;
        try { parsed = parseCsv_(String(reader.result||'')); } catch(err){ parsed = null; }
        if (!parsed || parsed.length < 2){ qs('#impMsg',importCard).innerHTML = '<div class="msg err">'+esc(t('entry_importParseError'))+'</div>'; return; }
        qs('#impMsg',importCard).innerHTML = '';
        var header = parsed[0].map(function(h){ return String(h||'').trim(); });
        var dataRows = parsed.slice(1).filter(function(r){ return r.some(function(c){ return String(c||'').trim() !== ''; }); });
        var idx = {};
        header.forEach(function(h,i){ idx[h]=i; });
        function cell(r,key){ var i = idx[key]; return (i!=null && r[i]!=null) ? String(r[i]) : ''; }

        pendingImportRows = dataRows.map(function(r){
          var date = cell(r,'date').trim();
          var sourceType = cell(r,'sourceType').trim().toLowerCase();
          var sourceName = cell(r,'sourceName').trim();
          var productName = cell(r,'product').trim();
          var cashSales = cell(r,'cashSales');
          var deliveryFee = cell(r,'deliveryFee');
          var posSales = cell(r,'posSales');
          var creditSales = cell(r,'creditSales');
          var cylindersOut = cell(r,'cylindersOut');
          var cylindersIn = cell(r,'cylindersIn');
          var note = cell(r,'note');

          var status = 'ok', sourceId = null, productId = null;
          if (!date || ['store','car','pos'].indexOf(sourceType) < 0 || !sourceName) status = 'missing';
          if (status === 'ok'){
            sourceId = resolveSourceByName_(sourceType, sourceName);
            if (!sourceId) status = 'notfound';
          }
          if (status === 'ok' && productName) productId = resolveProductByName_(productName);
          return {
            date: date, sourceType: sourceType, sourceId: sourceId, sourceName: sourceName,
            productId: productId, cashSales: cashSales, deliveryFeeBankAmount: deliveryFee, posSales: posSales,
            creditSales: creditSales, cylindersOut: cylindersOut, cylindersIn: cylindersIn, note: note,
            status: status
          };
        });

        renderImportPreview();
      };
      reader.readAsText(file);
    });

    function renderImportPreview(){
      var wrap = qs('#impPreviewWrap', importCard);
      if (!pendingImportRows.length){ wrap.innerHTML=''; return; }
      var rows = pendingImportRows.map(function(r, i){
        var statusLabel = r.status==='ok' ? '<span class="badge confirmed">'+esc(t('entry_importValid'))+'</span>'
          : r.status==='notfound' ? '<span class="badge disputed">'+esc(t('entry_importErr_notfound'))+'</span>'
          : '<span class="badge rejected">'+esc(t('entry_importErr_missing'))+'</span>';
        return '<tr><td>'+(i+1)+'</td><td>'+esc(r.date)+'</td><td>'+esc(r.sourceType)+'</td><td>'+esc(r.sourceName)+'</td><td>'+statusLabel+'</td></tr>';
      }).join('');
      wrap.innerHTML = '<h2 style="margin-top:14px;">'+esc(t('entry_importPreview'))+'</h2>' +
        '<table><thead><tr><th>'+esc(t('entry_importCol_row'))+'</th><th>'+esc(t('entry_importCol_date'))+'</th>' +
        '<th>'+esc(t('entry_importCol_type'))+'</th><th>'+esc(t('entry_importCol_source'))+'</th><th>'+esc(t('entry_importCol_status'))+'</th></tr></thead><tbody>'+rows+'</tbody></table>' +
        '<button class="btn" id="impSubmit" style="margin-top:12px;">'+esc(t('entry_importSubmit'))+'</button>';
      qs('#impSubmit', wrap).addEventListener('click', function(){
        var validRows = pendingImportRows.filter(function(r){ return r.status==='ok'; });
        if (!validRows.length) return;
        api('importDailyEntries', { rows: validRows }).then(function(res){
          if (!res.ok){ qs('#impMsg',importCard).innerHTML='<div class="msg err">'+esc(errMsg_(res))+'</div>'; return; }
          qs('#impMsg',importCard).innerHTML='<div class="msg ok">'+esc(t('entry_importResult').replace('{created}',res.created).replace('{total}',res.total))+'</div>';
          pendingImportRows = [];
          renderImportPreview();
          loadEntryList();
        });
      });
    }
  }

  var listCard = el('<div class="card"><h2>'+esc(t('entry_list'))+'</h2><div id="entryListBody"></div></div>');
  body.appendChild(listCard);
  loadEntryList();

  function loadEntryList(){
    api('listEntries', {}).then(function(res){
      var wrap = qs('#entryListBody');
      if(!res.ok || !res.entries.length){ wrap.innerHTML = '<div class="muted">'+esc(t('noData'))+'</div>'; return; }
      var rows = res.entries.slice(0,30).map(function(e){
        // A car or pos entry can carry cash, card/POS, and credit sales all
        // at once now, so a single-column quick list shows their sum rather
        // than picking just one and silently dropping the others.
        var amt = Number(e.cashSales||0) + Number(e.posSales||0) + Number(e.creditSales||0);
        return '<tr><td>'+esc(e.date)+'</td><td>'+esc(t('entry_source_'+e.sourceType))+'</td><td>'+money(amt)+'</td><td>'+(e.consumedBy?'✓':'')+'</td></tr>';
      }).join('');
      wrap.innerHTML = '<table><thead><tr><th>'+esc(t('entry_date'))+'</th><th>'+esc(t('entry_sourceType'))+'</th><th>'+esc(t('handoff_amount'))+'</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>';
    });
  }
}

// ---------------- area-manager bulk upload ----------------
// A deliberate alternative to renderEntries: cluster-wide file, batch
// review, submit-for-approval instead of submit-and-done — different enough
// semantics that reusing the single-location entry screen would mean
// forking most of its CSV-import card anyway. See CLAUDE.md.
function renderAreaBulk(body){
  var role = state.user.role;
  var clusters = (state.meta && state.meta.clusters) || [];
  var myCluster = role === 'admin' ? null : clusters.filter(function(c){ return c.clusterManagerUserId === state.user.id; })[0];

  var card = el('<div class="card">' +
    '<h2>'+esc(t('areaBulk_title'))+'</h2>' +
    '<div class="muted" style="font-size:12.5px;margin-bottom:10px;">'+esc(t('areaBulk_hint'))+'</div>' +
    (role==='admin' ? '<div class="field"><label>'+esc(t('deputy_cluster'))+'</label><select id="abCluster">'+
      clusters.map(function(c){ return '<option value="'+c.id+'">'+esc(c.name)+'</option>'; }).join('')+'</select></div>' : '') +
    '<div class="row" style="gap:10px;flex-wrap:wrap;margin-bottom:10px;align-items:center;">' +
      '<button type="button" class="btn" id="abTemplateBtn" style="background:var(--muted-2);">'+esc(t('areaBulk_template'))+'</button>' +
      '<input type="file" id="abFile" accept=".csv,text/csv">' +
    '</div>' +
    '<div id="abMsg"></div>' +
    '<div id="abPreviewWrap"></div>' +
  '</div>');
  body.innerHTML = '';
  body.appendChild(card);

  if (role !== 'admin' && !myCluster) {
    card.innerHTML = '<h2>'+esc(t('areaBulk_title'))+'</h2><div class="msg err">'+esc(t('err_forbidden'))+'</div>';
    return;
  }

  function currentClusterId(){
    return role === 'admin' ? qs('#abCluster', card).value : myCluster.id;
  }

  qs('#abTemplateBtn', card).addEventListener('click', function(){ downloadAreaBulkCsvTemplate_(currentClusterId()); });

  var pendingRows = [];
  qs('#abFile', card).addEventListener('change', function(e){
    var file = e.target.files[0];
    if (!file) return;
    var clusterId = currentClusterId();
    var reader = new FileReader();
    reader.onload = function(){
      var parsed;
      try { parsed = parseCsv_(String(reader.result||'')); } catch(err){ parsed = null; }
      if (!parsed || parsed.length < 2){ qs('#abMsg',card).innerHTML = '<div class="msg err">'+esc(t('entry_importParseError'))+'</div>'; return; }
      qs('#abMsg',card).innerHTML = '';
      var header = parsed[0].map(function(h){ return String(h||'').trim(); });
      var dataRows = parsed.slice(1).filter(function(r){ return r.some(function(c){ return String(c||'').trim() !== ''; }); });
      var idx = {};
      header.forEach(function(h,i){ idx[h]=i; });
      function cell(r,key){ var i = idx[key]; return (i!=null && r[i]!=null) ? String(r[i]) : ''; }

      // Product-level: one row = one product/service line (qty x unit price,
      // one payment method) — mirrors exactly what renderEntries' product
      // mode submits per line, so the same subtotal/routing logic applies
      // here and the batch that reaches Deputy review always carries real
      // product detail, never a bare day-total.
      pendingRows = dataRows.map(function(r){
        var date = cell(r,'date').trim();
        var locationName = cell(r,'locationName').trim();
        var sourceType = cell(r,'sourceType').trim().toLowerCase();
        var sourceName = cell(r,'sourceName').trim();
        var productName = cell(r,'product').trim();
        var qty = Number(cell(r,'qty').replace(/,/g,'').trim() || 0);
        var unitPrice = Number(cell(r,'unitPrice').replace(/,/g,'').trim() || 0);
        var paymentMethod = cell(r,'paymentMethod').trim().toLowerCase();
        var note = cell(r,'note');

        var status = 'ok', locationId = null, sourceId = null, productId = null, product = null;
        if (!date || !locationName || ['store','car','pos'].indexOf(sourceType) < 0 || !sourceName || !productName || !paymentMethod) status = 'missing';
        if (status === 'ok') {
          locationId = resolveLocationByNameInCluster_(locationName, clusterId);
          if (!locationId) status = 'location_notfound';
        }
        if (status === 'ok') {
          sourceId = resolveSourceByNameInCluster_(sourceType, sourceName, locationId);
          if (!sourceId) status = 'source_notfound';
        }
        if (status === 'ok') {
          productId = resolveProductByName_(productName);
          if (!productId) status = 'product_notfound'; else product = byId(state.meta.products, productId);
        }
        if (status === 'ok' && !(qty > 0)) status = 'invalid_qty';
        if (status === 'ok' && !(unitPrice > 0)) status = 'invalid_price';
        if (status === 'ok' && ['cash','pos','credit','delivery'].indexOf(paymentMethod) < 0) status = 'invalid_payment';
        // Same rule lineProductOptionsHtml_/showDelivery enforce in the
        // regular Entries screen: delivery is car/pos only (a store branch
        // has nothing to deliver), and only ever against a services product.
        if (status === 'ok' && paymentMethod === 'delivery' && sourceType === 'store') status = 'delivery_not_allowed_store';
        if (status === 'ok' && paymentMethod === 'delivery' && product && product.type !== 'services') status = 'delivery_needs_services';

        var subtotal = qty * unitPrice;
        return {
          date: date, locationName: locationName, sourceType: sourceType, sourceId: sourceId, sourceName: sourceName,
          productId: productId, productName: productName, qty: qty, unitPrice: unitPrice, paymentMethod: paymentMethod, subtotal: subtotal,
          cashSales: paymentMethod==='cash' ? subtotal : 0,
          posSales: paymentMethod==='pos' ? subtotal : 0,
          deliveryFeeBankAmount: paymentMethod==='delivery' ? subtotal : 0,
          creditSales: paymentMethod==='credit' ? subtotal : 0,
          cylindersOut: cell(r,'cylindersOut'), cylindersIn: cell(r,'cylindersIn'), note: note,
          status: status
        };
      });
      renderAreaBulkPreview();
    };
    reader.readAsText(file);
  });

  function renderAreaBulkPreview(){
    var wrap = qs('#abPreviewWrap', card);
    if (!pendingRows.length){ wrap.innerHTML=''; return; }
    var allValid = pendingRows.every(function(r){ return r.status==='ok'; });
    var statusLabels = {
      ok: '<span class="badge confirmed">'+esc(t('areaBulk_valid'))+'</span>',
      location_notfound: '<span class="badge disputed">'+esc(t('areaBulk_err_location_notfound'))+'</span>',
      source_notfound: '<span class="badge disputed">'+esc(t('areaBulk_err_source_notfound'))+'</span>',
      product_notfound: '<span class="badge disputed">'+esc(t('areaBulk_err_product_notfound'))+'</span>',
      invalid_qty: '<span class="badge rejected">'+esc(t('areaBulk_err_invalid_qty'))+'</span>',
      invalid_price: '<span class="badge rejected">'+esc(t('areaBulk_err_invalid_price'))+'</span>',
      invalid_payment: '<span class="badge rejected">'+esc(t('areaBulk_err_invalid_payment'))+'</span>',
      delivery_not_allowed_store: '<span class="badge rejected">'+esc(t('areaBulk_err_delivery_not_allowed_store'))+'</span>',
      delivery_needs_services: '<span class="badge rejected">'+esc(t('areaBulk_err_delivery_needs_services'))+'</span>'
    };
    var paymentLabels = { cash: t('entry_payment_cash'), pos: t('entry_payment_pos'), delivery: t('entry_payment_delivery'), credit: t('entry_payment_credit') };
    var rows = pendingRows.map(function(r, i){
      var statusLabel = statusLabels[r.status] || '<span class="badge rejected">'+esc(t('areaBulk_err_missing'))+'</span>';
      // An unrecognized paymentMethod has no i18n entry to translate — show
      // whatever the file actually said instead of a raw, confusing
      // "entry_payment_<junk>" key string falling out of t()'s not-found path.
      return '<tr><td>'+(i+1)+'</td><td>'+esc(r.date)+'</td><td>'+esc(r.locationName)+'</td><td>'+esc(r.sourceType)+'</td><td>'+esc(r.sourceName)+'</td>' +
        '<td>'+esc(r.productName)+'</td><td>'+(r.qty||0)+'</td><td>'+money(r.unitPrice)+'</td>' +
        '<td>'+esc(paymentLabels[r.paymentMethod] || r.paymentMethod || '')+'</td><td>'+money(r.subtotal)+'</td><td>'+statusLabel+'</td></tr>';
    }).join('');
    wrap.innerHTML = '<h2 style="margin-top:14px;">'+esc(t('entry_importPreview'))+'</h2>' +
      '<div class="tbl-scroll"><table><thead><tr><th>'+esc(t('areaBulk_col_row'))+'</th><th>'+esc(t('areaBulk_col_date'))+'</th>' +
      '<th>'+esc(t('areaBulk_col_location'))+'</th><th>'+esc(t('areaBulk_col_type'))+'</th><th>'+esc(t('areaBulk_col_source'))+'</th>' +
      '<th>'+esc(t('entry_lineProduct'))+'</th><th>'+esc(t('entry_qty'))+'</th><th>'+esc(t('entry_unitPrice'))+'</th>' +
      '<th>'+esc(t('entry_paymentMethod'))+'</th><th>'+esc(t('entry_lineSubtotal'))+'</th><th>'+esc(t('areaBulk_col_status'))+'</th></tr></thead><tbody>'+rows+'</tbody></table></div>' +
      (allValid ? '<div id="abCalcWrap">'+esc(t('loading'))+'</div>' : '<div class="msg err" style="margin-top:10px;">'+esc(t('areaBulk_needsAllValid'))+'</div>');

    if (!allValid) return;

    // Server-computed preview (dryRun:true) — the exact same computeNet_
    // formula the Deputy will see, nothing written yet, so the area
    // manager reviews real numbers instead of a client-side guess before
    // deciding to send this to the Deputy at all.
    api('bulkSubmitAreaBatch', { clusterId: currentClusterId(), rows: pendingRows, dryRun: true }).then(function(res){
      var calcWrap = qs('#abCalcWrap', wrap);
      if (!calcWrap) return;
      if (!res.ok){ calcWrap.innerHTML = '<div class="msg err">'+esc(errMsg_(res))+'</div>'; return; }
      var b = res.batch.breakdown;
      calcWrap.innerHTML = '<h2 style="margin-top:14px;">'+esc(t('areaBulk_calcTitle'))+'</h2>' +
        '<div class="muted" style="font-size:12.5px;margin-bottom:8px;">'+esc(t('areaBulk_calcHint'))+'</div>' +
        '<div style="font-size:24px;font-weight:800;text-align:center;margin-bottom:6px;">'+money(b.netCashOwed)+'</div>' +
        breakdownGrid(b) +
        handoffDetailRows(res.batch) +
        productBreakdownBlock_(pendingRows) +
        (b.deliveryFee > 0 ? vatExplainBlock_(b) : '') +
        '<button class="btn" id="abSubmit" style="margin-top:14px;">'+esc(t('areaBulk_submit'))+'</button>';
      qs('#abSubmit', calcWrap).addEventListener('click', function(){
        api('bulkSubmitAreaBatch', { clusterId: currentClusterId(), rows: pendingRows }).then(function(res2){
          if (!res2.ok){ qs('#abMsg',card).innerHTML = '<div class="msg err">'+esc(errMsg_(res2))+'</div>'; return; }
          qs('#abMsg',card).innerHTML = '<div class="msg ok">'+esc(t('ok_saved'))+'</div>';
          pendingRows = [];
          renderAreaBulkPreview();
          qs('#abFile', card).value = '';
          loadAreaBulkHistory();
        });
      });
    });
  }

  // Spells out the VAT-on-delivery-fee reclaim step-by-step with the
  // batch's own real numbers plugged in — the one formula in the whole
  // system people ask about most, per CLAUDE.md's "the formula" section:
  // vatOnDelivery = (deliveryFee / (1+vatRate)) * vatRate.
  // .replace(str, val) only swaps the FIRST occurrence — several of these
  // step strings use the same placeholder (e.g. {rate}) more than once, so
  // a plain chained .replace() silently leaves the second instance literal.
  // This fills every occurrence of every key.
  function fillTemplate_(str, vars){
    Object.keys(vars).forEach(function(k){
      str = str.split('{'+k+'}').join(vars[k]);
    });
    return str;
  }
  // Per-product "deep detail" the area manager asked to see before sending
  // for approval: every product/service line, aggregated across all rows in
  // this batch, with its own VAT 15% split shown out. This is purely
  // informational display built from the validated rows already on screen
  // — it does NOT feed computeNet_ or change netCashOwed in any way. Only
  // the delivery-fee VAT (vatExplainBlock_ below, using the server's own
  // b.deliveryFee) is ever actually reclaimed into the net cash figure, per
  // the xlsx formula (see CLAUDE.md "The formula"); a goods line's price is
  // simply assumed VAT-inclusive like any retail price tag, so its split
  // here is shown for transparency only, never subtracted or added back.
  function productBreakdownBlock_(rows){
    var vatRate = state.meta.config.vatRate;
    var byProduct = {};
    rows.forEach(function(r){
      var key = r.productId;
      if (!byProduct[key]) {
        var p = byId(state.meta.products, r.productId);
        byProduct[key] = { name: r.productName, type: p ? p.type : 'goods', qty: 0, subtotal: 0 };
      }
      byProduct[key].qty += r.qty;
      byProduct[key].subtotal += r.subtotal;
    });
    var list = Object.keys(byProduct).map(function(k){ return byProduct[k]; })
      .sort(function(a,b){ return b.subtotal - a.subtotal; });
    var rowsHtml = list.map(function(p){
      var base = p.subtotal / (1 + vatRate);
      var vat = base * vatRate;
      return '<tr><td>'+esc(p.name)+'</td><td>'+esc(t(p.type==='services' ? 'admin_typeServices' : 'admin_typeGoods'))+'</td>' +
        '<td>'+p.qty+'</td><td>'+money(p.subtotal)+'</td><td>'+money(base)+'</td><td>'+money(vat)+'</td></tr>';
    }).join('');
    return '<h2 style="margin-top:14px;">'+esc(t('areaBulk_productBreakdownTitle'))+'</h2>' +
      '<div class="muted" style="font-size:12px;margin-bottom:6px;">'+esc(t('areaBulk_productBreakdownHint'))+'</div>' +
      '<div class="tbl-scroll"><table><thead><tr><th>'+esc(t('entry_lineProduct'))+'</th><th>'+esc(t('admin_productType'))+'</th>' +
      '<th>'+esc(t('entry_qty'))+'</th><th>'+esc(t('entry_lineSubtotal'))+'</th><th>'+esc(t('areaBulk_vatBase'))+'</th><th>'+esc(t('report_vat'))+'</th></tr></thead><tbody>'+rowsHtml+'</tbody></table></div>';
  }
  function vatExplainBlock_(b){
    var vatRate = state.meta.config.vatRate;
    var deliveryFee = b.deliveryFee;
    var beforeVat = deliveryFee / (1 + vatRate);
    var vatAmount = beforeVat * vatRate;
    var ratePct = (vatRate*100).toFixed(0);
    return '<div class="msg" style="margin-top:10px;background:var(--green-pale);border:1px solid var(--green);font-size:12.5px;line-height:1.9;">' +
      '<strong>'+esc(t('areaBulk_vatTitle'))+'</strong><br>' +
      esc(fillTemplate_(t('areaBulk_vatStep1'), {fee: money(deliveryFee)})) + '<br>' +
      esc(fillTemplate_(t('areaBulk_vatStep2'), {fee: money(deliveryFee), rate: ratePct, base: money(beforeVat)})) + '<br>' +
      esc(fillTemplate_(t('areaBulk_vatStep3'), {base: money(beforeVat), rate: ratePct, vat: money(vatAmount)})) + '<br>' +
      esc(fillTemplate_(t('areaBulk_vatStep4'), {vat: money(vatAmount)})) +
    '</div>';
  }

  var historyCard = el('<div class="card"><h2>'+esc(t('areaBulk_recentTitle'))+'</h2><div id="abHistory"></div></div>');
  body.appendChild(historyCard);
  function loadAreaBulkHistory(){
    api('listAreaBulkBatches', {}).then(function(res){
      var wrap = qs('#abHistory', historyCard);
      if (!res.ok || !res.batches.length){ wrap.innerHTML = '<div class="muted">'+esc(t('areaBulk_noBatches'))+'</div>'; return; }
      wrap.innerHTML = res.batches.map(function(b){
        var badgeClass = b.status==='deputy_approved' ? 'confirmed' : b.status==='deputy_rejected' ? 'rejected' : 'pending';
        return '<div class="row" style="justify-content:space-between;padding:8px 0;border-top:1px dashed var(--border-soft);">' +
          '<span>'+esc((b.createdAt||'').slice(0,16).replace('T',' '))+' · <strong>'+money(b.breakdown.netCashOwed)+'</strong></span>' +
          '<span class="badge '+badgeClass+'">'+esc(t('batch_'+b.status))+'</span>' +
        '</div>' + (b.status==='deputy_rejected' && b.rejectionNote ? '<div class="msg err" style="margin-top:4px;">'+esc(t('areaBulk_rejectionNote'))+': '+esc(b.rejectionNote)+'</div>' : '');
      }).join('');
    });
  }
  loadAreaBulkHistory();
}

// ---------------- deputy operations manager: area batch approvals ----------------
// New screen, not folded into Handoffs, for the same reason the backend
// doesn't reuse confirm/dispute for this step: the Deputy is approving
// *data*, not confirming a *cash amount received* — handoffItem is built
// entirely around the latter shape. breakdownGrid/handoffDetailRows are
// reused as-is below since they only need a plain breakdown/perLocation
// object, with no handoff-specific assumptions. See CLAUDE.md.
function renderDeputyReview(body){
  body.innerHTML = '<div class="card">'+esc(t('loading'))+'</div>';
  api('listAreaBulkBatches', { status: 'pending_deputy' }).then(function(res){
    body.innerHTML = '';
    if (!res.ok){ body.innerHTML = '<div class="msg err">'+esc(errMsg_(res))+'</div>'; return; }

    var header = el('<div class="card"><h2>'+esc(t('deputy_title'))+'</h2><div class="muted" style="font-size:12.5px;">'+esc(t('deputy_hint'))+'</div></div>');
    body.appendChild(header);

    if (!res.batches.length){
      body.appendChild(el('<div class="card"><div class="muted">'+esc(t('deputy_noPending'))+'</div></div>'));

    }

    res.batches.forEach(function(b){
      var card = el('<div class="card">' +
        '<div class="row" style="justify-content:space-between;flex-wrap:wrap;">' +
          '<div><strong>'+esc(clusterName(b.clusterId))+'</strong> · '+esc(t('deputy_uploadedBy'))+': '+esc(userName(b.uploadedBy))+'</div>' +
          '<div class="muted">'+esc((b.createdAt||'').slice(0,16).replace('T',' '))+'</div>' +
        '</div>' +
        '<div style="font-size:22px;font-weight:800;margin-top:6px;">'+money(b.breakdown.netCashOwed)+'</div>' +
        breakdownGrid(b.breakdown) +
        handoffDetailRows(b) +
        '<div class="row" style="gap:10px;margin-top:12px;">' +
          '<button class="btn" id="dApprove-'+b.id+'">'+esc(t('deputy_approve'))+'</button>' +
          '<button class="btn secondary" id="dReject-'+b.id+'">'+esc(t('deputy_reject'))+'</button>' +
        '</div>' +
        '<div id="dMsg-'+b.id+'"></div>' +
      '</div>');
      body.appendChild(card);

      qs('#dApprove-'+b.id, card).addEventListener('click', function(){
        api('deputyApproveBatch', { id: b.id }).then(function(res2){
          if (!res2.ok){ qs('#dMsg-'+b.id, card).innerHTML = '<div class="msg err">'+esc(errMsg_(res2))+'</div>'; return; }
          toast('deputy_approved_toast', 'ok');

        api('deputyRejectBatch', { id: b.id, note: note }).then(function(res2){
          if (!res2.ok){ qs('#dMsg-'+b.id, card).innerHTML = '<div class="msg err">'+esc(errMsg_(res2))+'</div>'; return; }
          toast('deputy_rejected_toast', 'ok');
          renderDeputyReview(body);
        });
      });
    });
  });
}

// Reconstructs a chronological who/when timeline directly from the
// handoff's own timestamp fields — every state change already stamps who
// did it and when onto the record itself, so no separate audit-log fetch
// is needed to show it per-transaction.
function handoffAuditTrail_(h){
  var events = [];
  function add(at, key, actorId, extra){ if (at) events.push({ at:at, key:key, actorId:actorId, extra:extra }); }
  add(h.createdAt, 'audit_created', h.fromUserId);
  if (h.staleEscalatedAt) add(h.staleEscalatedAt, 'audit_staleEscalated', null);
  if (h.disputedAt) add(h.disputedAt, 'audit_disputed', h.toUserId, h.disputeNote);
  // A dispute resolved as "confirm" sets both confirmedAt and resolvedAt at
  // the same moment — show only the resolution event then, since it's the
  // more complete/accurate one (carries the resolver and note too).
  if (h.resolvedAt) add(h.resolvedAt, 'audit_resolved', h.resolvedBy, h.resolutionNote);
  else if (h.confirmedAt) add(h.confirmedAt, 'audit_confirmed', h.confirmedBy);
  if (h.secondApprovedAt) add(h.secondApprovedAt, 'audit_secondApproved', h.secondApprovedBy);
  events.sort(function(a,b){ return new Date(a.at) - new Date(b.at); });
  if (!events.length) return '';
  return events.map(function(e){
    return '<div class="row" style="justify-content:space-between;font-size:12px;padding:3px 0;border-top:1px dashed var(--border-soft);">' +
      '<span>'+esc(t(e.key))+(e.actorId?' — '+esc(userName(e.actorId)):'')+(e.extra?' («'+esc(e.extra)+'»)':'')+'</span>' +
      '<span class="muted">'+esc(String(e.at).slice(0,16).replace('T',' '))+'</span></div>';
  }).join('');
}

function handoffItem(h, showConfirm, showResolve){
  // The receiving step is exactly where "what am I actually confirming?"
  // matters most — default the breakdown open there instead of behind an
  // extra click, and collapsed elsewhere to keep history lists scannable.
  var isReceivingStep = showConfirm && h.status === 'pending';
  var div = el('<div class="list-item">' +
    '<div class="top">' +
      '<div><strong>'+esc(t('kind_'+h.kind))+'</strong> ' + statusBadge(h.status) + '</div>' +
      '<div class="amount">'+money(h.amount)+'</div>' +
    '</div>' +
    '<div class="muted">'+esc(t('handoff_from'))+': '+esc(userName(h.fromUserId))+' · '+esc(t('handoff_to'))+': '+esc(h.toUserId?userName(h.toUserId):t('entity_bank'))+' · '+esc((h.createdAt||'').slice(0,16).replace('T',' '))+'</div>' +
    (h.disputeNote ? '<div class="muted">📝 '+esc(h.disputeNote)+'</div>' : '') +
    varianceLine(h) +
    (h.requiresSecondApproval ? '<div class="msg '+(h.secondApprovedBy?'ok':'err')+'" style="margin-top:8px;">'+esc(t(h.secondApprovedBy?'handoff_secondApproved':'handoff_needsSecondApproval'))+'</div>' : '') +
    (h.breakdown ? (
      '<button type="button" class="details-toggle" id="hBrkToggle">'+esc(t(isReceivingStep ? 'handoff_hideBreakdown' : 'handoff_showBreakdown'))+'</button>' +
      '<div id="hBrkBody"'+(isReceivingStep?'':' hidden')+'>' + breakdownGrid(h.breakdown) + handoffDetailRows(h) + '</div>'
    ) : '') +
    ('<button type="button" class="details-toggle" id="hAuditToggle">'+esc(t('audit_showTrail'))+'</button>' +
      '<div id="hAuditBody" hidden>' + handoffAuditTrail_(h) + '</div>') +
    '<div class="actions" id="hActions"></div>' +
  '</div>');

  var auditToggle = qs('#hAuditToggle', div), auditBody = qs('#hAuditBody', div);
  auditToggle.addEventListener('click', function(){
    auditBody.hidden = !auditBody.hidden;
    auditToggle.textContent = t(auditBody.hidden ? 'audit_showTrail' : 'audit_hideTrail');
  });

  if (h.breakdown) {
    var toggle = qs('#hBrkToggle', div), brkBody = qs('#hBrkBody', div);
    toggle.addEventListener('click', function(){
      brkBody.hidden = !brkBody.hidden;
      toggle.textContent = t(brkBody.hidden ? 'handoff_showBreakdown' : 'handoff_hideBreakdown');
    });
  }

  var actions = qs('#hActions', div);
  if (showConfirm && h.status==='pending'){
    var recv = el('<div class="field"><label>'+esc(t('handoff_receivedAmount'))+'</label>' +
      '<input id="hRecvAmt" type="text" inputmode="decimal" value="'+esc(money(h.amount))+'"></div>');
    actions.parentNode.insertBefore(recv, actions);
    var cb = el('<button class="btn">'+esc(t('handoff_confirm'))+'</button>');
    cb.addEventListener('click', function(){
      var recvInput = qs('#hRecvAmt', div);
      var raw = String(recvInput.value || '').replace(/,/g, '').trim();
      var receivedAmount = raw === '' ? h.amount : Number(raw);
      api('confirmHandoff',{id:h.id, receivedAmount:receivedAmount}).then(function(res){
        if (res.ok && res.handoff && res.handoff.shortfall != null) { toast('handoff_shortfallAccepted', 'ok'); return; }
        render();
      });
    });
    var db = el('<button class="btn danger">'+esc(t('handoff_dispute'))+'</button>');
    db.addEventListener('click', function(){
      var note = prompt(t('handoff_disputeNote'))||'';
      api('disputeHandoff',{id:h.id, note:note}).then(function(){ render(); });
    });
    actions.appendChild(cb); actions.appendChild(db);
  }
  if (showResolve && h.status==='disputed'){
    var rc = el('<button class="btn">'+esc(t('handoff_resolveConfirm'))+'</button>');
    rc.addEventListener('click', function(){ api('resolveDispute',{id:h.id, resolution:'confirm'}).then(function(){ render(); }); });
    var rr = el('<button class="btn danger">'+esc(t('handoff_resolveReject'))+'</button>');
    rr.addEventListener('click', function(){ api('resolveDispute',{id:h.id, resolution:'reject'}).then(function(){ render(); }); });
    actions.appendChild(rc); actions.appendChild(rr);
  }
  if (h.requiresSecondApproval && !h.secondApprovedBy && (state.user.role==='admin' || state.user.role==='finance')){
    var ackBtn = el('<button class="btn secondary">'+esc(t('handoff_acknowledgeSecond'))+'</button>');
    ackBtn.addEventListener('click', function(){ api('acknowledgeSecondApproval',{id:h.id}).then(function(){ render(); }); });
    actions.appendChild(ackBtn);
  }
  return div;
}

function renderHandoffs(body){
  body.innerHTML = '<div class="card">'+esc(t('loading'))+'</div>';
  var role = state.user.role;

  api('listHandoffs', {}).then(function(res){
    if(!res.ok){ body.innerHTML='<div class="msg err">'+esc(errMsg_(res))+'</div>'; return; }
    body.innerHTML = '';

    // action card: create outgoing handoff / record deposit
    if (role==='driver' || role==='admin'){
      var myCars = (state.meta.cars||[]).filter(function(c){ return role==='admin' || c.driverUserId===state.user.id; });
      if (myCars.length){
        var crc = el('<div class="card"><h2>'+esc(t('handoff_createCar'))+'</h2>' +
          '<div class="field"><select id="hCar">'+myCars.map(function(c){return '<option value="'+c.id+'">'+esc(c.label)+'</option>';}).join('')+'</select></div>' +
          '<button class="btn" id="hCreateCar">'+esc(t('handoff_createCar'))+'</button><div id="hCarMsg"></div></div>');
        body.appendChild(crc);
        qs('#hCreateCar', crc).addEventListener('click', function(){
          var carId = qs('#hCar',crc).value;
          api('createHandoff', {kind:'car_to_location', carId: carId}).then(function(res2){

    if (role==='collector' || role==='admin'){

          '</div>' +

          '<input id="hSlipFile" type="file" accept="image/*" hidden>' +

        '</div>' +
        '<button class="btn" id="hDeposit">'+esc(t('handoff_deposit'))+'</button><div id="hDepMsg"></div></div>');
      body.appendChild(dc);

      var pickedFile = null;
      var preview = qs('#hSlipPreview', dc);
      function onPicked(input){
        return function(){
          var f = input.files && input.files[0];
          if (!f) return;
          pickedFile = f;
          var reader = new FileReader();
          reader.onload = function(){ preview.src = reader.result; preview.hidden = false; };
          reader.readAsDataURL(f);
        };
      }
      qs('#hSlipCameraBtn', dc).addEventListener('click', function(){ qs('#hSlipCamera', dc).click(); });
      qs('#hSlipFileBtn', dc).addEventListener('click', function(){ qs('#hSlipFile', dc).click(); });
      qs('#hSlipCamera', dc).addEventListener('change', onPicked(qs('#hSlipCamera', dc)));
      qs('#hSlipFile', dc).addEventListener('change', onPicked(qs('#hSlipFile', dc)));

      qs('#hDeposit', dc).addEventListener('click', function(){
        var bankRef = qs('#hBankRef', dc).value;
        function submit(fileData){
          var payload = { bankReference: bankRef };
          if (fileData) { payload.fileBase64 = fileData.base64; payload.fileName = fileData.name; payload.fileMime = fileData.mime; }
          api('recordDeposit', payload).then(function(res2){
            qs('#hDepMsg',dc).innerHTML = res2.ok ? '<div class="msg ok">'+esc(t('ok_saved'))+'</div>' : '<div class="msg err">'+esc(errMsg_(res2))+'</div>';
            if(res2.ok) render();

        if (pickedFile){
          var reader = new FileReader();
          reader.onload = function(){
            var base64 = reader.result.split(',')[1];
            submit({ base64: base64, name: pickedFile.name, mime: pickedFile.type });
          };
          reader.readAsDataURL(pickedFile);
        } else {
          submit(null);

      });

    // lists

    // real, tested backend capability (actionConfirmHandoff_/
    // actionDisputeHandoff_ relax the toUserId check for admin only, see
    // CLAUDE.md "conflict of interest"). Restricting this list to
    // toUserId===me for everyone, admin included, would leave that
    // capability with no way to actually reach it, so admin sees every
    // pending handoff here, not just their own.
    var pending = res.handoffs.filter(function(h){ return h.status==='pending' && (h.toUserId===state.user.id || role==='admin'); });
    var disputed = res.handoffs.filter(function(h){ return h.status==='disputed'; });
    var history = res.handoffs.filter(function(h){ return pending.indexOf(h)<0; });
    setNotifCount(pending.length + ((role==='admin'||role==='finance') ? disputed.length : 0));

    if (pending.length){
      var pc = el('<div class="card"><h2>'+esc(t('handoff_pending'))+'</h2><div id="pList"></div></div>');

    var hc = el('<div class="card"><h2>'+esc(t('nav_handoffs'))+'</h2><div id="hList"></div></div>');
    body.appendChild(hc);
    var hl = qs('#hList', hc);

    history.slice(0,40).forEach(function(h){ hl.appendChild(handoffItem(h, false, false)); });
  });
}
