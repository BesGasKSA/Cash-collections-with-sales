}
// Same as toast(), but takes an already-resolved string instead of an
// i18n key — for errMsg_() output, which is itself already translated
// (and may include a raw, untranslated server error code as a fallback).
function toastRaw_(text, type){
  state.msg = { text: text, type: type||'err' };
  render();
  setTimeout(function(){ state.msg=null; var m=qs('#msgBox'); if(m) m.remove(); }, 4000);
}

// A bare "something went wrong" swallowed exactly which action failed and
// why — every server-side action returns a specific error CODE (forbidden,
// not_found, conflict_of_interest, ...), and this surfaces the real one.
// Known codes get a clear, specific translated message; an unrecognized
// code still shows the generic message but with the raw code appended in
// parentheses, so the real reason is never fully hidden even for a code
// this table hasn't been taught yet.
var ERROR_KEYS_ = {
  already_acknowledged:'err_alreadyAcknowledged', auth_required:'err_authRequired', bad_request:'err_badRequest',
  conflict_of_interest:'err_conflictOfInterest', deposit_not_eligible:'err_depositNotEligible', email_exists:'err_emailExists',
  forbidden:'err_forbidden', has_children:'admin_hasChildren', invalid_input:'err_invalidInput', invalid_kind:'err_invalidKind',
  invalid_resolution:'err_invalidResolution', invalid_status:'err_invalidStatus', invalid_type:'err_invalidType',
  line_already_matched:'err_lineAlreadyMatched', missing_action:'err_missingAction', missing_email:'err_missingEmail',
  no_cluster_manager:'err_noClusterManager', no_collector:'err_noCollector', no_entries:'err_noEntries',
  no_held_cash:'err_noHeldCash', no_store_manager:'err_noStoreManager', delivery_without_sale:'err_deliveryWithoutSale', not_disputed:'err_notDisputed', not_flagged:'err_notFlagged', not_found:'err_notFound',
  not_pending:'err_notPending', nothing_owed:'err_nothingOwed', too_many_rows:'err_tooManyRows',
  feature_disabled:'err_featureDisabled', invalid_rows:'err_invalidRows',
  invalid_income_item:'err_invalidIncomeItem', invalid_expense_item:'err_invalidExpenseItem', reason_required:'err_reasonRequired',
  customer_required:'err_customerRequired', user_in_other_area:'err_userInOtherArea',
  deposit_needs_reference:'err_depositNeedsReference', deposit_exceeds_cash:'err_depositExceedsCash',
  confirm_required:'err_confirmRequired',
  manager_required:'err_managerRequired', collector_required:'err_collectorRequired',
  driver_required:'err_driverRequired', holder_required:'err_holderRequired', wrong_role:'err_wrongRole',
  invite_pending:'err_invitePending', invite_invalid:'err_inviteInvalid', invite_used:'err_inviteUsed', invite_expired:'err_inviteExpired',
  already_accepted:'err_alreadyAccepted', user_inactive:'err_userInactive',
  unknown_action:'err_unknownAction', weak_password:'err_weakPassword', wrong_current_password:'err_wrongCurrentPassword',
  network:'err_network'
};
function errMsg_(res){
  var code = res && res.error;
  if (!code) return t('err_generic');
  var key = ERROR_KEYS_[code];
  if (key) return t(key);

// User + reference data kept locally so reopening the app draws the shell
// instantly instead of waiting on whoami + listMeta before showing anything.
function saveSession_(){
  try {
    if (state.user) localStorage.setItem('bgc_user', JSON.stringify(state.user));
    if (state.meta) localStorage.setItem('bgc_meta', JSON.stringify(state.meta));
  } catch (e) {}
}
function restoreSession_(){
  try {
    var u = localStorage.getItem('bgc_user'), m = localStorage.getItem('bgc_meta');
    if (!u || !m) return false;
    state.user = JSON.parse(u);
    state.meta = JSON.parse(m);
    return true;
  } catch (e) { return false; }
}
// Quietly re-check the session and reference data after an instant restore.
function refreshSessionInBackground_(){
  api('bootstrap', {}, { silent: true }).then(function(res){
    if (res.error === 'auth_required') { logout(); return; }
    if (!res.ok) return;
    var metaChanged = JSON.stringify(stripToken_(res.meta || {})) !== JSON.stringify(stripToken_(state.meta || {}));
    var userChanged = JSON.stringify(res.user) !== JSON.stringify(state.user);
    state.user = res.user;
    if (res.meta && res.meta.ok) state.meta = res.meta;
    saveSession_();
    if (res.user.mustChangePw || res.user.active === false || userChanged) { render(); return; }
    // Reference data (names, locations, products) changed: redraw only if
    // the user isn't mid-form, same rule as apiCached.
    var body = qs('#screenBody');
    if (metaChanged && !(body && body.dataset.dirty === '1')) render();
  });
}

// Local wall-clock "yyyy-mm-dd hh:mm" (Gregorian, Latin digits) from an ISO
// timestamp; the raw ISO string is UTC, three hours off for Riyadh.
function fmtStamp_(iso){
  if (!iso) return '';
  var d = new Date(iso); if (isNaN(d)) return String(iso);
  function p(n){ return (n < 10 ? '0' : '') + n; }
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function relTime_(iso){
  if (!iso) return '';
  var diff = Date.now() - new Date(iso).getTime();
  if (diff < 0) return t('rel_in').replace('{n}', Math.ceil(-diff / 86400000));
  var m = Math.floor(diff / 60000);
  if (m < 1) return t('rel_now');
  if (m < 60) return t('rel_min').replace('{n}', m);
  var h = Math.floor(m / 60);
  if (h < 24) return t('rel_hour').replace('{n}', h);
  return t('rel_day').replace('{n}', Math.floor(h / 24));
}

// Raw-timestamp convention (slice+replace 'T') matches every other
// timestamp display in this app (handoff_created, audit log, risk items) —
// unambiguous and locale-independent, unlike a "today's date" banner line
// which is meant to read naturally, so that one goes through Intl instead.
// Seconds-precision (slice to 19 chars, not 16) since this is a one-line
// security-style "last login" notice, not a list of records where trailing
// seconds would just be noise.
function lastLoginLabel_(){
  var v = localStorage.getItem('bgc_lastLogin');
  return v ? String(v).slice(0,19).replace('T',' ') : null;
}
// Returns {gregorian, hijri} as two separate strings — shown as two separate
// lines in the welcome card, not joined, since Hijri and Gregorian are two
// distinct calendars a reader may want to read independently.
function todayDatesLines_(){
  var now = new Date();
  var loc = langLocale_();
  var greg;
  // -u-ca-gregory: ar-SA otherwise defaults to the Islamic (Umm al-Qura)
  // calendar on many devices, which would make this "Gregorian" line Hijri.
  // -nu-latn keeps the digits Latin, matching every amount in the app.
  try { greg = new Intl.DateTimeFormat(loc + '-u-ca-gregory-nu-latn', { weekday:'long', day:'numeric', month:'long', year:'numeric' }).format(now); }
  catch(e) {
    try { greg = new Intl.DateTimeFormat(loc, { weekday:'long', day:'numeric', month:'long', year:'numeric', calendar:'gregory', numberingSystem:'latn' }).format(now); }
    catch(e2) { greg = now.toDateString(); }
  }
  var hijri = '';
  try {
    var parts = new Intl.DateTimeFormat(loc + '-u-ca-islamic-umalqura-nu-latn', { day:'numeric', month:'long', year:'numeric' }).formatToParts(now);
    var d = {}; parts.forEach(function(p){ d[p.type] = p.value; });
    if (d.day && d.month && d.year) hijri = d.day + ' ' + d.month + ' ' + d.year + ' ' + t('home_hijriSuffix');
  } catch(e) { /* Hijri calendar not supported in this environment — Gregorian alone is still useful */ }
  return { gregorian: greg, hijri: hijri };
}

// Adds a show/hide eye inside every password field under root. The cursor
// position is kept when switching, so people can check what they typed and
// carry on without re-clicking into the field.
function wirePasswordEye_(root){
  qsa('input[type="password"]', root).forEach(function(input){
    if (input.dataset.eye) return;
    input.dataset.eye = '1';
    var wrap = document.createElement('span');
    wrap.className = 'pw-wrap';
    input.parentNode.insertBefore(wrap, input);
    wrap.appendChild(input);
    var btn = el('<button type="button" class="pw-eye" aria-pressed="false"></button>');
    function paint(shown){
      btn.innerHTML = icon_(shown ? 'eyeOff' : 'eye');
      btn.setAttribute('aria-label', t(shown ? 'ui_hidePassword' : 'ui_showPassword'));
      btn.title = t(shown ? 'ui_hidePassword' : 'ui_showPassword');
      btn.setAttribute('aria-pressed', shown ? 'true' : 'false');
      btn.classList.toggle('on', shown);
    }
    paint(false);
    // keep focus in the field when the eye is pressed
    btn.addEventListener('mousedown', function(e){ e.preventDefault(); });
    btn.addEventListener('click', function(){
      var shown = input.type === 'password';
      var start = input.selectionStart, end = input.selectionEnd;
      input.type = shown ? 'text' : 'password';
      paint(shown);
      btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop');
      if (document.activeElement === input && start != null) { try { input.setSelectionRange(start, end); } catch (e) {} }
    });
    wrap.appendChild(btn);
  });
}

// Ripple from the touch point on anything tappable. One delegated listener,
// so screens don't each have to opt in.
var RIPPLE_TARGETS = '.tile.click, .st-row.click, .rrow.click, .tx, button.btn, .bt-scroll button, .sb-item, .cx-more, .hero .cta button, .tl-step.click';
document.addEventListener('pointerdown', function(e){
  if (e.button > 0) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var host = e.target.closest && e.target.closest(RIPPLE_TARGETS);
  if (!host) return;
  var r = host.getBoundingClientRect();
  var size = Math.max(r.width, r.height) * 2.2;
  var dot = document.createElement('span');
  dot.className = 'rpl';
  dot.style.width = dot.style.height = size + 'px';
  dot.style.left = (e.clientX - r.left - size / 2) + 'px';
  dot.style.top = (e.clientY - r.top - size / 2) + 'px';
  if (getComputedStyle(host).position === 'static') host.style.position = 'relative';
  if (getComputedStyle(host).overflow !== 'hidden') host.style.overflow = 'hidden';
  host.appendChild(dot);
  setTimeout(function(){ if (dot.parentNode) dot.parentNode.removeChild(dot); }, 650);
}, { passive: true });

}

  var order = navItemsForRole_().map(function(it){ return it[0]; });
  state.navDir = order.indexOf(screen) >= order.indexOf(state.screen) ? 1 : -1;
  try { if (navigator.vibrate && window.matchMedia('(max-width:700px)').matches) navigator.vibrate(8); } catch (e) {}

// Bottom tab bar for phones. Holds every screen the role can reach; if they
// don't all fit it scrolls sideways, and round arrow buttons pop in while the
// bar is being touched/scrolled, then fade away after a short idle period.
function buildBottomSwitcher_(navItems, badge, justNavigated){
  var bar = el('<div class="bt" role="navigation">' +
    '<span class="bt-edge s"></span><span class="bt-edge e"></span>' +
    '<button type="button" class="bt-arrow s" aria-label="'+esc(t('ui_back'))+'">'+icon_('back')+'</button>' +
    '<button type="button" class="bt-arrow e" aria-label="'+esc(t('ui_more'))+'">'+icon_('chevron')+'</button>' +
    '<div class="bt-scroll"></div>' +
  '</div>');
  var scroller = qs('.bt-scroll', bar);
  var ind = el('<span class="bt-ind" aria-hidden="true"></span>');
  scroller.appendChild(ind);
  navItems.forEach(function(it){
    var b = el('<button type="button"'+(state.screen===it[0]?' class="active" aria-current="page"':'')+'>' +
      icon_(it[0]) + '<span>'+esc(t(it[1]))+'</span>' + (it[0]==='handoffs' ? badge : '') + '</button>');
    b.addEventListener('click', function(){ goScreen_(it[0]); });
    scroller.appendChild(b);
  });

  var hideTimer = null;
  function isRtl(){ return document.documentElement.dir === 'rtl'; }
  // scrollLeft is negative (0 → -max) in RTL in modern browsers.
  function pos(){ return Math.abs(scroller.scrollLeft); }
  function update(){
    var max = scroller.scrollWidth - scroller.clientWidth;
    // "Fits" means every label is readable, not merely that the row does not
    // overflow: squeezing ten screens into a phone width ellipsises every one
    // of them. Below ~76px per tab the bar scrolls instead.
    var count = qsa('button', scroller).length;
    var fits = max <= 2 && (!count || scroller.clientWidth / count >= 76);
    bar.classList.toggle('fits', fits);
    bar.classList.toggle('can-s', !fits && pos() > 4);
    bar.classList.toggle('can-e', !fits && pos() < max - 4);
  }
  function wake(){
    update();
    if (bar.classList.contains('fits')) return;
    bar.classList.add('active');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function(){ bar.classList.remove('active'); }, 2600);
  }
  function step(dir){
    var amount = Math.max(160, scroller.clientWidth * 0.7) * dir * (isRtl() ? -1 : 1);
    scroller.scrollBy({ left: amount, behavior: 'smooth' });
    wake();
  }
  qs('.bt-arrow.s', bar).addEventListener('click', function(e){ e.stopPropagation(); step(-1); });
  qs('.bt-arrow.e', bar).addEventListener('click', function(e){ e.stopPropagation(); step(1); });
  scroller.addEventListener('scroll', function(){ update(); wake(); }, { passive: true });
  bar.addEventListener('touchstart', wake, { passive: true });
  bar.addEventListener('pointerdown', wake);
  window.addEventListener('resize', update);
  // Keep the current screen's tab in view, then show the arrows once briefly
  // so people notice there's more than fits on screen.
  requestAnimationFrame(function(){
    var active = qs('button.active', scroller);
    if (active && active.scrollIntoView) active.scrollIntoView({ inline: 'center', block: 'nearest' });
    // The whole bar is rebuilt on every screen change, so start the pill
    // where it was last time and let it slide to the new tab.
    if (active) {
      var target = { x: active.offsetLeft, w: active.offsetWidth };
      var from = (justNavigated && state.btInd) ? state.btInd : target;
      ind.style.transition = 'none';
      ind.style.width = from.w + 'px';
      ind.style.transform = 'translateX(' + from.x + 'px)';
      void ind.offsetWidth;
      ind.style.transition = '';
      ind.style.width = target.w + 'px';
      ind.style.transform = 'translateX(' + target.x + 'px)';
      state.btInd = target;
      if (justNavigated) active.classList.add('bounce');
    }
    update();
    if (!bar.classList.contains('fits') && window.matchMedia('(max-width:700px)').matches) wake();
  });
  return bar;
}

function byId(list, id){ for(var i=0;i<(list||[]).length;i++) if(list[i].id===id) return list[i]; return null; }
function userName(id){ var u = byId(state.meta && state.meta.users, id); return u ? u.name : '—'; }
function locationName(id){ var l = byId(state.meta && state.meta.locations, id); return l ? (l.city+' — '+l.name) : '—'; }
function clusterName(id){ var c = byId(state.meta && state.meta.clusters, id); return c ? c.name : '—'; }

// A location only ever has stores and cars as direct children (per the
// entity hierarchy) — a POS machine is a grandchild, owned by one of those.
// Showing it as a bare label alongside store/car names with no context made
// it look like a disconnected third category floating next to Store/Car
// rather than a device attached to one of them, so every option built from
// these says which store/car (and location) it actually belongs to. Shared
// by the daily-entry form and the sales report filters — anywhere someone
// picks a specific store/car/POS.
function posOwnerName_(p){
  var meta = state.meta || {};
  if (p.ownerType === 'store') { var s = byId(meta.stores, p.ownerId); return s ? s.name : '—'; }
  var c = byId(meta.cars, p.ownerId); return c ? c.label : '—';
}
function posOwnerLocationId_(p){
  var meta = state.meta || {};
  if (p.ownerType === 'store') { var s = byId(meta.stores, p.ownerId); return s && s.locationId; }
  var c = byId(meta.cars, p.ownerId); return c && c.locationId;
}
function sourceOptionLabel_(type, x){
  if (type === 'store') return (x.name || x.id) + ' — ' + locationName(x.locationId);
  if (type === 'car') return (x.label || x.id) + ' — ' + locationName(x.locationId);
  if (type === 'pos') return (x.label || x.id) + ' — ' + posOwnerName_(x) + ' — ' + locationName(posOwnerLocationId_(x));
  return x.label || x.name || x.id;
}

// ---------------- home ----------------
// =====================================================================
// Design components + drill-down
// Every number on the dashboard/home opens the transactions behind it in a
// side drawer (bottom sheet on phones), and every transaction opens its own
// document: the daily entry, the handoff, the bank deposit (with its slip)
// or the uploaded batch it came from. All of it is built from data the
// screen already loaded, so opening a breakdown needs no extra round trip.
// =====================================================================

// ---------- shared data for drill-downs ----------
var DRILL = { entries: null, handoffs: null, hById: null, eById: null };
function drillSetData_(entries, handoffs){
  if (entries) { DRILL.entries = entries; DRILL.eById = null; }
  if (handoffs) { DRILL.handoffs = handoffs; DRILL.hById = null; }
}
function drillHandoff_(id){
  if (!DRILL.handoffs || !id) return null;
  if (!DRILL.hById) { DRILL.hById = {}; DRILL.handoffs.forEach(function(h){ DRILL.hById[h.id] = h; }); }
  return DRILL.hById[id] || null;
}
function drillEntry_(id){
  if (!DRILL.entries || !id) return null;
  if (!DRILL.eById) { DRILL.eById = {}; DRILL.entries.forEach(function(e){ DRILL.eById[e.id] = e; }); }
  return DRILL.eById[id] || null;
}
// Loads whichever list a document view needs but the current screen didn't
// fetch (e.g. the Handoffs screen has handoffs but not entries). Role-scoped
// on the server, so anything a user can't see simply isn't found.
function drillEnsure_(needEntries, needHandoffs, cb){
  var waits = [];
  if (needEntries && !DRILL.entries) {
    var isWide = ['admin','finance','accountant','operations_manager','deputy_operations_manager','cluster_manager'].indexOf(state.user.role) >= 0;
    waits.push((isWide ? api('getSalesReport', {}, { silent: true }) : api('listEntries', {}, { silent: true })).then(function(r){
      if (r.ok) drillSetData_(r.entries || [], null); else drillSetData_([], null);
    }));
  }
  if (needHandoffs && !DRILL.handoffs) {
    waits.push(api('listHandoffs', {}, { silent: true }).then(function(r){ drillSetData_(null, r.ok ? (r.handoffs || []) : []); }));
  }
  if (!waits.length) { cb(); return; }
  Promise.all(waits).then(cb);
}

function vatRateClient_(){
  var c = state.meta && state.meta.config;
  return (c && typeof c.vatRate === 'number') ? c.vatRate : 0.15;
}
// Per-entry amounts, mirroring computeNet_ on the server exactly so a
// breakdown's rows always add up to the number that was clicked.
function entryAmt_(e){
  var cash = Number(e.cashSales||0), pos = Number(e.posSales||0), credit = Number(e.creditSales||0);
  var delivery = Number(e.deliveryFeeBankAmount||0);
  var other = Number(e.otherCash||0), expense = Number(e.expenseAmount||0), banked = Number(e.directDepositAmount||0);
  var v = vatRateClient_();
  var vat = delivery > 0 ? delivery / (1 + v) * v : 0;
  return { cash: cash, pos: pos, credit: credit, gross: cash + pos + credit, delivery: delivery, vat: vat,
    deliveryBase: delivery - vat, other: other, expense: expense, banked: banked,
    net: cash + other - delivery + vat - expense - banked - credit };
}
// name of a master-data item (collection / expense), for search text
function itemName_(listName, id){
  if (!id) return '';
  var x = byId((state.meta||{})[listName], id);
  return x ? (x.name || '') : '';
}
function sourceName_(e){
  var m = state.meta || {};
  var list = e.sourceType === 'store' ? m.stores : e.sourceType === 'car' ? m.cars : m.pos;
  var x = byId(list, e.sourceId);
  return x ? (x.name || x.label || '') : '';
}
function productName_(id){
  var p = byId(state.meta && state.meta.products, id);
  return p ? p.name : '';
}
function fmtDateTime_(iso){ return iso ? String(iso).slice(0,16).replace('T',' ') : ''; }

// Where an entry's cash is now: still with whoever entered it, inside a
// handoff somewhere up the chain, waiting on a bulk-batch approval, or
// already deposited at the bank.
function entryChain_(e){
  var steps = [], seen = {};
  var id = e.consumedBy;
  while (id && !seen[id] && steps.length < 12) {
    seen[id] = 1;
    var h = drillHandoff_(id);
    if (!h) break;
    steps.push(h);
    id = h.consumedBy;
  }
  return steps;
}
function entryStatus_(e){
  if (e.voided) return { cls: 'bad', label: t('batch_deputy_rejected') };
  if (!e.consumedBy) return { cls: 'warn', label: t('st_notHandedOff') };
  if (e.batchId && e.consumedBy === e.batchId) return { cls: 'info', label: t('batch_pending_deputy') };
  var chain = entryChain_(e);
  var last = chain[chain.length - 1];
  if (last && last.kind === 'deposit') return { cls: 'ok', label: t('st_deposited') };
  return { cls: 'info', label: t('st_inHandoff') };
}
function handoffStatusChip_(h){
  var cls = h.status === 'confirmed' || h.status === 'completed' ? 'ok' : h.status === 'pending' ? 'warn' : h.status === 'disputed' || h.status === 'rejected' ? 'bad' : '';
  var label = h.kind === 'deposit' ? t('st_deposited') : t('handoff_' + h.status);
  return '<span class="chip '+cls+'">'+esc(label)+'</span>';
}

// ---------- drawer (stacked views, with back) ----------
var DRAWER = { root: null, stack: [] };
function drawerEls_(){
  if (DRAWER.root && DRAWER.root.dr.isConnected) return DRAWER.root;
  var scrim = el('<div class="dr-scrim" hidden></div>');
  var dr = el('<section class="dr" role="dialog" aria-modal="true" hidden>' +
    '<div class="dr-h">' +
      '<button type="button" class="icon-btn back" hidden aria-label="'+esc(t('ui_back'))+'">'+icon_('back')+'</button>' +
      '<div class="ttl"><b></b><span></span></div>' +
      '<button type="button" class="icon-btn close" aria-label="'+esc(t('ui_close'))+'">'+icon_('close')+'</button>' +
    '</div>' +
    '<div class="dr-crumbs"></div>' +
    '<div class="dr-b"></div>' +
    '<div class="dr-f" hidden></div>' +
  '</section>');
  document.body.appendChild(scrim);
  document.body.appendChild(dr);
  scrim.addEventListener('click', drawerClose_);
  qs('.close', dr).addEventListener('click', drawerClose_);
  // Phones: drag the sheet's header down to dismiss it. Past ~110px or a
  // quick flick closes; anything less springs back.
  (function(){
    var head = qs('.dr-h', dr), startY = 0, dy = 0, t0 = 0, dragging = false;
    head.addEventListener('pointerdown', function(e){
      if (!window.matchMedia('(max-width:700px)').matches || e.target.closest('button')) return;
      dragging = true; startY = e.clientY; dy = 0; t0 = Date.now();
      dr.classList.add('dragging');
      try { head.setPointerCapture(e.pointerId); } catch (err) {}
    });
    head.addEventListener('pointermove', function(e){
      if (!dragging) return;
      dy = Math.max(0, e.clientY - startY);
      dr.style.transform = 'translateY(' + dy + 'px)';
    });
    function end(){
      if (!dragging) return;
      dragging = false;
      dr.classList.remove('dragging');
      var velocity = dy / Math.max(1, Date.now() - t0);
      dr.style.transform = '';
      if (dy > 110 || (dy > 30 && velocity > 0.6)) drawerClose_();
    }
    head.addEventListener('pointerup', end);
    head.addEventListener('pointercancel', end);
  })();
  qs('.back', dr).addEventListener('click', drawerBack_);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && DRAWER.stack.length) drawerClose_(); });
  DRAWER.root = { scrim: scrim, dr: dr };
  return DRAWER.root;
}
function drawerPaint_(){
  var r = drawerEls_(), dr = r.dr;
  var view = DRAWER.stack[DRAWER.stack.length - 1];
  if (!view) return;
  qs('.ttl b', dr).textContent = view.title || '';
  qs('.ttl span', dr).textContent = view.sub || '';
  qs('.back', dr).hidden = DRAWER.stack.length < 2;
  qs('.dr-crumbs', dr).innerHTML = DRAWER.stack.length > 1 ? DRAWER.stack.map(function(v){ return '<span>'+esc(v.crumb || v.title)+'</span>'; }).join('') : '';
  var body = qs('.dr-b', dr), foot = qs('.dr-f', dr);
  body.innerHTML = ''; foot.innerHTML = ''; foot.hidden = true;
  body.scrollTop = 0;
  view.render(body, foot);
}
function drawerOpen_(view){
  var r = drawerEls_();
  DRAWER.stack = [view];
  r.scrim.hidden = false; r.dr.hidden = false;
  drawerPaint_();
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(function(){ r.scrim.classList.add('open'); r.dr.classList.add('open'); });
}
function drawerPush_(view){ DRAWER.stack.push(view); drawerPaint_(); }
function drawerBack_(){ if (DRAWER.stack.length > 1) { DRAWER.stack.pop(); drawerPaint_(); } }
function drawerClose_(){
  if (!DRAWER.root) return;
  var r = DRAWER.root;
  DRAWER.stack = [];
  r.scrim.classList.remove('open'); r.dr.classList.remove('open');
  document.body.style.overflow = '';
  setTimeout(function(){ if (!DRAWER.stack.length) { r.scrim.hidden = true; r.dr.hidden = true; } }, 300);
}

// ---------- building blocks ----------
function tile_(o){
  // o: {label, value, icon, color, foot, onClick}
  var node = el('<div class="tile'+(o.onClick?' click':'')+'" style="--c:'+(o.color||'var(--green)')+'"'+(o.onClick?' role="button" tabindex="0"':'')+'>' +
    '<div class="top"><span class="ic">'+icon_(o.icon||'layers')+'</span>' + (o.onClick ? '<span class="go">'+icon_('chevron')+'</span>' : '') + '</div>' +
    '<div><div class="lb">'+esc(o.label)+'</div><div class="vl">'+esc(o.value)+'</div></div>' +
    (o.foot ? '<div class="ft">'+o.foot+'</div>' : '') +
  '</div>');
  if (o.onClick) {
    node.addEventListener('click', o.onClick);
    node.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); o.onClick(); } });
  }
  return node;
}
function tiles_(list){
  var g = el('<div class="tiles"></div>');
  list.forEach(function(o){ if (o) g.appendChild(tile_(o)); });
  return g;
}
// A financial statement: a headline figure, an optional composition bar and
// labelled rows. Deductions carry a "deducted" tag instead of a minus sign.
function statement_(o){
  // o: {title, badge, value, caption, color, bar:[{v,color,label}], rows:[{label, hint, amount, kind:'add'|'deduct'|'sub'|'final', color, onClick}]}
  var total = (o.bar||[]).reduce(function(s,b){ return s + Math.max(0, b.v); }, 0);
  var node = el('<div class="statement" style="--c:'+(o.color||'var(--green)')+'">' +
    '<div class="st-head">' +
      '<div class="k">'+esc(o.title)+(o.badge?'<span class="badge2">'+esc(o.badge)+'</span>':'')+'</div>' +
      '<div class="v num">'+esc(money(o.value))+'<small>'+esc(t('ui_sar'))+'</small></div>' +
      (o.caption ? '<div class="cap">'+esc(o.caption)+'</div>' : '') +
      (o.bar && total > 0 ? '<div class="st-bar">' + o.bar.map(function(b){ return '<span style="width:'+(Math.max(0,b.v)/total*100)+'%;background:'+b.color+'" title="'+esc(b.label)+'"></span>'; }).join('') + '</div>' +
        '<div class="st-legend">' + o.bar.map(function(b){ return '<span><i style="background:'+b.color+'"></i>'+esc(b.label)+' <bdi dir="ltr">'+Math.round(Math.max(0,b.v)/total*100)+'%</bdi></span>'; }).join('') + '</div>' : '') +
    '</div>' +
    '<div class="st-rows"></div>' +
  '</div>');
  var rows = qs('.st-rows', node);
  o.rows.forEach(function(r){
    var tag = r.kind === 'deduct' ? '<span class="tag deduct">'+esc(t('tag_deduct'))+'</span>' : '';
    var row = el('<div class="st-row '+(r.kind||'')+(r.onClick?' click':'')+'" style="--c:'+(r.color||'var(--green)')+'"'+(r.onClick?' role="button" tabindex="0"':'')+'>' +
      '<span class="sw"></span>' +
      '<span class="lb">'+esc(r.label)+tag+(r.hint?'<span class="hint">'+esc(r.hint)+'</span>':'')+'</span>' +
      '<span class="amt num">'+esc(money(r.amount))+'</span>' +
      '<span class="chev">'+(r.onClick?icon_('chevron'):'')+'</span>' +
    '</div>');
    if (r.onClick) {
      row.addEventListener('click', r.onClick);
      row.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); r.onClick(); } });
    }
    rows.appendChild(row);
  });
  return node;
}
// Card with a title whose body collapses to a preview; big data sections
// start collapsed.
function panel_(title, opts){
  opts = opts || {};
  var node = el('<div class="card'+(opts.noCollapse?' no-collapse':'')+'"><h2>'+esc(title)+'</h2></div>');
  if (opts.hint) node.appendChild(el('<div class="muted" style="font-size:12px;margin:-6px 0 10px;">'+esc(opts.hint)+'</div>'));
  return node;
}
// Rows with a label, sub-line, proportional bar and amount; clickable.
function barRows_(rows, opts){
  // rows: [{label, sub, amount, color, icon, mark, onClick}]
  opts = opts || {};
  var max = Math.max.apply(null, rows.map(function(r){ return Math.abs(r.amount); }).concat([1]));
  var wrap = el('<div class="rows"></div>');
  if (!rows.length) { wrap.appendChild(el('<div class="muted" style="padding:6px 2px;">'+esc(t('dash_noData'))+'</div>')); return wrap; }
  rows.forEach(function(r){
    var mark = r.icon ? icon_(r.icon) : esc(r.mark || initials_(r.label));
    var row = el('<div class="rrow'+(r.onClick?' click':'')+'" style="--c:'+(r.color||'var(--green)')+'"'+(r.onClick?' role="button" tabindex="0"':'')+'>' +
      '<span class="mk">'+mark+'</span>' +
      '<div style="min-width:0;"><div class="t">'+esc(r.label)+'</div>' + (r.sub ? '<div class="s">'+esc(r.sub)+'</div>' : '') +
        (opts.bars === false ? '' : '<div class="bar"><span style="width:'+(Math.abs(r.amount)/max*100)+'%;background:'+(r.color||'var(--green)')+'"></span></div>') +
      '</div>' +
      '<span class="a num">'+esc(opts.count ? r.amount : money(r.amount))+'</span>' +
      '<span class="chev">'+(r.onClick?icon_('chevron'):'')+'</span>' +
    '</div>');
    if (r.onClick) row.addEventListener('click', r.onClick);
    wrap.appendChild(row);
  });
  return wrap;
}

// ---------- transaction list view ----------
function entryRowData_(e, amount){
  return {
    kind: 'entry', ref: e, amount: amount,
    title: locationName(e.locationId) + (sourceName_(e) ? ' — ' + sourceName_(e) : ''),
    sub: [e.date, t('entry_source_' + e.sourceType), productName_(e.productId), userName(e.enteredBy)].filter(Boolean).join(' · '),
    icon: e.sourceType === 'car' ? 'truck' : e.sourceType === 'pos' ? 'card' : 'cash',
    color: 'var(--c-cash)',
    status: entryStatus_(e)
  };
}
function handoffRowData_(h, amount){
  return {
    kind: 'handoff', ref: h, amount: amount == null ? Number(h.amount||0) : amount,
    title: t('kind_' + h.kind),
    sub: [userName(h.fromUserId) + ' ← ' + (h.toUserId ? userName(h.toUserId) : t('entity_bank')), fmtDateTime_(h.createdAt)].join(' · '),
    icon: h.kind === 'deposit' ? 'bank' : 'handoffs',
    color: h.kind === 'deposit' ? 'var(--c-deposit)' : 'var(--c-hold)',
    statusHtml: handoffStatusChip_(h)
  };
}
// o: {title, sub, items:[rowData or {group:'label'}], headline, note}
function txListView_(o){
  return {
    title: o.title, sub: o.sub, crumb: o.title,
    render: function(body, foot){
      var items = o.items || [];
      var search = el('<div class="dr-search">'+icon_('search')+'<input type="search" placeholder="'+esc(t('ui_search'))+'" aria-label="'+esc(t('ui_search'))+'"></div>');
      var count = el('<div class="dr-count"></div>');
      var listWrap = el('<div></div>');
      if (o.note) body.appendChild(el('<div class="msg" style="background:var(--warn-bg);color:var(--warn);margin-bottom:12px;">'+esc(o.note)+'</div>'));
      body.appendChild(search); body.appendChild(count); body.appendChild(listWrap);
      var input = qs('input', search);
      var limit = 150;
      function draw(){
        var q = input.value.trim().toLowerCase();
        var shown = items.filter(function(it){
          if (it.group) return !q;
          return !q || (it.title + ' ' + it.sub + ' ' + money(it.amount)).toLowerCase().indexOf(q) >= 0;
        });
        var real = shown.filter(function(it){ return !it.group; });
        count.textContent = t('ui_txCount').replace('{n}', real.length);
        var sum = real.reduce(function(s, it){ return s + Number(it.amount||0); }, 0);
        foot.hidden = false;
        foot.innerHTML = '<span class="lb">'+esc(t('ui_totalListed'))+'</span><span class="v num">'+esc(money(sum))+'</span>';
        listWrap.innerHTML = '';
        if (!real.length) { listWrap.appendChild(el('<div class="doc-sec muted" style="text-align:center;padding:26px;">'+esc(t('ui_noTx'))+'</div>')); return; }
        var list = el('<div class="tx-list"></div>');
        var n = 0;
        shown.some(function(it){
          if (it.group) { list.appendChild(el('<div class="tx-group">'+esc(it.group)+'</div>')); return false; }
          if (n >= limit) return true;
          n++;
          var row = el('<div class="tx" role="button" tabindex="0" style="--c:'+it.color+'">' +
            '<span class="mk">'+icon_(it.icon)+'</span>' +
            '<div style="min-width:0;"><div class="t">'+esc(it.title)+'</div><div class="s">'+esc(it.sub)+'</div></div>' +
            '<div class="r"><div class="a num">'+esc(money(it.amount))+'</div><div class="st">' +
              (it.statusHtml || (it.status ? '<span class="chip '+it.status.cls+'">'+esc(it.status.label)+'</span>' : '')) + '</div></div>' +
          '</div>');
          function open(){ drawerPush_(it.kind === 'entry' ? entryDocView_(it.ref) : handoffDocView_(it.ref)); }
          row.addEventListener('click', open);
          row.addEventListener('keydown', function(e){ if (e.key === 'Enter') open(); });
          list.appendChild(row);
          return false;
        });
        if (real.length > limit) {
          var more = el('<button type="button" class="more-btn">'+esc(t('ui_showMore'))+' ('+(real.length - limit)+')</button>');
          more.addEventListener('click', function(){ limit += 150; draw(); });
          list.appendChild(more);
        }
        listWrap.appendChild(list);
      }
      input.addEventListener('input', draw);
      draw();
    }
  };
}
function openTxList_(o){ drawerOpen_(txListView_(o)); }

// ---------- documents ----------
function kv_(pairs){
  return '<dl class="kv">' + pairs.filter(function(p){ return p[1] !== '' && p[1] != null; }).map(function(p){
    return '<dt>'+esc(p[0])+'</dt><dd>'+(p[2] ? p[1] : esc(p[1]))+'</dd>';
  }).join('') + '</dl>';
}
function entryDocView_(e){
  return {
    title: t('doc_entry'), sub: e.date + ' · ' + locationName(e.locationId), crumb: t('doc_entry'),
    render: function(body){
      drillEnsure_(false, true, function(){
        if (!body.isConnected) return;
        body.innerHTML = '';
        var a = entryAmt_(e), st = entryStatus_(e);
        body.appendChild(el('<div class="doc-hero">' +
          '<div class="ty">'+icon_('doc')+esc(t('doc_entry'))+' <span class="chip">'+esc(st.label)+'</span></div>' +
          '<div class="am num">'+esc(money(a.gross))+' <small style="font-size:13px;opacity:.75;">'+esc(t('ui_sar'))+'</small></div>' +
          '<div class="meta">'+esc(t('dash_grossSales'))+' · '+esc(e.date)+'</div></div>'));

        var qtyLine = (e.qty ? e.qty : '') + (e.unitPrice ? ' × ' + money(e.unitPrice) : '');
        body.appendChild(el('<div class="doc-sec"><h3>'+icon_('doc')+esc(t('doc_details'))+'</h3>' + kv_([
          [t('doc_date'), e.date],
          [t('doc_location'), locationName(e.locationId)],
          [t('doc_source'), t('entry_source_' + e.sourceType) + (sourceName_(e) ? ' — ' + sourceName_(e) : '')],
          [t('doc_product'), productName_(e.productId)],
          [t('doc_qty'), qtyLine ? '<bdi dir="ltr">'+esc(qtyLine)+'</bdi>' : '', true],
          [t('doc_cylOut'), e.cylindersOut ? String(e.cylindersOut) : ''],
          [t('doc_cylIn'), e.cylindersIn ? String(e.cylindersIn) : ''],
          [t('doc_enteredBy'), userName(e.enteredBy)],
          [t('doc_createdAt'), fmtDateTime_(e.createdAt || e.updatedAt)],
          [t('doc_note'), e.note || '']
        ]) + '</div>'));

        var rows = [];
        if (a.cash) rows.push({ label: t('dash_cashSales'), amount: a.cash, color: 'var(--c-cash)' });
        if (a.pos) rows.push({ label: t('report_pos'), amount: a.pos, color: 'var(--c-pos)', hint: t('handoff_posNote') });
        if (a.credit) rows.push({ label: t('report_credit'), amount: a.credit, color: 'var(--c-credit)', hint: t('handoff_creditNote') });
        if (a.delivery) {
          rows.push({ label: t('report_delivery'), amount: a.delivery, color: 'var(--c-delivery)' });
          rows.push({ label: t('dash_deliveryFeeBeforeVat'), amount: a.deliveryBase, kind: 'deduct', color: 'var(--c-danger)' });
          rows.push({ label: t('report_vat'), amount: a.vat, color: 'var(--c-vat)' });
        }
        rows.push({ label: t('report_net'), amount: a.net, kind: 'final' });
        var amtSec = el('<div class="doc-sec" style="padding:8px 6px;"><h3 style="padding:6px 10px 0;">'+icon_('cash')+esc(t('doc_amounts'))+'</h3></div>');
        var stNode = statement_({ title: '', value: 0, rows: rows });
        amtSec.appendChild(qs('.st-rows', stNode));
        body.appendChild(amtSec);

        // cash journey
        var chain = entryChain_(e);
        var tl = el('<div class="doc-sec"><h3>'+icon_('trend')+esc(t('doc_journey'))+'</h3><div class="tl"></div></div>');
        var tlBox = qs('.tl', tl);
        tlBox.appendChild(el('<div class="tl-step" style="--c:var(--c-cash)"><div class="h">'+esc(t('journey_entered'))+' '+esc(userName(e.enteredBy))+'</div><div class="d">'+esc(fmtDateTime_(e.createdAt || e.updatedAt) || e.date)+'</div></div>'));
        if (e.batchId) {
          var bStep = el('<div class="tl-step click" style="--c:var(--c-pos)"><div class="h">'+esc(t('doc_sourceBatch'))+' <span class="chip info">'+esc(t('doc_openBatch'))+'</span></div><div class="d">'+esc(e.batchId.slice(0,8))+'</div></div>');
          bStep.addEventListener('click', function(){ drawerPush_(batchDocView_(e.batchId)); });
          tlBox.appendChild(bStep);
        }
        chain.forEach(function(h){
          var step = el('<div class="tl-step click" style="--c:'+(h.kind==='deposit'?'var(--c-deposit)':'var(--c-hold)')+'">' +
            '<div class="h">'+esc(t('kind_' + h.kind))+' '+handoffStatusChip_(h)+'</div>' +
            '<div class="d">'+esc(userName(h.fromUserId))+' ← '+esc(h.toUserId ? userName(h.toUserId) : t('entity_bank'))+' · '+esc(fmtDateTime_(h.confirmedAt || h.createdAt))+' · '+esc(money(h.amount))+'</div></div>');
          step.addEventListener('click', function(){ drawerPush_(handoffDocView_(h)); });
          tlBox.appendChild(step);
        });
        var last = chain[chain.length - 1];
        if (!last || last.kind !== 'deposit') {
          tlBox.appendChild(el('<div class="tl-step todo"><div class="h">'+esc(t('st_awaitingDeposit'))+'</div></div>'));
        }
        body.appendChild(tl);
      });
    }
  };
}

function handoffDocView_(h){
  var isDeposit = h.kind === 'deposit';
  return {
    title: isDeposit ? t('doc_deposit') : t('doc_handoff'), sub: t('kind_' + h.kind) + ' · ' + fmtDateTime_(h.createdAt), crumb: t('kind_' + h.kind),
    render: function(body){
      var needEntries = (h.sourceEntryIds || []).length > 0;
      drillEnsure_(needEntries, true, function(){
        if (!body.isConnected) return;
        body.innerHTML = '';
        body.appendChild(el('<div class="doc-hero">' +
          '<div class="ty">'+icon_(isDeposit?'bank':'handoffs')+esc(t('kind_' + h.kind))+' '+handoffStatusChip_(h)+'</div>' +
          '<div class="am num">'+esc(money(h.amount))+' <small style="font-size:13px;opacity:.75;">'+esc(t('ui_sar'))+'</small></div>' +
          '<div class="meta">'+esc(userName(h.fromUserId))+' ← '+esc(h.toUserId ? userName(h.toUserId) : t('entity_bank'))+'</div></div>'));

        body.appendChild(el('<div class="doc-sec"><h3>'+icon_('doc')+esc(t('doc_details'))+'</h3>' + kv_([
          [t('doc_from'), userName(h.fromUserId)],
          [t('doc_to'), h.toUserId ? userName(h.toUserId) : t('entity_bank')],
          [t('doc_status'), handoffStatusChip_(h), true],
          [t('doc_createdAt'), fmtDateTime_(h.createdAt)],
          [t('doc_confirmedAt'), fmtDateTime_(h.confirmedAt)],
          [t('doc_bankRef'), h.bankReference || ''],
          [t('handoff_disputeNote'), h.disputeNote || ''],
          [t('doc_resolutionNote'), h.resolutionNote || '']
        ]) + '</div>'));

        if (h.originalAmount != null) {
          var sf = el('<div class="doc-sec" style="padding:8px 6px;"><h3 style="padding:6px 10px 0;color:var(--c-danger);">'+icon_('alert')+esc(t('handoff_shortfall'))+'</h3></div>');
          sf.appendChild(qs('.st-rows', statement_({ title:'', value:0, rows: [
            { label: t('handoff_originalAmount'), amount: h.originalAmount, color: 'var(--c-hold)' },
            { label: t('handoff_shortfall'), amount: Math.abs(Number(h.shortfall||0)), kind: 'deduct', color: 'var(--c-danger)' },
            { label: t('handoff_receivedAmount'), amount: h.amount, kind: 'final' }
          ]})));
          body.appendChild(sf);
        }

        if (h.breakdown) {
          var b = h.breakdown;
          var brk = el('<div class="doc-sec" style="padding:8px 6px;"><h3 style="padding:6px 10px 0;">'+icon_('cash')+esc(t('doc_amounts'))+'</h3></div>');
          var rows = [];
          if (b.storeCash) rows.push({ label: t('report_storeCash'), amount: b.storeCash, color: 'var(--c-cash)' });
          if (b.carCash) rows.push({ label: t('report_carCash'), amount: b.carCash, color: 'var(--c-cash)' });
          if (b.posCash) rows.push({ label: t('report_posCash'), amount: b.posCash, color: 'var(--c-cash)' });
          if (b.deliveryFee) {
            rows.push({ label: t('dash_deliveryFeeBeforeVat'), amount: b.deliveryFee - (b.vatOnDelivery||0), kind: 'deduct', color: 'var(--c-danger)' });
          }
          rows.push({ label: t('report_net'), amount: b.netCashOwed, kind: 'final' });
          brk.appendChild(qs('.st-rows', statement_({ title:'', value:0, rows: rows })));
          if (b.posSales) brk.appendChild(el('<div class="muted" style="font-size:11.5px;padding:0 10px 6px;">'+esc(t('report_pos'))+': '+esc(money(b.posSales))+' — '+esc(t('handoff_posNote'))+'</div>'));
          if (b.creditSales) brk.appendChild(el('<div class="muted" style="font-size:11.5px;padding:0 10px 6px;">'+esc(t('report_credit'))+': '+esc(money(b.creditSales))+' — '+esc(t('handoff_creditNote'))+'</div>'));
          body.appendChild(brk);
        }

        if (h.attachmentId) {
          var slip = el('<div class="doc-sec"><h3>'+icon_('doc')+esc(t('doc_attachment'))+'</h3><div class="slip">'+esc(t('loading'))+'</div></div>');
          body.appendChild(slip);
          api('getFile', { fileId: h.attachmentId }, { silent: true }).then(function(r){
            var box = qs('.slip', slip);
            if (!r.ok) { box.innerHTML = '<div class="muted">'+esc(t(r.error === 'forbidden' ? 'doc_attachmentForbidden' : 'doc_noAttachment'))+'</div>'; return; }
            // Drive doesn't always report an image type, so also recognise images by
            // file name and by the first bytes of the file itself.
            var b64 = String(r.base64||'');
            var sniff = /^iVBOR/.test(b64) ? 'image/png' : /^\/9j\//.test(b64) ? 'image/jpeg' : /^R0lGOD/.test(b64) ? 'image/gif' : /^UklGR/.test(b64) ? 'image/webp' : '';
            var mime = String(r.mime||'').indexOf('image/') === 0 ? r.mime : (sniff || (/\.(png|jpe?g|gif|webp)$/i.test(r.name||'') ? 'image/png' : (r.mime || 'application/octet-stream')));
            var src = 'data:' + mime + ';base64,' + b64;
            if (mime.indexOf('image/') === 0) box.innerHTML = '<img class="slip-img" alt="'+esc(t('doc_attachment'))+'" src="'+src+'">';
            else box.innerHTML = '<a class="btn secondary" target="_blank" rel="noopener" href="'+src+'">'+esc(r.name || t('doc_attachment'))+'</a>';
          });
        } else if (isDeposit) {
          body.appendChild(el('<div class="doc-sec"><h3>'+icon_('doc')+esc(t('doc_attachment'))+'</h3><div class="muted">'+esc(t('doc_noAttachment'))+'</div></div>'));
        }

        // journey: where this came from and where it went next
        var tl = el('<div class="doc-sec"><h3>'+icon_('trend')+esc(t('doc_journey'))+'</h3><div class="tl"></div></div>');
        var tlBox = qs('.tl', tl);
        (h.sourceHandoffIds || []).forEach(function(id){
          var p = drillHandoff_(id);
          if (!p) return;
          var s = el('<div class="tl-step click" style="--c:var(--c-hold)"><div class="h">'+esc(t('kind_' + p.kind))+' '+handoffStatusChip_(p)+'</div><div class="d">'+esc(userName(p.fromUserId))+' · '+esc(money(p.amount))+'</div></div>');
          s.addEventListener('click', function(){ drawerPush_(handoffDocView_(p)); });
          tlBox.appendChild(s);
        });
        tlBox.appendChild(el('<div class="tl-step" style="--c:var(--green)"><div class="h"><b>'+esc(t('kind_' + h.kind))+'</b> '+handoffStatusChip_(h)+'</div><div class="d">'+esc(fmtDateTime_(h.confirmedAt || h.createdAt))+'</div></div>'));
        var next = drillHandoff_(h.consumedBy);
        if (next) {
          var ns = el('<div class="tl-step click" style="--c:'+(next.kind==='deposit'?'var(--c-deposit)':'var(--c-hold)')+'"><div class="h">'+esc(t('doc_nextStep'))+': '+esc(t('kind_' + next.kind))+' '+handoffStatusChip_(next)+'</div><div class="d">'+esc(fmtDateTime_(next.createdAt))+'</div></div>');
          ns.addEventListener('click', function(){ drawerPush_(handoffDocView_(next)); });
          tlBox.appendChild(ns);
        } else if (!isDeposit) {
          tlBox.appendChild(el('<div class="tl-step todo"><div class="h">'+esc(t('st_awaitingDeposit'))+'</div></div>'));
        }
        body.appendChild(tl);

        // included transactions
        var inc = [];
        (h.sourceEntryIds || []).forEach(function(id){ var e = drillEntry_(id); if (e) inc.push(entryRowData_(e, entryAmt_(e).net)); });
        if (inc.length) {
          var incSec = el('<div class="doc-sec"><h3>'+icon_('layers')+esc(t('doc_included'))+' ('+inc.length+')</h3></div>');
          var list = el('<div class="tx-list"></div>');
          inc.forEach(function(it){
            var row = el('<div class="tx" role="button" tabindex="0" style="--c:'+it.color+'"><span class="mk">'+icon_(it.icon)+'</span>' +
              '<div style="min-width:0;"><div class="t">'+esc(it.title)+'</div><div class="s">'+esc(it.sub)+'</div></div>' +
              '<div class="r"><div class="a num">'+esc(money(it.amount))+'</div></div></div>');
            row.addEventListener('click', function(){ drawerPush_(entryDocView_(it.ref)); });
            list.appendChild(row);
          });
          incSec.appendChild(list);
          body.appendChild(incSec);
        } else if ((h.sourceEntryIds || []).length) {
          body.appendChild(el('<div class="doc-sec"><h3>'+icon_('layers')+esc(t('doc_included'))+'</h3><div class="muted">'+esc(t('doc_notAvailable'))+'</div></div>'));
        }

        var trail = handoffAuditTrail_(h);
        if (trail) body.appendChild(el('<div class="doc-sec"><h3>'+icon_('clock')+esc(t('audit_showTrail'))+'</h3>'+trail+'</div>'));
      });
    }
  };
}

function batchDocView_(batchId){
  return {
    title: t('doc_sourceBatch'), sub: batchId.slice(0,8), crumb: t('doc_sourceBatch'),
    render: function(body){
      body.innerHTML = '<div class="doc-sec muted">'+esc(t('loading'))+'</div>';
      api('areaBulkBatchDetail', { id: batchId }, { silent: true }).then(function(r){
        if (!body.isConnected) return;
        body.innerHTML = '';
        if (!r.ok) { body.appendChild(el('<div class="doc-sec muted">'+esc(t('doc_notAvailable'))+'</div>')); return; }
        var b = r.batch;
        body.appendChild(el('<div class="doc-hero"><div class="ty">'+icon_('areaBulk')+esc(t('doc_sourceBatch'))+' <span class="chip">'+esc(t('batch_' + b.status))+'</span></div>' +
          '<div class="am num">'+esc(money(b.breakdown && b.breakdown.netCashOwed))+'</div>' +
          '<div class="meta">'+esc(clusterName(b.clusterId))+' · '+esc(userName(b.uploadedBy))+' · '+esc(fmtDateTime_(b.createdAt))+'</div></div>'));
        body.appendChild(el('<div class="doc-sec"><h3>'+icon_('box')+esc(t('areaBulk_showProductDetail'))+'</h3>'+productDetailTable_(r.byProduct)+'</div>'));
        if (b.rejectionNote) body.appendChild(el('<div class="doc-sec"><h3>'+esc(t('areaBulk_rejectionNote'))+'</h3><div>'+esc(b.rejectionNote)+'</div></div>'));
        drillEnsure_(true, false, function(){
          if (!body.isConnected) return;
          var entries = (DRILL.entries || []).filter(function(e){ return e.batchId === batchId; });
          if (!entries.length) return;
          var list = el('<div class="tx-list"></div>');
          entries.forEach(function(e){
            var it = entryRowData_(e, entryAmt_(e).gross);
            var row = el('<div class="tx" role="button" tabindex="0" style="--c:'+it.color+'"><span class="mk">'+icon_(it.icon)+'</span>' +
              '<div style="min-width:0;"><div class="t">'+esc(it.title)+'</div><div class="s">'+esc(it.sub)+'</div></div>' +
              '<div class="r"><div class="a num">'+esc(money(it.amount))+'</div></div></div>');
            row.addEventListener('click', function(){ drawerPush_(entryDocView_(e)); });
            list.appendChild(row);
          });
          var sec = el('<div class="doc-sec"><h3>'+icon_('layers')+esc(t('doc_included'))+' ('+entries.length+')</h3></div>');
          sec.appendChild(list);
          body.appendChild(sec);
        });
      });
    }
  };
}

// ---------- metric breakdowns ----------
// ctx: {entries, handoffs} — `key` names which figure was clicked.
function openMetric_(key, ctx, extra){
  extra = extra || {};
  var entries = ctx.entries || [];
  var handoffs = ctx.handoffs || [];
  drillSetData_(ctx.entries || null, ctx.handoffs || null);
  function ent(filterFn, amountKey){
    return entries.filter(filterFn).map(function(e){ return entryRowData_(e, entryAmt_(e)[amountKey]); })
      .sort(function(a,b){ return String(b.ref.date).localeCompare(String(a.ref.date)); });
  }
  function hof(filterFn){
    return handoffs.filter(filterFn).map(function(h){ return handoffRowData_(h); })
      .sort(function(a,b){ return String(b.ref.createdAt).localeCompare(String(a.ref.createdAt)); });
  }
  var defs = {
    cash:        function(){ return { title: t('dash_cashSales'), items: ent(function(e){ return entryAmt_(e).cash; }, 'cash') }; },
    pos:         function(){ return { title: t('report_pos'), items: ent(function(e){ return entryAmt_(e).pos; }, 'pos') }; },

// ---------- entrance: once real content lands, animate it and count numbers up ----------
function watchEntrance_(body){
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var done = false;
  var mo = new MutationObserver(function(){
    if (done || !qs('.tile, .statement, .hero, .card', body) || qs('.sk', body)) return;
    done = true; mo.disconnect();
    body.classList.add('fx-in');
    countUp_(body);
    setTimeout(function(){ body.classList.remove('fx-in'); }, 1600);
  });
  mo.observe(body, { childList: true, subtree: true });
}
function countUp_(root){
  qsa('.tile .vl, .st-head .v, .hero .cta .big', root).forEach(function(node){
    var tn = null;
    for (var i = 0; i < node.childNodes.length; i++) { if (node.childNodes[i].nodeType === 3 && /\d/.test(node.childNodes[i].nodeValue)) { tn = node.childNodes[i]; break; } }
    if (!tn) return;
    var raw = tn.nodeValue.trim();
    if (!/^-?[\d,]+(\.\d+)?$/.test(raw)) return;
    var target = Number(raw.replace(/,/g, ''));
    var decimals = raw.indexOf('.') >= 0 ? 2 : 0;
    var start = null, dur = 900;
    function frame(ts){
      if (!tn.isConnected) return;
      if (start === null) start = ts;
      var p = Math.min(1, (ts - start) / dur);
      var eased = 1 - Math.pow(1 - p, 3);
      var v = target * eased;
      tn.nodeValue = decimals ? money(v) : Math.round(v).toLocaleString('en-US');
      if (p < 1) requestAnimationFrame(frame); else tn.nodeValue = raw;
    }
    requestAnimationFrame(frame);
  });
}

// ---------- auto-collapse for big cards on every screen ----------
function watchCollapsibles_(root){
  var pending = false;
  function run(){ pending = false; enhanceCollapsibles_(root); }
  var mo = new MutationObserver(function(){ if (!pending) { pending = true; requestAnimationFrame(run); } });
  mo.observe(root, { childList: true, subtree: true });
  requestAnimationFrame(run);
}
function enhanceCollapsibles_(root){
  qsa('.card', root).forEach(function(card){
    if (card.dataset.cx) return;
    if (card.classList.contains('no-collapse') || card.classList.contains('welcome-card') || card.closest('.cx-body')) return;
    var head = card.firstElementChild;
    if (!head || head.tagName !== 'H2') return;
    // Never fold a form: typing into a half-hidden card is worse than scrolling.
    if (qs('input, select, textarea', card)) { card.dataset.cx = 'form'; return; }
    if (card.scrollHeight < 420) return; // may still grow; checked again on the next change
    card.dataset.cx = '1';
    var key = 'bgc_cx_' + state.screen + '_' + head.textContent.trim();
    var stored = null;
    try { stored = sessionStorage.getItem(key); } catch (e) {}
    var body = document.createElement('div');
    body.className = 'cx-body';
    while (head.nextSibling) body.appendChild(head.nextSibling);
    card.appendChild(body);
    card.classList.add('cx');
    head.classList.add('cx-head');
    head.setAttribute('role', 'button');
    head.setAttribute('tabindex', '0');
    head.insertAdjacentHTML('beforeend', '<span class="cx-meta"><span class="cx-lbl"></span><span class="cx-chev"><svg viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg></span></span>');
    var more = el('<button type="button" class="cx-more"></button>');
    card.appendChild(more);
    function set(collapsed){
      card.classList.toggle('collapsed', collapsed);
      head.setAttribute('aria-expanded', String(!collapsed));
      qs('.cx-lbl', head).textContent = t(collapsed ? 'ui_expand' : 'ui_collapse');
      more.textContent = t(collapsed ? 'ui_expand' : 'ui_collapse');
      try { sessionStorage.setItem(key, collapsed ? '1' : '0'); } catch (e) {}
    }
    head.addEventListener('click', function(){ set(!card.classList.contains('collapsed')); });
    head.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); set(!card.classList.contains('collapsed')); } });
    more.addEventListener('click', function(){ var c = !card.classList.contains('collapsed'); set(c); if (c) card.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); });
    set(stored ? stored === '1' : true);
  });
}

  var otherCash = Number(T.otherCash||0), expenses = Number(T.expenses||0);
  var totalToCollect = cashSales + otherCash - deliveryBase - expenses - T.creditSales;

  // at the source — so it is deducted here, once, and never also from

  var remaining = totalToCollect - deposited;

  g.appendChild(statement_({

      { label: t('dash_grossSales'), amount: gross, kind: 'final', color: 'var(--c-cash)', onClick: open('gross') }
    ]
  }));
  g.appendChild(statement_({
    title: t('dash_statementCollect'), value: remaining, color: 'var(--c-deposit)',
    caption: t('dash_remainingToDeposit'),
    bar: [
      { v: deposited, color: 'var(--c-deposit)', label: t('dash_deposited') },

     .concat(expenses ? [{ label: t('report_expenses'), amount: expenses, kind: 'deduct', color: 'var(--c-danger)', onClick: open('expenses') }] : [])
     .concat(T.creditSales ? [{ label: t('report_credit'), hint: t('dash_creditHint'), amount: T.creditSales, kind: 'deduct', color: 'var(--c-credit)', onClick: open('credit') }] : [])
     .concat([
      { label: t('dash_totalToCollect'), amount: totalToCollect, kind: 'sub', color: 'var(--green)', onClick: open('net') },
      { label: t('dash_deposited'), hint: Number(T.directDeposit||0) ? t('dash_includesBankedAtSource').replace('{n}', money(T.directDeposit)) : '', amount: deposited, kind: 'deduct', color: 'var(--c-deposit)', onClick: open('deposited') },
      { label: t('dash_remainingToDeposit'), amount: remaining, kind: 'final', color: 'var(--c-deposit)', onClick: open('remaining') }

  return { node: g, remaining: remaining, totalToCollect: totalToCollect, gross: gross, deposited: deposited };

// The chain around the signed-in person, from master data. Returns null when
// the role has no place in the branch hierarchy.
function myOrgPanel_(all){
  var meta = state.meta || {};
  var role = state.user.role, me = state.user.id;
  var clusters, branches;
  if (all){
    clusters = (meta.clusters||[]).slice();
    branches = (meta.locations||[]).slice();
  } else if (role === 'cluster_manager'){
    clusters = (meta.clusters||[]).filter(function(c){ return c.clusterManagerUserId === me; });
    var ids = clusters.map(function(c){ return c.id; });
    branches = (meta.locations||[]).filter(function(l){ return ids.indexOf(l.clusterId) >= 0; });
  } else if (role === 'store_manager'){
    var mine = (meta.stores||[]).filter(function(st){ return st.storeManagerUserId === me; }).map(function(st){ return st.locationId; });
    branches = (meta.locations||[]).filter(function(l){ return mine.indexOf(l.id) >= 0; });
    var cids = [];
    branches.forEach(function(l){ if (l.clusterId && cids.indexOf(l.clusterId) < 0) cids.push(l.clusterId); });
    clusters = (meta.clusters||[]).filter(function(c){ return cids.indexOf(c.id) >= 0; });
  } else return null;

  function person(id, roleKey){
    if (!id) return '<span class="org-p missing">'+icon_('alert')+'<span>'+esc(t('org_unassigned'))+'</span></span>';
    var nm = userName(id), u = byId(meta.users, id);
    var off = u && u.active === false;
    return '<span class="org-p'+(off?' missing':'')+'"><span class="org-av">'+esc(initials_(nm))+'</span><span class="org-pn"><b>'+esc(nm)+'</b>' +
      (roleKey || off ? '<i>'+esc(off ? t('org_disabled') : t(roleKey))+'</i>' : '') + '</span></span>';
  }
  function isOff_(id){ var u = byId(meta.users, id); return !!(u && u.active === false); }
  function branchCard(l){
    var stores = (meta.stores||[]).filter(function(st){ return st.locationId === l.id; });
    var cars = (meta.cars||[]).filter(function(c){ return c.locationId === l.id; });
    var storeIds = stores.map(function(st){ return st.id; }), carIds = cars.map(function(c){ return c.id; });
    var pos = (meta.pos||[]).filter(function(p){
      return (p.ownerType === 'store' && storeIds.indexOf(p.ownerId) >= 0) || (p.ownerType === 'car' && carIds.indexOf(p.ownerId) >= 0);
    });
    var managers = stores.length ? stores.map(function(st){ return person(st.storeManagerUserId, 'role_store_manager'); }).join('') : person(null);
    var gaps = stores.filter(function(st){ return !st.storeManagerUserId; }).length + (stores.length ? 0 : 1) +
      cars.filter(function(c){ return !c.driverUserId || isOff_(c.driverUserId); }).length + pos.filter(function(p){ return !p.assignedUserId || isOff_(p.assignedUserId); }).length +
      stores.filter(function(st){ return st.storeManagerUserId && isOff_(st.storeManagerUserId); }).length;
    function sub(iconName, labelKey, list, labelOf, holderOf){
      if (!list.length) return '';
      return '<div class="org-sub"><div class="org-sh">'+icon_(iconName)+'<span>'+esc(t(labelKey))+'</span><em class="num">'+list.length+'</em></div>' +
        '<ul>' + list.map(function(x){
          var h = holderOf(x);
          return '<li><span class="org-lb">'+esc(labelOf(x))+'</span>' +
            (h ? (function(){ var hu = byId(meta.users, h), hoff = hu && hu.active === false; return '<span class="org-hd'+(hoff?' missing':'')+'">'+esc(userName(h) + (hoff ? ' · ' + t('org_disabled') : ''))+'</span>'; })() : '<span class="org-hd missing">'+esc(t('org_unassigned'))+'</span>') + '</li>';
        }).join('') + '</ul></div>';
    }
    return '<article class="org-b'+(gaps?' has-gap':'')+'">' +
      '<div class="org-bh"><span class="org-bi">'+icon_('home')+'</span><div class="org-bt"><b>'+esc(l.name)+'</b><span>'+esc(l.city||'')+'</span></div>' +
        (gaps ? '<span class="org-flag">'+esc(t('org_gaps').replace('{n}', gaps))+'</span>' : '<span class="org-ok">'+icon_('check')+'</span>') + '</div>' +
      '<div class="org-mgr">'+managers+'</div>' +
      sub('truck', 'org_cars', cars, function(c){ return c.label; }, function(c){ return c.driverUserId; }) +
      sub('card', 'org_pos', pos, function(p){ return p.label; }, function(p){ return p.assignedUserId; }) +
    '</article>';
  }

  var node = el('<section class="org"></section>');
  if (!clusters.length && !branches.length){
    node.innerHTML = '<div class="org-empty">'+icon_('alert')+'<span>'+esc(t(role === 'cluster_manager' ? 'org_noArea' : 'org_noBranch'))+'</span></div>';
    return node;
  }
  var areaHtml = clusters.map(function(c){
    var inArea = branches.filter(function(l){ return l.clusterId === c.id; });
    return '<div class="org-area">' +
      '<div class="org-ah"><span class="org-ai">'+icon_('pin')+'</span><div class="org-at"><span>'+esc(t('org_area'))+'</span><b>'+esc(c.name)+'</b></div>' +
        '<div class="org-stats"><span><b class="num">'+inArea.length+'</b>'+esc(t('org_branches'))+'</span></div></div>' +
      '<div class="org-people">' +
        (all || role === 'store_manager' ? person(c.clusterManagerUserId, 'role_cluster_manager') : '') +
        person(c.collectorUserId, 'role_collector') +
      '</div>' +
      '<div class="org-grid">' + inArea.map(branchCard).join('') + '</div>' +
    '</div>';
  }).join('');
  // a branch whose area was never set still belongs on the map
  var orphan = branches.filter(function(l){ return !clusters.some(function(c){ return c.id === l.clusterId; }); });
  if (orphan.length) areaHtml += '<div class="org-area"><div class="org-grid">' + orphan.map(branchCard).join('') + '</div></div>';
  node.innerHTML = areaHtml;
  return node;
}

// ---------------- CSV import (daily entries) ----------------
// Minimal RFC4180-ish CSV parser — quoted fields, escaped quotes, CRLF/LF.
// No library: this is the only place in the app that needs one.
function parseCsv_(text){
  var rows = [], row = [], field = '', inQuotes = false;
  for (var i=0;i<text.length;i++){
    var c = text[i];
    if (inQuotes){
      if (c === '"'){
        if (text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; }
      } else field += c;
    } else if (c === '"'){
      inQuotes = true;
    } else if (c === ','){
      row.push(field); field = '';
    } else if (c === '\n' || c === '\r'){
      if (c === '\r' && text[i+1] === '\n') i++;
      row.push(field); field = '';
      if (row.length > 1 || row[0] !== '') rows.push(row);
      row = [];
    } else field += c;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function resolveSourceByName_(type, name){

}

// Cluster-scoped source resolution for the area-manager bulk upload —
// unlike resolveSourceByName_ (single-admin/whole-company scope, name alone
// is enough), two stores/cars in different locations of the same cluster
// could share a name, so resolution here always goes through the location
// first: (locationName, sourceType, sourceName) -> id, never name alone.
function resolveLocationByNameInCluster_(name, clusterId){

function resolveSourceByNameInCluster_(type, name, locationId){

  }
  return null;
}

  var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});

  a.href = url; a.download = 'entries_template.csv';

// Product-level template: one row = one product/service line (qty x unit
// price, routed to a single payment method), the same shape renderEntries'
// product mode already writes one daily_entries row per line — not one row
// per source per day like the old flat cashSales/deliveryFee/posSales/
// creditSales columns used to be. Plus a leading locationName column, needed
// here (and not on the single-location admin import) because this template
// spans every location in a whole cluster at once.
function downloadAreaBulkCsvTemplate_(clusterId){
  var meta = state.meta || {};
  var myLoc = (meta.locations||[]).filter(function(l){ return l.clusterId===clusterId; })[0];
  var sampleLocation = myLoc ? myLoc.name : 'Location name';
  var sampleStore = (meta.stores||[]).filter(function(s){ return !myLoc || s.locationId===myLoc.id; })[0];
  var sampleCar = (meta.cars||[]).filter(function(c){ return !myLoc || c.locationId===myLoc.id; })[0];
  var goodsProduct = (meta.products||[]).filter(function(p){ return p.type!=='services' && p.active!==false; })[0];
  // Delivery fees are a service, never cash — the sample line demonstrates

// The branches this person may enter data for: null means "no limit"
// (admin), otherwise a list of branch ids. An area manager gets every branch
// in the areas they manage; a branch manager gets their own branch.
function branchIdsForEntry_(){
  var meta = state.meta || {};
  var role = state.user.role;
  // Company-wide roles see everything — same list as the server's
  // COMPANY_WIDE_ROLES. Falling through to [] here emptied their report
  // pickers completely.
  if (['admin','finance','accountant','operations_manager','deputy_operations_manager'].indexOf(role) >= 0) return null;
  if (role === 'cluster_manager') {
    var myClusters = (meta.clusters||[]).filter(function(c){ return c.clusterManagerUserId === state.user.id; })
      .map(function(c){ return c.id; });
    return (meta.locations||[]).filter(function(l){ return myClusters.indexOf(l.clusterId) >= 0; })
      .map(function(l){ return l.id; });

  if (role === 'store_manager') {
    return (meta.stores||[]).filter(function(s){ return s.storeManagerUserId === state.user.id; })
      .map(function(s){ return s.locationId; });
  }
  return [];
}
