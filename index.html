  // accidentally booking a cylinder sale as a delivery fee or vice versa.
  function lineProductOptionsHtml_(payment){
    var list = payment === 'delivery' ? products.filter(function(p){ return p.type === 'services'; }) : products;
    return '<option value="">'+esc(t('entry_product_none'))+'</option>' +
      list.map(function(p){ return '<option value="'+p.id+'">'+esc(p.name)+'</option>'; }).join('');
  }
  function refreshLineProductOptions_(lineEl){
    var paySel = qs('.lnPayment', lineEl), prodSel = qs('.lnProduct', lineEl);
    var current = prodSel.value;
    prodSel.innerHTML = lineProductOptionsHtml_(paySel.value);
    if (list_hasOption_(prodSel, current)) prodSel.value = current; else recomputeLineCyl_(lineEl);
  }
  function list_hasOption_(sel, val){
    for (var i=0;i<sel.options.length;i++) if (sel.options[i].value===val) return true;
    return false;
  }
  function recomputeLineCyl_(lineEl){
    var show = !!qs('.lnProduct', lineEl).value;
    var wrap = qs('.lnCylWrap', lineEl);
    wrap.style.display = show ? '' : 'none';
    if (!show) { qs('.lnCylOut', lineEl).value = '0'; qs('.lnCylIn', lineEl).value = '0'; }
  }
  function recomputeLineSubtotal_(lineEl){
    var qty = numFromInput_(qs('.lnQty', lineEl));
    var price = numFromInput_(qs('.lnPrice', lineEl));
    qs('.lnSubtotal', lineEl).textContent = money(qty * price);
  }
  function recomputeTotals_(){
    var sums = { cash: 0, pos: 0 };
    qsa('.eLine', linesBody).forEach(function(lineEl){
      var qty = numFromInput_(qs('.lnQty', lineEl));
      var price = numFromInput_(qs('.lnPrice', lineEl));
      var payment = qs('.lnPayment', lineEl).value;
      if (sums.hasOwnProperty(payment)) sums[payment] += qty * price;
    });
    var counted = qsa('.eLine', linesBody).filter(function(l){
      return numFromInput_(qs('.lnQty', l)) > 0 && numFromInput_(qs('.lnPrice', l)) > 0;
    }).length;
    var linesTotal = sums.cash + sums.pos;
    var sumEl = qs('#eLinesSum', form);
    if (sumEl) sumEl.textContent = counted ? (t('entry_lineCount').replace('{n}', counted) + ' · ' + money(linesTotal)) : '';
    qs('#eCash', form).value = money(sums.cash);
    qs('#ePos', form).value = money(sums.pos);
    syncSalesTotal_();
    entryNetPreview_();
  }
  function addLine_(){
    lineSeq++;
    var lineEl = el(
      '<div class="card eLine" style="margin-bottom:10px;background:var(--bg-soft,#f7f5ef);" data-seq="'+lineSeq+'">' +
        '<div class="grid">' +
          '<div class="field"><label>'+esc(t('entry_lineProduct'))+'</label><select class="lnProduct">'+lineProductOptionsHtml_('cash')+'</select></div>' +
          '<div class="field"><label>'+esc(t('entry_qty'))+'</label><input class="lnQty" type="text" inputmode="decimal" value="0"></div>' +
          '<div class="field"><label>'+esc(t('entry_unitPrice'))+'</label><input class="lnPrice" type="text" inputmode="decimal" value="0"></div>' +
          '<div class="field"><label>'+esc(t('entry_paymentMethod'))+'</label><select class="lnPayment">'+paymentOptionsHtml_()+'</select></div>' +
        '</div>' +
        '<div class="grid lnCylWrap" style="display:none;">' +
          '<div class="field"><label>'+esc(t('entry_cylindersOut'))+'</label><input class="lnCylOut" type="text" inputmode="numeric" value="0"></div>' +
          '<div class="field"><label>'+esc(t('entry_cylindersIn'))+'</label><input class="lnCylIn" type="text" inputmode="numeric" value="0"></div>' +
        '</div>' +
        '<div class="row" style="justify-content:space-between;align-items:center;margin-top:6px;">' +
          '<div><span class="muted">'+esc(t('entry_lineSubtotal'))+':</span> <strong class="lnSubtotal">0.00</strong></div>' +
          '<button type="button" class="btn-icon lnRemove" title="'+esc(t('entry_removeLine'))+'"><svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg></button>' +
        '</div>' +
      '</div>'
    );
    linesBody.appendChild(lineEl);
    wireCommaInput_(qs('.lnQty', lineEl), true);
    wireCommaInput_(qs('.lnPrice', lineEl), true);
    wireCommaInput_(qs('.lnCylOut', lineEl), false);
    wireCommaInput_(qs('.lnCylIn', lineEl), false);
    // The price comes from the product master data. A product whose price is
    // fixed fills the box read-only, so a branch cannot sell at its own price;
    // otherwise the stored price is only a starting point.
    function applyProductPrice_(){
      var prod = byId(meta.products, qs('.lnProduct', lineEl).value);
      var priceInput = qs('.lnPrice', lineEl);
      var locked = !!(prod && prod.priceLocked && Number(prod.unitPrice) > 0);
      if (prod && Number(prod.unitPrice) > 0 && (locked || !numFromInput_(priceInput))) {
        priceInput.value = String(prod.unitPrice);
      }
      priceInput.readOnly = locked;
      priceInput.classList.toggle('locked', locked);
      priceInput.title = locked ? t('entry_priceFixed') : '';
      recomputeLineSubtotal_(lineEl);
      recomputeTotals_();
    }
    qs('.lnProduct', lineEl).addEventListener('change', function(){ recomputeLineCyl_(lineEl); applyProductPrice_(); });
    applyProductPrice_();
    qs('.lnPayment', lineEl).addEventListener('change', function(){ refreshLineProductOptions_(lineEl); recomputeTotals_(); });
    ['input','blur'].forEach(function(evt){
      qs('.lnQty', lineEl).addEventListener(evt, function(){ recomputeLineSubtotal_(lineEl); recomputeTotals_(); });
      qs('.lnPrice', lineEl).addEventListener(evt, function(){ recomputeLineSubtotal_(lineEl); recomputeTotals_(); });
    });
    qs('.lnRemove', lineEl).addEventListener('click', function(){
      lineEl.remove();
      recomputeTotals_();
    });
  }
  function resetLines_(){
    if (qs('#eLinesDone', form)) reopenLines_();
    linesBody.innerHTML = '';
    if (qs('#eMode', form).value === 'product') addLine_();
    recomputeTotals_();
  }
  qs('#eAddLine', form).addEventListener('click', addLine_);

  // Confirming the lines folds them away: the totals they produced stay on
  // screen, and the next thing the eye lands on is the non-sales money.
  // Nothing is submitted here — this only tidies the form.
  function lineSummaryRows_(){
    var rows = [];
    qsa('.eLine', linesBody).forEach(function(lineEl){
      var qty = numFromInput_(qs('.lnQty', lineEl));
      var price = numFromInput_(qs('.lnPrice', lineEl));
      var prodSel = qs('.lnProduct', lineEl);
      if (!(qty > 0) || !(price > 0) || !prodSel.value) return;
      rows.push({
        name: prodSel.options[prodSel.selectedIndex].textContent,
        pay: qs('.lnPayment', lineEl).value,
        qty: qty, price: price, total: qty * price
      });
    });
    return rows;
  }
  function collapseLines_(rows){
    var wrap = qs('#eLinesDone', form);
    var total = rows.reduce(function(s2, r){ return s2 + r.total; }, 0);
    wrap.innerHTML =
      '<div class="lines-done">' +
        '<div class="ld-head">' +
          '<span class="ld-ic">'+icon_('check')+'</span>' +
          '<span class="ld-t"><b>'+esc(t('entry_linesConfirmed').replace('{n}', rows.length))+'</b>' +
            '<span>'+esc(t('entry_linesTotal'))+' <bdi dir="ltr">'+money(total)+'</bdi></span></span>' +
          '<button type="button" class="btn secondary" id="eEditLines">'+esc(t('entry_editLines'))+'</button>' +
        '</div>' +
        '<div class="ld-rows">' + rows.map(function(r){
          return '<div class="ld-row"><span class="n">'+esc(r.name)+'</span>' +
            '<span class="q"><bdi dir="ltr">'+money(r.qty)+' × '+money(r.price)+'</bdi></span>' +
            '<span class="p">'+esc(t('entry_payment_'+r.pay))+'</span>' +
            '<span class="a"><bdi dir="ltr">'+money(r.total)+'</bdi></span></div>';
        }).join('') + '</div>' +
      '</div>';
    qs('#eLinesOpen', form).hidden = true;
    wrap.hidden = false;
    qs('#eEditLines', wrap).addEventListener('click', function(){
      wrap.hidden = true;
      qs('#eLinesOpen', form).hidden = false;
      qs('#eLinesMsg', form).innerHTML = '';
    });
  }
  function reopenLines_(){
    qs('#eLinesDone', form).hidden = true;
    qs('#eLinesOpen', form).hidden = false;
  }
  qs('#eConfirmLines', form).addEventListener('click', function(){
    var rows = lineSummaryRows_();
    if (!rows.length) {
      qs('#eLinesMsg', form).innerHTML = '<div class="msg err">'+esc(t('entry_linesNeeded'))+'</div>';
      return;
    }
    qs('#eLinesMsg', form).innerHTML = '';
    recomputeTotals_();
    collapseLines_(rows);
    entryNetPreview_();
    // land on the next thing to fill in, not on empty space
    var next = qs('#eOtherWrap', form);
    if (next) next.scrollIntoView({ block: 'start', behavior: 'smooth' });
  });

  function applyMode_(){
    var mode = qs('#eMode', form).value;
    var isProduct = mode === 'product';
    qs('#eProductWrap', form).style.display = isProduct ? 'none' : '';
    qs('#eLinesWrap', form).style.display = isProduct ? '' : 'none';
    qs('#eComputedHint', form).style.display = isProduct ? '' : 'none';
    ['#eCash','#ePos'].forEach(function(sel){
      var input = qs(sel, form);
      input.disabled = isProduct;
      input.readOnly = isProduct;
      input.classList.toggle('locked', isProduct);
    });
    toggleCylFields();
    if (isProduct) {
      if (!qsa('.eLine', linesBody).length) addLine_();
      recomputeTotals_();
    } else {
      // Switching back to direct mode starts the amount fields fresh
      // rather than carrying over whatever the (now-hidden) product lines
      // last summed to — the two entry paths shouldn't silently blend.
      qs('#eCash', form).value = '0';
      qs('#ePos', form).value = '0';
      syncSalesTotal_();
    }
  }
  qs('#eMode', form).addEventListener('change', applyMode_);

  typeSel.addEventListener('change', populateSourceOptions);
  qs('#eSource', form).addEventListener('change', updateLocationDisplay);
  populateSourceOptions();
  productSel.addEventListener('change', toggleCylFields);
  applyMode_();

  qs('#eSubmit', form).addEventListener('click', function(){
    var mode = qs('#eMode', form).value;
    var date = qs('#eDate', form).value;
    var sourceType = typeSel.value;
    var sourceId = qs('#eSource', form).value;
    var note = qs('#eNote', form).value;
    if (!sourceId){ qs('#entryMsg',form).innerHTML='<div class="msg err">'+esc(t('err_noSourceSelected'))+'</div>'; return; }

    if (mode === 'direct') {
      var payload = {
        date: date, sourceType: sourceType, sourceId: sourceId,
        cylindersOut: numFromInput_(qs('#eCylOut', form)),
        cylindersIn: numFromInput_(qs('#eCylIn', form)),
        productId: productSel.value || null,
        cashSales: numFromInput_(qs('#eCash', form)),
        posSales: numFromInput_(qs('#ePos', form)),
        directDepositAmount: numFromInput_(qs('#eDeposit', form)),
        directDepositRef: qs('#eDepositRef', form).value,
        directDepositNote: qs('#eDepositNote', form).value,
        note: note
      };
      var firstMoney = firstMoneyFields_();
      Object.keys(firstMoney).forEach(function(k){ payload[k] = firstMoney[k]; });
      var extraRows = extraMoneyRows_(payload);
      function afterSave(res){
        if(!res.ok){ qs('#entryMsg',form).innerHTML='<div class="msg err">'+esc(errMsg_(res))+'</div>'; return; }
        var failed = (res.results||[]).filter(function(r){ return !r.ok; });
        if (failed.length) {
          qs('#entryMsg',form).innerHTML='<div class="msg err">'+esc(errMsg_({ error: failed[0].error }))+'</div>';
          return;
        }
        qs('#entryMsg',form).innerHTML='<div class="msg ok">'+esc(t('ok_saved'))+'</div>';
        loadEntryList();
      }
      // One line each is one request, exactly as before; extra lines go as
      // their own rows in a single bulk call rather than several requests.
      if (extraRows.length) api('importDailyEntries', { rows: [payload].concat(extraRows) }).then(afterSave);
      else api('createDailyEntry', payload).then(afterSave);
      return;
    }

    // product mode: one daily_entries row per product line, all sharing the
    // same date/source/note — the existing bulk-import action already does
    // exactly this per-row validation, so it's reused instead of adding a
    // second entry-creation code path on the server.
    var lineEls = qsa('.eLine', linesBody);
    if (!lineEls.length){ qs('#entryMsg',form).innerHTML='<div class="msg err">'+esc(t('err_noProductLines'))+'</div>'; return; }
    var rows = [];
    for (var i=0;i<lineEls.length;i++){
      var lineEl = lineEls[i];
      var productId = qs('.lnProduct', lineEl).value;
      var qty = numFromInput_(qs('.lnQty', lineEl));
      var price = numFromInput_(qs('.lnPrice', lineEl));
      var payment = qs('.lnPayment', lineEl).value;
      if (!productId || !(qty > 0) || !(price > 0) || !payment){
        qs('#entryMsg',form).innerHTML='<div class="msg err">'+esc(t('err_lineIncomplete'))+'</div>';
        return;
      }
      var subtotal = qty * price;
      rows.push({
        date: date, sourceType: sourceType, sourceId: sourceId, productId: productId,
        qty: qty, unitPrice: price,
        cashSales: payment==='pos' ? 0 : subtotal,
        posSales: payment==='pos' ? subtotal : 0,
        cylindersOut: numFromInput_(qs('.lnCylOut', lineEl)),
        cylindersIn: numFromInput_(qs('.lnCylIn', lineEl)),
        note: note
      });
    }
    // The collection / expense / direct-deposit blocks belong to the day, not
    // to one product line, so they ride on the first row of the batch.
    if (rows.length) {
      var firstMoney2 = firstMoneyFields_();
      Object.keys(firstMoney2).forEach(function(k){ rows[0][k] = firstMoney2[k]; });
      rows[0].directDepositAmount = numFromInput_(qs('#eDeposit', form));
      rows[0].directDepositRef = qs('#eDepositRef', form).value;
      rows[0].directDepositNote = qs('#eDepositNote', form).value;
      rows = rows.concat(extraMoneyRows_(rows[0]));
    }
    api('importDailyEntries', { rows: rows }).then(function(res){
      if(!res.ok){ qs('#entryMsg',form).innerHTML='<div class="msg err">'+esc(errMsg_(res))+'</div>'; return; }
      var failed = (res.results||[]).filter(function(r){ return !r.ok; });
      qs('#entryMsg',form).innerHTML = failed.length
        ? '<div class="msg err">'+esc(t('entry_importResult').replace('{created}',res.created).replace('{total}',res.total))+'</div>'
        : '<div class="msg ok">'+esc(t('ok_saved'))+'</div>';
      if (res.created > 0){ resetLines_(); [otherLines, expenseLines, deliveryLines, creditLines].forEach(function(l){ l.reset(); }); loadEntryList(); }
    });
  });

  if (role === 'admin') {
    var importCard = el('<div class="card">' +
      '<h2>'+esc(t('entry_importTitle'))+'</h2>' +
      '<div class="muted" style="font-size:12.5px;margin-bottom:10px;">'+esc(t('entry_importHint'))+'</div>' +
      '<div class="row" style="gap:10px;flex-wrap:wrap;margin-bottom:10px;align-items:center;">' +
        '<button type="button" class="btn" id="impTemplateBtn" style="background:var(--muted-2);">'+esc(t('entry_importTemplate'))+'</button>' +
        '<input type="file" id="impFile" accept=".csv,text/csv">' +
      '</div>' +
      '<div id="impMsg"></div>' +
      '<div id="impPreviewWrap"></div>' +
    '</div>');
    body.appendChild(importCard);
    qs('#impTemplateBtn', importCard).addEventListener('click', downloadCsvTemplate_);

    var pendingImportRows = [];
    qs('#impFile', importCard).addEventListener('change', function(e){
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(){
        var parsed;
        try { parsed = parseCsv_(String(reader.result||'')); } catch(err){ parsed = null; }
        if (!parsed || parsed.length < 2){ qs('#impMsg',importCard).innerHTML = '<div class="msg err">'+esc(t('entry_importParseError'))+'</div>'; return; }
        qs('#impMsg',importCard).innerHTML = '';
        var header = parsed[0].map(function(h){ return String(h||'').trim(); });
        var dataRows = parsed.slice(1).filter(function(r){ return r.some(function(c){ return String(c||'').trim() !== ''; }); });
        var idx = {};
        header.forEach(function(h,i){ idx[h]=i; });
        function cell(r,key){ var i = idx[key]; return (i!=null && r[i]!=null) ? String(r[i]) : ''; }

        pendingImportRows = dataRows.map(function(r){
          var date = cell(r,'date').trim();
          var sourceType = cell(r,'sourceType').trim().toLowerCase();
          var sourceName = cell(r,'sourceName').trim();
          var productName = cell(r,'product').trim();
          var cashSales = cell(r,'cashSales');
          var deliveryFee = cell(r,'deliveryFee');
          var posSales = cell(r,'posSales');
          var creditSales = cell(r,'creditSales');
          var cylindersOut = cell(r,'cylindersOut');
          var cylindersIn = cell(r,'cylindersIn');
          var note = cell(r,'note');

          var status = 'ok', sourceId = null, productId = null;
          if (!date || ['store','car','pos'].indexOf(sourceType) < 0 || !sourceName) status = 'missing';
          if (status === 'ok'){
            sourceId = resolveSourceByName_(sourceType, sourceName);
            if (!sourceId) status = 'notfound';
          }
          if (status === 'ok' && productName) productId = resolveProductByName_(productName);
          var row = {
            date: date, sourceType: sourceType, sourceId: sourceId, sourceName: sourceName,
            productId: productId, cashSales: cashSales, deliveryFeeBankAmount: deliveryFee, posSales: posSales,
            creditSales: creditSales, cylindersOut: cylindersOut, cylindersIn: cylindersIn, note: note,
            status: status
          };
          var extra = nonSalesFromRow_(cell, r);
          Object.keys(extra).forEach(function(k){ row[k] = extra[k]; });
          if (row.status === 'ok' && row.otherCash > 0 && (!row.otherCashItemId || !row.otherCashReason)) row.status = 'missing';
          if (row.status === 'ok' && row.expenseAmount > 0 && (!row.expenseItemId || !row.expenseReason)) row.status = 'missing';
          if (row.status === 'ok' && row.directDepositAmount > 0 && !row.directDepositRef) row.status = 'missing';
          if (row.status === 'ok' && row.creditSales > 0 && !row.creditCustomer) row.status = 'missing';
          return row;
        });

        renderImportPreview();
      };
      reader.readAsText(file);
    });

    function renderImportPreview(){
      var wrap = qs('#impPreviewWrap', importCard);
      if (!pendingImportRows.length){ wrap.innerHTML=''; return; }
      var rows = pendingImportRows.map(function(r, i){
        var statusLabel = r.status==='ok' ? '<span class="badge confirmed">'+esc(t('entry_importValid'))+'</span>'
          : r.status==='notfound' ? '<span class="badge disputed">'+esc(t('entry_importErr_notfound'))+'</span>'
          : '<span class="badge rejected">'+esc(t('entry_importErr_missing'))+'</span>';
        return '<tr><td>'+(i+1)+'</td><td>'+esc(r.date)+'</td><td>'+esc(r.sourceType)+'</td><td>'+esc(r.sourceName)+'</td><td>'+statusLabel+'</td></tr>';
      }).join('');
      wrap.innerHTML = '<h2 style="margin-top:14px;">'+esc(t('entry_importPreview'))+'</h2>' +
        '<table><thead><tr><th>'+esc(t('entry_importCol_row'))+'</th><th>'+esc(t('entry_importCol_date'))+'</th>' +
        '<th>'+esc(t('entry_importCol_type'))+'</th><th>'+esc(t('entry_importCol_source'))+'</th><th>'+esc(t('entry_importCol_status'))+'</th></tr></thead><tbody>'+rows+'</tbody></table>' +
        '<button class="btn" id="impSubmit" style="margin-top:12px;">'+esc(t('entry_importSubmit'))+'</button>';
      qs('#impSubmit', wrap).addEventListener('click', function(){
        var validRows = pendingImportRows.filter(function(r){ return r.status==='ok'; });
        if (!validRows.length) return;
        api('importDailyEntries', { rows: validRows }).then(function(res){
          if (!res.ok){ qs('#impMsg',importCard).innerHTML='<div class="msg err">'+esc(errMsg_(res))+'</div>'; return; }
          qs('#impMsg',importCard).innerHTML='<div class="msg ok">'+esc(t('entry_importResult').replace('{created}',res.created).replace('{total}',res.total))+'</div>';
          pendingImportRows = [];
          renderImportPreview();
          loadEntryList();
        });
      });
    }
  }

  var entryFilter = listFilters_({
    fields: ['text','date','area','branch','sourceType','payment','movement','status','person','amount'],
    status: [['open', t('st_notHandedOff')], ['handed', t('st_inHandoff')]],
    people: (meta.users||[]).filter(function(u){ return ['driver','store_manager','cluster_manager','admin'].indexOf(u.role) >= 0; })
      .map(function(u){ return [u.id, u.name]; }),
    onChange: drawEntryList
  });
  body.appendChild(entryFilter.node);
  var listCard = el('<div class="card"><h2>'+esc(t('entry_list'))+'</h2><div id="entryListBody"></div></div>');
  body.appendChild(listCard);
  loadEntryList();

  var entryRows = [];
  function drawEntryList(){
    var wrap = qs('#entryListBody');
    if (!wrap) return;
    if (!entryRows.length){ wrap.innerHTML = '<div class="muted">'+esc(t('noData'))+'</div>'; return; }
    var shown = entryFilter ? entryRows.filter(function(r){ return entryFilter.match(r.norm); }) : entryRows;
    if (!shown.length){ wrap.innerHTML = '<div class="lf-empty">'+esc(t('lf_noMatch'))+'</div>'; return; }
    wrap.innerHTML = '<table><thead><tr><th>'+esc(t('entry_date'))+'</th><th>'+esc(t('entry_sourceType'))+'</th><th>'+esc(t('handoff_amount'))+'</th><th></th></tr></thead><tbody>' +
      shown.slice(0,60).map(function(r){ return r.html; }).join('') + '</tbody></table>' +
      '<div class="muted" style="margin-top:8px;font-size:11.5px;">'+esc(t('lf_showing').replace('{n}', Math.min(shown.length,60)).replace('{total}', entryRows.length))+'</div>';
  }
  function loadEntryList(){
    api('listEntries', {}).then(function(res){
      var wrap = qs('#entryListBody');
      if(!res.ok || !res.entries.length){ entryRows = []; drawEntryList(); return; }
      entryRows = res.entries.map(function(e){
        // A car or pos entry can carry cash, card/POS, and credit sales all
        // at once now, so a single-column quick list shows their sum rather
        // than picking just one and silently dropping the others.
        var amt = Number(e.cashSales||0) + Number(e.posSales||0) + Number(e.creditSales||0);
        return {
          html: '<tr><td>'+esc(e.date)+'</td><td>'+esc(t('entry_source_'+e.sourceType))+'</td><td>'+money(amt)+'</td><td>'+(e.consumedBy?'✓':'')+'</td></tr>',
          norm: {
            date: e.date, locationId: e.locationId, sourceType: e.sourceType, amount: amt,
            people: [e.enteredBy], status: e.consumedBy ? 'handed' : 'open',
            pay: { cash: Number(e.cashSales||0) > 0, pos: Number(e.posSales||0) > 0, credit: Number(e.creditSales||0) > 0,
              delivery: Number(e.deliveryFeeBankAmount||0) > 0, other: Number(e.otherCash||0) > 0,
              expense: Number(e.expenseAmount||0) > 0, deposit: Number(e.directDepositAmount||0) > 0 },
            // everything a person might actually type into the box: the
            // reasons and bank references are usually what they remember
            text: [e.date, t('entry_source_'+e.sourceType), sourceName_(e), locationName(e.locationId),
              userName(e.enteredBy), productName_(e.productId), e.note, money(amt),
              e.otherCashReason, e.expenseReason, e.directDepositRef, e.directDepositNote,
              itemName_('incomeItems', e.otherCashItemId), itemName_('expenseItems', e.expenseItemId)].join(' ')
          }
        };
      });
      drawEntryList();
    });
  }
}

// ---------------- area-manager bulk upload ----------------
// A deliberate alternative to renderEntries: cluster-wide file, batch
// review, submit-for-approval instead of submit-and-done — different enough
// semantics that reusing the single-location entry screen would mean
// forking most of its CSV-import card anyway. See CLAUDE.md.
function renderAreaBulk(body){
  var role = state.user.role;
  var clusters = (state.meta && state.meta.clusters) || [];
  var myCluster = role === 'admin' ? null : clusters.filter(function(c){ return c.clusterManagerUserId === state.user.id; })[0];

  var card = el('<div class="card">' +
    '<h2>'+esc(t('areaBulk_title'))+'</h2>' +
    '<div class="muted" style="font-size:12.5px;margin-bottom:10px;">'+esc(t('areaBulk_hint'))+'</div>' +
    (role==='admin' ? '<div class="field"><label>'+esc(t('deputy_cluster'))+'</label><select id="abCluster">'+
      clusters.map(function(c){ return '<option value="'+c.id+'">'+esc(c.name)+'</option>'; }).join('')+'</select></div>' : '') +
    '<div class="row" style="gap:10px;flex-wrap:wrap;margin-bottom:10px;align-items:center;">' +
      '<button type="button" class="btn" id="abTemplateBtn" style="background:var(--muted-2);">'+esc(t('areaBulk_template'))+'</button>' +
      '<input type="file" id="abFile" accept=".csv,text/csv">' +
    '</div>' +
    '<div id="abMsg"></div>' +
    '<div id="abPreviewWrap"></div>' +
  '</div>');
  body.innerHTML = '';
  body.appendChild(card);

  if (role !== 'admin' && !myCluster) {
    card.innerHTML = '<h2>'+esc(t('areaBulk_title'))+'</h2><div class="msg err">'+esc(t('err_forbidden'))+'</div>';
    return;
  }

  function currentClusterId(){
    return role === 'admin' ? qs('#abCluster', card).value : myCluster.id;
  }

  qs('#abTemplateBtn', card).addEventListener('click', function(){ downloadAreaBulkCsvTemplate_(currentClusterId()); });

  var pendingRows = [];
  qs('#abFile', card).addEventListener('change', function(e){
    var file = e.target.files[0];
    if (!file) return;
    var clusterId = currentClusterId();
    var reader = new FileReader();
    reader.onload = function(){
      var parsed;
      try { parsed = parseCsv_(String(reader.result||'')); } catch(err){ parsed = null; }
      if (!parsed || parsed.length < 2){ qs('#abMsg',card).innerHTML = '<div class="msg err">'+esc(t('entry_importParseError'))+'</div>'; return; }
      qs('#abMsg',card).innerHTML = '';
      var header = parsed[0].map(function(h){ return String(h||'').trim(); });
      var dataRows = parsed.slice(1).filter(function(r){ return r.some(function(c){ return String(c||'').trim() !== ''; }); });
      var idx = {};
      header.forEach(function(h,i){ idx[h]=i; });
      function cell(r,key){ var i = idx[key]; return (i!=null && r[i]!=null) ? String(r[i]) : ''; }

      // Product-level: one row = one product/service line (qty x unit price,
      // one payment method) — mirrors exactly what renderEntries' product
      // mode submits per line, so the same subtotal/routing logic applies
      // here and the batch that reaches Deputy review always carries real
      // product detail, never a bare day-total.
      pendingRows = dataRows.map(function(r){
        var date = cell(r,'date').trim();
        var locationName = cell(r,'locationName').trim();
        var sourceType = cell(r,'sourceType').trim().toLowerCase();
        var sourceName = cell(r,'sourceName').trim();
        var productName = cell(r,'product').trim();
        var qty = Number(cell(r,'qty').replace(/,/g,'').trim() || 0);
        var unitPrice = Number(cell(r,'unitPrice').replace(/,/g,'').trim() || 0);
        var paymentMethod = cell(r,'paymentMethod').trim().toLowerCase();
        var note = cell(r,'note');

        var status = 'ok', locationId = null, sourceId = null, productId = null, product = null;
        if (!date || !locationName || ['store','car','pos'].indexOf(sourceType) < 0 || !sourceName || !productName || !paymentMethod) status = 'missing';
        if (status === 'ok') {
          locationId = resolveLocationByNameInCluster_(locationName, clusterId);
          if (!locationId) status = 'location_notfound';
        }
        if (status === 'ok') {
          sourceId = resolveSourceByNameInCluster_(sourceType, sourceName, locationId);
          if (!sourceId) status = 'source_notfound';
        }
        if (status === 'ok') {
          productId = resolveProductByName_(productName);
          if (!productId) status = 'product_notfound'; else product = byId(state.meta.products, productId);
        }
        if (status === 'ok' && !(qty > 0)) status = 'invalid_qty';
        if (status === 'ok' && !(unitPrice > 0)) status = 'invalid_price';
        if (status === 'ok' && ['cash','pos'].indexOf(paymentMethod) < 0) status = 'invalid_payment';
        var numCol = function(k){ return Number(String(cell(r,k)||'').replace(/,/g,'').trim() || 0); };
        var deliveryAmt = numCol('deliveryFee'), creditAmt = numCol('creditSales');

        var extraCols = nonSalesFromRow_(cell, r);
        if (status === 'ok' && extraCols.otherCash > 0 && (!extraCols.otherCashItemId || !extraCols.otherCashReason)) status = 'missing';
        if (status === 'ok' && extraCols.expenseAmount > 0 && (!extraCols.expenseItemId || !extraCols.expenseReason)) status = 'missing';
        if (status === 'ok' && extraCols.directDepositAmount > 0 && !extraCols.directDepositRef) status = 'missing';
        if (status === 'ok' && creditAmt > 0 && !extraCols.creditCustomer) status = 'missing';
        var subtotal = qty * unitPrice;
        return {
          date: date, locationName: locationName, sourceType: sourceType, sourceId: sourceId, sourceName: sourceName,
          productId: productId, productName: productName, qty: qty, unitPrice: unitPrice, paymentMethod: paymentMethod, subtotal: subtotal,
          cashSales: paymentMethod==='cash' ? subtotal : 0,
          posSales: paymentMethod==='pos' ? subtotal : 0,
          deliveryFeeBankAmount: deliveryAmt, deliveryNote: extraCols.deliveryNote,
          creditSales: creditAmt, creditCustomer: extraCols.creditCustomer,
          cylindersOut: cell(r,'cylindersOut'), cylindersIn: cell(r,'cylindersIn'), note: note,
          otherCash: extraCols.otherCash, otherCashItemId: extraCols.otherCashItemId, otherCashReason: extraCols.otherCashReason,
          directDepositNote: extraCols.directDepositNote,
          expenseAmount: extraCols.expenseAmount, expenseItemId: extraCols.expenseItemId, expenseReason: extraCols.expenseReason,
          directDepositAmount: extraCols.directDepositAmount, directDepositRef: extraCols.directDepositRef,
          status: status
        };
      });
      renderAreaBulkPreview();
    };
    reader.readAsText(file);
  });

  function renderAreaBulkPreview(){
    var wrap = qs('#abPreviewWrap', card);
    if (!pendingRows.length){ wrap.innerHTML=''; return; }
    var allValid = pendingRows.every(function(r){ return r.status==='ok'; });
    var statusLabels = {
      ok: '<span class="badge confirmed">'+esc(t('areaBulk_valid'))+'</span>',
      location_notfound: '<span class="badge disputed">'+esc(t('areaBulk_err_location_notfound'))+'</span>',
      source_notfound: '<span class="badge disputed">'+esc(t('areaBulk_err_source_notfound'))+'</span>',
      product_notfound: '<span class="badge disputed">'+esc(t('areaBulk_err_product_notfound'))+'</span>',
      invalid_qty: '<span class="badge rejected">'+esc(t('areaBulk_err_invalid_qty'))+'</span>',
      invalid_price: '<span class="badge rejected">'+esc(t('areaBulk_err_invalid_price'))+'</span>',
      invalid_payment: '<span class="badge rejected">'+esc(t('areaBulk_err_invalid_payment'))+'</span>',
      delivery_not_allowed_store: '<span class="badge rejected">'+esc(t('areaBulk_err_delivery_not_allowed_store'))+'</span>',
      delivery_needs_services: '<span class="badge rejected">'+esc(t('areaBulk_err_delivery_needs_services'))+'</span>'
    };
    var paymentLabels = { cash: t('entry_payment_cash'), pos: t('entry_payment_pos') };
    var rows = pendingRows.map(function(r, i){
      var statusLabel = statusLabels[r.status] || '<span class="badge rejected">'+esc(t('areaBulk_err_missing'))+'</span>';
      // An unrecognized paymentMethod has no i18n entry to translate — show
      // whatever the file actually said instead of a raw, confusing
      // "entry_payment_<junk>" key string falling out of t()'s not-found path.
      return '<tr><td>'+(i+1)+'</td><td>'+esc(r.date)+'</td><td>'+esc(r.locationName)+'</td><td>'+esc(r.sourceType)+'</td><td>'+esc(r.sourceName)+'</td>' +
        '<td>'+esc(r.productName)+'</td><td>'+(r.qty||0)+'</td><td>'+money(r.unitPrice)+'</td>' +
        '<td>'+esc(paymentLabels[r.paymentMethod] || r.paymentMethod || '')+'</td><td>'+money(r.subtotal)+'</td><td>'+statusLabel+'</td></tr>';
    }).join('');
    wrap.innerHTML = '<h2 style="margin-top:14px;">'+esc(t('entry_importPreview'))+'</h2>' +
      '<div class="tbl-scroll"><table><thead><tr><th>'+esc(t('areaBulk_col_row'))+'</th><th>'+esc(t('areaBulk_col_date'))+'</th>' +
      '<th>'+esc(t('areaBulk_col_location'))+'</th><th>'+esc(t('areaBulk_col_type'))+'</th><th>'+esc(t('areaBulk_col_source'))+'</th>' +
      '<th>'+esc(t('entry_lineProduct'))+'</th><th>'+esc(t('entry_qty'))+'</th><th>'+esc(t('entry_unitPrice'))+'</th>' +
      '<th>'+esc(t('entry_paymentMethod'))+'</th><th>'+esc(t('entry_lineSubtotal'))+'</th><th>'+esc(t('areaBulk_col_status'))+'</th></tr></thead><tbody>'+rows+'</tbody></table></div>' +
      (allValid ? '<div id="abCalcWrap">'+esc(t('loading'))+'</div>' : '<div class="msg err" style="margin-top:10px;">'+esc(t('areaBulk_needsAllValid'))+'</div>');

    if (!allValid) return;

    // Server-computed preview (dryRun:true) — the exact same computeNet_
    // formula the Deputy will see, nothing written yet, so the area
    // manager reviews real numbers instead of a client-side guess before
    // deciding to send this to the Deputy at all.
    api('bulkSubmitAreaBatch', { clusterId: currentClusterId(), rows: pendingRows, dryRun: true }).then(function(res){
      var calcWrap = qs('#abCalcWrap', wrap);
      if (!calcWrap) return;
      if (!res.ok){ calcWrap.innerHTML = '<div class="msg err">'+esc(errMsg_(res))+'</div>'; return; }
      var b = res.batch.breakdown;
      calcWrap.innerHTML = '<h2 style="margin-top:14px;">'+esc(t('areaBulk_calcTitle'))+'</h2>' +
        '<div class="muted" style="font-size:12.5px;margin-bottom:8px;">'+esc(t('areaBulk_calcHint'))+'</div>' +
        '<div style="font-size:24px;font-weight:800;text-align:center;margin-bottom:6px;">'+money(b.netCashOwed)+'</div>' +
        breakdownGrid(b) +
        handoffDetailRows(res.batch) +
        productBreakdownBlock_(pendingRows) +
        (b.deliveryFee > 0 ? vatExplainBlock_(b) : '') +
        '<button class="btn" id="abSubmit" style="margin-top:14px;">'+esc(t('areaBulk_submit'))+'</button>';
      qs('#abSubmit', calcWrap).addEventListener('click', function(){
        api('bulkSubmitAreaBatch', { clusterId: currentClusterId(), rows: pendingRows }).then(function(res2){
          if (!res2.ok){ qs('#abMsg',card).innerHTML = '<div class="msg err">'+esc(errMsg_(res2))+'</div>'; return; }
          qs('#abMsg',card).innerHTML = '<div class="msg ok">'+esc(t('ok_saved'))+'</div>';
          pendingRows = [];
          renderAreaBulkPreview();
          qs('#abFile', card).value = '';
          loadAreaBulkHistory();
        });
      });
    });
  }

  // Spells out the VAT-on-delivery-fee reclaim step-by-step with the
  // batch's own real numbers plugged in — the one formula in the whole
  // system people ask about most, per CLAUDE.md's "the formula" section:
  // vatOnDelivery = (deliveryFee / (1+vatRate)) * vatRate.
  // .replace(str, val) only swaps the FIRST occurrence — several of these
  // step strings use the same placeholder (e.g. {rate}) more than once, so
  // a plain chained .replace() silently leaves the second instance literal.
  // This fills every occurrence of every key.
  function fillTemplate_(str, vars){
    Object.keys(vars).forEach(function(k){
      str = str.split('{'+k+'}').join(vars[k]);
    });
    return str;
  }
  // Per-product "deep detail" the area manager asked to see before sending
  // for approval: every product/service line, aggregated across all rows in
  // this batch, with its own VAT 15% split shown out. This is purely
  // informational display built from the validated rows already on screen
  // — it does NOT feed computeNet_ or change netCashOwed in any way. Only
  // the delivery-fee VAT (vatExplainBlock_ below, using the server's own
  // b.deliveryFee) is ever actually reclaimed into the net cash figure, per
  // the xlsx formula (see CLAUDE.md "The formula"); a goods line's price is
  // simply assumed VAT-inclusive like any retail price tag, so its split
  // here is shown for transparency only, never subtracted or added back.
  function productBreakdownBlock_(rows){
    var vatRate = state.meta.config.vatRate;
    var byProduct = {};
    rows.forEach(function(r){
      var key = r.productId;
      if (!byProduct[key]) {
        var p = byId(state.meta.products, r.productId);
        byProduct[key] = { name: r.productName, type: p ? p.type : 'goods', qty: 0, subtotal: 0 };
      }
      byProduct[key].qty += r.qty;
      byProduct[key].subtotal += r.subtotal;
    });
    var list = Object.keys(byProduct).map(function(k){ return byProduct[k]; })
      .sort(function(a,b){ return b.subtotal - a.subtotal; });
    var rowsHtml = list.map(function(p){
      var base = p.subtotal / (1 + vatRate);
      var vat = base * vatRate;
      return '<tr><td>'+esc(p.name)+'</td><td>'+esc(t(p.type==='services' ? 'admin_typeServices' : 'admin_typeGoods'))+'</td>' +
        '<td>'+p.qty+'</td><td>'+money(p.subtotal)+'</td><td>'+money(base)+'</td><td>'+money(vat)+'</td></tr>';
    }).join('');
    return '<h2 style="margin-top:14px;">'+esc(t('areaBulk_productBreakdownTitle'))+'</h2>' +
      '<div class="muted" style="font-size:12px;margin-bottom:6px;">'+esc(t('areaBulk_productBreakdownHint'))+'</div>' +
      '<div class="tbl-scroll"><table><thead><tr><th>'+esc(t('entry_lineProduct'))+'</th><th>'+esc(t('admin_productType'))+'</th>' +
      '<th>'+esc(t('entry_qty'))+'</th><th>'+esc(t('entry_lineSubtotal'))+'</th><th>'+esc(t('areaBulk_vatBase'))+'</th><th>'+esc(t('report_vat'))+'</th></tr></thead><tbody>'+rowsHtml+'</tbody></table></div>';
  }
  function vatExplainBlock_(b){
    var vatRate = state.meta.config.vatRate;
    var deliveryFee = b.deliveryFee;
    var beforeVat = deliveryFee / (1 + vatRate);
    var vatAmount = beforeVat * vatRate;
    var ratePct = (vatRate*100).toFixed(0);
    return '<div class="msg" style="margin-top:10px;background:var(--green-pale);border:1px solid var(--green);font-size:12.5px;line-height:1.9;">' +
      '<strong>'+esc(t('areaBulk_vatTitle'))+'</strong><br>' +
      esc(fillTemplate_(t('areaBulk_vatStep1'), {fee: money(deliveryFee)})) + '<br>' +
      esc(fillTemplate_(t('areaBulk_vatStep2'), {fee: money(deliveryFee), rate: ratePct, base: money(beforeVat)})) + '<br>' +
      esc(fillTemplate_(t('areaBulk_vatStep3'), {base: money(beforeVat), rate: ratePct, vat: money(vatAmount)})) + '<br>' +
      esc(fillTemplate_(t('areaBulk_vatStep4'), {vat: money(vatAmount)})) +
    '</div>';
  }

  var historyCard = el('<div class="card"><h2>'+esc(t('areaBulk_recentTitle'))+'</h2><div id="abHistory"></div></div>');
  body.appendChild(historyCard);
  function loadAreaBulkHistory(){
    api('listAreaBulkBatches', {}).then(function(res){
      var wrap = qs('#abHistory', historyCard);
      wrap.innerHTML = '';
      if (!res.ok || !res.batches.length){ wrap.innerHTML = '<div class="muted">'+esc(t('areaBulk_noBatches'))+'</div>'; return; }
      res.batches.forEach(function(b){
        var badgeClass = b.status==='deputy_approved' ? 'confirmed' : b.status==='deputy_rejected' ? 'rejected' : 'pending';
        var row = el(
          '<div style="padding:8px 0;border-top:1px dashed var(--border-soft);">' +
            '<div class="row" style="justify-content:space-between;">' +
              '<span>'+esc((b.createdAt||'').slice(0,16).replace('T',' '))+' · <strong>'+money(b.breakdown.netCashOwed)+'</strong></span>' +
              '<span class="badge '+badgeClass+'">'+esc(t('batch_'+b.status))+'</span>' +
            '</div>' +
            (b.status==='deputy_rejected' && b.rejectionNote ? '<div class="msg err" style="margin-top:4px;">'+esc(t('areaBulk_rejectionNote'))+': '+esc(b.rejectionNote)+'</div>' : '') +
            '<button type="button" class="btn secondary pdToggle" style="margin-top:8px;font-size:12px;padding:6px 12px;">'+esc(t('areaBulk_showProductDetail'))+'</button>' +
            '<div class="pdWrap" hidden style="margin-top:8px;"></div>' +
          '</div>'
        );
        wrap.appendChild(row);
        wireProductDetailToggle_(row, b.id);
      });
    });
  }
  loadAreaBulkHistory();
}

// Renders the persistent, post-submission product-level VAT breakdown —
// same columns as the dry-run preview's productBreakdownBlock_, but fed
// from actionAreaBulkBatchDetail_'s server-computed byProduct array
// instead of recomputing base/vat client-side from in-memory CSV rows,
// which no longer exist once a batch is actually submitted. Lets both the
// uploading area manager and the Deputy check product/qty/subtotal/VAT for
// an already-submitted batch, not only during the upload moment itself.
function productDetailTable_(byProduct){
  if (!byProduct || !byProduct.length) return '<div class="muted">'+esc(t('noData'))+'</div>';
  var rows = byProduct.map(function(p){
    return '<tr><td>'+esc(p.name||'—')+'</td><td>'+esc(t(p.type==='services' ? 'admin_typeServices' : 'admin_typeGoods'))+'</td>' +
      '<td>'+p.qty+'</td><td>'+money(p.subtotal)+'</td><td>'+money(p.base)+'</td><td>'+money(p.vat)+'</td></tr>';
  }).join('');
  return '<div class="tbl-scroll"><table><thead><tr><th>'+esc(t('entry_lineProduct'))+'</th><th>'+esc(t('admin_productType'))+'</th>' +
    '<th>'+esc(t('entry_qty'))+'</th><th>'+esc(t('entry_lineSubtotal'))+'</th><th>'+esc(t('areaBulk_vatBase'))+'</th><th>'+esc(t('report_vat'))+'</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
// Shared by both the area manager's own batch history and the Deputy's
// review list — lazily fetches on first expand, toggles visibility after.
function wireProductDetailToggle_(container, batchId){
  var btn = qs('.pdToggle', container);
  var wrap = qs('.pdWrap', container);
  var loaded = false;
  btn.addEventListener('click', function(){
    var showing = !wrap.hidden;
    if (showing) { wrap.hidden = true; btn.textContent = t('areaBulk_showProductDetail'); return; }
    wrap.hidden = false;
    btn.textContent = t('areaBulk_hideProductDetail');
    if (loaded) return;
    wrap.innerHTML = '<div class="muted">'+esc(t('loading'))+'</div>';
    api('areaBulkBatchDetail', { id: batchId }).then(function(res){
      if (!res.ok) { wrap.innerHTML = '<div class="msg err">'+esc(errMsg_(res))+'</div>'; return; }
      loaded = true;
      wrap.innerHTML = productDetailTable_(res.byProduct);
    });
  });
}

// ---------------- deputy operations manager: area batch approvals ----------------
// New screen, not folded into Handoffs, for the same reason the backend
// doesn't reuse confirm/dispute for this step: the Deputy is approving
// *data*, not confirming a *cash amount received* — handoffItem is built
// entirely around the latter shape. breakdownGrid/handoffDetailRows are
// reused as-is below since they only need a plain breakdown/perLocation
// object, with no handoff-specific assumptions. See CLAUDE.md.
function renderDeputyReview(body){
  body.innerHTML = '<div class="card">'+esc(t('loading'))+'</div>';
  api('listAreaBulkBatches', { status: 'pending_deputy' }).then(function(res){
    body.innerHTML = '';
    if (!res.ok){ body.innerHTML = '<div class="msg err">'+esc(errMsg_(res))+'</div>'; return; }

    var header = el('<div class="card"><h2>'+esc(t('deputy_title'))+'</h2><div class="muted" style="font-size:12.5px;">'+esc(t('deputy_hint'))+'</div></div>');
    body.appendChild(header);

    if (!res.batches.length){
      body.appendChild(el('<div class="card"><div class="muted">'+esc(t('deputy_noPending'))+'</div></div>'));
      return;
    }

    res.batches.forEach(function(b){
      var card = el('<div class="card">' +
        '<div class="row" style="justify-content:space-between;flex-wrap:wrap;">' +
          '<div><strong>'+esc(clusterName(b.clusterId))+'</strong> · '+esc(t('deputy_uploadedBy'))+': '+esc(userName(b.uploadedBy))+'</div>' +
          '<div class="muted">'+esc((b.createdAt||'').slice(0,16).replace('T',' '))+'</div>' +
        '</div>' +
        '<div style="font-size:22px;font-weight:800;margin-top:6px;">'+money(b.breakdown.netCashOwed)+'</div>' +
        breakdownGrid(b.breakdown) +
        handoffDetailRows(b) +
        '<button type="button" class="btn secondary pdToggle" style="margin-top:10px;font-size:12px;padding:6px 12px;">'+esc(t('areaBulk_showProductDetail'))+'</button>' +
        '<div class="pdWrap" hidden style="margin-top:8px;"></div>' +
        '<div class="row" style="gap:10px;margin-top:12px;">' +
          '<button class="btn" id="dApprove-'+b.id+'">'+esc(t('deputy_approve'))+'</button>' +
          '<button class="btn secondary" id="dReject-'+b.id+'">'+esc(t('deputy_reject'))+'</button>' +
        '</div>' +
        '<div id="dMsg-'+b.id+'"></div>' +
      '</div>');
      body.appendChild(card);
      wireProductDetailToggle_(card, b.id);

      qs('#dApprove-'+b.id, card).addEventListener('click', function(){
        api('deputyApproveBatch', { id: b.id }).then(function(res2){
          if (!res2.ok){ qs('#dMsg-'+b.id, card).innerHTML = '<div class="msg err">'+esc(errMsg_(res2))+'</div>'; return; }
          toast('deputy_approved_toast', 'ok');
          renderDeputyReview(body);
        });
      });
      qs('#dReject-'+b.id, card).addEventListener('click', function(){
        var note = window.prompt(t('deputy_rejectPrompt'), '');
        if (note === null) return;
        api('deputyRejectBatch', { id: b.id, note: note }).then(function(res2){
          if (!res2.ok){ qs('#dMsg-'+b.id, card).innerHTML = '<div class="msg err">'+esc(errMsg_(res2))+'</div>'; return; }
          toast('deputy_rejected_toast', 'ok');
          renderDeputyReview(body);
        });
      });
    });
  });
}

// ---------------- handoffs ----------------
function statusBadge(s){
  return '<span class="badge '+esc(s)+'">'+esc(t('handoff_'+s))+'</span>';
}

function breakdownGrid(b){
  if (!b) return '';
  var items = [
    ['report_storeCash', b.storeCash],
    ['report_carCash', b.carCash],
    ['report_posCash', b.posCash],
    ['report_delivery', b.deliveryFee],
    ['report_vat', b.vatOnDelivery]
  ];
  // only shown when they actually happened, so an ordinary day's breakdown
  // keeps the shape people already know
  if (Number(b.creditSales||0)) items.push(['report_credit', b.creditSales]);
  if (Number(b.otherCash||0)) items.push(['report_otherCash', b.otherCash]);
  if (Number(b.expenses||0)) items.push(['report_expenses', b.expenses]);
  if (Number(b.directDeposit||0)) items.push(['report_directDeposit', b.directDeposit]);
  items.push(['report_net', b.netCashOwed]);
  var grid = '<div class="breakdown">' + items.map(function(it){
    return '<div class="bi">'+esc(t(it[0]))+'<b>'+money(it[1])+'</b></div>';
  }).join('') + '</div>';
  if (Number(b.posSales||0) > 0) {

  }

  return grid;
}

// Reconstructs a chronological who/when timeline directly from the
// handoff's own timestamp fields — every state change already stamps who
// did it and when onto the record itself, so no separate audit-log fetch
// is needed to show it per-transaction.
function handoffAuditTrail_(h){
  var events = [];
  function add(at, key, actorId, extra){ if (at) events.push({ at:at, key:key, actorId:actorId, extra:extra }); }
  add(h.createdAt, 'audit_created', h.fromUserId);
  if (h.staleEscalatedAt) add(h.staleEscalatedAt, 'audit_staleEscalated', null);
  if (h.disputedAt) add(h.disputedAt, 'audit_disputed', h.toUserId, h.disputeNote);
  // A dispute resolved as "confirm" sets both confirmedAt and resolvedAt at
  // the same moment — show only the resolution event then, since it's the
  // more complete/accurate one (carries the resolver and note too).
  if (h.resolvedAt) add(h.resolvedAt, 'audit_resolved', h.resolvedBy, h.resolutionNote);
  else if (h.confirmedAt) add(h.confirmedAt, 'audit_confirmed', h.confirmedBy);
  if (h.secondApprovedAt) add(h.secondApprovedAt, 'audit_secondApproved', h.secondApprovedBy);
  events.sort(function(a,b){ return new Date(a.at) - new Date(b.at); });
  if (!events.length) return '';
  return events.map(function(e){
    return '<div class="row" style="justify-content:space-between;font-size:12px;padding:3px 0;border-top:1px dashed var(--border-soft);">' +
      '<span>'+esc(t(e.key))+(e.actorId?' — '+esc(userName(e.actorId)):'')+(e.extra?' («'+esc(e.extra)+'»)':'')+'</span>' +
      '<span class="muted">'+esc(String(e.at).slice(0,16).replace('T',' '))+'</span></div>';
  }).join('');
}

function handoffItem(h, showConfirm, showResolve){
  // The receiving step is exactly where "what am I actually confirming?"
  // matters most — default the breakdown open there instead of behind an
  // extra click, and collapsed elsewhere to keep history lists scannable.
  var isReceivingStep = showConfirm && h.status === 'pending';
  var div = el('<div class="list-item">' +
    '<div class="top">' +
      '<div><strong>'+esc(t('kind_'+h.kind))+'</strong> ' + statusBadge(h.status) + '</div>' +
      '<div class="amount">'+money(h.amount)+'</div>' +
    '</div>' +
    '<div class="muted">'+esc(t('handoff_from'))+': '+esc(userName(h.fromUserId))+' · '+esc(t('handoff_to'))+': '+esc(h.toUserId?userName(h.toUserId):t('entity_bank'))+' · '+esc((h.createdAt||'').slice(0,16).replace('T',' '))+'</div>' +
    (h.disputeNote ? '<div class="muted">📝 '+esc(h.disputeNote)+'</div>' : '') +
    varianceLine(h) +
    (h.requiresSecondApproval ? '<div class="msg '+(h.secondApprovedBy?'ok':'err')+'" style="margin-top:8px;">'+esc(t(h.secondApprovedBy?'handoff_secondApproved':'handoff_needsSecondApproval'))+'</div>' : '') +
    (h.breakdown ? (
      '<button type="button" class="details-toggle" id="hBrkToggle">'+esc(t(isReceivingStep ? 'handoff_hideBreakdown' : 'handoff_showBreakdown'))+'</button>' +
      '<div id="hBrkBody"'+(isReceivingStep?'':' hidden')+'>' + breakdownGrid(h.breakdown) + handoffDetailRows(h) + '</div>'
    ) : '') +
    ('<button type="button" class="details-toggle" id="hAuditToggle">'+esc(t('audit_showTrail'))+'</button>' +
      '<div id="hAuditBody" hidden>' + handoffAuditTrail_(h) + '</div>') +
    '<button type="button" class="doc-link" id="hDocBtn">'+icon_('doc')+esc(t('ui_openDoc'))+'</button>' +
    '<div class="actions" id="hActions"></div>' +
  '</div>');
  qs('#hDocBtn', div).addEventListener('click', function(){ drawerOpen_(handoffDocView_(h)); });

  var auditToggle = qs('#hAuditToggle', div), auditBody = qs('#hAuditBody', div);
  auditToggle.addEventListener('click', function(){
    auditBody.hidden = !auditBody.hidden;
    auditToggle.textContent = t(auditBody.hidden ? 'audit_showTrail' : 'audit_hideTrail');
  });

  if (h.breakdown) {
    var toggle = qs('#hBrkToggle', div), brkBody = qs('#hBrkBody', div);
    toggle.addEventListener('click', function(){
      brkBody.hidden = !brkBody.hidden;
      toggle.textContent = t(brkBody.hidden ? 'handoff_showBreakdown' : 'handoff_hideBreakdown');
    });
  }

  var actions = qs('#hActions', div);
  if (showConfirm && h.status==='pending'){
    var recv = el('<div class="field"><label>'+esc(t('handoff_receivedAmount'))+'</label>' +
      '<input id="hRecvAmt" type="text" inputmode="decimal" value="'+esc(money(h.amount))+'"></div>');
    actions.parentNode.insertBefore(recv, actions);
    var cb = el('<button class="btn">'+esc(t('handoff_confirm'))+'</button>');
    cb.addEventListener('click', function(){
      var recvInput = qs('#hRecvAmt', div);
      var raw = String(recvInput.value || '').replace(/,/g, '').trim();
      var receivedAmount = raw === '' ? h.amount : Number(raw);
      api('confirmHandoff',{id:h.id, receivedAmount:receivedAmount}).then(function(res){
        if (res.ok && res.handoff && res.handoff.shortfall != null) { toast('handoff_shortfallAccepted', 'ok'); return; }
        render();
      });
    });
    var db = el('<button class="btn danger">'+esc(t('handoff_dispute'))+'</button>');
    db.addEventListener('click', function(){
      var note = prompt(t('handoff_disputeNote'))||'';
      api('disputeHandoff',{id:h.id, note:note}).then(function(){ render(); });
    });
    actions.appendChild(cb); actions.appendChild(db);
  }
  if (showResolve && h.status==='disputed'){
    var rc = el('<button class="btn">'+esc(t('handoff_resolveConfirm'))+'</button>');
    rc.addEventListener('click', function(){ api('resolveDispute',{id:h.id, resolution:'confirm'}).then(function(){ render(); }); });
    var rr = el('<button class="btn danger">'+esc(t('handoff_resolveReject'))+'</button>');
    rr.addEventListener('click', function(){ api('resolveDispute',{id:h.id, resolution:'reject'}).then(function(){ render(); }); });
    actions.appendChild(rc); actions.appendChild(rr);
  }
  if (h.requiresSecondApproval && !h.secondApprovedBy && (state.user.role==='admin' || state.user.role==='finance')){
    var ackBtn = el('<button class="btn secondary">'+esc(t('handoff_acknowledgeSecond'))+'</button>');
    ackBtn.addEventListener('click', function(){ api('acknowledgeSecondApproval',{id:h.id}).then(function(){ render(); }); });
    actions.appendChild(ackBtn);
  }
  return div;
}

function renderHandoffs(body){
  body.innerHTML = '<div class="card">'+esc(t('loading'))+'</div>';
  var role = state.user.role;

  markDirtyOnInput_(body);
  apiCached('listHandoffs', {}, body, function(res){
    if(!res.ok){ body.innerHTML='<div class="msg err">'+esc(errMsg_(res))+'</div>'; return; }
    body.innerHTML = '';

    // action card: create outgoing handoff / record deposit
    if (role==='driver' || role==='admin'){
      var myCars = (state.meta.cars||[]).filter(function(c){ return role==='admin' || c.driverUserId===state.user.id; });

            if(res2.ok) render();

    if (role==='store_manager' || role==='admin'){
      var locId = null;
      var myStore = (state.meta.stores||[]).find(function(s){ return s.storeManagerUserId===state.user.id; });
      if (myStore) locId = myStore.locationId;
      var lc = el('<div class="card"><h2>'+esc(t('handoff_createLocation'))+'</h2>' +
        (role==='admin' ? '<div class="field"><select id="hLoc">'+(state.meta.locations||[]).map(function(l){return '<option value="'+l.id+'">'+esc(l.city+' — '+l.name)+'</option>';}).join('')+'</select></div>' : '') +
        '<button class="btn" id="hCreateLoc">'+esc(t('handoff_createLocation'))+'</button><div id="hLocMsg"></div></div>');
      body.appendChild(lc);
      qs('#hCreateLoc', lc).addEventListener('click', function(){
        var lid = role==='admin' ? qs('#hLoc',lc).value : locId;
        api('createHandoff', {kind:'location_to_cluster', locationId: lid}).then(function(res2){
          qs('#hLocMsg',lc).innerHTML = res2.ok ? '<div class="msg ok">'+esc(t('ok_saved'))+'</div>' : '<div class="msg err">'+esc(errMsg_(res2))+'</div>';
          if(res2.ok) render();
        });
      });
    }

    if (role==='cluster_manager' || role==='admin'){
      var myCluster = (state.meta.clusters||[]).find(function(c){ return c.clusterManagerUserId===state.user.id; });
      var cc = el('<div class="card"><h2>'+esc(t('handoff_createCluster'))+'</h2>' +
        (role==='admin' ? '<div class="field"><select id="hClu">'+(state.meta.clusters||[]).map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>';}).join('')+'</select></div>' : '') +
        '<button class="btn" id="hCreateClu">'+esc(t('handoff_createCluster'))+'</button><div id="hCluMsg"></div></div>');
      body.appendChild(cc);
      qs('#hCreateClu', cc).addEventListener('click', function(){

        api('createHandoff', {kind:'cluster_to_collector', clusterId: cid}).then(function(res2){
          qs('#hCluMsg',cc).innerHTML = res2.ok ? '<div class="msg ok">'+esc(t('ok_saved'))+'</div>' : '<div class="msg err">'+esc(errMsg_(res2))+'</div>';
          if(res2.ok) render();
        });
      });
    }

    if (role==='collector' || role==='admin'){
      var dc = el('<div class="card"><h2>'+esc(t('handoff_deposit'))+'</h2>' +
        '<div class="field"><label>'+esc(t('handoff_bankRef'))+'</label><input id="hBankRef"></div>' +
        '<div class="field"><label>'+esc(t('handoff_slip'))+'</label>' +
          '<div class="row">' +
            '<button type="button" class="btn secondary" id="hSlipCameraBtn">'+esc(t('handoff_takePhoto'))+'</button>' +
            '<button type="button" class="btn secondary" id="hSlipFileBtn">'+esc(t('handoff_chooseFile'))+'</button>' +
          '</div>' +
          '<input id="hSlipCamera" type="file" accept="image/*" capture="environment" hidden>' +
          '<input id="hSlipFile" type="file" accept="image/*" hidden>' +
          '<img id="hSlipPreview" hidden style="max-width:160px;max-height:160px;border-radius:8px;margin-top:8px;display:block;">' +
        '</div>' +
        '<button class="btn" id="hDeposit">'+esc(t('handoff_deposit'))+'</button><div id="hDepMsg"></div></div>');
      body.appendChild(dc);

      var pickedFile = null;
      var preview = qs('#hSlipPreview', dc);
      function onPicked(input){
        return function(){
          var f = input.files && input.files[0];
          if (!f) return;
          pickedFile = f;
          var reader = new FileReader();
          reader.onload = function(){ preview.src = reader.result; preview.hidden = false; };
          reader.readAsDataURL(f);
        };
      }
      qs('#hSlipCameraBtn', dc).addEventListener('click', function(){ qs('#hSlipCamera', dc).click(); });
      qs('#hSlipFileBtn', dc).addEventListener('click', function(){ qs('#hSlipFile', dc).click(); });
      qs('#hSlipCamera', dc).addEventListener('change', onPicked(qs('#hSlipCamera', dc)));
      qs('#hSlipFile', dc).addEventListener('change', onPicked(qs('#hSlipFile', dc)));

      qs('#hDeposit', dc).addEventListener('click', function(){
        var bankRef = qs('#hBankRef', dc).value;

          var payload = { bankReference: bankRef };
          if (fileData) { payload.fileBase64 = fileData.base64; payload.fileName = fileData.name; payload.fileMime = fileData.mime; }
          api('recordDeposit', payload).then(function(res2){
            qs('#hDepMsg',dc).innerHTML = res2.ok ? '<div class="msg ok">'+esc(t('ok_saved'))+'</div>' : '<div class="msg err">'+esc(errMsg_(res2))+'</div>';
            if(res2.ok) render();
          });
        }
        if (pickedFile){
          var reader = new FileReader();
          reader.onload = function(){
            var base64 = reader.result.split(',')[1];
            submit({ base64: base64, name: pickedFile.name, mime: pickedFile.type });
          };
          reader.readAsDataURL(pickedFile);
        } else {
          submit(null);
        }
      });
    }

    // lists
    // Admin can confirm/dispute on behalf of an unavailable receiver — a
    // real, tested backend capability (actionConfirmHandoff_/
    // actionDisputeHandoff_ relax the toUserId check for admin only, see
    // CLAUDE.md "conflict of interest"). Restricting this list to
    // toUserId===me for everyone, admin included, would leave that
    // capability with no way to actually reach it, so admin sees every
    // pending handoff here, not just their own.
    // One bar over all three lists on this screen: what you are looking for
    // is a handoff, not "a handoff in the third card".
    var hFilter = listFilters_({
      fields: ['text','date','area','branch','payment','movement','status','person','amount'],
      status: [['pending', t('handoff_pending')], ['confirmed', t('handoff_confirmed')],
        ['disputed', t('handoff_disputed')], ['rejected', t('handoff_rejected')], ['deposit', t('st_deposited')]],
      people: (state.meta.users||[]).map(function(u){ return [u.id, u.name]; }),
      labels: { person: 'handoff_from' },
      onChange: function(){ renderHandoffs(body); }
    });
    body.appendChild(hFilter.node);
    function hNorm(h){
      return {
        date: (h.createdAt||'').slice(0,10), locationId: h.locationId || null, amount: Number(h.amount||0),
        people: [h.fromUserId, h.toUserId].filter(Boolean),
        status: h.kind === 'deposit' ? 'deposit' : h.status,
        pay: (function(b){ b = b || {};
          return { cash: Number(b.storeCash||0) + Number(b.carCash||0) + Number(b.posCash||0) > 0, pos: Number(b.posSales||0) > 0,
            credit: Number(b.creditSales||0) > 0, delivery: Number(b.deliveryFee||0) > 0, other: Number(b.otherCash||0) > 0,
            expense: Number(b.expenses||0) > 0, deposit: Number(b.directDeposit||0) > 0 || h.kind === 'deposit' }; })(h.breakdown),
        text: [userName(h.fromUserId), userName(h.toUserId), t('kind_'+h.kind), t('handoff_'+h.status),
          locationName(h.locationId), h.bankReference, h.note, money(h.amount)].join(' ')
      };
    }
    var visible = res.handoffs.filter(function(h){ return hFilter.match(hNorm(h)); });
    var pending = visible.filter(function(h){ return h.status==='pending' && (h.toUserId===state.user.id || role==='admin'); });
    var disputed = visible.filter(function(h){ return h.status==='disputed'; });
    var history = visible.filter(function(h){ return pending.indexOf(h)<0; });
    setNotifCount(pending.length + ((role==='admin'||role==='finance') ? disputed.length : 0));

    if (pending.length){
      var pc = el('<div class="card"><h2>'+esc(t('handoff_pending'))+'</h2><div id="pList"></div></div>');
      body.appendChild(pc);
      var pl = qs('#pList', pc);
      pending.forEach(function(h){ pl.appendChild(handoffItem(h, true)); });
    }

    if (disputed.length && (role==='admin' || role==='finance')){
      var dcw = el('<div class="card"><h2>'+esc(t('handoff_disputed'))+'</h2><div id="dList"></div></div>');
      body.appendChild(dcw);
      var dl = qs('#dList', dcw);
      disputed.forEach(function(h){ dl.appendChild(handoffItem(h, false, true)); });
    }

    var hc = el('<div class="card"><h2>'+esc(t('nav_handoffs'))+'</h2><div id="hList"></div></div>');
    body.appendChild(hc);
    var hl = qs('#hList', hc);
    if (!history.length){ hl.innerHTML = '<div class="'+(hFilter.active() ? 'lf-empty' : 'muted')+'">'+esc(t(hFilter.active() ? 'lf_noMatch' : 'noData'))+'</div>'; }
    history.slice(0,40).forEach(function(h){ hl.appendChild(handoffItem(h, false, false)); });
  });
}

// ---------------- small viz helpers (no chart library — self-contained app) ----------------

// A <table> that re-sorts itself in place when a header is clicked. Column
// defs: {key, label, render?(row)->html, numeric?}. Keeps its own sort
// state via closures, so callers just call sortableTable(...).el once.
function sortableTable(rows, columns, opts){
  opts = opts || {};
  var sortKey = opts.sortKey || columns[0].key;
  var sortDir = opts.sortDir || 'desc';
  var wrap = el('<div></div>');
  function render(){
    var sorted = rows.slice().sort(function(a,b){
      var av = a[sortKey], bv = b[sortKey];
      var an = typeof av === 'number', bn = typeof bv === 'number';
      if (an || bn) {
        av = Number(av||0); bv = Number(bv||0);
        return sortDir==='asc' ? av-bv : bv-av;
      }
      av = String(av==null?'':av); bv = String(bv==null?'':bv);
      return sortDir==='asc' ? av.localeCompare(bv) : bv.localeCompare(av);
    });
    var thead = '<tr>'+columns.map(function(c){
      var arrow = c.key===sortKey ? (sortDir==='asc'?' ▲':' ▼') : '';
      return '<th data-key="'+c.key+'">'+esc(c.label)+arrow+'</th>';
    }).join('')+'</tr>';
    var tbody = sorted.map(function(r){
      return '<tr>'+columns.map(function(c){ return '<td>'+(c.render?c.render(r):esc(r[c.key])) +'</td>'; }).join('')+'</tr>';
    }).join('');
    wrap.innerHTML = (rows.length ? '<table><thead>'+thead+'</thead><tbody>'+tbody+'</tbody></table>' : '<div class="muted">'+esc(t('noData'))+'</div>');
    qsa('th[data-key]', wrap).forEach(function(th){
      th.addEventListener('click', function(){
        var k = th.getAttribute('data-key');
        if (sortKey===k) sortDir = sortDir==='asc'?'desc':'asc'; else { sortKey=k; sortDir='desc'; }
        render();
      });
    });
  }
  render();
  return wrap;
}

// Horizontal bar list (e.g. top products) — two stacked bars per row (cash / pos).
function barList(rows, labelFn, cashFn, posFn, creditFn){
  creditFn = creditFn || function(){ return 0; };
  var max = Math.max.apply(null, rows.map(function(r){ return cashFn(r)+posFn(r)+creditFn(r); }).concat([1]));
  var wrap = el('<div class="barlist"></div>');
  rows.forEach(function(r){
    var cash = cashFn(r), pos = posFn(r), credit = creditFn(r), total = cash+pos+credit;
    var item = el('<div>' +
      '<div class="row-label"><span>'+esc(labelFn(r))+'</span><span>'+money(total)+'</span></div>' +
      '<div class="track"><div class="fill" style="width:'+(max? (cash/max*100):0)+'%;display:inline-block;"></div>' +
      '<div class="fill pos" style="width:'+(max? (pos/max*100):0)+'%;display:inline-block;"></div>' +
      '<div class="fill credit" style="width:'+(max? (credit/max*100):0)+'%;display:inline-block;"></div></div>' +
    '</div>');
    wrap.appendChild(item);
  });
  return wrap;
}

// Minimal inline SVG bar chart for a date trend — no charting library, self
// contained like the rest of this app.
function trendChart(rows){
  if (!rows.length) return el('<div class="muted">'+esc(t('noData'))+'</div>');
  var w = 700, h = 210, padX = 18, padTop = 26, padBottom = 30;
  var max = Math.max.apply(null, rows.map(function(r){ return r.total; }).concat([1]));
  var stepX = rows.length > 1 ? (w - padX * 2) / (rows.length - 1) : 0;
  function xAt(i){ return rows.length > 1 ? padX + i * stepX : w / 2; }
  function yAt(v){ return h - padBottom - (v / max) * (h - padTop - padBottom); }
  var uid = 'tg' + Math.random().toString(36).slice(2, 8);
  // horizontal guides at 0/50/100% of the peak
  var grid = [0, 0.5, 1].map(function(f){
    var y = yAt(max * f);
    return '<line x1="'+padX+'" y1="'+y+'" x2="'+(w-padX)+'" y2="'+y+'" stroke="var(--border)" stroke-width="1" stroke-dasharray="'+(f===0?'0':'3 5')+'"/>' +
      // no value labels on the guides: the svg is stretched to fill its card
      // (preserveAspectRatio=none), which distorts text. The peak label and the
      // hover readout carry the numbers instead.
      '';
  }).join('');
  var line = rows.map(function(r,i){ return (i ? 'L' : 'M') + xAt(i) + ' ' + yAt(r.total); }).join(' ');
  var area = line + ' L' + xAt(rows.length-1) + ' ' + (h - padBottom) + ' L' + xAt(0) + ' ' + (h - padBottom) + ' Z';
  var pts = rows.map(function(r,i){
    return '<circle class="pt" cx="'+xAt(i)+'" cy="'+yAt(r.total)+'" r="3.5" fill="#fff" stroke="var(--green)" stroke-width="2.5"/>';
  }).join('');
  // one invisible column per point: the click/hover target (and what the
  // dashboard binds its drill-down to, in row order)
  var hitW = rows.length > 1 ? stepX : (w - padX * 2);
  var hits = rows.map(function(r,i){
    return '<rect class="hit" x="'+(xAt(i)-hitW/2)+'" y="'+padTop+'" width="'+hitW+'" height="'+(h-padTop-padBottom)+'" data-i="'+i+'"><title>'+esc(r.date)+': '+esc(money(r.total))+'</title></rect>';
  }).join('');
  var labels = rows.map(function(r,i){
    var show = rows.length <= 8 || i === 0 || i === rows.length-1 || i === Math.floor(rows.length/2);
    return show ? '<text x="'+xAt(i)+'" y="'+(h-9)+'" font-size="9.5" fill="var(--muted)" text-anchor="middle">'+esc(String(r.date).slice(5))+'</text>' : '';
  }).join('');
  var peak = rows.reduce(function(a,b){ return b.total > a.total ? b : a; }, rows[0]);
  var peakI = rows.indexOf(peak);
  var peakLabel = '<text x="'+xAt(peakI)+'" y="'+(yAt(peak.total)-11)+'" font-size="10.5" font-weight="800" fill="var(--green-dark)" text-anchor="middle">'+esc(money(peak.total))+'</text>';
  var wrap = el('<div class="chart-wrap">' +
    '<svg class="trend-svg" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" role="img">' +
      '<defs><linearGradient id="'+uid+'" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="var(--green)" stop-opacity=".32"/>' +
        '<stop offset="100%" stop-color="var(--green)" stop-opacity=".02"/></linearGradient></defs>' +
      grid +

      pts + peakLabel + labels + hits +
    '</svg><div class="chart-tip"></div></div>');
  // hover readout
  var tip = qs('.chart-tip', wrap), svg = qs('svg', wrap), circles = qsa('.pt', wrap);
  qsa('.hit', wrap).forEach(function(hit, i){
    hit.addEventListener('mouseenter', function(){
      var box = svg.getBoundingClientRect(), wrapBox = wrap.getBoundingClientRect();
      tip.innerHTML = '<span class="v">'+esc(money(rows[i].total))+'</span> · '+esc(rows[i].date);
      tip.style.left = (box.left - wrapBox.left + (xAt(i) / w) * box.width) + 'px';
      tip.style.top = (box.top - wrapBox.top + (yAt(rows[i].total) / h) * box.height) + 'px';
      tip.classList.add('on');
      if (circles[i]) circles[i].classList.add('on');
    });
    hit.addEventListener('mouseleave', function(){ tip.classList.remove('on'); if (circles[i]) circles[i].classList.remove('on'); });
  });
  return wrap;
}

// Inline SVG donut with a legend — segments: [{label, value, color}].
function donutChart(segments){
  segments = segments.filter(function(s){ return s.value > 0; });
  var total = segments.reduce(function(s,x){ return s+x.value; }, 0);
  if (!total) return el('<div class="muted">'+esc(t('dash_noData'))+'</div>');
  var r = 54, cx = 70, cy = 70, circumference = 2*Math.PI*r;
  var offset = 0;
  var arcs = segments.map(function(seg){
    var frac = seg.value/total;
    var len = frac*circumference;
    var circle = '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+seg.color+'" stroke-width="20" ' +
      'stroke-dasharray="'+len+' '+(circumference-len)+'" stroke-dashoffset="'+(-offset)+'"><title>'+esc(seg.label)+': '+money(seg.value)+'</title></circle>';
    // Percentage data label at the arc's own midpoint — computed in the
    // same (pre-rotation) coordinate space as the circle itself, so the
    // whole svg's CSS rotate(-90deg) carries the label along with its arc
    // automatically. Skipped under 8% share: too thin a slice for the
    // text to sit on without spilling into its neighbors.
    var pct = Math.round(frac*100);
    var label = '';
    if (frac >= 0.08) {
      var midAngle = ((offset + len/2) / circumference) * 2*Math.PI;
      var lx = cx + r*Math.cos(midAngle), ly = cy + r*Math.sin(midAngle);
      label = '<text x="'+lx+'" y="'+ly+'" font-size="11" font-weight="800" fill="#fff" text-anchor="middle" ' +
        'dominant-baseline="middle" transform="rotate(90 '+lx+' '+ly+')">'+pct+'%</text>';
    }
    offset += len;
    return circle + label;
  }).join('');
  var svg = '<svg viewBox="0 0 140 140" width="140" height="140" style="transform:rotate(-90deg)">'+arcs+'</svg>';
  var legend = '<div class="donut-legend">'+segments.map(function(seg){
    var pct = Math.round(seg.value/total*100);
    return '<div class="donut-legend-row"><span class="dot" style="background:'+seg.color+'"></span>' +
      '<span class="dl-label">'+esc(seg.label)+'</span><span class="dl-val">'+money(seg.value)+' ('+pct+'%)</span></div>';
  }).join('')+'</div>';
  return el('<div class="donut-wrap">'+svg+legend+'</div>');
}

// Multi-series inline SVG line chart — series: [{label, color, values:[...]}]
// all aligned to the same `dates` array. Same no-library, self-contained
// approach as trendChart/donutChart above.
function lineChart(dates, series){
  var w = 700, h = 200, pad = 28;
  if (!dates.length || !series.length) return el('<div class="muted">'+esc(t('noData'))+'</div>');
  var max = Math.max.apply(null, series.reduce(function(acc,s){ return acc.concat(s.values); }, []).concat([1]));
  var stepX = dates.length > 1 ? (w - pad*2) / (dates.length - 1) : 0;
  function xAt(i){ return pad + i*stepX; }
  function yAt(v){ return h - pad - (max>0 ? (v/max)*(h-pad*2) : 0); }
  var lines = series.map(function(s){
    var points = s.values.map(function(v,i){ return xAt(i)+','+yAt(v); }).join(' ');
    var dots = s.values.map(function(v,i){
      return '<circle cx="'+xAt(i)+'" cy="'+yAt(v)+'" r="2.5" fill="'+s.color+'"><title>'+esc(s.label)+' — '+esc(dates[i])+': '+money(v)+'</title></circle>';
    }).join('');
    return '<polyline points="'+points+'" fill="none" stroke="'+s.color+'" stroke-width="2"/>'+dots;
  }).join('');
  var baseline = '<line x1="'+pad+'" y1="'+(h-pad)+'" x2="'+(w-pad)+'" y2="'+(h-pad)+'" stroke="var(--border)" stroke-width="1"/>';
  var firstLabel = '<text x="'+pad+'" y="'+(h-6)+'" font-size="10" fill="var(--muted)">'+esc(dates[0])+'</text>';
  var lastLabel = dates.length>1 ? '<text x="'+(w-pad)+'" y="'+(h-6)+'" font-size="10" fill="var(--muted)" text-anchor="end">'+esc(dates[dates.length-1])+'</text>' : '';
  var svg = '<svg class="trend-svg" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+baseline+lines+firstLabel+lastLabel+'</svg>';
  var legend = '<div class="donut-legend">'+series.map(function(s){
    var last = s.values[s.values.length-1];
    return '<div class="donut-legend-row"><span class="dot" style="background:'+s.color+'"></span>' +
      '<span class="dl-label">'+esc(s.label)+'</span><span class="dl-val">'+money(last)+'</span></div>';
  }).join('')+'</div>';
  return el('<div>'+svg+legend+'</div>');
}

// A row of small KPI tiles — [[value, label], ...], value pre-formatted.
function kpiRow(items){
  return el('<div class="kpi-grid">'+items.map(function(it){
    return '<div class="kpi"><div class="n">'+esc(it[0])+'</div><div class="l">'+esc(it[1])+'</div></div>';
  }).join('')+'</div>');
}

// One line of a period-over-period comparison — current figure large and
// prominent, previous figure as context underneath, and a colored up/down
// percentage badge (0% previous with something now reads as +100%, not a
// divide-by-zero NaN).
function comparisonRow_(label, current, previous){
  var delta = current - previous;
  var pct = previous > 0 ? (delta / previous * 100) : (current > 0 ? 100 : 0);
  var up = delta >= 0;
  var color = up ? 'var(--ok)' : 'var(--danger)';
  var arrow = up ? '▲' : '▼';
  return '<div class="row" style="justify-content:space-between;align-items:center;padding:10px 0;border-top:1px dashed var(--border-soft);">' +
    '<div><div class="muted" style="font-size:12px;">'+esc(label)+'</div>' +
      '<div style="font-size:18px;font-weight:800;">'+money(current)+'</div>' +
      '<div class="muted" style="font-size:11.5px;">'+esc(t('dash_comparisonPrevious'))+': '+money(previous)+'</div></div>' +
    '<div style="color:'+color+';font-weight:800;font-size:15px;white-space:nowrap;">'+arrow+' '+Math.abs(Math.round(pct))+'%</div>' +
  '</div>';
}
