<style>
  :root{
    --green:#4D6D51; --green-dark:#3b5540; --green-pale:#e7ede8; --cream:#F2EEE4;
    --bg:#f6f5f1; --card:#ffffff; --text:#20241f; --muted:#767b71; --muted-2:#98988f;
    --border:#e7e3d7; --border-soft:#f0ede4; --danger:#c14a30; --danger-bg:#fbe7e1;
    --warn:#b3820f; --warn-bg:#fdf1d8; --ok:#2f7a45; --ok-bg:#e2f3e6;
    --radius:14px; --radius-sm:9px; --radius-lg:20px;
    --shadow-sm:0 1px 2px rgba(32,36,31,.05), 0 1px 1px rgba(32,36,31,.04);
    --shadow-md:0 4px 14px rgba(32,36,31,.07), 0 1px 3px rgba(32,36,31,.05);
    --shadow-lg:0 12px 32px rgba(32,36,31,.12), 0 2px 6px rgba(32,36,31,.06);
    --font-en:'Inter',-apple-system,'Segoe UI',Tahoma,Arial,sans-serif;
    --font-ar:'Cairo','Inter',-apple-system,'Segoe UI','Geeza Pro',Arial,sans-serif;
  }
  /* Without this, mobile browsers keep their default double-tap-to-zoom
     gesture on every element — so a tap that lands a few pixels off a
     button/card can register as the first half of a "double tap", and the
     page visibly zooms in on that spot. touch-action:manipulation drops
     that gesture (pinch-zoom still works) and the ~300ms tap-delay some
     browsers still add before dispatching click, on every element site-wide. */
  *{box-sizing:border-box;touch-action:manipulation;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-en);min-height:100vh;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;}
  html[dir="rtl"] body{font-family:var(--font-ar);letter-spacing:0;}
  ::selection{background:var(--green);color:#fff;}
  /* Flat #4D6D51, exactly the logo artwork's own background — the PNG has
     no transparency around the emblem, so anything but an exact match shows
     as a visible rectangle behind it. */
  .brand-page{background:var(--green);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;gap:22px;}
  /* No border/shadow/background treatment here on purpose (see c8610e1) —
     the source PNG's own background already matches .brand-page exactly, so
     any box decoration just draws the image's rectangular bounds as a seam.
     "More visible" instead means the artwork's own pixels: brighten and
     lift the contrast of the cream emblem/wordmark so it reads more boldly
     against the green, without touching the seamless edge at all. */
  .brand-logo{width:280px;max-width:65vw;display:block;filter:contrast(1.25) brightness(1.12) saturate(1.1);}
  header{background:var(--green);color:#fff;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;box-shadow:var(--shadow-md);position:relative;z-index:2;}
  header .brand{font-weight:800;font-size:36px;display:flex;align-items:center;gap:14px;letter-spacing:-.02em;min-width:0;flex-shrink:1;line-height:1.15;}
  /* LOGO_B64 is one full lockup (circular emblem + "BEST GAS CARRIER CO."
     wordmark + Arabic tagline stacked below it, 555x457) on a solid
     background that happens to match the header exactly (both var(--green))
     — so showing the whole image here at a small header height rendered the
     circular mark itself at barely half that height, with the wordmark/
     tagline beneath it too tiny to read and blending invisibly into the
     same-color header: the "logo" effectively read as a small, soft blob.
     .logo-mark crops to just the circular emblem (its bounding box in the
     source image is x:[148,392] y:[43,287], a 244x244 square — measured by
     sampling the PNG for non-background pixels) via a fixed-size round
     window with the source image scaled/offset so that box exactly fills
     it, then adds a ring + shadow for real contrast against the flat green
     header, independent of the source art. --logo-size drives both the
     window and the math together, so one number keeps them in sync. */
  header .brand .logo-mark{--logo-size:108px;width:var(--logo-size);height:var(--logo-size);border-radius:50%;overflow:hidden;flex-shrink:0;position:relative;box-shadow:0 3px 10px rgba(0,0,0,.35),0 0 0 3px rgba(255,255,255,.55);}
  header .brand .logo-mark img{position:absolute;max-width:none;width:calc(var(--logo-size) * 555 / 244);height:calc(var(--logo-size) * 457 / 244);left:calc(var(--logo-size) * -148 / 244);top:calc(var(--logo-size) * -43 / 244);}
  @media (max-width:700px){
    header .brand{font-size:20px;gap:9px;}
    header .brand .logo-mark{--logo-size:60px;}
  }
  header .who{font-size:13px;opacity:.85;font-weight:500;white-space:nowrap;padding-inline-end:12px;margin-inline-end:2px;border-inline-end:1px solid rgba(255,255,255,.22);}
  header .header-controls{display:flex;gap:8px;align-items:center;flex-wrap:nowrap;flex-shrink:0;}
  /* flex-shrink:0 on both: header-controls sits in the same flex row as the
     (sometimes long, Arabic) brand title, and a plain flex child has no
     guaranteed minimum size against its sibling — without this the browser
     can compress the select/button narrower than their own label needs
     before it ever wraps the row, silently clipping the text inside. */
  header select, header button{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:9px;padding:7px 12px;height:34px;font-size:13px;cursor:pointer;font-weight:600;transition:background .15s ease, transform .1s ease;font-family:inherit;box-sizing:border-box;flex-shrink:0;}
  /* appearance:none replaces the browser's own dropdown arrow with a fixed
     SVG chevron drawn in our own reserved padding. The native arrow's
     reserved width is OS/font-dependent and not something author CSS can
     measure — on some platforms it ate into the label text itself, most
     visibly clipping "العربية"/"English". With appearance:none the box's
     size is entirely ours: width:auto plus a safe min-width means it can
     only ever grow to fit a label, never shrink below a size that was
     already tested against every language, in every browser. */

  main{max-width:min(1500px, 94vw);margin:0 auto;padding:22px 18px 60px;}
  .card{background:var(--card);border:1px solid var(--border-soft);border-radius:var(--radius);padding:20px;margin-bottom:18px;overflow-x:auto;box-shadow:var(--shadow-sm);transition:box-shadow .2s ease;}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
  /* Body text/labels align to the reading direction's start (right for
     Arabic/Urdu, left for English) — the standard mobile-app convention —
     instead of sitting centered, which read as unusual/unbalanced above a
     left- or right-anchored input box. Purely decorative "hero" elements
     (the login/splash screen, big KPI numbers) are deliberately left
     centered elsewhere — that's a different, still-standard pattern. */
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;text-align:start;}

  .breakdown .bi{font-size:11.5px;color:var(--muted);}
  .breakdown .bi b{display:block;font-size:13.5px;color:var(--text);font-weight:700;margin-top:1px;}
  .details-toggle{background:none;border:none;color:var(--green);font-size:12px;font-weight:700;cursor:pointer;padding:0;margin-top:8px;font-family:inherit;}
  .details-toggle:hover{text-decoration:underline;}
  /* sortable / searchable table component */
  .tbl-search{position:relative;margin-bottom:12px;max-width:320px;}
  .tbl-search input{padding-inline-start:36px;border-radius:999px;background:var(--bg);}
  .tbl-search::before{content:'';position:absolute;top:50%;inset-inline-start:13px;transform:translateY(-50%);width:14px;height:14px;border:2px solid var(--muted-2);border-radius:50%;pointer-events:none;}
  .tbl-search::after{content:'';position:absolute;top:60%;inset-inline-start:23px;width:6px;height:2px;background:var(--muted-2);transform:rotate(45deg);pointer-events:none;}
  html[dir="rtl"] .tbl-search::after{inset-inline-start:auto;inset-inline-end:23px;transform:rotate(-45deg);}
  .tbl-scroll{overflow-x:auto;}
  th.sortable{cursor:pointer;user-select:none;white-space:nowrap;}
  th.sortable:hover{color:var(--green-dark);}
  th.sortable .arrow{color:var(--green);margin-inline-start:3px;}

  /* Small phones — tighten spacing to reclaim width rather than relying on
     auto-fit grids alone, and keep the header from feeling cramped once the
     bell + language switch + logout are all fighting for the same row. */
  @media (max-width: 420px){
    main{padding:14px 10px 50px;}
    .card{padding:14px;}
    header{padding:10px 12px;gap:8px;}
    header .who{display:none;}
    .grid{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;}
    .login-card{padding:22px 18px 20px;}
    .brand-logo{width:150px;}
    table{font-size:12.5px;}
  }

  /* =====================================================================
     DESIGN SYSTEM v2 — shell, tiles, statements, drill-down drawer,
     collapsible sections, heartbeat loader. Layered after the original
     rules so it wins on equal specificity; the original component rules
     above still style forms/tables inside every screen.
     ===================================================================== */
  :root{
    --bg:#f4f3ee; --card:#ffffff; --text:#1c211d; --muted:#6f756c; --border:#e4e1d6; --border-soft:#efece3;
    --green:#4D6D51; --green-dark:#34503a; --green-deep:#23372a; --green-pale:#e9efe9; --cream:#F2EEE4;
    --c-cash:#4D6D51; --c-pos:#3E7C8C; --c-credit:#B8862B; --c-delivery:#7A5C8E; --c-vat:#5E7A99;
    --c-deposit:#2F7A45; --c-hold:#B3820F; --c-danger:#C14A30;
    --radius:16px; --radius-lg:22px;
    --shadow-sm:0 1px 2px rgba(28,33,29,.05);
    --shadow-md:0 6px 20px rgba(28,33,29,.07), 0 1px 3px rgba(28,33,29,.05);
    --shadow-lg:0 18px 48px rgba(28,33,29,.16), 0 4px 12px rgba(28,33,29,.07);
    --sb-w:264px;
  }
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}
  /* The v2 components set display on many elements; [hidden] must still win. */
  [hidden]{display:none !important;}
  /* Every stroke icon gets a sane default size; containers override it. */
  svg.ic2{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:middle;}
  .doc-hero .ty svg.ic2{width:16px;height:16px;}
  .doc-sec h3 svg.ic2{width:16px;height:16px;color:var(--green);}

  /* ---------- App shell ---------- */
  #app.shell{display:grid;grid-template-columns:var(--sb-w) minmax(0,1fr);min-height:100vh;}
  .sb{position:sticky;top:0;height:100vh;overflow-y:auto;background:linear-gradient(180deg,#3f5c43 0%,#2c4431 55%,#22362a 100%);color:#fff;display:flex;flex-direction:column;padding:18px 14px;gap:18px;z-index:30;}
  .sb::-webkit-scrollbar{width:0;}
  .sb-brand{display:flex;align-items:center;gap:12px;padding:4px 6px 14px;border-bottom:1px solid rgba(255,255,255,.1);}
  .emblem{--s:46px;display:inline-block;vertical-align:middle;width:var(--s);height:var(--s);border-radius:50%;overflow:hidden;position:relative;flex-shrink:0;box-shadow:0 0 0 2px rgba(242,238,228,.55),0 6px 16px rgba(0,0,0,.28);background:var(--green);}
  .emblem img{position:absolute;max-width:none;width:calc(var(--s) * 555 / 244);height:calc(var(--s) * 457 / 244);left:calc(var(--s) * -148 / 244);top:calc(var(--s) * -43 / 244);}
  .sb-brand .t1{font-weight:800;font-size:15.5px;line-height:1.25;}
  .sb-brand .t2{font-size:11.5px;opacity:.65;margin-top:2px;}
  .sb-nav{display:flex;flex-direction:column;gap:3px;}
  .sb-sec{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.45;padding:6px 12px 4px;}
  .sb-item{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:rgba(255,255,255,.8);font-size:14px;font-weight:600;cursor:pointer;position:relative;transition:background .15s ease,color .15s ease;}
  .sb-item:hover{background:rgba(255,255,255,.08);color:#fff;}
  .sb-item:focus-visible{outline:2px solid var(--cream);outline-offset:2px;}
  .sb-item svg{width:20px;height:20px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
  .sb-item.active{background:var(--cream);color:var(--green-deep);box-shadow:0 4px 14px rgba(0,0,0,.18);}
  .sb-item .pill{margin-inline-start:auto;background:var(--c-danger);color:#fff;border-radius:999px;font-size:10.5px;font-weight:800;min-width:20px;height:20px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;}
  .sb-user{margin-top:auto;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;}
  .sb-user .who2{display:flex;align-items:center;gap:10px;min-width:0;}
  .avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--cream),#d9d2bf);color:var(--green-deep);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .sb-user .nm{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sb-user .rl{font-size:11.5px;opacity:.65;}
  .sb-user .ctl{display:flex;gap:8px;}
  .sb-user select,.sb-user .out{flex:1;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.1);color:#fff;font-size:12.5px;font-weight:600;padding:0 10px;cursor:pointer;min-width:0;}
  .sb-user select option{color:#1c211d;}
  .sb-user .out:hover{background:rgba(255,255,255,.18);}

  .col{min-width:0;display:flex;flex-direction:column;}
  .tb{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 32px;background:rgba(244,243,238,.86);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--border);}
  .tb-title{min-width:0;}
  .tb-title h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tb-title .sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .tb-actions{display:flex;align-items:center;gap:10px;}
  .tb-brand{display:none;}
  .icon-btn{all:unset;box-sizing:border-box;width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;position:relative;color:var(--text);transition:box-shadow .15s ease,transform .1s ease;}
  .icon-btn:hover{box-shadow:var(--shadow-md);}
  .icon-btn:active{transform:scale(.95);}
  .icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
  .icon-btn .notif-badge{top:-3px;inset-inline-end:-3px;}
  .tb .icon-btn.notif-bell{padding:0 !important;}
  .tb .icon-btn.notif-bell svg{stroke:currentColor;width:20px;height:20px;}
  .doc-link{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--green-dark);background:var(--green-pale);border-radius:999px;padding:5px 11px;margin-top:8px;}
  .doc-link svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;}
  .doc-link:hover{background:#dbe6dc;}
  .shell main,#app.shell main{max-width:1480px;width:100%;margin:0 auto;padding:26px 32px 56px;}
  .bt,.tb-menu{display:none;}

  /* tablet: icon rail */
  @media (max-width:1100px) and (min-width:701px){
    #app.shell{grid-template-columns:78px minmax(0,1fr);}
    .sb{padding:16px 10px;align-items:center;}
    .sb-brand{padding:4px 0 12px;border-bottom:0;}
    .sb-brand .txt,.sb-sec,.sb-item .lbl,.sb-user .nm,.sb-user .rl,.sb-user select{display:none;}
    .sb-item{justify-content:center;width:52px;height:48px;padding:0;}
    .sb-item .pill{position:absolute;top:4px;inset-inline-end:4px;min-width:16px;height:16px;font-size:9.5px;padding:0 4px;}
    .sb-user{padding:8px;align-items:center;background:transparent;border:0;}
    .sb-user .ctl{flex-direction:column;}
    .sb-user .out{flex:none;width:42px;padding:0;font-size:0;}
    .sb-user .out svg{display:block;margin:auto;}
    .shell main,#app.shell main{padding:22px 22px 48px;}
    .tb{padding:12px 22px;}
  }
  .sb-user .out svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:none;}

  /* phone: app bar + bottom tabs */
  @media (max-width:700px){
    #app.shell{grid-template-columns:minmax(0,1fr);}
    .sb{display:none;}
    .tb{background:linear-gradient(180deg,#3f5c43,#34503a);color:#fff;border-bottom:0;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));box-shadow:0 4px 18px rgba(0,0,0,.15);}
    .tb-brand{display:block;flex-shrink:0;line-height:0;}
    .tb-brand .emblem{--s:38px;}
    .tb-left{display:flex;align-items:center;gap:10px;min-width:0;}
    .tb-title h1{font-size:17px;color:#fff;}
    .tb-title .sub{color:rgba(255,255,255,.7);font-size:11.5px;}
    .tb .icon-btn{width:38px;height:38px;background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.18);color:#fff;}
    .tb-menu{display:inline-flex;}
    .shell main,#app.shell main{padding:16px 14px calc(96px + env(safe-area-inset-bottom));}
    .bt{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;bottom:0;inset-inline:0;z-index:40;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 22px rgba(0,0,0,.06);}
    .bt-scroll button{all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:7px 2px;border-radius:14px;color:var(--muted);font-size:10.5px;font-weight:700;cursor:pointer;position:relative;min-width:0;}
    .bt-scroll button span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .bt-scroll button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s ease;}
    .bt-scroll button.active{color:var(--green-dark);background:var(--green-pale);}
    .bt-scroll button.active svg{transform:translateY(-1px) scale(1.08);}
    .bt-scroll button .pill{position:absolute;top:3px;inset-inline-end:calc(50% - 20px);background:var(--c-danger);color:#fff;border-radius:999px;font-size:9.5px;font-weight:800;min-width:16px;height:16px;padding:0 4px;display:flex;align-items:center;justify-content:center;}
  }

  /* ---------- Page sections ---------- */
  .sec-title{display:flex;align-items:center;gap:10px;margin:30px 2px 14px;font-size:15px;font-weight:800;letter-spacing:-.01em;}
  .sec-title:first-child{margin-top:0;}
  .sec-title .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px var(--green-pale);}
  .sec-title .note{margin-inline-start:auto;font-size:12px;font-weight:600;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:999px;padding:4px 10px;}
  .g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;}
  .g2 > .card, .g2 > .statement{margin-bottom:0;}
  @media (max-width:1100px){ .g2{grid-template-columns:minmax(0,1fr);} }
  .stack{display:flex;flex-direction:column;gap:18px;}
  .card{border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow-sm);}
  .card h2{font-size:15px;}

  /* ---------- Tiles ---------- */
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:18px;}
  @media (max-width:700px){ .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;} }
  .tile{--c:var(--green);position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 16px 14px;overflow:hidden;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:10px;min-width:0;text-align:start;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;}
  .tile::before{content:'';position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:var(--c);opacity:.85;}
  .tile.click{cursor:pointer;}
  .tile.click:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:color-mix(in srgb,var(--c) 35%,var(--border));}
  .tile.click:focus-visible{outline:2px solid var(--c);outline-offset:2px;}
  .tile .top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .tile .ic{width:36px;height:36px;border-radius:11px;background:color-mix(in srgb,var(--c) 13%,#fff);color:var(--c);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .tile .ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .tile .go{color:var(--muted);opacity:.55;transition:opacity .15s ease,transform .15s ease;}
  .tile .go svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;}
  html[dir="rtl"] .tile .go svg{transform:scaleX(-1);}
  .tile.click:hover .go{opacity:1;color:var(--c);}
  .tile .lb{font-size:12.5px;font-weight:600;color:var(--muted);line-height:1.35;}
  .tile .vl{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tile .ft{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;}
  .tile .spark{height:28px;margin-top:-4px;}
  @media (max-width:700px){ .tile{padding:13px 12px 12px;gap:8px;} .tile .vl{font-size:18px;} .tile .ic{width:30px;height:30px;border-radius:9px;} .tile .ic svg{width:16px;height:16px;} }

  /* ---------- Statement (replaces + − = formula cards) ---------- */
  .statement{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);overflow:hidden;margin-bottom:18px;display:flex;flex-direction:column;}
  .st-head{padding:20px 22px 16px;background:linear-gradient(135deg,color-mix(in srgb,var(--c,var(--green)) 9%,#fff),#fff 70%);border-bottom:1px solid var(--border-soft);}
  .st-head .k{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted);}
  .st-head .k .badge2{font-size:11px;font-weight:700;color:var(--c,var(--green));background:color-mix(in srgb,var(--c,var(--green)) 12%,#fff);border-radius:999px;padding:3px 9px;}
  .st-head .v{font-size:32px;font-weight:800;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums;color:var(--text);}
  .st-head .v small{font-size:13px;font-weight:700;color:var(--muted);margin-inline-start:6px;}
  .st-head .cap{font-size:12px;color:var(--muted);margin-top:2px;}
  .st-bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--border-soft);margin-top:14px;}
  .st-bar span{display:block;height:100%;transition:width .6s cubic-bezier(.2,.8,.2,1);}
  .st-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:9px;font-size:11.5px;color:var(--muted);font-weight:600;}
  .st-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:5px;vertical-align:middle;}
  .st-rows{padding:8px 10px 12px;}
  .st-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;min-height:48px;}
  .st-row + .st-row{border-top:1px dashed var(--border-soft);}
  .st-row.click{cursor:pointer;transition:background .12s ease;}
  .st-row.click:hover{background:#f7f6f1;}
  .st-row .sw{width:10px;height:10px;border-radius:3px;background:var(--c,var(--green));}
  .st-row .lb{font-size:13.5px;font-weight:600;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .st-row .lb .hint{font-size:11.5px;color:var(--muted);font-weight:500;width:100%;}
  .st-row .tag{font-size:10.5px;font-weight:800;border-radius:999px;padding:2px 8px;white-space:nowrap;}
  .st-row .tag.deduct{background:var(--danger-bg);color:var(--c-danger);}
  .st-row .tag.add{background:var(--ok-bg);color:var(--ok);}
  .st-row .amt{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .st-row.deduct .amt{color:var(--c-danger);}
  .st-row .chev{color:var(--muted);opacity:.4;}
  .st-row .chev svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;display:block;}
  html[dir="rtl"] .st-row .chev svg{transform:scaleX(-1);}
  .st-row.click:hover .chev{opacity:1;}
  .st-row.sub{border-top:1.5px solid var(--border) !important;margin-top:4px;}
  .st-row.sub .lb,.st-row.sub .amt{font-weight:800;}
  .st-row.final{background:color-mix(in srgb,var(--c,var(--green)) 10%,#fff);border:1px solid color-mix(in srgb,var(--c,var(--green)) 22%,#fff) !important;margin-top:8px;}
  .st-row.final .lb{font-weight:800;font-size:14.5px;}
  .st-row.final .amt{font-size:19px;color:var(--green-deep);}
  @media (max-width:700px){ .st-head{padding:16px 16px 14px;} .st-head .v{font-size:26px;} .st-rows{padding:6px 6px 10px;} .st-row{gap:9px;padding:10px 8px;} .st-row .amt{font-size:14px;} }

  /* ---------- List rows (holders, bars, recent) ---------- */
  .rows{display:flex;flex-direction:column;}
  .rrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:11px 8px;border-radius:12px;}
  .rrow + .rrow{border-top:1px dashed var(--border-soft);}
  .rrow.click{cursor:pointer;}
  .rrow.click:hover{background:#f7f6f1;}
  .rrow .mk{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--c,var(--green));background:color-mix(in srgb,var(--c,var(--green)) 12%,#fff);}
  .rrow .mk svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .rrow .t{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rrow .s{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rrow .bar{height:6px;border-radius:999px;background:var(--border-soft);margin-top:6px;overflow:hidden;display:flex;}
  .rrow .bar span{display:block;height:100%;}
  .rrow .a{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:end;}
  .rrow .chev{color:var(--muted);opacity:.35;}
  .rrow .chev svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;display:block;}
  html[dir="rtl"] .rrow .chev svg{transform:scaleX(-1);}
  .rrow.click:hover .chev{opacity:1;}

  /* ---------- Collapsible (auto-collapse big cards, tap to expand) ---------- */
  .cx > .cx-head{cursor:pointer;user-select:none;}
  .cx-head .cx-meta{margin-inline-start:auto;display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted);}
  .cx-head .cx-chev{width:28px;height:28px;border-radius:50%;background:var(--bg);border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;transition:transform .25s ease;}
  .cx-head .cx-chev svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;}
  .cx.collapsed .cx-head .cx-chev{transform:rotate(180deg);}
  .cx-body{position:relative;transition:max-height .35s ease;}
  .cx.collapsed .cx-body{max-height:190px;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,#000 45%,transparent);mask-image:linear-gradient(180deg,#000 45%,transparent);pointer-events:none;}
  .cx-more{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:10px;padding:9px;border-radius:12px;background:var(--bg);border:1px dashed var(--border);font-size:12.5px;font-weight:700;color:var(--green-dark);cursor:pointer;}
  .cx-more:hover{background:var(--green-pale);}

  /* ---------- Drawer (drill-down + documents) ---------- */
  .dr-scrim{position:fixed;inset:0;background:rgba(18,24,19,.42);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);z-index:80;opacity:0;transition:opacity .22s ease;}
  .dr-scrim.open{opacity:1;}
  .dr{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(600px,100vw);background:var(--bg);z-index:81;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;transform:translateX(104%);transition:transform .28s cubic-bezier(.2,.8,.2,1);}
  html[dir="rtl"] .dr{transform:translateX(-104%);}
  .dr.open,html[dir="rtl"] .dr.open{transform:none;}
  .dr-h{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--border);}
  .dr-h .ttl{min-width:0;flex:1;}
  .dr-h .ttl b{display:block;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dr-h .ttl span{display:block;font-size:12px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dr-h .icon-btn{width:38px;height:38px;}
  html[dir="rtl"] .dr-h .back svg{transform:scaleX(-1);}
  .dr-crumbs{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px 0;font-size:11.5px;color:var(--muted);}
  .dr-crumbs span+span::before{content:'›';margin-inline-end:6px;opacity:.6;}
  .dr-b{flex:1;overflow-y:auto;padding:16px;overscroll-behavior:contain;}
  .dr-f{padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:800;}
  .dr-f .lb{font-size:12.5px;color:var(--muted);font-weight:700;}
  .dr-f .v{font-size:18px;font-variant-numeric:tabular-nums;}
  @media (max-width:700px){
    .dr{top:auto;height:92vh;width:100vw;inset-inline:0;border-radius:22px 22px 0 0;transform:translateY(104%) !important;}
    .dr.open{transform:none !important;}
    .dr::before{content:'';position:absolute;top:7px;left:50%;width:42px;height:5px;margin-left:-21px;border-radius:999px;background:rgba(0,0,0,.18);}
    .dr-h{border-radius:22px 22px 0 0;padding-top:20px;}
  }
  .dr-search{position:relative;margin-bottom:12px;}
  .dr-search input{padding-inline-start:38px;height:44px;border-radius:12px;}
  .dr-search svg{position:absolute;top:50%;inset-inline-start:12px;width:18px;height:18px;margin-top:-9px;stroke:var(--muted);fill:none;stroke-width:2;}
  .dr-count{font-size:12px;color:var(--muted);font-weight:600;margin:0 2px 8px;}
  .tx-list{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
  .tx-group{padding:10px 14px;font-size:11.5px;font-weight:800;color:var(--muted);background:#faf9f5;border-bottom:1px solid var(--border-soft);letter-spacing:.02em;}
  .tx{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;transition:background .12s ease;}
  .tx + .tx{border-top:1px solid var(--border-soft);}
  .tx:hover{background:#f8f7f2;}
  .tx .mk{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--c,var(--green));background:color-mix(in srgb,var(--c,var(--green)) 12%,#fff);}
  .tx .mk svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .tx .t{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tx .s{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tx .r{text-align:end;}
  .tx .a{font-size:14.5px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .tx .st{margin-top:3px;}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;border-radius:999px;padding:2px 8px;white-space:nowrap;background:var(--bg);color:var(--muted);}
  .chip::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
  .chip.ok{background:var(--ok-bg);color:var(--ok);}
  .chip.warn{background:var(--warn-bg);color:var(--warn);}
  .chip.bad{background:var(--danger-bg);color:var(--c-danger);}
  .chip.info{background:#e3eff2;color:var(--c-pos);}
  .more-btn{all:unset;box-sizing:border-box;display:block;width:100%;text-align:center;padding:12px;font-size:13px;font-weight:700;color:var(--green-dark);cursor:pointer;border-top:1px solid var(--border-soft);}

  /* document view */
  .doc-hero{background:linear-gradient(135deg,var(--green) 0%,var(--green-dark) 60%,var(--green-deep) 100%);color:#fff;border-radius:var(--radius-lg);padding:18px 20px;position:relative;overflow:hidden;margin-bottom:14px;}
  .doc-hero::after{content:'';position:absolute;width:220px;height:220px;border-radius:50%;inset-inline-end:-70px;top:-90px;background:radial-gradient(circle,rgba(242,238,228,.18),transparent 70%);}
  .doc-hero .ty{font-size:12px;font-weight:700;opacity:.8;display:flex;align-items:center;gap:8px;}
  .doc-hero .am{font-size:30px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
  .doc-hero .meta{font-size:12px;opacity:.78;margin-top:4px;}
  .doc-hero .chip{background:rgba(255,255,255,.16);color:#fff;}
  .doc-sec{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;}
  .doc-sec h3{margin:0 0 10px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.02em;display:flex;align-items:center;gap:8px;}
  .kv{display:grid;grid-template-columns:minmax(110px,40%) minmax(0,1fr);gap:9px 14px;font-size:13px;}
  .kv dt{color:var(--muted);font-weight:600;}
  .kv dd{margin:0;font-weight:700;word-break:break-word;}
  .tl{position:relative;padding-inline-start:22px;}
  .tl::before{content:'';position:absolute;top:8px;bottom:8px;inset-inline-start:7px;width:2px;background:var(--border);}
  .tl-step{position:relative;padding:8px 10px;border-radius:12px;margin-bottom:4px;}
  .tl-step::before{content:'';position:absolute;inset-inline-start:-20px;top:14px;width:12px;height:12px;border-radius:50%;background:var(--card);border:3px solid var(--c,var(--green));}
  .tl-step.click{cursor:pointer;}
  .tl-step.click:hover{background:#f7f6f1;}
  .tl-step .h{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .tl-step .d{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .tl-step.todo::before{border-style:dashed;border-color:var(--muted-2);}
  .tl-step.todo .h{color:var(--muted);}
  .slip-img{display:block;max-width:100%;border-radius:12px;border:1px solid var(--border);margin-top:8px;}

  /* ---------- Home hero ---------- */
  .hero{position:relative;overflow:hidden;border-radius:var(--radius-lg);padding:24px 26px;color:#fff;background:radial-gradient(120% 140% at 100% 0%,#5f8464 0%,var(--green) 38%,var(--green-dark) 70%,var(--green-deep) 100%);box-shadow:0 14px 34px rgba(52,80,58,.28);margin-bottom:18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;}
  .hero::before{content:'';position:absolute;inset-inline-end:-60px;bottom:-80px;width:260px;height:260px;border-radius:50%;border:34px solid rgba(242,238,228,.07);}
  .hero::after{content:'';position:absolute;inset-inline-end:90px;top:-50px;width:120px;height:120px;border-radius:50%;background:rgba(242,238,228,.06);}
  .hero .hi{font-size:13.5px;font-weight:700;opacity:.8;}
  .hero .nm{font-size:26px;font-weight:800;margin-top:2px;letter-spacing:-.01em;}
  .hero .rl{font-size:13px;opacity:.78;margin-top:2px;}
  .hero .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .hero .meta span{font-size:11.5px;font-weight:600;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:4px 10px;}
  .hero .cta{position:relative;z-index:1;display:flex;flex-direction:column;align-items:flex-end;gap:8px;text-align:end;}
  .hero .cta .big{font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;}
  .hero .cta .cap{font-size:12px;opacity:.8;max-width:180px;}
  .hero .cta button{all:unset;cursor:pointer;background:var(--cream);color:var(--green-deep);font-weight:800;font-size:13px;border-radius:999px;padding:9px 16px;box-shadow:0 6px 16px rgba(0,0,0,.18);}
  .hero .cta button:hover{transform:translateY(-1px);}
  .hero.splash{animation:bgcWelcomeIn .7s cubic-bezier(.2,.8,.2,1);}
  @media (max-width:700px){ .hero{grid-template-columns:minmax(0,1fr);padding:20px 18px;} .hero .nm{font-size:21px;} .hero .cta{align-items:flex-start;text-align:start;flex-direction:row;align-items:center;justify-content:space-between;} .hero .cta .big{font-size:30px;} }

  /* ---------- Loading: heartbeat emblem + silent top bar ---------- */
  #loadOverlay{background:rgba(244,243,238,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);}
  #loadOverlay .hb{position:relative;width:124px;height:124px;display:flex;align-items:center;justify-content:center;}
  #loadOverlay .ripple{position:absolute;inset:18px;border-radius:50%;border:2px solid var(--green);opacity:0;animation:bgcRipple 1.6s cubic-bezier(.2,.6,.3,1) infinite;}
  #loadOverlay .ripple.r2{animation-delay:.4s;}
  #loadOverlay .ring{width:92px;height:92px;box-shadow:var(--shadow-lg);position:relative;z-index:1;}
  #loadOverlay .ring-inner{width:80px;height:80px;overflow:hidden;position:relative;background:var(--green);animation:bgcHeartbeat 1.1s ease-in-out infinite;}
  #loadOverlay .ring-inner img{position:absolute;max-width:none;width:calc(80px * 555 / 244);height:calc(80px * 457 / 244);left:calc(80px * -148 / 244);top:calc(80px * -43 / 244);}
  #loadOverlay .pct{position:absolute;top:100%;left:50%;transform:translate(-50%,6px);font-size:12px;font-weight:800;color:var(--green-dark);background:var(--card);border-radius:999px;padding:2px 9px;box-shadow:var(--shadow-sm);white-space:nowrap;}
  @keyframes bgcHeartbeat{0%{transform:scale(1);}14%{transform:scale(1.13);}28%{transform:scale(1);}42%{transform:scale(1.08);}70%{transform:scale(1);}}
  @keyframes bgcRipple{0%{transform:scale(.8);opacity:.55;}100%{transform:scale(1.45);opacity:0;}}
  #topProgress{position:fixed;top:0;inset-inline:0;height:3px;z-index:9998;pointer-events:none;opacity:0;transition:opacity .25s ease;overflow:hidden;}
  #topProgress.active{opacity:1;}
  #topProgress::before{content:'';position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,var(--c-credit),var(--green),transparent);animation:bgcSlide 1.1s ease-in-out infinite;}
  @keyframes bgcSlide{0%{inset-inline-start:-40%;}100%{inset-inline-start:100%;}}
  @keyframes bgcFadeUp{0%{opacity:0;transform:translateY(8px);}100%{opacity:1;transform:none;}}
  @keyframes bgcRise{0%{opacity:0;transform:translateY(14px) scale(.985);}100%{opacity:1;transform:none;}}
  @keyframes bgcGrow{0%{transform:scaleX(0);}100%{transform:scaleX(1);}}
  /* One entrance per screen visit: cards rise in sequence, bars grow. */
  .fx-in .hero,.fx-in .statement,.fx-in .tile,.fx-in > .card,.fx-in .g2 > .card,.fx-in .sec-title{animation:bgcRise .55s cubic-bezier(.2,.8,.2,1) both;}
  .fx-in .tiles .tile:nth-child(1){animation-delay:.04s}.fx-in .tiles .tile:nth-child(2){animation-delay:.08s}.fx-in .tiles .tile:nth-child(3){animation-delay:.12s}.fx-in .tiles .tile:nth-child(4){animation-delay:.16s}
  .fx-in .tiles .tile:nth-child(5){animation-delay:.2s}.fx-in .tiles .tile:nth-child(6){animation-delay:.24s}.fx-in .tiles .tile:nth-child(7){animation-delay:.28s}.fx-in .tiles .tile:nth-child(8){animation-delay:.32s}
  .fx-in .g2 > :nth-child(2){animation-delay:.1s}
  .fx-in .st-bar span,.fx-in .rrow .bar span{animation:bgcGrow 1s cubic-bezier(.2,.8,.2,1) .15s both;transform-origin:left center;}
  html[dir="rtl"] .fx-in .st-bar span,html[dir="rtl"] .fx-in .rrow .bar span{transform-origin:right center;}
  /* richer surfaces */
  .tile{background:linear-gradient(180deg,#fff 0%,color-mix(in srgb,var(--c) 3%,#fff) 100%);}
  .tile::after{content:'';position:absolute;inset-inline-end:-30px;bottom:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 10%,transparent),transparent 70%);pointer-events:none;}
  .statement{box-shadow:0 1px 2px rgba(28,33,29,.04),0 10px 30px -18px rgba(28,33,29,.18);}
  .fade-up{animation:bgcFadeUp .45s cubic-bezier(.2,.8,.2,1) both;}
  /* ---------- Phone bottom switcher: every screen for the role, swipeable,
     with arrows that appear while it's being used and fade out when idle ---------- */
  @media (max-width:700px){
    .bt{display:block;padding:0;}
    .bt-scroll{display:flex;gap:4px;overflow-x:auto;scroll-behavior:smooth;scroll-snap-type:x proximity;padding:6px 8px calc(6px + env(safe-area-inset-bottom));scrollbar-width:none;-webkit-overflow-scrolling:touch;}
    .bt-scroll::-webkit-scrollbar{display:none;}
    .bt-scroll button{flex:0 0 auto;min-width:74px;scroll-snap-align:center;}
    .bt.fits .bt-scroll{justify-content:space-around;}
    .bt.fits .bt-scroll button{flex:1 1 0;min-width:0;}
    .bt-edge{position:absolute;top:0;bottom:0;width:34px;pointer-events:none;opacity:0;transition:opacity .25s ease;z-index:1;}
    .bt-edge.s{inset-inline-start:0;background:linear-gradient(to var(--edge-dir-s,right),rgba(255,255,255,.98),rgba(255,255,255,0));}
    .bt-edge.e{inset-inline-end:0;background:linear-gradient(to var(--edge-dir-e,left),rgba(255,255,255,.98),rgba(255,255,255,0));}
    html[dir="rtl"] .bt-edge.s{--edge-dir-s:left;}
    html[dir="rtl"] .bt-edge.e{--edge-dir-e:right;}
    .bt.can-s .bt-edge.s,.bt.can-e .bt-edge.e{opacity:1;}
    .bt-arrow{all:unset;box-sizing:border-box;position:absolute;top:50%;z-index:2;width:36px;height:36px;margin-top:-18px;border-radius:50%;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(135deg,var(--green),var(--green-deep));color:#fff;box-shadow:0 6px 16px rgba(35,55,42,.35),0 0 0 3px rgba(255,255,255,.9);
      opacity:0;transform:scale(.4);pointer-events:none;transition:opacity .22s ease,transform .32s cubic-bezier(.34,1.56,.64,1);cursor:pointer;}
    .bt-arrow svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}
    .bt-arrow.s{inset-inline-start:6px;}
    .bt-arrow.e{inset-inline-end:6px;}
    html[dir="rtl"] .bt-arrow svg{transform:scaleX(-1);}
    .bt.active.can-s .bt-arrow.s,.bt.active.can-e .bt-arrow.e{opacity:1;transform:scale(1);pointer-events:auto;}
    .bt.active.can-s .bt-arrow.s::after,.bt.active.can-e .bt-arrow.e::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--green);animation:bgcRipple 1.4s ease-out infinite;}
    .bt-arrow:active{transform:scale(.88) !important;}
  }

  @media (prefers-reduced-motion: reduce){
    .bt-arrow::after{animation:none !important;}
    #loadOverlay .ring-inner,#loadOverlay .ripple,#topProgress::before,.fade-up,.hero.splash,.fx-in *{animation:none !important;}
    .dr,.dr-scrim,.tile,.cx-body{transition:none !important;}
  }
</style>
