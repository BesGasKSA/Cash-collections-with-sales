  .tl-step.click:hover{background:#f7f6f1;}
  .tl-step .h{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .tl-step .d{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .tl-step.todo::before{border-style:dashed;border-color:var(--muted-2);}
  .tl-step.todo .h{color:var(--muted);}
  .slip-img{display:block;max-width:100%;border-radius:12px;border:1px solid var(--border);margin-top:8px;}

  /* ---------- Home hero ---------- */
  .hero{position:relative;overflow:hidden;border-radius:var(--radius-lg);padding:24px 26px;color:#fff;background:radial-gradient(120% 140% at 100% 0%,#5f8464 0%,var(--green) 38%,var(--green-dark) 70%,var(--green-deep) 100%);box-shadow:0 14px 34px rgba(52,80,58,.28);margin-bottom:18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;}
  .hero::before{content:'';position:absolute;inset-inline-end:-60px;bottom:-80px;width:260px;height:260px;border-radius:50%;border:34px solid rgba(242,238,228,.07);}
  .hero::after{content:'';position:absolute;inset-inline-end:90px;top:-50px;width:120px;height:120px;border-radius:50%;background:rgba(242,238,228,.06);}
  .hero .hi{font-size:13.5px;font-weight:700;opacity:.8;}
  .hero .nm{font-size:26px;font-weight:800;margin-top:2px;letter-spacing:-.01em;}
  .hero .rl{font-size:13px;opacity:.78;margin-top:2px;}
  .hero .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .hero .meta span{font-size:11.5px;font-weight:600;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:4px 10px;}
  .hero .cta{position:relative;z-index:1;display:flex;flex-direction:column;align-items:flex-end;gap:8px;text-align:end;}
  .hero .cta .big{font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;}
  .hero .cta .cap{font-size:12px;opacity:.8;max-width:180px;}
  .hero .cta button{all:unset;cursor:pointer;background:var(--cream);color:var(--green-deep);font-weight:800;font-size:13px;border-radius:999px;padding:9px 16px;box-shadow:0 6px 16px rgba(0,0,0,.18);}
  .hero .cta button:hover{transform:translateY(-1px);}
  .hero.splash{animation:bgcWelcomeIn .7s cubic-bezier(.2,.8,.2,1);}
  @media (max-width:700px){ .hero{grid-template-columns:minmax(0,1fr);padding:20px 18px;} .hero .nm{font-size:21px;} .hero .cta{align-items:flex-start;text-align:start;flex-direction:row;align-items:center;justify-content:space-between;} .hero .cta .big{font-size:30px;} }

  /* ---------- Loading: heartbeat emblem + silent top bar ---------- */
  #loadOverlay{background:rgba(244,243,238,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);}
  #loadOverlay .hb{position:relative;width:124px;height:124px;display:flex;align-items:center;justify-content:center;}
  #loadOverlay .ripple{position:absolute;inset:18px;border-radius:50%;border:2px solid var(--green);opacity:0;animation:bgcRipple 1.6s cubic-bezier(.2,.6,.3,1) infinite;}
  #loadOverlay .ripple.r2{animation-delay:.4s;}
  #loadOverlay .ring{width:92px;height:92px;box-shadow:var(--shadow-lg);position:relative;z-index:1;}
  #loadOverlay .ring-inner{width:80px;height:80px;overflow:hidden;position:relative;background:var(--green);animation:bgcHeartbeat 1.1s ease-in-out infinite;}
  #loadOverlay .ring-inner img{position:absolute;max-width:none;width:calc(80px * 555 / 244);height:calc(80px * 457 / 244);left:calc(80px * -148 / 244);top:calc(80px * -43 / 244);}
  #loadOverlay .pct{position:absolute;top:100%;left:50%;transform:translate(-50%,6px);font-size:12px;font-weight:800;color:var(--green-dark);background:var(--card);border-radius:999px;padding:2px 9px;box-shadow:var(--shadow-sm);white-space:nowrap;}
  @keyframes bgcHeartbeat{0%{transform:scale(1);}14%{transform:scale(1.13);}28%{transform:scale(1);}42%{transform:scale(1.08);}70%{transform:scale(1);}}
  @keyframes bgcRipple{0%{transform:scale(.8);opacity:.55;}100%{transform:scale(1.45);opacity:0;}}
  #topProgress{position:fixed;top:0;inset-inline:0;height:3px;z-index:9998;pointer-events:none;opacity:0;transition:opacity .25s ease;overflow:hidden;}
  #topProgress.active{opacity:1;}
  #topProgress::before{content:'';position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,var(--c-credit),var(--green),transparent);animation:bgcSlide 1.1s ease-in-out infinite;}
  @keyframes bgcSlide{0%{inset-inline-start:-40%;}100%{inset-inline-start:100%;}}
  @keyframes bgcFadeUp{0%{opacity:0;transform:translateY(8px);}100%{opacity:1;transform:none;}}
  /* ---- sign-in: layered aurora, glowing emblem, glass card ---- */
  /* clip, not hidden: hidden makes this a scroll container that the aurora layer
     (which bleeds 25% past the edges) overflows, so a phone focusing the password
     field could scroll the whole sign-in screen and expose the band below. */
  .brand-page{position:relative;background:#243a29;overflow:hidden;overflow:clip;}
  .brand-page::before{content:'';position:absolute;inset:-25%;background:
      radial-gradient(38% 42% at 22% 18%, rgba(122,166,128,.55), transparent 62%),
      radial-gradient(34% 38% at 82% 26%, rgba(242,238,228,.20), transparent 60%),
      radial-gradient(45% 50% at 70% 88%, rgba(62,124,140,.38), transparent 64%),
      radial-gradient(40% 44% at 12% 82%, rgba(77,109,81,.55), transparent 60%);
    filter:blur(6px);animation:bgcAurora 22s ease-in-out infinite alternate;}
  .brand-page::after{content:'';position:absolute;inset:0;background:
      radial-gradient(120% 90% at 50% 0%, transparent 40%, rgba(15,26,18,.55) 100%),
      repeating-linear-gradient(115deg, rgba(255,255,255,.028) 0 2px, transparent 2px 7px);}
  @keyframes bgcAurora{0%{transform:translate3d(-3%,-2%,0) scale(1.04);}50%{transform:translate3d(3%,2%,0) scale(1.1);}100%{transform:translate3d(-2%,3%,0) scale(1.05);}}
  .brand-page > *{position:relative;z-index:1;}
  /* ---- sign-in entrance: the page assembles itself once, top to bottom ---- */
  .brand-page > *{animation:bgcSignIn .7s cubic-bezier(.2,.8,.2,1) both;}
  .brand-page .brand-logo{animation:bgcSignInLogo .9s cubic-bezier(.22,1.2,.36,1) both;}
  .brand-page .brand-title{animation-delay:.12s;}
  .brand-page .brand-tagline{animation-delay:.18s;}
  .brand-page .login-card{animation-delay:.24s;}
  .brand-page .login-footer{animation-delay:.34s;}
  @keyframes bgcSignIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
  @keyframes bgcSignInLogo{0%{opacity:0;transform:translateY(10px) scale(.86);}60%{opacity:1;}100%{opacity:1;transform:none;}}
  /* the card's own contents follow, one after another */
  .login-card .login-lang,.login-card .field,.login-card button.btn,.login-card .login-forgot{
    animation:bgcSignInRow .55s cubic-bezier(.2,.8,.2,1) both;}
  .login-card .login-lang{animation-delay:.34s;}
  .login-card .field:nth-of-type(1){animation-delay:.40s;}
  .login-card .field:nth-of-type(2){animation-delay:.46s;}
  .login-card button.btn{animation-delay:.54s;}
  .login-card .login-forgot{animation-delay:.62s;}
  @keyframes bgcSignInRow{from{opacity:0;transform:translateY(9px);}to{opacity:1;transform:none;}}
  /* a slow sheen crosses the sign-in button, so the primary action is the one
     thing on the page that keeps moving */
  .brand-page .login-card button.btn{position:relative;overflow:hidden;}
  .brand-page .login-card button.btn::after{content:'';position:absolute;top:0;bottom:0;width:38%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);
    transform:translateX(-160%);animation:bgcSheen 4.2s ease-in-out 1.6s infinite;}
  @keyframes bgcSheen{0%{transform:translateX(-160%);}55%,100%{transform:translateX(320%);}}
  /* the field you are typing in lifts slightly off the card */
  .brand-page .login-card .field input:focus{transform:translateY(-1px);
    box-shadow:0 6px 18px rgba(77,109,81,.16);transition:transform .2s ease,box-shadow .2s ease;}
  .brand-logo{filter:contrast(1.2) brightness(1.14) saturate(1.05) drop-shadow(0 14px 40px rgba(0,0,0,.45));}
  .brand-title{text-shadow:0 2px 18px rgba(0,0,0,.35);}
  .login-card{background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);
    border:1px solid rgba(255,255,255,.55) !important;box-shadow:0 30px 70px -28px rgba(0,0,0,.62), 0 2px 8px rgba(0,0,0,.18);animation:bgcRise .6s cubic-bezier(.2,.8,.2,1) both;}
  .login-card .field input{background:#f7f6f1;border-color:#e6e2d7;height:50px;font-size:15px;transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;}
  .login-card .field input:focus{background:#fff;box-shadow:0 0 0 4px rgba(77,109,81,.14);}
  .login-card button.btn{background:linear-gradient(135deg,var(--green) 0%,var(--green-dark) 100%);box-shadow:0 10px 24px -10px rgba(52,80,58,.85);transition:transform .12s ease, box-shadow .2s ease;}
  .login-card button.btn:hover{transform:translateY(-1px);box-shadow:0 14px 28px -10px rgba(52,80,58,.95);}
  .login-card button.btn:active{transform:translateY(0) scale(.99);}
  /* ---- shimmer while data loads ---- */
  .sk{position:relative;overflow:hidden;background:#eeece5;border-color:transparent !important;box-shadow:none !important;}
  .sk::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);transform:translateX(-100%);animation:bgcShimmer 1.25s ease-in-out infinite;}
  @keyframes bgcShimmer{100%{transform:translateX(100%);}}
  /* ---- charts ---- */
  .chart-wrap{position:relative;}
  .chart-wrap .hit{fill:transparent;cursor:pointer;}
  .chart-wrap .hit:hover + .pt, .chart-wrap .pt.on{r:5.5;}
  .chart-wrap .pt{transition:r .15s ease;}
  .chart-tip{position:absolute;pointer-events:none;background:var(--green-deep);color:#fff;border-radius:10px;padding:6px 10px;font-size:11.5px;font-weight:700;white-space:nowrap;opacity:0;transform:translate(-50%,-140%);transition:opacity .15s ease;box-shadow:var(--shadow-md);z-index:2;}
  .chart-tip.on{opacity:1;}
  .chart-tip .v{font-variant-numeric:tabular-nums;}
  /* ---- touch feedback: press-in + ripple from the finger ---- */
  .st-row.click,.rrow.click,.tx,.bt-scroll button,.sb-item,.cx-more{position:relative;overflow:hidden;}
  .tile.click:active,.st-row.click:active,.rrow.click:active,.tx:active,button.btn:active,.cx-more:active{transform:scale(.975);transition:transform .08s ease;}
  .rpl{position:absolute;border-radius:50%;pointer-events:none;background:currentColor;opacity:.16;transform:scale(0);animation:bgcTap .55s cubic-bezier(.2,.7,.3,1) forwards;}
  @keyframes bgcTap{to{transform:scale(1);opacity:0;}}
  /* ---- screen transitions: slide in from the side you're heading to ---- */
  #screenBody.nav-fwd{--sx:28px;animation:bgcSlideIn .38s cubic-bezier(.2,.8,.2,1) both;}
  #screenBody.nav-back{--sx:-28px;animation:bgcSlideIn .38s cubic-bezier(.2,.8,.2,1) both;}
  html[dir="rtl"] #screenBody.nav-fwd{--sx:-28px;}
  html[dir="rtl"] #screenBody.nav-back{--sx:28px;}
  @keyframes bgcSlideIn{0%{opacity:0;transform:translateX(var(--sx));}100%{opacity:1;transform:none;}}
  /* ---- bottom bar: sliding indicator + icon bounce ---- */
  @media (max-width:700px){
    .bt-scroll{position:relative;}
    .bt-scroll button{z-index:1;}
    .bt-scroll button.active{background:transparent !important;}
    .bt-ind{position:absolute;top:6px;left:0;height:calc(100% - 12px - env(safe-area-inset-bottom));border-radius:14px;background:var(--green-pale);z-index:0;
      box-shadow:inset 0 0 0 1px rgba(77,109,81,.12);transition:transform .5s cubic-bezier(.34,1.35,.64,1),width .5s cubic-bezier(.34,1.35,.64,1);}
    .bt-scroll button.bounce svg{animation:bgcTabBounce .55s cubic-bezier(.34,1.56,.64,1);}
    /* bottom sheet follows the finger while being dragged down */
    .dr.dragging{transition:none !important;}
    .dr-h{touch-action:none;cursor:grab;}
  }
  @keyframes bgcTabBounce{0%{transform:scale(1);}35%{transform:scale(1.28) translateY(-3px);}65%{transform:scale(.94);}100%{transform:scale(1.08) translateY(-1px);}}
  /* ---- the shared filter bar ---- */
  .lf{padding:0;overflow:hidden;}
  .lf-head{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 14px;}
  .lf-toggle{all:unset;box-sizing:border-box;flex:1;display:flex;align-items:center;gap:10px;cursor:pointer;
    padding:10px 4px;font-size:13.5px;font-weight:700;color:var(--text);}
  .lf-toggle svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .lf-toggle svg:last-child{margin-inline-start:auto;color:var(--muted);transition:transform .22s ease;}
  html[dir="rtl"] .lf-toggle svg:last-child{transform:rotate(180deg);}
  .lf.open .lf-toggle svg:last-child,html[dir="rtl"] .lf.open .lf-toggle svg:last-child{transform:rotate(90deg);}
  .lf-count{font-size:11.5px;font-weight:700;color:var(--green);background:var(--green-pale);border-radius:999px;padding:3px 9px;}
  .lf-count:empty{display:none;}
  .lf-clear{all:unset;box-sizing:border-box;cursor:pointer;font-size:12px;font-weight:700;color:var(--muted);
    padding:7px 11px;border-radius:9px;}
  .lf-clear:hover{background:var(--bg);color:var(--danger);}
  .lf-body{padding:2px 14px 14px;border-top:1px solid var(--border-soft);}
  .lf-body .grid{gap:10px;}
  .lf .field label{font-size:11px;}
  .lf-wide{grid-column:1/-1;}
  .lf-empty{padding:18px 4px;text-align:center;color:var(--muted);font-size:13px;}
  /* ---- repeatable collection / expense lines ---- */
  .mlines{display:flex;flex-direction:column;gap:10px;margin-top:10px;}
  .mline{border:1px dashed var(--border-soft);border-radius:12px;padding:10px 12px 2px;background:var(--bg);}
  .ml-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;}
  .mlNo{width:22px;height:22px;border-radius:7px;background:var(--c);color:#fff;opacity:.85;display:flex;
    align-items:center;justify-content:center;font-size:11.5px;font-weight:800;}
  .mline .ico-btn{width:28px;height:28px;border-radius:8px;}
  .mline .ico-btn svg{width:14px;height:14px;}
  .mline-add{margin:10px 0 4px;padding:8px 14px;font-size:12.5px;}
  .sec-sum{margin-inline-start:auto;font-size:12px;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums;}
  .sec-sum:empty{display:none;}
  .me-confirm{margin:12px 0 14px;padding:9px 16px;font-size:13px;}
  .me-confirm svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.4;margin-inline-end:6px;vertical-align:-3px;}
  .me-msg:empty{display:none;}
  .me.from-lines .me-body input{background:var(--bg);color:var(--muted);}
  .me.from-lines .me-confirm{display:none;}
  .me[data-state="closed"][data-done="1"]{border-color:var(--green-pale);background:linear-gradient(0deg,var(--green-pale),var(--green-pale));}
  .me[data-done="1"] .me-ic{background:var(--green);color:#fff;}
  .me[data-done="1"] .me-amt::after{content:' ✓';font-size:12px;opacity:.7;}
  /* ---- product lines, confirmed and folded away ---- */
  .lines-done{border:1px solid var(--green-pale);border-radius:var(--radius);background:var(--card);overflow:hidden;}
  .ld-head{display:flex;align-items:center;gap:12px;padding:13px 16px;background:var(--green-pale);}
  .ld-ic{flex:none;width:32px;height:32px;border-radius:10px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;}
  .ld-ic svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.4;}
  .ld-t{flex:1;min-width:0;}
  .ld-t b{display:block;font-size:13.5px;color:var(--green-dark);}
  .ld-t span{display:block;font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums;}
  .ld-head .btn{padding:7px 13px;font-size:12.5px;}
  .ld-rows{padding:4px 16px 10px;}
  .ld-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--border-soft);font-size:12.5px;}
  .ld-row:first-child{border-top:none;}
  .ld-row .n{flex:1;min-width:0;font-weight:700;}
  .ld-row .q,.ld-row .p{color:var(--muted);white-space:nowrap;}
  .ld-row .a{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;}
  #eConfirmLines svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;margin-inline-end:6px;vertical-align:-3px;}
  /* ================= PHONE PASS =================
     Last in the file on purpose: these rules are meant to win over the
     desktop ones at the same specificity (see CLAUDE.md, Trap #7). */
  @media (max-width:700px){
    /* --- app bar: slimmer, so content starts higher --- */
    .tb{padding-block:9px;}
    .tb .tb-title h1{font-size:17px;}
    .tb .tb-title .sub{font-size:11px;}

    /* --- cards: less chrome, more content --- */
    .card{padding:14px 14px 12px;border-radius:16px;margin-bottom:12px;}
    .card h2{font-size:14px;margin-bottom:10px;}
    .grid{gap:10px;}

    /* --- the greeting: a strip, not a poster --- */
    .hero{padding:16px 16px 14px;border-radius:18px;margin-bottom:12px;
      grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start;}
    .hero .hi{font-size:12px;}
    .hero .nm{font-size:20px;line-height:1.2;}
    .hero .rl{font-size:11.5px;}
    .hero .meta{gap:6px;margin-top:10px;}
    .hero .meta span{font-size:10.5px;padding:3px 8px;}
    .hero .cta .big{font-size:26px;}
    .hero .cta .big svg{width:26px !important;height:26px !important;}
    .hero .cta .cap{font-size:11px;max-width:120px;}
    .hero .cta button{font-size:12px;padding:8px 14px;}

    /* --- metric tiles become data rows: the figure is the point --- */
    .tiles{grid-template-columns:1fr;gap:8px;margin-bottom:12px;}
    .tile{flex-direction:row;align-items:center;gap:12px;padding:11px 14px 11px 12px;
      border-radius:14px;box-shadow:none;border-color:var(--border-soft);min-height:56px;}
    .tile::before{width:3px;opacity:1;}
    .tile::after{display:none;}
    .tile .top{flex:none;}
    .tile .top .go{display:none;}
    .tile .ic{width:34px;height:34px;border-radius:11px;}
    .tile{flex-wrap:wrap;}
    /* label on the leading edge, the figure on the trailing edge, and the
       sub-line wrapping underneath — a data row, not a poster */
    .tile > div:not(.top):not(.ft){flex:1 1 auto;min-width:0;display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
    .tile .lb{flex:1 1 auto;font-size:12.5px;line-height:1.3;}
    .tile .vl{flex:none;font-size:20px;letter-spacing:-.01em;text-align:end;}
    .tile .ft{flex:1 0 100%;order:9;margin-top:1px;padding-inline-start:46px;font-size:10.5px;line-height:1.35;}
    .tile.click:active{transform:scale(.99);}

    /* --- statements: tighter rows, heavier totals --- */
    .statement{border-radius:16px;}
    .st-head{padding:14px 14px 12px;}
    .st-head .v{font-size:26px;}
    .st-row{padding:9px 14px;gap:10px;min-height:46px;}
    .st-row .lb{font-size:12.5px;}
    .st-row .amt{font-size:13.5px;}
    .st-row.final{font-size:14.5px;}
    .st-row.final .amt{font-size:16px;}

    /* --- panels and drawers --- */
    .panel{border-radius:16px;}
    .dr{border-radius:20px 20px 0 0;}

    /* --- bottom bar: real tap targets --- */
    .bt-scroll{padding-block:7px;}
    .bt-scroll button{min-height:54px;min-width:70px;font-size:11px;gap:4px;padding:6px 4px;}
    .bt-scroll button svg{width:23px;height:23px;}

    /* --- forms: thumb-sized, and never zooming iOS on focus --- */
    .field input,.field select,.field textarea{font-size:16px;min-height:46px;}
    .btn{min-height:46px;}
    .me-toggle{padding:14px 14px;}
    .me-body{padding:0 14px 8px;}
  }
  /* ---- entry: money that moves without being a sale ----
     Same surface language as the rest of the app (card, radius, category
     colour on the left edge of the header icon). Each block stays shut until
     it has an amount, so the ordinary "just my sales" entry is unchanged. */
  .me{margin-top:12px;border:1px solid var(--border-soft);border-radius:var(--radius);background:var(--card);overflow:hidden;--c:var(--green);}
  .me[data-state="open"]{box-shadow:var(--shadow-sm);}
  .me-toggle{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;cursor:pointer;transition:background .18s ease,transform .1s ease;}
  .me-toggle:hover{background:var(--bg);}
  .me-toggle:active{transform:scale(.995);}
  .me-toggle:focus-visible{outline:2px solid var(--c);outline-offset:-2px;}
  .me-ic{flex:none;width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb, var(--c) 12%, #fff);color:var(--c);}
  .me-ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
  .me-t{flex:1;min-width:0;}
  .me-t b{display:block;font-size:13.5px;font-weight:700;color:var(--text);}
  .me-t span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.5;}
  .me-amt{flex:none;font-weight:800;font-size:14px;color:var(--c);font-variant-numeric:tabular-nums;}
  .me-amt:empty{display:none;}
  .me-chev{flex:none;color:var(--muted);display:flex;transition:transform .22s ease;}
  .me-chev svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;}
  .me[data-state="open"] .me-chev{transform:rotate(90deg);}
  html[dir="rtl"] .me-chev{transform:rotate(180deg);}
  html[dir="rtl"] .me[data-state="open"] .me-chev{transform:rotate(90deg);}
  .me-body{padding:0 16px 8px;border-top:1px solid var(--border-soft);}
  .me[data-state="closed"] .me-body{display:none;}
  .me[data-state="open"] .me-body{animation:bgcMeOpen .26s cubic-bezier(.2,.8,.2,1);}
  @keyframes bgcMeOpen{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}
  .me-body .hint{display:block;margin:10px 0 0;}
  input.locked{background:var(--bg);color:var(--muted);cursor:not-allowed;}
  #eNetPreview{margin-top:16px;}
  #eNetPreview:empty{display:none;}
  /* ---- invitations: accept page ---- */
  .inv-card{text-align:center;}
  .inv-card h2{justify-content:center;text-align:center;}
  .inv-card h2::before{display:none;}
  .inv-card .field{text-align:start;}
  .inv-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:999px;background:var(--green-pale);color:var(--green-dark);font-size:12px;font-weight:700;margin:4px 0 14px;}
  .inv-chip svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .inv-hi{font-size:21px;font-weight:800;margin:0 0 8px;letter-spacing:-.01em;}
  .inv-lead{color:var(--muted);font-size:14px;line-height:1.75;margin:0 0 18px;}
  .inv-lead b{color:var(--green-dark);}
  .inv-note{font-size:12px;color:var(--muted);margin-top:14px;}
  .inv-ico{width:74px;height:74px;border-radius:50%;margin:6px auto 16px;display:flex;align-items:center;justify-content:center;background:var(--green-pale);color:var(--green);animation:bgcInvPop .55s cubic-bezier(.34,1.56,.64,1) both;}
  .inv-ico.warn{background:var(--warn-bg);color:var(--warn);}
  .inv-ico.bad{background:var(--danger-bg);color:var(--danger);}
  .inv-ico svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
  .inv-ico.done{background:var(--green);color:#fff;box-shadow:0 0 0 0 rgba(77,109,81,.45);animation:bgcInvPop .55s cubic-bezier(.34,1.56,.64,1) both,bgcInvRing 1.6s ease-out .4s 2;}
  .inv-ico.done path{stroke-dasharray:30;stroke-dashoffset:30;animation:bgcInvDraw .5s ease-out .35s forwards;}
  @keyframes bgcInvPop{0%{transform:scale(.4);opacity:0;}100%{transform:none;opacity:1;}}
  @keyframes bgcInvDraw{to{stroke-dashoffset:0;}}
  @keyframes bgcInvRing{0%{box-shadow:0 0 0 0 rgba(77,109,81,.45);}100%{box-shadow:0 0 0 22px rgba(77,109,81,0);}}
  .pw-meter{display:flex;gap:5px;margin:-4px 0 6px;}
  .pw-meter i{flex:1;height:5px;border-radius:9px;background:var(--border-soft);transition:background .25s ease;}
  .pw-meter[data-s="1"] i:nth-child(-n+1){background:var(--danger);}
  .pw-meter[data-s="2"] i:nth-child(-n+2){background:var(--warn);}
  .pw-meter[data-s="3"] i:nth-child(-n+3){background:#7da25f;}
  .pw-meter[data-s="4"] i{background:var(--green);}
  .pw-rules{font-size:12px;color:var(--muted);text-align:start;margin:0 0 10px;}
  .pw-rules.bad{color:var(--danger);}
  .inv-skel{height:14px;border-radius:8px;margin:10px auto;background:linear-gradient(90deg,var(--border-soft),var(--bg),var(--border-soft));background-size:200% 100%;animation:bgcShim 1.2s linear infinite;}
  @keyframes bgcShim{to{background-position:-200% 0;}}
  /* ---- Admin > Users: status + last login ---- */
  .us-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;}
  .us-badge::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;}
  .us-badge.invited{background:#FFF4DB;color:#A36A00;}
  .us-badge.invited::before{animation:bgcUsPulse 1.6s ease-in-out infinite;}
  .us-badge.invite_expired{background:var(--danger-bg);color:var(--danger);}
  .us-badge.accepted{background:#E6F0FB;color:#2D67A8;}
  .us-badge.active{background:var(--ok-bg);color:var(--ok);}
  .us-badge.disabled{background:#efeee8;color:var(--muted);}
  @keyframes bgcUsPulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(.7);}}
  .us-sub{display:block;font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap;}
  .us-when{white-space:nowrap;font-variant-numeric:tabular-nums;}
  .us-when .rel{display:block;font-size:11px;color:var(--muted);margin-top:2px;}
  .us-name b{display:block;}
  .us-name span{display:block;font-size:11.5px;color:var(--muted);direction:ltr;unicode-bidi:plaintext;}
  html[dir="rtl"] .us-name span{text-align:right;}
  .invite-link{margin-top:10px;border:1px solid var(--green-pale);border-radius:14px;padding:12px 14px;background:var(--card);}
  .invite-link .il-t{font-size:12.5px;font-weight:700;color:var(--green-dark);margin-bottom:6px;}
  .invite-link .il-u{font-size:11.5px;color:var(--muted);word-break:break-all;background:var(--bg);border-radius:9px;padding:8px 10px;margin-bottom:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  .invite-link .btn{padding:8px 14px;font-size:12.5px;}
  .invite-link a.btn{text-decoration:none;display:inline-flex;align-items:center;}
  .us-chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;}
  .us-chips button{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:12px;border:1px solid var(--border-soft);background:var(--card);font-size:12.5px;font-weight:700;color:var(--ink,#1f2a22);transition:transform .15s ease,box-shadow .15s ease,background .15s ease;}
  .us-chips button:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm);}
  .us-chips button b{font-size:15px;font-variant-numeric:tabular-nums;}
  .us-chips button.on{background:var(--green);color:#fff;border-color:var(--green);}
  .inv-hint{display:flex;gap:10px;align-items:flex-start;background:var(--green-pale);color:var(--green-dark);border-radius:12px;padding:11px 14px;font-size:13px;line-height:1.6;margin:0 0 14px;}
  .inv-hint svg{flex:none;width:18px;height:18px;margin-top:2px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .btn .bi{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;margin-inline-end:6px;}
  .us-acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:nowrap;width:max-content;margin-inline-start:auto;}
  .us-acts .btn{padding:7px 11px;font-size:12px;border-radius:9px;}
  .us-acts .bi{width:14px;height:14px;margin-inline-end:4px;}
  .ico-btn{all:unset;box-sizing:border-box;cursor:pointer;width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;
    border:1px solid var(--border-soft);background:var(--card);color:var(--muted);transition:background .15s ease,color .15s ease,transform .15s ease,border-color .15s ease;}
  .ico-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
  .ico-btn:hover{background:var(--green-pale);color:var(--green-dark);border-color:var(--green-pale);transform:translateY(-1px);}
  .ico-btn:focus-visible{outline:2px solid var(--green);outline-offset:1px;}
  .ico-btn.primary{background:var(--green);border-color:var(--green);color:#fff;}
  .ico-btn.primary:hover{background:var(--green-dark);color:#fff;}
  .ico-btn.danger:hover{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-bg);}
  .ico-btn[disabled]{opacity:.5;cursor:default;transform:none;}
  tr.us-new{animation:bgcUsNew 2.2s ease-out;}
  @keyframes bgcUsNew{0%{background:var(--green-pale);}100%{background:transparent;}}
  /* ---- show/hide password eye ---- */
  .pw-wrap{position:relative;display:block;}
  .pw-wrap input{padding-inline-end:50px !important;}
  /* Edge and Chrome draw their own reveal/clear buttons inside a password
     field; next to our eye that reads as two eyes doing the same job. */
  .pw-wrap input::-ms-reveal,.pw-wrap input::-ms-clear{display:none;}
  .pw-wrap input::-webkit-credentials-auto-fill-button,
  .pw-wrap input::-webkit-strong-password-auto-fill-button{visibility:hidden;pointer-events:none;margin:0;width:0;}
  .pw-eye{all:unset;box-sizing:border-box;position:absolute;top:50%;inset-inline-end:7px;width:38px;height:38px;margin-top:-19px;border-radius:11px;
    display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;transition:background .15s ease,color .15s ease;}
  .pw-eye:hover{background:var(--green-pale);color:var(--green-dark);}
  .pw-eye:focus-visible{outline:2px solid var(--green);outline-offset:1px;}
  .pw-eye.on{color:var(--green);}
  .pw-eye svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .pw-eye.pop svg{animation:bgcEyePop .3s cubic-bezier(.34,1.56,.64,1);}
  @keyframes bgcEyePop{0%{transform:scale(.6) rotate(-12deg);opacity:.4;}100%{transform:none;opacity:1;}}
  @keyframes bgcRise{0%{opacity:0;transform:translateY(14px) scale(.985);}100%{opacity:1;transform:none;}}
  @keyframes bgcGrow{0%{transform:scaleX(0);}100%{transform:scaleX(1);}}
  /* One entrance per screen visit: cards rise in sequence, bars grow. */
  .fx-in .hero,.fx-in .statement,.fx-in .tile,.fx-in > .card,.fx-in .g2 > .card,.fx-in .sec-title{animation:bgcRise .55s cubic-bezier(.2,.8,.2,1) both;}
  .fx-in .tiles .tile:nth-child(1){animation-delay:.04s}.fx-in .tiles .tile:nth-child(2){animation-delay:.08s}.fx-in .tiles .tile:nth-child(3){animation-delay:.12s}.fx-in .tiles .tile:nth-child(4){animation-delay:.16s}
  .fx-in .tiles .tile:nth-child(5){animation-delay:.2s}.fx-in .tiles .tile:nth-child(6){animation-delay:.24s}.fx-in .tiles .tile:nth-child(7){animation-delay:.28s}.fx-in .tiles .tile:nth-child(8){animation-delay:.32s}
  .fx-in .g2 > :nth-child(2){animation-delay:.1s}
  .fx-in .st-bar span,.fx-in .rrow .bar span{animation:bgcGrow 1s cubic-bezier(.2,.8,.2,1) .15s both;transform-origin:left center;}
  html[dir="rtl"] .fx-in .st-bar span,html[dir="rtl"] .fx-in .rrow .bar span{transform-origin:right center;}
  /* richer surfaces */
  .tile{background:linear-gradient(180deg,#fff 0%,color-mix(in srgb,var(--c) 3%,#fff) 100%);}
  .tile::after{content:'';position:absolute;inset-inline-end:-30px;bottom:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 10%,transparent),transparent 70%);pointer-events:none;}
  .statement{box-shadow:0 1px 2px rgba(28,33,29,.04),0 10px 30px -18px rgba(28,33,29,.18);}
  .fade-up{animation:bgcFadeUp .45s cubic-bezier(.2,.8,.2,1) both;}
  /* ---------- Phone bottom switcher: every screen for the role, swipeable,
     with arrows that appear while it's being used and fade out when idle ---------- */
  @media (max-width:700px){
    .bt{display:block;padding:0;}
    .bt-scroll{display:flex;gap:4px;overflow-x:auto;scroll-behavior:smooth;scroll-snap-type:x proximity;padding:6px 8px calc(6px + env(safe-area-inset-bottom));scrollbar-width:none;-webkit-overflow-scrolling:touch;}
    .bt-scroll::-webkit-scrollbar{display:none;}
    .bt-scroll button{flex:0 0 auto;min-width:74px;scroll-snap-align:center;}
    .bt.fits .bt-scroll{justify-content:space-around;}
    .bt.fits .bt-scroll button{flex:1 1 0;min-width:0;}
    .bt-edge{position:absolute;top:0;bottom:0;width:34px;pointer-events:none;opacity:0;transition:opacity .25s ease;z-index:1;}
    .bt-edge.s{inset-inline-start:0;background:linear-gradient(to var(--edge-dir-s,right),rgba(255,255,255,.98),rgba(255,255,255,0));}
    .bt-edge.e{inset-inline-end:0;background:linear-gradient(to var(--edge-dir-e,left),rgba(255,255,255,.98),rgba(255,255,255,0));}
    html[dir="rtl"] .bt-edge.s{--edge-dir-s:left;}
    html[dir="rtl"] .bt-edge.e{--edge-dir-e:right;}
    .bt.can-s .bt-edge.s,.bt.can-e .bt-edge.e{opacity:1;}
    .bt-arrow{all:unset;box-sizing:border-box;position:absolute;top:50%;z-index:2;width:36px;height:36px;margin-top:-18px;border-radius:50%;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(135deg,var(--green),var(--green-deep));color:#fff;box-shadow:0 6px 16px rgba(35,55,42,.35),0 0 0 3px rgba(255,255,255,.9);
      opacity:0;transform:scale(.4);pointer-events:none;transition:opacity .22s ease,transform .32s cubic-bezier(.34,1.56,.64,1);cursor:pointer;}
    .bt-arrow svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}
    .bt-arrow.s{inset-inline-start:6px;}
    .bt-arrow.e{inset-inline-end:6px;}
    html[dir="rtl"] .bt-arrow svg{transform:scaleX(-1);}
    .bt.active.can-s .bt-arrow.s,.bt.active.can-e .bt-arrow.e{opacity:1;transform:scale(1);pointer-events:auto;}
    .bt.active.can-s .bt-arrow.s::after,.bt.active.can-e .bt-arrow.e::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--green);animation:bgcRipple 1.4s ease-out infinite;}
    .bt-arrow:active{transform:scale(.88) !important;}
  }

  @media (prefers-reduced-motion: reduce){
    .bt-arrow::after{animation:none !important;}
    #loadOverlay .ring-inner,#loadOverlay .ripple,#topProgress::before,.fade-up,.hero.splash,.fx-in *,#screenBody,.rpl,.bt-scroll button svg,.inv-ico,.inv-ico path,.us-badge::before,tr.us-new{animation:none !important;}
    .inv-ico.done path{stroke-dashoffset:0;}
    .brand-page > *,.brand-page .brand-logo,.login-card .login-lang,.login-card .field,.login-card button.btn,.login-card .login-forgot,.brand-page .login-card button.btn::after{animation:none !important;}
    .me-body,.me-chev{animation:none !important;transition:none !important;}
    .bt-ind,.tile,.st-row,.rrow,.tx{transition:none !important;}
    .dr,.dr-scrim,.tile,.cx-body{transition:none !important;}
  }
</style>
