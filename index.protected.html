<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  :root{
    --green:#4D6D51; --green-dark:#3b5540; --green-pale:#e7ede8; --cream:#F2EEE4;
    --bg:#f6f5f1; --card:#ffffff; --text:#20241f; --muted:#767b71; --muted-2:#98988f;
    --border:#e7e3d7; --border-soft:#f0ede4; --danger:#c14a30; --danger-bg:#fbe7e1;
    --warn:#b3820f; --warn-bg:#fdf1d8; --ok:#2f7a45; --ok-bg:#e2f3e6;
    --radius:14px; --radius-sm:9px; --radius-lg:20px;
    --shadow-sm:0 1px 2px rgba(32,36,31,.05), 0 1px 1px rgba(32,36,31,.04);
    --shadow-md:0 4px 14px rgba(32,36,31,.07), 0 1px 3px rgba(32,36,31,.05);
    --shadow-lg:0 12px 32px rgba(32,36,31,.12), 0 2px 6px rgba(32,36,31,.06);
    --font-en:'Inter',-apple-system,'Segoe UI',Tahoma,Arial,sans-serif;
    --font-ar:'Cairo','Inter',-apple-system,'Segoe UI','Geeza Pro',Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-en);min-height:100vh;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;}
  html[dir="rtl"] body{font-family:var(--font-ar);letter-spacing:0;}
  ::selection{background:var(--green);color:#fff;}
  /* Flat #4D6D51, exactly the logo artwork's own background — the PNG has
     no transparency around the emblem, so anything but an exact match shows
     as a visible rectangle behind it. */
  .brand-page{background:var(--green);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;gap:22px;}
  .brand-logo{width:210px;max-width:60vw;display:block;}
  header{background:var(--green);color:#fff;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;box-shadow:var(--shadow-md);position:relative;z-index:2;}
  header .brand{font-weight:800;font-size:36px;display:flex;align-items:center;gap:14px;letter-spacing:-.02em;min-width:0;flex-shrink:1;line-height:1.15;}
  header .brand img{height:112px;width:auto;object-fit:contain;flex-shrink:0;}
  @media (max-width:700px){
    header .brand{font-size:20px;gap:9px;}
    header .brand img{height:58px;}
  }
  header .who{font-size:13px;opacity:.85;font-weight:500;white-space:nowrap;padding-inline-end:12px;margin-inline-end:2px;border-inline-end:1px solid rgba(255,255,255,.22);}
  header .header-controls{display:flex;gap:8px;align-items:center;flex-wrap:nowrap;flex-shrink:0;}
  header select, header button{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:9px;padding:7px 12px;height:34px;font-size:13px;cursor:pointer;font-weight:600;transition:background .15s ease, transform .1s ease;font-family:inherit;box-sizing:border-box;}
  header select{background:#fff;color:var(--green-dark);border-color:transparent;}
  header button:hover{background:rgba(255,255,255,.24);}
  header button:active{transform:scale(.97);}
  .notif-bell{position:relative;padding:8px !important;display:flex;align-items:center;justify-content:center;line-height:1;}
  .notif-bell svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;}
  #loadOverlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(32,36,31,.22);z-index:9999;opacity:0;pointer-events:none;transition:opacity .2s ease;}
  #loadOverlay.active{opacity:1;}
  #loadOverlay .ring{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-lg);}
  #loadOverlay .ring-inner{width:52px;height:52px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;}
  #loadOverlay .pct{font-size:13.5px;font-weight:800;color:var(--green-dark);}
  .notif-badge{position:absolute;top:-4px;inset-inline-end:-4px;background:var(--danger);color:#fff;border-radius:999px;min-width:17px;height:17px;padding:0 4px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--green);}
  .home-action{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.22);font-size:13px;font-weight:600;opacity:.95;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .home-action.has-action{cursor:pointer;}
  .home-action.has-action:hover{opacity:1;}
  .home-action-cta{font-size:12px;font-weight:800;white-space:nowrap;text-decoration:underline;text-underline-offset:2px;}
  .card.welcome-card{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--green) 0%,var(--green-dark) 55%,#2f4a33 100%);transition:box-shadow .6s ease;}
  .card.welcome-card.splash{background-size:220% 220%;animation:bgcWelcomeGradient 4s ease infinite, bgcWelcomeIn .7s cubic-bezier(.2,.8,.2,1);box-shadow:0 10px 34px rgba(77,109,81,.35),0 2px 8px rgba(32,36,31,.15);}
  .card.welcome-card.splash::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.18) 45%,transparent 60%);background-size:200% 100%;animation:bgcWelcomeShine 2.2s ease-in-out infinite;pointer-events:none;}
  @keyframes bgcWelcomeGradient{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
  @keyframes bgcWelcomeShine{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
  @keyframes bgcWelcomeIn{0%{opacity:0;transform:translateY(-6px) scale(.98);}100%{opacity:1;transform:translateY(0) scale(1);}}
  @media (prefers-reduced-motion: reduce){ .card.welcome-card.splash, .card.welcome-card.splash::after{animation:none;} }
  .welcome-meta{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.22);font-size:12px;opacity:.92;display:flex;flex-direction:column;gap:3px;}
  nav{display:flex;gap:6px;flex-wrap:wrap;background:var(--green-dark);padding:10px 18px;position:relative;z-index:1;}
  nav button{background:transparent;border:1px solid rgba(255,255,255,.28);color:rgba(255,255,255,.92);padding:7px 15px 7px 12px;border-radius:999px;font-size:13px;cursor:pointer;font-weight:600;transition:background .15s ease, border-color .15s ease, transform .1s ease;font-family:inherit;display:inline-flex;align-items:center;gap:6px;}
  html[dir="rtl"] nav button{padding:7px 12px 7px 15px;}
  nav button:hover{background:rgba(255,255,255,.1);}
  nav button.active{background:#fff;color:var(--green-dark);border-color:#fff;box-shadow:var(--shadow-sm);}
  nav button.active .nav-icon{stroke:var(--green-dark);}
  nav button:active{transform:scale(.96);}
  .nav-icon{width:15px;height:15px;stroke:rgba(255,255,255,.92);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
  main{max-width:1080px;margin:0 auto;padding:22px 18px 60px;}
  .card{background:var(--card);border:1px solid var(--border-soft);border-radius:var(--radius);padding:20px;margin-bottom:18px;overflow-x:auto;box-shadow:var(--shadow-sm);transition:box-shadow .2s ease;}
  .card h2{margin:0 0 14px;font-size:15px;font-weight:700;color:var(--text);letter-spacing:-.01em;display:flex;align-items:center;gap:8px;}
  .card h2::before{content:'';width:4px;height:15px;border-radius:3px;background:var(--green);display:inline-block;flex-shrink:0;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  html[dir="rtl"] label{text-transform:none;letter-spacing:0;}
  input,select,textarea{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;background:var(--bg);color:var(--text);font-family:inherit;transition:border-color .15s ease, background .15s ease, box-shadow .15s ease;}
  input:hover,select:hover,textarea:hover{border-color:var(--muted-2);}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);background:#fff;box-shadow:0 0 0 3px var(--green-pale);}
  .field{margin-bottom:12px;}
  button.btn{background:var(--green);color:#fff;border:none;padding:10px 18px;border-radius:var(--radius-sm);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:var(--shadow-sm);transition:background .15s ease, transform .1s ease, box-shadow .15s ease;}
  button.btn:hover{background:var(--green-dark);box-shadow:var(--shadow-md);}
  button.btn:active{transform:scale(.97);}
  button.btn.secondary{background:#fff;color:var(--green);border:1.5px solid var(--border);box-shadow:none;}
  button.btn.secondary:hover{border-color:var(--green);background:var(--green-pale);}
  button.btn.danger{background:var(--danger);}
  button.btn.danger:hover{background:#a13c26;}
  button.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none;}
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px;border:1px solid var(--border-soft);border-radius:var(--radius-sm);overflow:hidden;}
  th,td{padding:11px 14px;border-bottom:1px solid var(--border-soft);text-align:start;}
  th{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em;background:var(--bg);border-bottom:1.5px solid var(--border);}
  html[dir="rtl"] th{text-transform:none;letter-spacing:0;}
  tbody tr{transition:background .1s ease;}
  tbody tr:nth-child(even){background:rgba(32,36,31,.014);}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--green-pale);}
  td{color:var(--text);}
  .col-actions{width:1%;white-space:nowrap;text-align:end;}
  .btn-icon{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;padding:0;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;transition:background .15s ease,color .15s ease;}
  .btn-icon svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .btn-icon:hover{background:var(--danger-bg);color:var(--danger);}
  .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 11px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.01em;}
  .badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
  .badge.pending{background:var(--warn-bg);color:var(--warn);}
  .badge.confirmed{background:var(--ok-bg);color:var(--ok);}
  .badge.disputed{background:var(--danger-bg);color:var(--danger);}
  .badge.rejected{background:#efeee8;color:var(--muted);}
  .badge.completed{background:var(--ok-bg);color:var(--ok);}
  .stat{display:flex;flex-direction:column;gap:4px;position:relative;padding-inline-start:14px;}
  .stat::before{content:'';position:absolute;inset-inline-start:0;top:2px;bottom:2px;width:3px;border-radius:3px;background:var(--green);opacity:.55;}
  .stat .n{font-size:26px;font-weight:800;color:var(--text);letter-spacing:-.02em;line-height:1.1;}
  .stat .l{font-size:12px;color:var(--muted);font-weight:600;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .msg{padding:11px 14px;border-radius:var(--radius-sm);margin-bottom:14px;font-size:13px;font-weight:600;}
  .msg.err{background:var(--danger-bg);color:var(--danger);}
  .msg.ok{background:var(--ok-bg);color:var(--ok);}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
  .tabs button{padding:8px 15px;border-radius:999px;border:1.5px solid var(--border);background:#fff;cursor:pointer;font-size:13px;font-weight:600;color:var(--text);font-family:inherit;transition:all .15s ease;}
  .tabs button:hover{border-color:var(--green);}
  .tabs button.active{background:var(--green);color:#fff;border-color:var(--green);box-shadow:var(--shadow-sm);}
  .center{display:flex;align-items:center;justify-content:center;min-height:70vh;}
  table th[data-key]{cursor:pointer;user-select:none;white-space:nowrap;}
  table th[data-key]:hover{color:var(--green);}
  .barlist{display:flex;flex-direction:column;gap:10px;}
  .barlist .row-label{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:3px;}
  .barlist .track{height:10px;border-radius:6px;background:var(--bg-2,#eee9dd);overflow:hidden;}
  .barlist .fill{height:100%;border-radius:6px;background:var(--green);}
  .barlist .fill.pos{background:#8fae7a;}
  .barlist .fill.credit{background:#c9a227;}
  .dash-section-title{font-size:14px;font-weight:800;color:var(--green-dark);text-transform:uppercase;letter-spacing:.04em;margin:22px 0 10px;display:flex;align-items:center;gap:8px;}
  .dash-section-title:first-child{margin-top:0;}
  .dash-section-title::before{content:'';width:4px;height:15px;border-radius:3px;background:var(--green);display:inline-block;}
  .donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
  .donut-wrap svg{flex-shrink:0;}
  .donut-legend{display:flex;flex-direction:column;gap:8px;flex:1;min-width:150px;}
  .donut-legend-row{display:flex;align-items:center;gap:8px;font-size:12.5px;}
  .donut-legend-row .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .donut-legend-row .dl-label{flex:1;color:var(--text);font-weight:600;}
  .donut-legend-row .dl-val{color:var(--muted);font-weight:700;white-space:nowrap;}
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:8px;}
  .kpi{background:var(--card);border:1px solid var(--border-soft);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow-sm);}
  .kpi .n{font-size:22px;font-weight:800;color:var(--text);letter-spacing:-.02em;line-height:1.15;}
  .kpi .l{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:3px;}
  .mini-table{width:100%;font-size:12.5px;}
  .mini-table td{padding:6px 8px;border-bottom:1px solid var(--border-soft);}
  .mini-table tr:last-child td{border-bottom:none;}
  .trend-svg{width:100%;height:auto;display:block;}
  .login-card{width:100%;max-width:380px;box-shadow:var(--shadow-lg);border:none;border-radius:var(--radius-lg);padding:30px 26px 26px;}
  .brand-title{color:#fff;font-weight:800;font-size:21px;letter-spacing:-.02em;text-align:center;margin:0;}
  .brand-tagline{color:rgba(255,255,255,.8);font-size:12.5px;font-weight:600;text-align:center;margin-top:2px;letter-spacing:.01em;}
  .login-lang{display:flex;justify-content:center;gap:6px;margin-bottom:20px;}
  .login-lang button{border:1.5px solid var(--border);background:#fff;color:var(--muted);font-size:12px;font-weight:700;padding:5px 13px;border-radius:999px;cursor:pointer;font-family:inherit;transition:all .15s ease;}
  .login-lang button:hover{border-color:var(--green);color:var(--green-dark);}
  .login-lang button.active{background:var(--green);color:#fff;border-color:var(--green);}
  .login-card h2{font-size:16px;margin:0 0 6px;text-align:center;}
  .login-hint{font-size:12.5px;color:var(--muted);text-align:center;margin:0 0 18px;line-height:1.5;}
  .login-card .field label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
  .login-card .field input{padding:12px 14px;border-radius:var(--radius-sm);font-size:15px;}
  .login-card button.btn{width:100%;padding:12.5px;font-size:14.5px;border-radius:var(--radius-sm);margin-top:8px;letter-spacing:-.005em;}
  .login-forgot{display:block;width:100%;text-align:center;margin-top:16px;font-size:12.5px;color:var(--green-dark);font-weight:700;cursor:pointer;background:none;border:none;font-family:inherit;padding:4px;}
  .login-forgot:hover{text-decoration:underline;color:var(--green);}
  .login-footer{color:rgba(255,255,255,.65);font-size:11px;text-align:center;margin-top:-6px;}
  small.hint{color:var(--muted);font-size:12px;}
  .list-item{padding:14px;border:1px solid var(--border-soft);border-radius:var(--radius-sm);margin-bottom:10px;background:#fff;transition:box-shadow .15s ease, border-color .15s ease;}
  .list-item:hover{box-shadow:var(--shadow-sm);border-color:var(--border);}
  .list-item .top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
  .amount{font-weight:800;color:var(--text);font-size:15px;letter-spacing:-.01em;}
  .muted{color:var(--muted);font-size:12px;}
  .actions{display:flex;gap:8px;margin-top:10px;}
  .breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);}
  .breakdown .bi{font-size:11.5px;color:var(--muted);}
  .breakdown .bi b{display:block;font-size:13.5px;color:var(--text);font-weight:700;margin-top:1px;}
  .details-toggle{background:none;border:none;color:var(--green);font-size:12px;font-weight:700;cursor:pointer;padding:0;margin-top:8px;font-family:inherit;}
  .details-toggle:hover{text-decoration:underline;}
  /* sortable / searchable table component */
  .tbl-search{position:relative;margin-bottom:12px;max-width:320px;}
  .tbl-search input{padding-inline-start:36px;border-radius:999px;background:var(--bg);}
  .tbl-search::before{content:'';position:absolute;top:50%;inset-inline-start:13px;transform:translateY(-50%);width:14px;height:14px;border:2px solid var(--muted-2);border-radius:50%;pointer-events:none;}
  .tbl-search::after{content:'';position:absolute;top:60%;inset-inline-start:23px;width:6px;height:2px;background:var(--muted-2);transform:rotate(45deg);pointer-events:none;}
  html[dir="rtl"] .tbl-search::after{inset-inline-start:auto;inset-inline-end:23px;transform:rotate(-45deg);}
  .tbl-scroll{overflow-x:auto;}
  th.sortable{cursor:pointer;user-select:none;white-space:nowrap;}
  th.sortable:hover{color:var(--green-dark);}
  th.sortable .arrow{color:var(--green);margin-inline-start:3px;}

  /* Small phones — tighten spacing to reclaim width rather than relying on
     auto-fit grids alone, and keep the header from feeling cramped once the
     bell + language switch + logout are all fighting for the same row. */
  @media (max-width: 420px){
    main{padding:14px 10px 50px;}
    .card{padding:14px;}
    header{padding:10px 12px;gap:8px;}
    header .who{display:none;}
    .grid{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;}
    .login-card{padding:22px 18px 20px;}
    .brand-logo{width:150px;}
    table{font-size:12.5px;}
  }
</style>
